r den Preis in Ordnung , leider ist die Trägerfolie nicht ganz ohne klebrige Finger zu entfernen. Deswegen auch ein Stern weniger, funktionieren tun die einwandfrei", "tags": ["efficacy_works"]}, {"r": 3, "t": "Funktionieren ihn ihren Aufgaben allerdings fummelige kleine Dinger die nicht richtig stecken bleiben wollen, gibt bessere Produkte von der Konkurrenz.", "tags": ["efficacy_works"]}, {"r": 3, "t": "Nützlich, hat mein Befall aber „nur“ gemindert.", "tags": []}, {"r": 1, "t": "Keine einzige Fruchtfliege bleibt an diesen Dinger hängen.  Entweder sind die schon total veraltet oder von Beginn an nutzlos", "tags": ["efficacy_fails", "fruit_flies"]}, {"r": 1, "t": "Erste Lieferung Karton zerdrückt und gerissen, zweite gerissen und mit Klebeband geklebt, dritte wieder zerdrückt. Voll nervig. Vielleicht wäre ein kleiner Versandkarton die Wahl und nicht ein Umschlag? Irgendwo muss man die Dinger ja aufbewahren. Ansonsten denke ich gutes und günstiges Produkt.", "tags": ["efficacy_works", "price_value"]}, {"r": 4, "t": "Für meine blumentöpfe", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Ich war ja etwas skeptisch, aber es hat tatsächlich funktioniert. Die Mücken sammeln sich an den gelben Klebeflächen.", "tags": ["efficacy_works"]}, {"r": 2, "t": "Wir haben kleine fliegende Bewohner auf unserer Pflanze entdeckt & nun versucht mit diesen Klebefallen der Invasion Herr zu werden. Leider haben die gelben Platten bei den Tierchen keinen Eindruck gemacht. Im Gegenteil, es scheint gerade nur noch mehr zu werden. Schade.", "tags": ["plants_gnats"]}, {"r": 4, "t": "Die sticker sind etwas schwer zu vereinzelt. Erfüllen aber voll in ihren Zweck. Es gab die Möglichkeit die Ware in der Originalverpackung senden zu lassen. Der Lieferzustand nach Auswahl dessen war leider nicht optimal. Zudem wird dabei ein Versandkleber über die Anleitung geklebt, welcher sich nichtmehr lösen lässt.", "tags": []}, {"r": 3, "t": "Das Produkt ist Preis/Leistung in Ordnung. Es gibt andere Markenprodukte, welche eine bessere und längere Klebeleistung haben! Der Gelbton bei anderen Produkten ist auch anders.", "tags": []}, {"r": 4, "t": "Seit der Nutzung ist die Fensterbank frei von Trauermücken die aus der Blumenerde kamen", "tags": ["plants_gnats"]}, {"r": 4, "t": "Sieht nicht schick aus, ist auch ziemlich brutal. In Kombination mit Neemöl aber unabdingbar", "tags": []}, {"r": 3, "t": "Funktioniert", "tags": ["efficacy_works"]}, {"r": 3, "t": "Karton sieht aus als würde er seit Jahren auf Lager gelegen hat. Kleben noch aber mehr auch nicht. Bis jetzt noch nicht viel Erfolg damit gehabt.", "tags": ["plants_gnats"]}, {"r": 1, "t": "Leider hat das Produkt die Wirkung 0. Zufällig vorbeikommende Fleigen werden gefangen, angelockt wird nix, die Wirkung gegen Trauermücken, Fliegen etc ist bescheiden., ich werde es nicht mehr kaufen.", "tags": ["plants_gnats"]}, {"r": 4, "t": "Die extra Knickecke ist vorteilhaft Gut klebene Gelbtafeln Kleben auch am Finger 🤣🤣🤣", "tags": ["efficacy_works"]}, {"r": 4, "t": "...scheint die Erwartungen zu erfüllen.", "tags": []}, {"r": 4, "t": "Die etwas teureren sind etwas besser . Ist aber evtl. Chargenabhängig.", "tags": ["efficacy_works"]}, {"r": 4, "t": "Tut was es soll, nicht mehr nicht weniger.", "tags": []}, {"r": 4, "t": "Preis/Leistung passt; Bereits erfolgreich im Einsatz", "tags": []}, {"r": 4, "t": "Es hat ein bischen gedauert, aber jetzt sammeln sich die kleinen Mücken schon am Klebeteil (incl. Fliege). Klebe-Abdeckung mit einem Ruck abziehen, dann klappt es gut. Unteren Teil zusammen biegen und nur \"dort\" angreifen, dann kleben die Finger nicht an. Habe \"mehrere\" Standorte gewählt - kann man auch in schmale Gläser hinein-stecken. Sehr zufrieden.", "tags": ["efficacy_works"]}, {"r": 2, "t": "Ich habe mein Paket ohne jeglichen Schutz erhalten. Es scheint alt and bereits verwendet. Nicht glücklich", "tags": []}, {"r": 1, "t": "Hatte in meiner Küche sehr viele Fruchtfiegen, und als ich dieses gekauft hatte und in meiner Küche die Klebe Blätter an mehreren Bereichen geklebt hatte ist nach einigen Tagen nicht eine Einzige Fruchtfliege auf dem Blatt angehaftet. Also Müll", "tags": ["fruit_flies"]}, {"r": 4, "t": "Trauermücken bleiben massenhaft kleben. Anwendung etwas schwierig aufgrund der Klebestellen.", "tags": ["plants_gnats"]}, {"r": 4, "t": "Erfüllt seinen Zweck. Klebewirkung ist sehr gut. Die Tafeln in die Erde zu bekommen, könnte besser gelöst werden", "tags": ["efficacy_works"]}, {"r": 3, "t": "Le produit fait parfaitement son job, par contre il n'est pas très ergonomique, dans la mesure où on se colle facilement les doigts en le plaçant, et où il est difficile de l'enfoncer et le faire tenir droit si le sol est trop dense ou sec. Les feuilles de plante également, peuvent se coller dessus si elles ont tendance à bouger ou être bougées par un animal de compagnie.", "tags": ["plants_gnats"]}, {"r": 4, "t": "Ich habe kürzlich die Gelbsticker zur Bekämpfung von Trauermücken mit einer Packung von 60 Stück erworben und möchte meine Erfahrungen damit teilen. Zunächst einmal möchte ich betonen, dass das Preis-Leistungs-Verhältnis wirklich gut ist. Für die Anzahl der Sticker, die man erhält, ist der Preis äußerst erschwinglich.  Die Sticker erfüllen definitiv ihren Zweck und helfen, Trauermücken effektiv zu bekämpfen. Sie ziehen die Schädlinge an und halten sie fest, was die Population deutlich reduziert.  Ein kleiner Nachteil ist jedoch, dass einige Sticker miteinander verklebt sind und es schwierig se", "tags": ["efficacy_works", "plants_gnats", "price_value"]}, {"r": 4, "t": "Es funktioniert gut, aber das \"anbringen /platzieren\" könnte gerne etwas einfacher gestaltet werden. Die Folien lassen sich teilweise schlecht ablösen.", "tags": ["efficacy_works", "efficacy_fails", "ease"]}, {"r": 4, "t": "Als Mückenfalle. Macht was es soll. Schnelle Lieferung", "tags": ["efficacy_works"]}, {"r": 3, "t": "Klebt gut", "tags": ["efficacy_works", "very_sticky"]}, {"r": 3, "t": "Für den Preis im Angebot gut. Aber qualitativ gibt es bessere", "tags": ["efficacy_works"]}, {"r": 4, "t": "Stickers have really strong glue, which is perfect for insects, but it’s difficult to put them in the pot. Paper is too thin in my opinion.", "tags": []}, {"r": 3, "t": "Ich hatte Trauermücken aber leider wollten diese nicht an die Klebeschilder fliegen. Vielleicht lag es auch an der Art der Inseken. Auf jeden Fall reicht man mit diesem Paket sehr lange.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Was soll man schreiben.", "tags": []}, {"r": 4, "t": "Aber leider kein schöner Anblick.", "tags": []}, {"r": 4, "t": "sehr schnelle Hilfe, bei Insektenbefall, sehr nützlich.", "tags": []}, {"r": 3, "t": "Funktioniert gut als eine Art Friedhof für die Trauermücken, bekämpft sie aber nicht ursächlich. Da helfen nur die Nematoden.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Umständlich in die Erde zu bringen, man bleibt kleben, aber sie funktionieren und das ist die Hauptsache.", "tags": []}, {"r": 3, "t": "Hat bei mir nur eine einzige Mücke erwischt. Vielleicht nicht gegen Obstfliegen geeignet?", "tags": ["fruit_flies"]}, {"r": 1, "t": "Packung zerrissen, Hälfte fehlte. Unmöglich.", "tags": []}, {"r": 4, "t": "Die gelben Klebetafeln sind sehr biegsam und dadurch etwas unhandlich in die Erde zu stecken. Die Mücken bleiben gut kleben. Bin mir aber nicht sicher, ob das ausreicht, da es die Larven nicht betrifft", "tags": ["efficacy_works"]}, {"r": 2, "t": "Das Material ist so dünn, dass man die Kärtchen nicht wirklich in die Blumenerde stecken kann. Leider nicht wirklich brauchbar.", "tags": []}, {"r": 4, "t": "Konnte die Plage mit den Matten abwenden", "tags": ["efficacy_works"]}, {"r": 1, "t": "I mistakenly bought these with the notion that they contained some attractant. That is false. They supposedly attract bugs by their bright color. It does not work. Back to vinegar, I guess…", "tags": ["efficacy_fails"]}, {"r": 3, "t": "Die Ausführung, das „Basteln“ (muss man aufbauen) ist ein wenig naja…. Aber es erfüllt seinen Zweck", "tags": []}, {"r": 4, "t": "Die Klebetafeln erfüllen ihren Zweck wenn sie erstmal da sind wo sie hingehören und das ist mein Kritikpunkt. Es ist insbesondere bei kleinen Blumentöpfe oft nicht möglich die Klebefläche möglichst nahe der Erde zu platzieren, ohne dabei nicht selbst die Klebefläche zu berühren. Das erschwert die Anbringung leider sehr. Wenn sie dann mal an Ort und Stelle sind funktionieren sie sehr gut, trotzdem werde ich sie vermutlich nicht wieder kaufen.", "tags": ["efficacy_works", "plants_gnats", "repeat"]}, {"r": 2, "t": "Die Fliegen wurden sehr gut davon angelockt.  Sie blieben auch gut kleben. Leider haben sich die Fliegen dadurch nicht reduziert und ich musste ein anderes Produkt kaufen.", "tags": ["efficacy_works"]}, {"r": 4, "t": "erfüllen sehr gut ihren Zweck", "tags": ["efficacy_works"]}, {"r": 2, "t": "Hat nicht Funktioniert habe trotz ich 2 Tagen in 2 größer Pflanzen töpe gesteckt 1 sieht es trodem hässlich aus 2  habe ich viele Trauer Mücken i der Wohnung.", "tags": ["efficacy_fails", "plants_gnats", "size_issue"]}, {"r": 2, "t": "Habe sie gekauft für meine Bonsai, und allgemein in der Küche wegen Obst. Funktioniert nicht wirklich, wenn mal 1 picken bleibt, ist das ein großer Erfolg. Ich habe wieder meine alte Methode benutzt. Schuss Essig,  Schuss Sirup, und Wasser mischen. 3 Stunden später 6 bis 10 im Glas.", "tags": ["efficacy_fails"]}, {"r": 1, "t": "Die kleben sehr schlecht! Nochmal kaufen nein!", "tags": ["efficacy_fails"]}, {"r": 2, "t": "Es scheint so, als ob meine Trauermücken intelligenter sind als andere. Denn Sie fliegen überall hin - nur NICHT auf die Gelbsticker, lol.  Produkt kam in einer zerquetschten und geöffneten Produktverpackung.", "tags": ["plants_gnats"]}, {"r": 2, "t": "Die Verpackung war bereits geöffnet und leicht beschädigt. Des Weiteren wirken die Gelbtafeln kaum und ziehen die Trauermücken nicht an. Kein Wunder, dass der Vorbesitzer meiner Packung das Produkt zurück geschickt hat.", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 1, "t": "Diese Karten sind schlecht zu platzieren", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 1, "t": "really disapointed compared to reviews, gnats are NOT attracted to this product.", "tags": ["plants_gnats"]}, {"r": 4, "t": "Macht, was es soll. Im Blumentopf etwas wackelig", "tags": ["plants_gnats"]}, {"r": 1, "t": "Es gibt keine frei Fläche ohne Kleber und somit bleibt man mit dem Handschuh immer irgendwie an diesem gelben Teil kleben.", "tags": []}, {"r": 4, "t": "Gutes Produkt aber paar Euronen zu teuer", "tags": ["efficacy_works", "price_value", "price_high"]}, {"r": 1, "t": "Den kleinen Fliegen macht das Aufstellen der Gelbsticker nichts aus, sie fliegen munter drum herum.", "tags": []}, {"r": 4, "t": "Effizienz 5/5 Handling 3/5", "tags": []}, {"r": 1, "t": "Das Paket kam offen und beschäftigt an!", "tags": ["efficacy_fails"]}, {"r": 4, "t": "Ich bin mit dem Produkt an sich zufrieden, gerade aufgestellt, schon hängen die Fliegen daran. Durch den knickbaren Fuß hat die Fliegenfalle auch einen sicheren Stand in der Blumenerde.  Allerdings hätte man den Karton besser verpacken müssen. Der Karton kam komplett eingedrückt bei mir an.", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 1, "t": "Das ist der schlechteste Artikel, den ich je bei Amazon gekauft habe ! Aber Amazon hat super reagiert !", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 4, "t": "Erfüllt seinen Zweck. Bisschen blöd beim reinstecken", "tags": ["efficacy_works"]}, {"r": 3, "t": "Alles klebt! Die Hände, wenn man das Teil in die Erde tut, die Blätter der Pflanzen, sogar auch der Vorhang, falls ihr Pflanzen an der Fensterbank habt. Habe das Produkt gegen kleine Fliegen gekauft und die meisten blieben kleben, aber Anzahl der Fliegen verringerte sich nicht. Da muss man zu flüssigen Mitteln zugreifen. Und da alles kleben bleibt, liegt genau darin ein Nachteil, denn bei mir ist 2 mal eine
