gs": []}, {"r": 3, "t": "Mein Ungeziefer hat sich wenig bis gar nicht von den Stickern beeindrucken lassen. Leider.", "tags": []}, {"r": 1, "t": "Dieses Produkt ist wirklich ein kompletter Witz. Derjenige der sich diese Konstruktion ausgedacht hat muss wirklich ohne Schulabschluss in das Entwicklerteam dieser Firma gekommen sein. Die \"Halterung\" die man bekommt besteht aus nur einem Draht, dessen Dicke man nur auf Nanoebene messen kann, sprich es ist nicht möglich, dass dieser Draht irgendwie fest in die Erde zu bringen ist. Dazu kommt, dass jeder einzelne Draht in eine Plastikverpackung geschweißt ist, aus der man ihn nur unter dem Mikroskop und einer Nanopinzette heraus bekommt. Wenn man es dann doch mal geschafft hat in von seiner Ve", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 1, "t": "Diese Gelbsticker haben komplett versagt. Wir hatten letztes Jahr starken Befall von Trauermücken und haben gelbsticker einer bekannten Marke gekauft. Die haben auch super geholfen und es blieben sehr viele Trauermücken daran hängen. Dieses Jahr dann diese Gelbsticker hier gekauft und es bleibt NICHT EINE Trauermücke daran hängen, obwohl die Trauermücken überall an der Pflanze sind. Kann ich direkt wegschmeißen und mir jetzt wieder die gelbsticker der Markenfirma kaufen", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 3, "t": "Ich hatte die Karten jetzt ein halbes Jahr an jeder Ecke Eingefangen hatte ich mir die Mücken durch ein Basilkumtopf aus dem Supermarkt. Die Mücken haben sich dann auf andere Töpfe in der Wohnung verteilt. Eine absolute Seuche in der Wohnung. Als ich die Karten aufgehängt habe war der Erfolg enorm, die Gelbkarten waren RatzFatz voll mit Fliegen. Nach 4-6 Wochen war fast keinen Fliege mehr zu sehen. Die Karten bleiben aber hängen bzw in den Töpfen gesteckt. Es war immer wieder mal 1-2 Fliegen zu sehen, sei es in der Luft oder an den Karten. Nach über Zwei Monaten hat es dann wohl wieder eine Fl", "tags": ["efficacy_works", "repeat"]}, {"r": 2, "t": "Noch keine einzige Mücken auf den Tafeln", "tags": []}, {"r": 3, "t": "2 x 20 Gelbsticker sind in der Packung enthalten, aber nur je 5 Metallhalter, um die Sticker in die Erde zu stecken und nur je 10 Bindedrähte, um die Gelbsticker an Zweige zu hängen. Sehr ärgerlich. Da könnte man doch genügend Metallhalter oder Bindedrähte beilegen. Darum nur 3 Sterne. Ansonsten tun die Sticker, was sie versprechen", "tags": []}, {"r": 3, "t": "Die Klebesticker halten eigentlich was sie versprechen. Der Klebeeffekt ist noch lange nach abziehen der Folie vorhanden und es sammeln sich zahlreiche Mücken. Das Problem ist, dass man die Ursache nicht bekämpft. So stehe ich vor dem Problem, dass ich alle paar Wochen neue gelbsticker verwende, die sich wieder mit zahlreichen Insekten besiedeln, jedoch wurde dem Grundproblem und dem nachkommen neuer Tiere nicht entgegen gewirkt.  Zusatz:  Nachdem ich über mehrere Wochen Gelbsticker verwendete, habe ich bestimmt 1000 Mücken erwischt. Problem: Es kamen immer neue Mücken nach, die die Wurzeln ze", "tags": ["efficacy_works"]}, {"r": 3, "t": "Besser als nichts. Es bleiben schon Fliegen an der Gelbfalle hängen. Allerdings die Mehrheit der Trauermücken geht dadurch nicht kaputt. Das Tragische an der Sache ist das, dass man glaubt, mit Composana eine ordebntliche Erde gekauft zu haben, dann jedoch ernüchternd feststellt, dass diese einen Trauermückenbefall hat und ich dieses Erde nur noch entsorgen kann. Vorher habe ich mir jedoch einige Pflanzen, die ich im guten Glauben umtopfte, versaut. Dann bestellt man noch die Gelbsticker. Leute, so kann man auch sein Geld auf die Straße werfen. Ich traue mich jetzt nicht mehr an normale Erde h", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 1, "t": "Soit les moucherons sont intelligents où soit ce produit ne fonctionne pas mais pas du tout...", "tags": []}, {"r": 1, "t": "Il prodotto non corrisponde alla descrizione. Le cimici, sia quelle verdi che quelle nere, non ne vogliono sapere di posizionarvici. Le uniche che ho \"acchiappate\" sono quelle di quando ho usato l'acchiappa mosche.", "tags": []}, {"r": 3, "t": "Catch flies but awkward to use and set up as they stick to everything and leaves fingers tacky …", "tags": []}, {"r": 2, "t": "No me ha gustado,ya que no veo que se enganchen los bichos", "tags": []}, {"r": 1, "t": "Je cherche encore l’efficacité. Les moucherons volent tranquillement autour s’en s’y poser dessus.", "tags": []}, {"r": 3, "t": "Pas bien colle.apres les doigts et difficult a mettre en terre", "tags": []}, {"r": 2, "t": "La boîte était ouverte, il y a 58 étiquettes au lieu de 60", "tags": []}, {"r": 1, "t": "Aunque mire las medidas y ponía diez por quince, no es así, son pequeñas y para pinchar en macetas y yo las quería grandes h para colgar. No las recomiendo ni volveré a comprar aquí, las cogeré en Temu como el año pasado,maz baratas y de buen tamaño.", "tags": []}, {"r": 1, "t": "No me han gustado nada son super pequeños", "tags": ["efficacy_works"]}, {"r": 1, "t": "It came opened and used", "tags": []}, {"r": 1, "t": "Ho la casa piena di moscerini e nemmeno uno è finito nella trappola: apparentemente non funziona per niente. Per prova ho messo due dita di aceto in un bicchiere e dopo un pomeriggio c'erano dentro 5 o 6 moscerini, ma nelle trappole, a fianco, manco uno.", "tags": []}, {"r": 3, "t": "No es ninguna maravilla", "tags": []}, {"r": 1, "t": "L'enfer ! ne fonctionne pas et en plus s'accroche partout. Impossible de le faire tenir dans la terre ! on a dû tous les jeter", "tags": []}, {"r": 3, "t": "fidèle a sa description et son utilisation", "tags": []}, {"r": 1, "t": "Non serve a niente. In una settimana si saranno attaccanti si e no 4 moscerini!! Ho risolto il problema dei moscerini buttando la terra vecchia (cercando di pulire il più possibile le radici) e mettendo la terra nuova!", "tags": []}, {"r": 2, "t": "Vraiment difficile à positionner avec en plus le film de protection qui s'enlève difficilement. Je ne rachèterai pas c'est sûr.", "tags": []}, {"r": 3, "t": "effective? reliable ? it does a fair job--not much more--still it is preferable to a toxic spray .", "tags": ["efficacy_works"]}, {"r": 3, "t": "Se pegan mucho en las manos, demasiado grandes para macetas pequeñas", "tags": []}, {"r": 2, "t": "Mi aspettavo fosse più catturante", "tags": []}, {"r": 2, "t": "A fait fuir une partie des moucherons mais en 2 semaines seuls 3/4 moucheron de cuisine se sont collé dessus.", "tags": []}, {"r": 1, "t": "uno dei prodotti più  inutili mai comprato, in tre giorni non ha catturato nemmeno un moscerino.", "tags": []}, {"r": 1, "t": "Moscas y mosquitos vuelan a su alrededor sin inmutarse, no me ha valido para nada.", "tags": []}, {"r": 1, "t": "Non serve per lo scopo...", "tags": []}, {"r": 1, "t": "Nul ! Pas pratique du tout ! La partie à planter dans la  terre n’est pas assez rigide et ne tient pas du tout. On est obligé de forcer en tenant la partie collante. Résultat on a les doigts tout collants et c'est vraiment difficile à nettoyer. Non vraiment je ne conseille pas.", "tags": ["plants_gnats"]}, {"r": 1, "t": "Attrape peut etre quelque chose. Mais dans l'absolue pas les mouches du terreau", "tags": []}, {"r": 1, "t": "Pessimo. Le mosche non vanno vicino nemmeno per sbaglio. Do una stella perché zero non si può dare.", "tags": []}, {"r": 1, "t": "El producto llegó deteriorado como los lirios del valle. Los dos envíos con la seña mal", "tags": []}, {"r": 2, "t": "Purtroppo risulta poco efficace con i moscerini: ne cattura solo qualcuno, mentre gli altri continuano indisturbati a molestare. Dovrò ricorrere a un metodo più drastico.", "tags": []}, {"r": 2, "t": "N’a pas était efficace pour mon problème", "tags": []}, {"r": 1, "t": "à éviter,  le plastique trop fin et la pointe bien trop courte ne tient pas sur un sol meuble, très difficile à installer sans éviter de coller les doigts , la terre se colle sur le piège!", "tags": []}, {"r": 1, "t": "I moscerini non sono attirati", "tags": []}, {"r": 3, "t": "I primi che ho utilizzato non si attaccavano, altri pezzi veramente wfficenti", "tags": []}, {"r": 2, "t": "Je trouve cela innefficace, pénible à utiliser et la couleur horrible. Pas discret dans les pots", "tags": []}, {"r": 2, "t": "No funciona, llevan dos semanas puestos y no cae ni uno, están por la casa a sus anchas los mosquitos", "tags": []}, {"r": 1, "t": "forse non li ho saputi usare ma non hanno funzionato, hanno preso solo tanta polvere.", "tags": []}, {"r": 1, "t": "1 moucheron sur 50 est tombé dans le panneaux donc très inutile.10 euros a la poubelle", "tags": []}, {"r": 1, "t": "Nul aucun effet", "tags": ["efficacy_fails"]}, {"r": 1, "t": "Pessimo prodotto, difficile da inserire le strisce dentro la pianta, si appiccicano alle mani e non funziona come trappola, non attrae i ditteri ed altri parassiti", "tags": []}, {"r": 1, "t": "La boîte est arrivée écrasée et ouverte. Est-ce que le produit est périmé ? Mais quoiqu’il en soit les moucherons sont toujours présents et continuent de voler autour!! Vraiment déçue par le produit.", "tags": []}, {"r": 1, "t": "I moscerini sorvolano ed evitano di poggiarsi", "tags": []}, {"r": 1, "t": "Mérite 0 Etoile ne fonctionne pas", "tags": []}, {"r": 3, "t": "La scatola è arrivata schiacciata. Come prodotto preferivo quello a foglietti perché si potevano anche appendere, ma ho dovuto optare per questi perché quella tipologia non la vendono più qui su Amazon.", "tags": []}, {"r": 1, "t": "Au bout de 4 jours, n'a attrapé aucun moucheron. Encore un gadget qui ne fonction que pour vider les poches.", "tags": []}, {"r": 1, "t": "Prodotto inutile, non funziona", "tags": []}, {"r": 1, "t": "Produit complètement inutile, les moucherons ne doivent pas aimer le jaune ou sentent le piège. Ils se posent à coté en étant MDR. A fuir", "tags": []}, {"r": 1, "t": "Purtroppo non funziona. La mia confezione inoltre era aperta ed alcuni erano già stati usati", "tags": []}, {"r": 1, "t": "Aucun résultat, totalement inefficace Et en plus Vendu en grand quantité !!! Très déçue  ne sert à rien", "tags": []}, {"r": 1, "t": "Infester depuis quelques temps de moucherons, j’ai acheté ce piège a mouches et moucherons, j’en ai installé 4 à des distances de 50 cm et 2 mètres à l’endroit où il y en a le plus ; résultat au bout de 4 heures : 1 moucheron de collé ! Je vais attendre jusqu'à demain et si toujours pas de résultats, j’essaierais de trouver autre chose pour m’en débarrasser. Cet Anti Moucherons ne sert à rien à part dépenser de l’argent pour rien.", "tags": []}, {"r": 1, "t": "TOTALEMENT INEFFICACE CONTRE LES MOUCHERONS... NE PAS ACHETER...", "tags": []}, {"r": 2, "t": "meglio la famosa polvere bianca di una nota fabbrica", "tags": []}, {"r": 1, "t": "Llego antes pero el paquete abierto y faltaban 20 pegatinas. No lo compraré más veces.", "tags": []}, {"r": 1, "t": "absolument aucune mouchettes attirées par ces collants jaunes !  Remboursé !", "tags": []}, {"r": 3, "t": "Sono ottimi se inseriti nei vasi, ne acchiappa parecchi, ma se il moscerino si allontana dal vaso, non viene attirato e svolazza qua e là. Comunque meglio di prima.", "tags": []}, {"r": 2, "t": "Relativement déçu, pour ma part ça n’a pas marché. Pas un seul moustique d’attrapé. Au moins j’ai essayé", "tags": []}, {"r": 1, "t": "Forse i moscerini di casa mia sono troppo intelligenti e non ci vanno, solo una povera farfalla è morta sul cartoncino.", "tags": []}, {"r": 2, "t": "J'ai testé ces anti moucherons et mouches.  Sur 2 pots de fleurs à l'intérieur. Aucun effets en particulier ??? Toujours autant de moucherons qui tournent autour !!! Pas du tout satisfaisant pour nous. Avez vous autre chose de plus efficace ?? Cordialement, ZUZ51", "tags": ["efficacy_fails"]}, {"r": 1, "t": "produkten i sig kanske är ok. Men i och med att man skickar den i originalkartongen utan att på minsta sätt tejpa eller försluta den. Då kan man inte förvänta sig att innehållet kommer fram.. Men med sagt så kan det ju vara så att produkten faktist fungerar.. men jag antar att det kommer jag inte få veta.", "tags": []}, {"r": 1, "t": "bonjours ne fonction pas  01/20 je le recommande pas du tout", "tags": []}, {"r": 3, "t": "Mieux vaut les anciennes spirales aux plafonds !!", "tags": []}, {"r": 1, "t": "J’ai pas aimé puisque le problème n’est pas résolu", "tags": []}, {"r": 1, "t": "Je suis envahi de moucherons dans toute la cuisine et autres ayant posé ces stikers double face autocollant croyant m en débarrasser mais aucun moucheron ne s y colle ils se posent en dehors des collants argent fichu à la poubelle", "tags": []}, {"r": 1, "t": "Aucune utilité, vraiment déçu ne fonctionne pas du tout !!!!", "tags": []}, {"r": 3, "t": "Allora: di per se il prodotto funziona: i moscerini rimangono effettivamente incollati, ma non essendo dotata di una qualsivoglia sostanza che li possa attrarre (magari zuccherina) deve capitare che ci finiscano sopra mentre ronzano intorno alla pianta perché diversamente non sono minimamente attratti da essa… Risultato: funziona se messa vicino ad una pianta o ad un punto dove gli insetti sono soliti gironzolare ma in tutti gli altri punti rimangono inefficaci. Possono quindi aiutare ma non pensate di risolvere il problema completamente.", "tags": []}, {"r": 1, "t": "Bonjour , ne fonctionne pas, toujours autant de moucherons.", "tags": []}, {"r": 1, "t": "N attire absolument rien... Aucune efficacité. Décevant", "tags": []}, {"r": 3, "t": "Je ne sais pas si c'est efficace. Mais le produit est arrivé ouvert et pas complet", "tags": []}, {"r": 1, "t": "No valen para nada", "tags": []}, {"r": 1, "t": "Aucune efficacité", "tags": []}, {"r": 1, "t": "Colis arrivé endommagé,je ne peux même pas lire la notice", "tags": []}, {"r": 1, "t": "non serve e' solo plastica adesiva da ambo le parti e i moscerini non ne sono attratti", "tags": []}, {"r": 3, "t": "Ce produit est très efficace : installé dans une plante fraîchement arrosée, il attire en quelques heures un grand nombre d'insectes qui viennent s'y coller.  Par contre, il est tout aussi efficace et impitoyable pour coller : - les doigts de la personne qui essaie laborieusement de l'enfoncer dans le terreau - sa pointe triangulaire n'est vraiment pas très affutée, ça ne rentre pas ! - un peu de substrat si on se rate lors de l'insertion. - les feuilles de mes calathéas qui ont eu l'audace de s'en approcher lors de leur tai chi du matin.  Je préférais l'autre version du produit avec une petit", "tags": ["plants_gnats"]}, {"r": 1, "t": "Non funziona", "tags": []}, {"r": 1, "t": "L’ho acquistato per i moscerini in cucina.. dopo averlo esposto in piu punti.. ho riscontrato che non ha nessuna efficacia attrattiva…  inutile.", "tags": []}, {"r": 3, "t": "N'attire pas beaucoup les moustiques mais ça colle s'ils s'y posent", "tags": []}, {"r": 2, "t": "I'd really hoped these would work well, but to be honest, the fruit flies that kept getting into the cupboard we keep the fruit in, just ignored the traps and went straight for the fruit.  The sticky pad literally only caught one, out of hundreds of the blighters.  Maybe our fruit flies are a mutant local sub-species that hate the colour yellow, and maybe yours love it to bits.  All I know is, these didn't work for me personally, so I'm only able to award 2 stars.  Sorry.", "tags": ["fruit_flies"]}, {"r": 3, "t": "Does the job", "tags": ["efficacy_works"]}, {"r": 3, "t": "forse ad altri si appiccicano subito perche han migliaia di moscerini. ma nella stanza con 2 terrari e forse una 20 di mosceeini sempre a gironzolare dopo 2 settimane e 5 fogli sparsi in punti strategici non ne ho visto neanche uno appiccicato", "tags": []}, {"r": 1, "t": "Cet article s’est avéré inutile,sur 20 fiches posées à côté de mes plantes ,une seule mouche s’est prise au soi disant piége.Chez moi,cet achat s’est révélé être un attrape nigaud pas un attrape moucherons D’une grande et magnifique inefficacité", "tags": ["plants_gnats"]}, {"r": 1, "t": "N'a clairement pas fonctionné", "tags": []}, {"r": 3, "t": "Utile mais pas très pratique ni esthétique dans les pots.", "tags": []}, {"r": 2, "t": "L'inserimento nel terriccio non è ottimale e nel mio caso non hanno funzionato", "tags": []}, {"r": 2, "t": "non funziona", "tags": []}, {"r": 2, "t": "Inexploitable, j’ai déjà acheté des plaquettes digne de ce nom, la c’est ridicule, de plus on s’en met plein les mains …", "tags": []}, {"r": 3, "t": "Non funziona bene, mi aspettavo qualcosa di meglio.", "tags": []}, {"r": 2, "t": "C’est bien mais ça ne les tue pas donc ça résout pas le problème", "tags": []}, {"r": 2, "t": "aderiscono bene, ma utilità zero assoluto... vero, qualche insetto distratto finisce incollato, ma se credete di risolvere il problema insetti o parassiti di una pianta così facilmente.... 🤣🤣", "tags": []}, {"r": 3, "t": "Avis mitigé, les moucherons se collent mais il en reste malgré tout qui vole", "tags": []}, {"r": 2, "t": "Déçu, attire très peu de moucherons. Je vais reprendre mon ancienne marque.", "tags": []}, {"r": 2, "t": "J'étais envahi par des moucherons mais pas très efficaces. Il n'était pas attiré plus que ça. Je recommande pas trop", "tags": []}, {"r": 2, "t": "Ho tenuto per tre giorni le trappole ma i moscerini ci giravano intorno felici e contenti. Non si attaccano neanche spingendoli contro. Mah! Forse non funziona con tutti i moscerini... Strano!!!", "tags": []}, {"r": 2, "t": "Li ho comprati per le mie orchidee infestate da piccoli insetti volanti....ma ce ne sono veramente tanti, allora ho deciso prima di intervenire con prodotti chimici di usare questi innocui adesivi. Il risultato è nella foto,  c'è ne sono solo 4 attaccati sebbene siano molto appiccicosi , sono semplici adesivi ma non attraggono gli insetti e così sono dovuta passare ad altri rimedi che meno male avevo acquistato in contemporanea", "tags": []}, {"r": 3, "t": "Semble moyennement efficace", "tags": []}, {"r": 3, "t": "Ho posizionato gli adesivi su molte piante, catturano i moscerini volanti, si, ma non risolvono il problema se le uova sono nel terriccio", "tags": []}, {"r": 3, "t": "Molto utile per i moscerini che si aggirano attorno alle piante", "tags": []}, {"r": 2, "t": "mise à part coller mes doigts , ces petits cartons jaunes ne servent à rien. une semaine et pas un insecte , à eviter donc.", "tags": []}, {"r": 2, "t": "Ho avuto dei problemi di moscerini della frutta,  ne avevo veramente tanti. Ho messo 4 trappole in giro per la cucina,  non si è attaccato un moscerino in 4 giorni. Riassunto, non serve a nulla!", "tags": []}, {"r": 3, "t": "Il marche très bien: les insectes restent collés. Cependant la colle est en double face, donc ce n’est pas très pratique s’il faut le poser qq part", "tags": []}, {"r": 2, "t": "Spedizione immediata. Prodotto non adatto alla mia esigenza di creare una trappola per moscerini", "tags": []}, {"r": 3, "t": "Sono molto piccoli, quindi adatti per i vasi dei fiori ma non per gli alberi o, comunque, superfici grandi. A parte questo, sono una meraviglia perché attraggono gli insetti (farfalle, mosche, formiche) che restano incollati e non si muovono più.", "tags": ["efficacy_works"]}, {"r": 3, "t": "They do catch some flys but then you can also eat i other flys just walk across the surface", "tags": []}, {"r": 2, "t": "Had these hanging in a doorway which was swarming with small gnat like flies, even tried adding a bit of honey to one without effect Best use is holding in your hand and sneaking up on them after they've landed", "tags": ["plants_gnats"]}, {"r": 2, "t": "Je comptais sur ces produits pour me débarrasser des pucerons,  et ne sont absolument pas efficaces.", "tags": []}, {"r": 2, "t": "Mi spiace quando ho visto una vespina attaccata... Ho messo i foglietti più interni alla pianta e meno visibili", "tags": []}, {"r": 3, "t": "produit moins efficace que bien d'autres, la colle s'assèche au bout de 2, 3 jours", "tags": []}, {"r": 3, "t": "Il prodotto è sicuramente buono ma per le mie esigenze non ha funzionato", "tags": []}, {"r": 2, "t": "Pare che i moscerini e mosche finiscano attaccati solo per caso ma non vengono attirati in nessun modo. Consiglio di metterci dello zucchero o qualche prodotto che attiri gli insetti", "tags": []}, {"r": 3, "t": "Infestazione da tripidi: ne ho trovati attaccati all'adesivo non più di 4/5 ... eppure l'infestazione è in stato avanzato. Probabilmente era più indicato il colore azzurro per questo tipo di problema.", "tags": []}, {"r": 3, "t": "Forse i moscerini si sono fatti furbi ahimè", "tags": []}, {"r": 3, "t": "Purtroppo non ha soddisfatto al meglio per quanto indicato per la sua funzione, ha risolto il problema del 30-40% non di più', comunque sempre utile", "tags": []}, {"r": 3, "t": "Non sono stata pienamente soddisfatta dell'acquisto. In un primo momento la striscia sembrava funzionare, ma non ha risolto il problema. I moscerini hanno semplicemente deciso di passarci intorno e di non appiccicarsi sopra. Ho provato a cambiarla e niente, avrò dei moscerini super intelligenti.", "tags": ["efficacy_works"]}, {"r": 3, "t": "Hanno attirato si e no tre moscerini in una settimana. Non li ricomprerei. Alla fine ho risolto con le strisce del supermercato...", "tags": ["efficacy_works"]}, {"r": 2, "t": "Un seul petit moucheron c'est laissé piégé pour l'instant!", "tags": []}, {"r": 2, "t": "Personnellement aucun moucheron se colle dessus....", "tags": []}, {"r": 3, "t": "Il primo foglio è rimasto completamente pulito per alcuni giorni. Ho poi effettuato il trattamento con l'olio di neem alla piantina e i moscerini sono calati drasticamente, ma ho provato a mettere ugualmente due fogli appoggiati sul terriccio anziché sospesi (come letto in un'altra recensione), in modo tale che le larve o i moscerini camminandoci sopra rimanessero incollati. In una settimana ne ho trovati solo due. Il trattamento con l'olio di neem aveva già fatto il suo effetto e quindi è difficile valutare l'efficacia (o inefficacia) dei foglietti.", "tags": []}, {"r": 2, "t": "Utilisé près de plantes et de fruits où les moucherons se présentent. Force est de constater qu’ils ignorent l’attrait du piège. 1 mois d’utilisation 10 moucherons de pris. J’en ai même vu se balader sur les rebords de la feuille sans aller sur les bandes collantes. Ils me narguent. Conclusion : Pas top.", "tags": ["plants_gnats"]}, {"r": 2, "t": "Cela ne sert a rien c'est inutile ça n'attrape rien", "tags": []}, {"r": 2, "t": "J’espérais m’en servir pour protéger mon espace fruits dans ma cuisine car beaucoup de moucherons me rendaient visite mais hélas cela n’a pas fonctionné", "tags": ["plants_gnats"]}, {"r": 2, "t": "My headline speaks so far", "tags": []}, {"r": 3, "t": "L'avevo preso per evitare prodotti chimici nelle piante. Purtroppo si attaccano anche api e lucertole.", "tags": []}, {"r": 3, "t": "Papier collant sont pas mal cependant les support fournir sont trop peu pour ma situation après il aurait dû mettre un produit pour attirer les moustiques dessus", "tags": []}, {"r": 3, "t": "Sono stato assente da casa per diverso tempo e ho trovato la cucina invasa da moscerini - tonnellate di insetticidi spray non hanno sortito effetto come i ROTOLI adesivi che in due giorni hanno fatto una strage e ripulito quasi tutto - consiglio di aggiungere 1 o 2 cucchiaini di aceto di mele al bicchierino alla base che ne aumenta ulteriormente l'efficacia (allego foto) - al 2° posto le trappole a capanna con bicchierino di aceto - al 3° e ultimo posto questi fogli gialli che hanno catturato molto meno - forse sono più adatti ai vasi di fiori", "tags": []}, {"r": 3, "t": "Moyennement convaincu. Les petits moucherons dans mon terreau ne vont pas vraiment dessus ...", "tags": []}, {"r": 2, "t": "Ogni mattina trovo i moscerini vicino la macchinetta del caffè. Ho messo questo adesivo e per diverse notti è rimasto intonso con i moscerini invece intorno alla macchinetta del caffè. Inutile. L'ho messo fuori in giardino e ci ho trovato due mosche ma non era per le mosche fuori era per i moscerini dentro e non funziona.", "tags": []}, {"r": 2, "t": "Certes, quelques moucherons se collent sur le piège mais il n'en demeure pas moins qu'un certain nombre continue de voleter.", "tags": []}, {"r": 3, "t": "Forse troppo economici. Sono molto piccoli e dopo un mesetto di utilizzo sembrano aver perso il potere collante.  Forse meglio spendere qualcosa in poi per avere piu qualita.", "tags": []}, {"r": 3, "t": "I understand the need to leave the non-stick margins on those papers. It definitely makes it easier to use. Funny part is that flies learned to sit on non-stick edges. I literally have a swarm of flies flying around this papers and having a laugh out of me and producers of this thing.", "tags": []}, {"r": 3, "t": "👍", "tags": []}, {"r": 3, "t": "Spedizione ultra rapida stile amazon prime, rapporto quantità prezzo eccellente, ci sono un sacco di foglietti Purtroppo non funzionano come speravo però, una trentina di moschini probabilmente poco svegli sono rimasti appiccicati, gli altri sono affacciati al vetro della finestra o fanno nugoli in giro per casa Peccato", "tags": []}, {"r": 3, "t": "it useful", "tags": []}, {"r": 2, "t": "acheté pour assayer de venir à bout des moucherons dans une cuisine: aucune efficacité le papier reste intact marche peut être pour les insectes des plantes", "tags": ["plants_gnats"]}, {"r": 2, "t": "NULLA", "tags": []}, {"r": 2, "t": "Dommage que les moucherons ne s'y collent pas. Pics bien trop courts", "tags": []}, {"r": 2, "t": "These are useful but one major flaw exists. Whilst trapping pests that eat plants like some bugs do these could catch things like bees. Really are only any good for indoor plants.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 2, "t": "I have to say, these are not to my liking. It's such a faff setting them up, the hangers are not effective, and while the yellow sticky pads are sticky, they don't just catch bugs, but also everything else! I spent ages fiddling with these, wasted most of my afternoon. Next time I will use something more straightforward. Waste of my time and money.", "tags": ["efficacy_fails", "ease"]}, {"r": 1, "t": "Aucun effet sur les mouchettes", "tags": ["efficacy_fails"]}, {"r": 5, "t": "Funktionieren", "tags": []}, {"r": 5, "t": "Bin sehr zufrieden mit dem Fliegenfänger, alle bleiben dran kleben und ich hab meine Ruhe. 😅😅😅😅", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 1, "t": "schrott klebt nicht richtig fehlt immer wieder ab", "tags": ["efficacy_fails", "not_sticky", "plants_gnats", "fruit_flies", "repeat"]}, {"r": 5, "t": "Effektive Gelbsticker gegen Trauermücken und andere kleine Fliegen. Einfach anzuwenden und tun zuverlässig, was sie sollen.“", "tags": ["efficacy_works", "plants_gnats", "ease"]}, {"r": 5, "t": "Die Sticker kleben echt wie S… Wir wurde so unsere Plage los. Könnten im Fußbereich  etwas  stabiler sein, Aber das ist jammern auf hohem Niveau", "tags": ["efficacy_works"]}, {"r": 5, "t": "Funktioniert sehr gut", "tags": ["efficacy_works"]}, {"r": 5, "t": "Grower need it", "tags": []}, {"r": 5, "t": "Arbeiten sehr zuverlässig, altbewährtes Prinzip.", "tags": ["efficacy_works"]}, {"r": 4, "t": "Funktioniert gut. Gute Berarbeitung", "tags": ["efficacy_works"]}, {"r": 5, "t": "Bin sehr zufrieden. Funktioniert einwandfrei. Die Mücken haben keine Schanzen zu entkommen.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Hat bisher gut funktioniert", "tags": ["efficacy_works"]}, {"r": 5, "t": "Fliegen kleben dran sie machen was sie sollen", "tags": ["efficacy_works"]}, {"r": 5, "t": "Sehr nützlich", "tags": []}, {"r": 5, "t": "Einfach nur Klasse ich bin schnell alle Fliegen los! Und sie sehen auch noch hübsch aus ☺👍👍👍", "tags": ["ease", "aesthetic"]}, {"r": 1, "t": "These do not work at all. I have used other similar traps in the past and they would be totally covered in fungus gnats, but these don't seem to attract them at all, even though they are flying around in the house. They feel like a total waste of money and plastic (too bad that they're plastic and not paper based).", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 5, "t": "Super Stecker, ziehen Mücken magisch an", "tags": ["efficacy_works"]}, {"r": 5, "t": "Funktioniert super die Trauer fliegen sind weg!!", "tags": ["efficacy_works"]}, {"r": 5, "t": "Klebt super", "tags": ["efficacy_works"]}, {"r": 4, "t": "Leicht zu handhaben. Ansprechendes Motiv. Funktioniert.", "tags": ["efficacy_works", "ease"]}, {"r": 1, "t": "Bin ich nicht mit zufrieden lassen sich schwierig von der Folie lösen. Würde ich nicht noch mal kaufen.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Für den Preis 60 Tafeln absolut top!", "tags": []}, {"r": 3, "t": "Funktioniert. Nur es dauert bis die Viecher mal darauf landen. Etwas Lockstoff wäre evtl. nicht schlecht. Der allerdings nicht den Pflanzen schadet.", "tags": ["efficacy_works", "efficacy_fails", "plants_gnats"]}, {"r": 5, "t": "Die Sticker funktionieren sehr gut.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Super Preis-Leistungsverhältnis. Hübsch anzusehen.", "tags": ["efficacy_works", "price_value", "aesthetic"]}, {"r": 5, "t": "Beste Hilfe gegen Mücken", "tags": []}, {"r": 3, "t": "Von der Funktion und vom Preis her müsste es 5 Sterne bekommen, aber das Schutzpapier ist viel schlechter geworden als früher ,und lässt sich nur sehr fummelig abziehen. Das abzufummeln ist richtig nervig. Aber im ganzen sehr super.", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 4, "t": "Top", "tags": ["efficacy_works"]}, {"r": 4, "t": "Kleben gut und erreichen ihr Ziel mit der Zeit. Allerdings lassen sich die Schmetterlinge blöd abziehen. Das Papier reißt immer einmal ein und dann wird man gezwungen den Klebebereich anzufassen. Das ist nicht schön und nervig. Ansonsten erfüllen sie ihren Zweck und bei den Blumen passiert das nicht.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Funktioniert gut, könnten etwas größer sein", "tags": ["efficacy_works", "size_issue"]}, {"r": 5, "t": "Funktioniert sehr gut für Trauermücken, trotz anfänglicher Bedenken", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 5, "t": "Consiglio", "tags": []}, {"r": 1, "t": "Habe sie in verschiedene Blumentöpfe gesteckt. Alle Fliegen haben die Sticker ignoriert. Somit rausgeworfenes Geld.", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 5, "t": "Fangen alle Mücken. Paßt", "tags": ["efficacy_works"]}, {"r": 5, "t": "Schnell geliefert und bin begeistert von den klebefallen. Die sind sehr hilfreich für meine Pflanzen da aus der Erde so viel von den kleinen Mücken.", "tags": ["plants_gnats"]}, {"r": 5, "t": "Sehr nützlich  klebt  gut und ist kinderleicht", "tags": ["efficacy_works", "ease"]}, {"r": 5, "t": "👍👍", "tags": []}, {"r": 1, "t": "Gegen die Fruchtfliegen in meiner Küche ist das Produkt VÖLLIG WIRKUNGSLOS. Habe innerhalb von 3 Tagen noch keine einzige damit gefangen. Es halten sich fast ständig ca. 5 bis 10 Fruchtfliegen gleichzeitig in dem Raum auf, in welchem ich 3 Fallen an verschiedenen Stellen angebracht habe. Die Fliegen sitzen auf verschiedenen Oberflächen (z. B. Obst, Spüle, Schranktüren, Wände) - manchmal nur wenige Zentimeter von den Fallen entfernt - aber keine einzige der Fliegen hat bislang das Bedürfnis verspürt, sich direkt auf einer der Fallen niederzulassen, um dort ihr nichtswürdiges Leben auszuhauchen.", "tags": ["efficacy_fails", "fruit_flies", "ease"]}, {"r": 1, "t": "Schon des Öfteren bestellt, wir haben einen Dschungel an Pflanzen im Haus, diesmal bleiben die kleinen Fliegen eher dran hängen weil 'se beim Flug nicht aufgepasst haben oder vielleicht sind 'se ja auch immun dagegen geworden... iwas is an den Dingern geändert worden - leider absolut schrottig...", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 1, "t": "Bei mir hat’s nicht funktioniert", "tags": ["efficacy_fails"]}, {"r": 1, "t": "Die Sticker nutzen ÜBERHAUPT NICHTS! Die Mücken kommen in die Nähe aber vermeiden gar den Kontakt. Einen Stern dafür, dass zumindest Klebstoff aufgebracht ist.", "tags": []}, {"r": 1, "t": "Ich habe mir die Sticker wegen einer Obstfliegenplage gekauft. Die Sticker wurden an mehreren Stellen angebracht. Es hat sich aber keine einzige Obstfliege darauf gesetzt", "tags": ["fruit_flies"]}, {"r": 5, "t": "Funktioniert einwandfrei.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Does the work!", "tags": []}, {"r": 1, "t": "Fliegen sitzen überall außer auf den Dingern", "tags": []}, {"r": 5, "t": "Tun watse solln.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Super hat mir sehr geholfen", "tags": ["efficacy_works"]}, {"r": 5, "t": "Gutes Preis-Leistungsverhältnis. Einfach zu handhaben, sehr hilfreich.", "tags": ["efficacy_works", "price_value", "ease"]}, {"r": 3, "t": "Der Effekt hält sich leider in engen Grenzen", "tags": []}, {"r": 5, "t": "Erfüllt voll seinen Zweck", "tags": []}, {"r": 5, "t": "Alles gut sind sehr Zufrieden, damit und können es in fehlen.", "tags": ["efficacy_works"]}, {"r": 5, "t": "hilft gut", "tags": ["efficacy_works"]}, {"r": 5, "t": "Alles bestens", "tags": ["efficacy_works"]}, {"r": 5, "t": "Funktioniert super!", "tags": ["efficacy_works"]}, {"r": 1, "t": "Hilft nicht viel", "tags": []}, {"r": 2, "t": "wenn man die Mücken oder Fruchtfliegen nicht selber anklebt, dann bleibt nicht viel an den gelben Dingern haften...auch wenn man sie direkt neben Obst oder Saft aufstellt, passiert nicht viel...höchstens mal eine suizidale Fliege...", "tags": ["fruit_flies"]}, {"r": 3, "t": "Efficace dans l’ensemble, les moucherons se collent bien dessus. Par contre, ce n’est pas non plus révolutionnaire, mais ça aide à réduire un peu le problème.", "tags": []}, {"r": 5, "t": "Sind super", "tags": ["efficacy_works"]}, {"r": 1, "t": "The only time this actually caught any fruit flies was when I would use it to squash them! The flies not attracted to these stickers at all.", "tags": ["fruit_flies"]}, {"r": 5, "t": "Alles bestens- gute Größe und einfache Handhabung- bitte nicht im Freien verwenden!!!! Am Kleber bleibt wirklich alles kleben!!!!", "tags": ["efficacy_works", "size_issue", "ease"]}, {"r": 5, "t": "Tolles Produkt. Erfüllt seinen Zweck", "tags": []}, {"r": 1, "t": "Half nicht", "tags": []}, {"r": 4, "t": "Alles gut", "tags": ["efficacy_works"]}, {"r": 5, "t": "Wie erwartet tun die Klebefallen was sie Sollen.  Gute Qualität", "tags": ["efficacy_works"]}, {"r": 1, "t": "Wir haben derzeit eine Fruchtfliegen-Plage und dafür diese Klebefallen angeschafft. Leider gehen die Fruchtfliegen nicht an diese Fallen, diese sind somit völlig wirkungslos. Schade ums Geld und die vertane Zeit. Die Dinger gehen in den Müll.", "tags": ["fruit_flies"]}, {"r": 1, "t": "Nach Erhalt habe ich gleich mehrere der Sticker in der Küche platziert. Quasi direkt dort wo die Fruchtfliegen „wohnen“. Ergebnis nach 24 Stunden: 1 Fruchtfliege hat sich auf dem Sticker niedergelassen.  Da ist jedes Hausmittel (einfach mal googeln) wirksamer als diese Sticker. Im Endeffekt 6€ zum Fenster rausgeworfen und den Müll kann ich auch entsorgen.", "tags": ["fruit_flies", "ease"]}, {"r": 1, "t": "Nicht eine Mücke hat sich dorthin verirrt. Nutzlos", "tags": ["efficacy_fails"]}, {"r": 5, "t": "Die funktionieren genauso gut wie die teuren Matkenprodukte", "tags": ["efficacy_works"]}, {"r": 5, "t": "Es funktioniert 100% schnell und zuverlässig!", "tags": ["efficacy_works", "ease"]}, {"r": 5, "t": "Alles Bestens gelaufen Gerne wieder", "tags": ["repeat"]}, {"r": 4, "t": "Excellent produit, colle très fort", "tags": []}, {"r": 5, "t": "TOP wie immer, Fliegen bleiben super dran kleben. kaufe die immer gerne und auch wieder", "tags": ["efficacy_works", "ease"]}, {"r": 5, "t": "Macht was es soll zu empfehlen", "tags": ["efficacy_works"]}, {"r": 5, "t": "Gelbtafeln funktionieren bei Trauermücken", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 5, "t": "Sie machen absolut ihren Job!", "tags": ["efficacy_works"]}, {"r": 1, "t": "Funktioniert nicht gegen Fliegen, Fruchtfliegen oder Mücken! Nur in der Blumenerde hilft es gegen das dort lebende Ungeziefer.", "tags": ["efficacy_fails", "fruit_flies"]}, {"r": 1, "t": "Entweder zu alt oder nutzlos", "tags": ["efficacy_fails"]}, {"r": 3, "t": "Funktionieren nur teilweise ein paar Fruchtfliegen bleiben kleben", "tags": ["very_sticky", "fruit_flies"]}, {"r": 5, "t": "Immer gute eigenschaften", "tags": ["efficacy_works"]}, {"r": 3, "t": "Gut", "tags": ["efficacy_works"]}, {"r": 1, "t": "Die Fruchtfliegenfalle zeigt überhaupt keine Wirkung", "tags": ["fruit_flies"]}, {"r": 1, "t": "SEHR SCHLECHTE QUALITÄT Schutzpapier lässt sich schlecht bis gar nicht abziehen nicht zu empfehlen", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 2, "t": "Auch nach einer Woche kaum Fliegen am Kleber. Wir hatten ein Alternativprodukt eines Discounters und dieser funktionierte um einiges besser. Daher leider nur mangelhafte Wirksamkeit", "tags": ["efficacy_works", "fast_result"]}, {"r": 1, "t": "Leider ein Griff ins Klo", "tags": []}, {"r": 1, "t": "Ich habe diese Insektenfalle für die kleinen Obstfliegen gekauft. Leider setzen sich die kleinen Fliegen über all hin aber leider nicht auf die Schmetterlinge, somit bringt die Falle leider nichts.", "tags": ["efficacy_fails", "fruit_flies"]}, {"r": 1, "t": "Keine Fruchtfliege verirrt sich auf diesse Falle. Nicht eine nach 5 Tagen und zwei Fallen. Und es sind zahlreiche vorhanden...", "tags": ["fruit_flies"]}, {"r": 3, "t": "Je ne sais pas si ça marche ou non, en tout cas j'avais une invasion de trips de dehors et non sur mes plantes (des trips des céréales ?) mais ça n'a RIEN attrapés, pourtant des centaines d'insectes. (voir milliers, vraiment) J'avais acheté la couleur bleu, rien, chat gpt a insisté pour acheter en jaune, toujours rien.", "tags": ["plants_gnats"]}, {"r": 5, "t": "Das funktioniert sooooo gut!! Sooo viele Trauermücken aus der Erde bleiben dort kleben! Unglaublich. Weniger fliegen herum! Werde ich nachbestellen 100%", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Geht", "tags": []}, {"r": 4, "t": "Große Menge.", "tags": ["plants_gnats"]}, {"r": 5, "t": "Einfache Handhabung, Ergebnis super", "tags": ["efficacy_works", "plants_gnats", "size_issue", "ease"]}, {"r": 5, "t": "Obstfliegen haben kein langes Leben. Die Stecker erfüllen auch ihre Aufgabe in Blumentöpfen sehr gut. Besonders bei dem heißen, schwülen Wetter.", "tags": ["efficacy_works", "plants_gnats", "fruit_flies"]}, {"r": 5, "t": "Alles gut", "tags": ["efficacy_works", "repeat"]}, {"r": 5, "t": "Einfache Handhabung, die Gelbtafeln lassen sich leicht anbringen, nach ein eigen Tagen sieht man das Ergebnis. Gutes Produkt.", "tags": ["efficacy_works", "ease"]}, {"r": 2, "t": "Sie funktionieren leider nicht richtig. Alle möglichen Mücken oder Obstfliegen machen einen Bogen drum herum und es bleiben kaum welche haften…", "tags": ["fruit_flies"]}, {"r": 4, "t": "Rezensenten berichten zu recht das das Papier grade von den Schmetterlingen nicht abgeht !. Das liegt an der unvorteilhaften Form ............  wenn man von der Mitte unten den dafür vorgesehenen Zipfel benutzt reißt der einfach ab !. - Und SO gehts  :  Mit einem Messer seitlich am Flügel das Papier anheben - macht das auf beiden Seiten damit Ihr beim zweiten Papier nicht mit den Fingern an der befreiten Seite kleben bleibt !!. - Nun kann man das gelöste Papier mit ein wenig Geschick und langsam  über die Fläche relativ leicht abziehen weil die Hinterschnitte am Rand in ziehrichtung liegen 😁. ", "tags": ["efficacy_works", "ease"]}, {"r": 5, "t": "Top Produkt,schnelle Lieferung", "tags": ["efficacy_works"]}, {"r": 5, "t": "Genau wie beschrieben", "tags": []}, {"r": 4, "t": "Meinen Trauermücken gefällts zwar nicht, sie bleibe kleben. Aber mir umso mehr. Gibt's nichts auszusetzen, außer das sich die Schutzfolie nicht gut löst", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 5, "t": "Hilft 100 %", "tags": []}, {"r": 5, "t": "Funktioniert einwandfrei,nur die Schutzfolie entfernen ist ein bisschen fummelig,aber es geht", "tags": ["efficacy_works"]}, {"r": 1, "t": "Preiswert, aber sehr umständlich die Folien vor Gebrauch zu entfernen", "tags": ["price_value"]}, {"r": 5, "t": "Funktioniert gut !", "tags": ["efficacy_works"]}, {"r": 5, "t": "Bardzo szybka dostawa,na drugi dzień . Bardzo  praktyczne,polecam", "tags": []}, {"r": 5, "t": "Funktioniert überraschend gut Sehr empfehlenswert", "tags": ["efficacy_works"]}, {"r": 5, "t": "Wenn man Probleme mit Fruchtfliegen hat sind diese Klebefallen die erste Wahl. Hat sofort geholfen.", "tags": ["efficacy_works", "fruit_flies", "fast_result"]}, {"r": 5, "t": "Świetny produkt do odstraszania muszek, przydatny szczególnie do młodych sadzonek soślin , oraz kwiatów", "tags": []}, {"r": 5, "t": "Ich habe die Kewyuz Gelbsticker gegen Trauermücken in meinen Zimmerpflanzen ausprobiert. Die Sticker sind einfach anzuwenden - einfach Schutzfolie abziehen und in die Erde stecken.  Wirkung: Die Mücken werden nicht sofort angezogen, aber über die Zeit sammeln sich immer mehr Mücken auf den Gelbstickern. Es dauert etwas länger, bis man Ergebnisse sieht, aber wenn man geduldig ist, wirkt es. Nach ein paar Tagen konnte ich eine deutliche Reduktion der Trauermücken feststellen.  Anwendung und Haltbarkeit: Die Sticker sind robust und können auch in größeren Pflanzgefäßen eingesetzt werden. Sie halt", "tags": ["efficacy_works", "plants_gnats", "size_issue", "ease", "fast_result"]}, {"r": 5, "t": "Co tutaj dużo pisać produkt dobrze funkcjonuje zbiera muszki", "tags": []}, {"r": 5, "t": "Sehr gut", "tags": ["efficacy_works"]}, {"r": 5, "t": "angenehm zu tragen qualität gut", "tags": ["efficacy_works", "price_value"]}, {"r": 5, "t": "Bardzo przydatne", "tags": []}, {"r": 5, "t": "Sind perfekt, endlich die kleinen Fliegen los zu werden.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Funktioniert", "tags": ["efficacy_works"]}, {"r": 4, "t": "Klebesticker funktionieren und es bleiben die kleinen Mücken kleben. Allerdings ist der Sticker billig gemacht und könnte etwas kleiner und handlicher sein.", "tags": ["price_value"]}, {"r": 5, "t": "Das Teil funktioniert. Nach einigen Tagen kleben alle Fliegen an dem Klebebrettchen.", "tags": ["efficacy_works"]}, {"r": 4, "t": "Dauert bisschen, hat aber funktioniert", "tags": ["efficacy_works", "aesthetic"]}, {"r": 5, "t": "🌟 Effektive Trauermückenfalle von KEWUZY! 🌟  Die KEWUZY 60 x Gelbsticker sind einfach super für die Schädlingsbekämpfung bei Zimmerpflanzen. Die Trauermücken bleiben super dran kleben, ganz anders als bei anderen Gelbtafeln, die ich ausprobiert habe. Die klebrige Oberfläche funktioniert einwandfrei und hilft wirklich, Schädlinge effektiv loszuwerden.  Der Versand war gut und ohne Probleme, alles kam schnell und sicher bei mir an. Ich bin sehr zufrieden und gebe volle 5 Sterne!⭐⭐⭐⭐⭐", "tags": ["efficacy_works", "plants_gnats", "ease"]}, {"r": 5, "t": "Perfekte sticks für kleine Ungeziefer in Blumentöpfe.durch fas helle gelb werden Sie angelockt,funktioniert prima", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 5, "t": "top", "tags": []}, {"r": 5, "t": "Tut was es soll, nervige Fliegen fangen", "tags": []}, {"r": 3, "t": "Sind sehr wirkungsvoll, nur leider ist die Schutzfolie kaum von den Stickern zu lösen, d.h. es ist ein ziemlicher Aufwand sie abzubekommen. Habe die Sticker schon öfters bestellt und dieses mal aber leider schlechte oder alte bekommen.", "tags": ["efficacy_fails"]}, {"r": 5, "t": "Klappt perfekt, keine Fliegen mehr", "tags": ["efficacy_works"]}, {"r": 5, "t": "Klebt gut und lässt sich gut anbringen, einfach immer wieder austauschen wenn sie voll sind, bei der Menge kein Problem", "tags": ["efficacy_works", "very_sticky", "plants_gnats", "ease", "repeat"]}, {"r": 5, "t": "Da meine Pflanzen leider befallen sind hab ich diese Kleber gekauft, sie wirken sehr gut. Für einen feinmotorischen Honk wie mich etwas schwer in die Erde zu bekommen ohne selber an der Falle zu kleben aber wenn sie erst mal steckt ergeht es den Fliegen schlecht.", "tags": ["efficacy_works", "efficacy_fails", "plants_gnats"]}, {"r": 2, "t": "Im ganzen würde ich 5 Sterne geben, wenn es leichter zum anbringen währe. Die Schutzstreifen von den Klebeseiten sind nur mühsam zu lösen! Geht fast gar nicht! Ständig reist das Schutzpapier. Ein einfaches Viereck, mit einer Ablösestelle, würde vollkomm reichen! Aber kleben tut es super!", "tags": ["efficacy_works", "ease"]}, {"r": 5, "t": "It attracts the tiny fruit flies and then they stick to it. It is amazing having these stickers, no more fruit flies.", "tags": ["fruit_flies"]}, {"r": 5, "t": "Funktioniert !", "tags": ["efficacy_works"]}, {"r": 1, "t": "Ich hab jetzt geduldig gewartet, aber in keine einzige Fall ist auch nur eine Fruchtfliege hängen geblieben. Sie ignorieren die Fallen komplett.", "tags": ["fruit_flies"]}, {"r": 3, "t": "Die \"Schmetterlinge\" waren extrem klebrig, die absolute Todesfalle für allerlei Fliegen. Absolute 10/10. Die \"Tulpen\" oder \"Gespenster\" sind leider viel weniger klebrig. Ich habe mehrfach beobachtet wir Fliegen auf der Klebefläche landen, umherlaufen und wieder abheben. Erst wenn die Flügel die Klebefläche berühren können die Fliegen nicht mehr weiter.  Die eine Hälfte hat also wirklich hervorragend funktioniert, die andere Hälfte eher so naja.", "tags": ["efficacy_works"]}, {"r": 2, "t": "Es ist sehr schwer die Fruchtfliegenstecker in die Erde der Blumentöpfe zu stecken ohne an den Blättern kleben zu bleiben. Bei mir im Test durchgefallen", "tags": ["plants_gnats", "fruit_flies"]}, {"r": 5, "t": "Das Produkt wurde schnell geliefert und zieht gut Trauermücken an. Die Klebeflächen sind sehr stark und sollten vorsichtig an Blättern vorbei in die Blumenerde gesteckt werden, sonst kriegt man festklebende Blätter nicht mehr davon ab.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Gute Ware !", "tags": ["efficacy_works"]}, {"r": 5, "t": "Es funktioniert, genau wie ich es wollte. Ich empfehle es.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Die Kleber funktionieren prima. Nach wenigen Tagen flogen kaum noch fruchtfliegen in der Küche herum", "tags": ["fruit_flies"]}, {"r": 4, "t": "Funktioniert ohne Probleme. Für den Preis ein Schnapper. Ein Stern abzug, da es teilweise nervig ist, die Folie abzuziehen, da diese sehr schnell reißt. Das eventuell verbessern, wenn möglich.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Super", "tags": ["efficacy_works"]}, {"r": 5, "t": "Gerne wieder", "tags": ["repeat"]}, {"r": 1, "t": "An diesen \"Fallen\" bleibt nur durch Zufall mal eine Fliege kleben, ansonsten düsen die Viecher da drum herum und haben null Interesse daran.", "tags": []}, {"r": 5, "t": "I.o.", "tags": ["efficacy_works"]}, {"r": 5, "t": "In nur eine halbe Stunde so viele Mücken angefangen worden in einem Topf, in dem ich nicht viele vermutet hatte !", "tags": ["efficacy_works"]}, {"r": 5, "t": "schon nach 4 Stunden war der Schmetterling besiedelt nur zu empfehlen", "tags": ["efficacy_works", "fast_result"]}, {"r": 5, "t": "Gerne wieder", "tags": ["efficacy_works", "repeat"]}, {"r": 5, "t": "W przeciągu godziny bardzo pomogło. Bardzo przydatne.", "tags": []}, {"r": 5, "t": "Sehr gutes Pruduckt. Entfehlenswert", "tags": ["efficacy_works"]}, {"r": 5, "t": "Schön finde ich, dass man diese Sticker stecken kann, ohne sich die Finger zu verkleben, und sie bleiben besser in der Erde stehen. Wirksamkeit von Gelbstickern ist ja bekannt, und diese funktionieren tadellos.", "tags": []}, {"r": 5, "t": "die Nutzungsmöglichkeit ist vielfältig und auch bei Tierhaushalten kein Problem. Nur sollte man es so aufstellen dass es nicht im Fell eines Hyutieres kleben bleiben kann", "tags": []}, {"r": 1, "t": "Die falle funktioniert tadellos. Aber es ist nicht möchte das Deckblatt abzuziehen  ohne sich die Finger zu verkleben  .ärgert mich immer wieder.  Darum einen fut gemeinten 🌟", "tags": ["efficacy_works", "repeat"]}, {"r": 5, "t": "Habe die Leimfallen in den Blumentopf stecken, um Trauermücken und anderes Viehzeug zu fangen welches so im Haus rumfliegt. Kann ich nur empfehlen, kein großer Aufwand und gute Wirkung.", "tags": ["efficacy_works", "plants_gnats", "price_value"]}, {"r": 5, "t": "Wir haben das Produkt im Sommer genutzt um z.B. an der Spüle oder generell in der Küche um Fruchtfliegen zu fangen und es hat gut funktioniert.", "tags": ["efficacy_works", "fruit_flies"]}, {"r": 3, "t": "Die Fliegen kleben gut, ebenso, die Finger, wenn man versucht, das Teil in die Erde zu stecken, da ist noch Verbesserungsbedarf nötig, ich hatte solche Teile schon mal in anderer Form gehabt, waren besser, auch das ablösen des Papiers, nicht so wirklich toll.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Work the purpose", "tags": []}, {"r": 5, "t": "Funktioniert sehr gut", "tags": ["efficacy_works"]}, {"r": 4, "t": "Nur der Schmetterling ist ein Kampf, um das Papier sauber abziehen zu können", "tags": []}, {"r": 5, "t": "Super Qualität zum wirklich günstigen Preis.", "tags": ["efficacy_works", "price_value"]}, {"r": 1, "t": "Sorry, ich weiß nicht was ich sonst schreiben soll, aber dieses Produkt ist unbrauchbar. Hatte die Dinger an verschiedenen Obstfliegen-Hotspots angebracht. Es hatte sich jeweils eine Fliege darauf verirrt und sogar kleben geblieben. Denke mal das waren die  Ältesten ihres Stammes. Wie auch immer, die Klebefläche ist völlig untauglich im Vergleich zu anderen Produkten, also meine Erfahreung -> Finger weg!!!", "tags": ["fruit_flies"]}, {"r": 5, "t": "Ist echt super, schneller Versand", "tags": ["efficacy_works"]}, {"r": 5, "t": "Erfüllt seinen Zweck!", "tags": ["efficacy_works"]}, {"r": 5, "t": "Top Preis für die 60 Stück!", "tags": []}, {"r": 5, "t": "Starke Anziehungskraft und hübsch anzusehen :-) nach zwei Wochen in Verbindung mit Nematoden(!!!)waren die Trauermücken ausgerottet", "tags": ["efficacy_works", "plants_gnats", "aesthetic"]}, {"r": 4, "t": "Ich habe das Produkt mit 4/5 Sternen bewertet aus folgenden Gründen:  + sieht schön aus (schöne Formen) + Mücken kleben dran  - Formen sind schon sehr dünn, und bleiben schnell sobald man Plastik abzieht an der Hand kleben  Würde das Produkt für den preis jedoch immer wieder kaufen!", "tags": ["repeat"]}, {"r": 3, "t": "Die Gelbtafeln erfüllen ihren Zweck. Sämtliches Ungeziefer haftet problemlos. Allerdings ist die Schutzfolie aufgrund der Form super super schlecht zu entfernen... Das ist leider eine wahnsinnige Fummelarbeit. Schade.", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 4, "t": "Das Schmetterlingsmotiv ist zwar schön, aber etwas unpraktisch beim abmachen der Folie. Ansonsten alles top", "tags": ["ease"]}, {"r": 4, "t": "Für den Preis ein super Produkt! Die Fliegen aller Art werden direkt angelockt und kleben fest. Leider ist es nervig, wenn man mit den Finger auf die Klebefläche kommt. Aber damit kann man leben. Es tut definitiv, was es verspricht!!", "tags": ["efficacy_works"]}, {"r": 1, "t": "Da ist ein Glas mit Wasser, Apfelessig und einem Tropfen Spüli besser geeigent. Die Fallen bringen bisher wirklich absolut nichts", "tags": ["fruit_flies"]}, {"r": 4, "t": "Klebt wie Hölle und fängt unglaublich viele Fliegen. Sinn erfüllt.", "tags": ["efficacy_works"]}, {"r": 1, "t": "Preis ist super, wenn man die Fruchtfliegen mit der Hand fangen möchte. Also für Räumlichkeiten haben die Dinger keinen Effekt,... vielleich in Blumenkästen bei fiesem Befall.", "tags": ["efficacy_works", "fruit_flies"]}, {"r": 4, "t": "it doesnt attract flies. but if you want to hunt them by using it it can be perfect weapon for you.", "tags": []}, {"r": 3, "t": "Hab den Artikel in die Blumentöpfe 🌺 gesteckt, leider wenig Erfolg", "tags": ["plants_gnats"]}, {"r": 2, "t": "Seit 10 Tagen bisher eine einzige Mücke festgeklebt. Viele andere freuen sich ihres Daseins.", "tags": []}, {"r": 1, "t": "Ich weiß ja nicht, ob unsere Trauermücken und Fruchtfliegen einfach intelligenter sind als die der vielen positiven Bewertungen hier, aber nach mehreren Tagen haben sich bei uns bisher genau 0 an diese Fallen verirrt.", "tags": ["plants_gnats", "fruit_flies", "ease"]}, {"r": 4, "t": "Preis Leistung okay", "tags": ["efficacy_works", "price_value"]}, {"r": 3, "t": "Habe mir diese Gelbtafeln gekauft, da ich einen kleinen Befall von Trauermücken hatte. An sich helfen die Tafeln und erfüllen den Zweck, aber 1 Stern Abzug da die Schutzfolie manchmal sehr schwer runter geht und man von der Folie Stückchen hat um die zu entfernen klebt man sich dann komplett voll. Sonst klare Kaufempfehlung 👍😊", "tags": ["plants_gnats"]}, {"r": 4, "t": "Preis Leistung ist gut und wurde auch prompt geliefert.Es erfüllt absolut seinen Zweck gegen die Trauermücken. Die Schutzfolie geht zwar nicht gleich runter,aber das ist für diesen Preis kein Hinderniss.Ich würde es wieder kaufen.", "tags": ["efficacy_works", "plants_gnats", "price_value", "repeat"]}, {"r": 1, "t": "Absolut unwirksam. Wir haben die Klebefalle seit 5 Tagen in großer Zahl im Einsatz, kein einziges Insekt wurde bisher angelockt. Insofern ein absoluter Fehlkauf - rausgeworfenes Geld.", "tags": ["efficacy_fails"]}, {"r": 3, "t": "Die Dinger tun - sofern man die Schutzfolie abbekommen hat - ihren Dienst. Aber bis dahin ist man fünfmal verzweifelt und hat klebrige Finger. Zumindest bei den Dingern, die eine Blumenform haben. Die Schutzfolie reißt ständig ein und man muss dann irgendwie die restlichen Fitzel runterpopeln.", "tags": []}, {"r": 4, "t": "Leider Kann man das Schutzpapier bei manchen Gelbstickern schlecht entfernen. Alles klebt sofort fest dran. Da kommt keine Trauermücke o.ä. wieder weg. Es riecht nach nichts.", "tags": ["efficacy_works", "efficacy_fails", "fast_result"]}, {"r": 3, "t": "Die Schmetterlinge sind fast unbrauchbar. Man bekommt die weiße Folie nur extrem schlecht ab. Bei den anderen funktioniert es etwas besser.", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 3, "t": "Die KEWUZY 60 x Gelbsticker bieten eine großzügige Menge zu einem erschwinglichen Preis. Leider erfüllten sie meine Erwartungen bezüglich der Schädlingsbekämpfung nicht ganz. Einige Insekten wurden angezogen, aber nicht alle. Für Experimentierfreudige möglicherweise geeignet, aber für zuverlässige Ergebnisse würde ich andere Optionen empfehlen.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Sie kleben und fangen Fliegen.", "tags": []}, {"r": 2, "t": "Das ist bereits die zweite Packung, wo dich die Schutzfolien sich nicht lösen lassen. Anscheinend werden sie schlecht gelagert.", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 4, "t": "Funktioniert gut. Schutzpapier ist schwer abziehbar Die Mücken bleiben hängen am Klebstoff.", "tags": ["efficacy_works"]}, {"r": 3, "t": "The butterfly model was not good because the white protective paper was stuck to the yellow glue and could not be removed", "tags": []}, {"r": 2, "t": "Die Wirkung ist super. Wir nutzen solche Kleber schon länger und halten sie für effektiv. Dieses Produkt ist allerdings mangelhaft… die Folie auf dem Kleber lässt sich schwer abziehen. Das Papier reißt oft und die Hände werden klebrig. Sehr unangenehm. Hatten die Erfahrung mit anderen Marken nicht…", "tags": ["efficacy_works"]}, {"r": 1, "t": "Die Folie lässt sich bei den Blumen nicht abziehen, da sie zu fest klebt und wegen der Form immer einreißt! Man braucht eine Pinzette und hat klebrige Hände danach. Keine Kaufempfehlung, da gibt es bessere Gelbsticker von anderen Herstellern!", "tags": []}, {"r": 4, "t": "Erfüllen ihren Zweck, manchmal lässt sich das Papier nicht gut abziehen (reißt) und \"Füßchen\"-Knick für stabileren Halt hält nicht sooo in Form.", "tags": ["efficacy_works"]}, {"r": 4, "t": "funktioniert super man sieht den Erfolg und ist überrascht wie viele", "tags": ["efficacy_works"]}, {"r": 4, "t": "Das Papier lässt sich schwer entfernen, reißt immer wieder ab.", "tags": ["repeat"]}, {"r": 1, "t": "Was kann man bei Gelbtafeln schon falsch machen? Offensichtlich einiges, wenn man die falsche Form wählt. Alle 30 Gelbtafeln in Schmetterlingsform (immerhin die Hälfte!) wandern in den Müll. Das Schutzpapier ist nur mit äußerst viel Gefummel und nie in einem Stück von den Klebeflächen ablösbar und davon hat man immerhin zwei pro Tafel. Die Tulpenform ist perfekt. Aber wenn die Hälfte weggeschmissen werden muss, dann gibt es auch nur einen Stern.", "tags": ["efficacy_works"]}, {"r": 3, "t": "Passt eigentlich könnte vl bissi mehr kleben", "tags": []}, {"r": 1, "t": "Sind günstig und helfen nicht , ausserdem lässt sich der Schmetterling nicht abziehen bleibt das Papier in Fetzen hängen und die Trauermücken freuen sich darüber, lieber etwas mehr Geld ausgeben und die kleben wirklich gut. Absolut nicht zu empfehlen. Ich habe feinen Sand , Lavagestein auf die Erde gegeben und das Hilft besser gegen diese Trauermücken und zusätzlich bessere Klebefallen besorgt, sorry keine gure Qualität. Jetzt sind sie weg.", "tags": ["efficacy_works", "plants_gnats", "price_value"]}, {"r": 1, "t": "Man bekommt die Schutzfolie nur in Fetzen ab, wenn man es dann geschafft hat, kann man mit den klebrigen Fingern sehr gut Fliegen fangen oder Staub aufnehmen.", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 2, "t": "Die einfachen sind gut, die Schmetterlinge sind nutzlos da man sie nicht richtig abziehen kann. Würde ich mir daher nicht nochmal kaufen.", "tags": ["efficacy_works", "efficacy_fails", "ease"]}, {"r": 2, "t": "Kleben gut, aber so gut das man kaum das Papier ab bekommt. Schade, sonst 5 Sterne.", "tags": ["efficacy_works", "very_sticky"]}, {"r": 1, "t": "Nach etlichen verschiedenen Herstellern habe ich mit diesem Produkt das am schlechtesten handhabbare unter den Gelbtafeln erwischt. Der Kleberschutz lässt sich nur sehr schwer und in Ferzen ablösen und man hat garantiert klebrige Finger im Anschluss. Hoffentlich bleiben wenigstens auch die Trauermücken effektiv daran kleben.", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 4, "t": "macht was es soll-Mücken fangen.kleines minus ist das herunterlösen des Papiers-manchmal geht es ganz einfach,dann wieder extrem schweres ablösen", "tags": ["efficacy_works", "ease"]}, {"r": 1, "t": "Die Schmetterlingsform lässt sich schlecht sehr von der Folie befreien, ständig reißt sie ein, bei der anderen Form ist das deutlich einfacher. Ich bin mit der Klebkraft sehr unzufrieden, die Mücken lachen sich schlapp, wenn sie dagegen fliegen. Ich werde sie nicht wieder kaufen.", "tags": ["efficacy_works", "efficacy_fails", "ease", "repeat"]}, {"r": 2, "t": "Der Kleber ist nicht schlecht, nur lässt sich das Papier nicht einfach abziehen.. Muss es abknibbeln und somit eine große Sauerei! Vermutlich zu lange, bei hoher Temperatur gelagert.", "tags": ["efficacy_fails", "ease"]}, {"r": 1, "t": "Katzenkopfform ok, Schmetterlingsform unterirdisch, weil da die Schutzfolie entfernen die Adrenalinausschüttung triggert. Das gefummel diese Folie in zig  Stücken zu entfernen ist eine Zumutung. Da hier nur die Hälfte nutzbar ist, relativiert sich der gute Preis hin zu extrem teurer Ware. Leider brauchen meine Chili diese Teile, also no retour. Geld rausgeworfen.", "tags": ["efficacy_works"]}, {"r": 4, "t": "klappt alles wunderbar", "tags": ["efficacy_works"]}, {"r": 4, "t": "The stickiness of these ones is okay, but I have others that in comparison sticks more.", "tags": ["efficacy_works"]}, {"r": 4, "t": "Die Gelbkleber sind von beiden Seiten mit Kleber versehen, wodurch sie zuverlässig gegen Trauermücken und kleine Fliegen helfen. Kleiner Minuspunkt, das Schutzpapier ist teilweise ein wenig fummelig abzuziehen und reißt gerne mal in kleine Stücke.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "They do the job of keeping track of and control pests.", "tags": ["efficacy_works"]}, {"r": 4, "t": "Kleben gut, nur die Schuttfolie reißt beim abziehen immer ein. Dadurch bekommt man dann auch selber klebrige Finger. Aber bei dem Preis kann man auch nicht viel mehr erwarten", "tags": ["efficacy_works"]}, {"r": 4, "t": "Super Sache", "tags": ["efficacy_works"]}, {"r": 1, "t": "Dieses Ding hat seit dem Kauf keine einzige Fliege gefangen.", "tags": ["efficacy_fails"]}, {"r": 4, "t": "Durch dir gelbe Farbe unglaublich auffällig aber sie tuen was sie sollen.", "tags": ["efficacy_works"]}, {"r": 1, "t": "Das Papier zum Abziehen bleibt am Kleber kleben und reißt ständig. Keine Kauf Empfehlung", "tags": []}, {"r": 4, "t": "Zieht wirklich sehr viele Fliegen an. Ein paar schwirren jedoch auch einfach in der Nähe davon herum und lassen sich nicht ernten.", "tags": ["ease"]}, {"r": 4, "t": "Also ja es kleben viele dran aber es werden gefühlt trotzdem mehr. Habe mir jetzt zusätzlich noch andere Larven bestellt die die Trauermücken Larven angeblich eliminieren. Ich bin gespannt...", "tags": ["plants_gnats"]}, {"r": 3, "t": "Die Sticker beinhalten das anziehende Motten-hormon nicht, dadurch lockt es keine Motten an. Trotzdem kleben sich ein paar Motten dran.", "tags": []}, {"r": 4, "t": "Super die Dinger funktionieren perfekt. Einziger Nachteil bei der Schmetterlingsform lässt sich die Folie schlecht abziehen. Deswegen nur 4 von 5 Sternen.", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 4, "t": "According to the website the stickers are non-toxic for humans and plants. I would like to know if they are potentially toxic for cats and dogs.", "tags": ["plants_gnats"]}, {"r": 4, "t": "En effet les mouches s'y collent. Après c'est pas pour autant qu'elles ont disparues de mon appartement...", "tags": []}, {"r": 3, "t": "Die Folie lässt sich sehr schlecht abziehen.", "tags": ["efficacy_fails"]}, {"r": 3, "t": "Tut was es soll. Die Klebewirkung ist aber Ausbaufähig. Ich habe mehrere kleine Fliegen entdeckt, die sich auf der Klebefläche fortbewegen konnten und sich an den Rändern wieder befreien konnten. Nichts desto trotz wird die ein oder andere Fliege gefangen.", "tags": []}, {"r": 4, "t": "Etwas schwerer in die Erde zu stecken (-1*), aber zum Zeitpunkt des Kaufs das Produkt mit dem besten P/L. Offensichtlich erfüllen die Fallen ihren Zweck, wie an dem Foto zu erkennen, folglich eine Empfehlung mit nur einem Stern Abzug.  Positiv auch hervorzuheben, dass nicht die gesamte Fläche beklebt ist, wodurch man nicht in Kleber fasst.", "tags": ["efficacy_works", "price_value"]}, {"r": 4, "t": "✅ Positiv 1️⃣ Preis Die Gelbtafeln sind zu meinem Kaufzeitpunkt die günstigsten auf dem Markt gewesen und waren daher auch Grund für meinen Kauf.  2️⃣ Optik und Größe Ich finde die Formen ansprechend und abwechslungsreich. Die Gelbtafeln sind echt groß und können viele Fliegen fangen.  🔘Neutral 1️⃣ Klebekraft Meiner Meinung nach ist die Klebekraft etwas schwächer als bei anderen Gelbtafeln. Allerdings scheint es zu reichen um die Fliegen/ Trauermücken zu fangen. Zur Unterstützung sind die also nicht verkehrt.  ❗️Negativ 1️⃣ Sticker schwierig zu entfernen Die weisen Aufkleber sind echt fummelig", "tags": ["efficacy_works", "plants_gnats", "price_value", "size_issue"]}, {"r": 2, "t": "Hat Ihre Zweck nicht erfüllt…", "tags": []}, {"r": 2, "t": "Ich habe 10 Kärtchen verteilt, nach einem Tag waren bei relativ hohem Fruchtfliegenbefall genau 0 Fruchtfliegen an den Teilen. Lediglich bei einer, die ich in eine Pflanze gesteckt hatte, fanden sich 3 Trauermücken, da scheinen sie zu funktionieren.", "tags": ["efficacy_works", "efficacy_fails", "plants_gnats", "fruit_flies"]}, {"r": 1, "t": "Ich hab sie seit 2 Tagen im Blumentopf stecken. Leider ist bis jz keine einzige Fliege drauf.", "tags": ["plants_gnats"]}, {"r": 4, "t": "goed product maar wat groot", "tags": []}, {"r": 1, "t": "Die bestellte Ware kam super schnell doch leider der Schock beim auspacken ( geöffnet + beschädigt )). Nie wieder !", "tags": ["efficacy_works"]}, {"r": 4, "t": "Ja was soll ich dazu jetzt schreiben es funktioniert und erfüllt seinen Zweck😅", "tags": ["efficacy_works"]}, {"r": 4, "t": "hatten schon mal diese gelbtafeln bestellt welche wesentlich besser geklebt haben. aber auch im innebereich gut.", "tags": ["efficacy_works"]}, {"r": 3, "t": "Die Folie lässt sich nicht besonders gut entfernen.", "tags": ["efficacy_works"]}, {"r": 1, "t": "Das Produkt zeigt keinerlei Wirkung, nach einer Woche keine einzige Fruchtfliege erwischt", "tags": ["efficacy_fails", "fruit_flies", "fast_result"]}, {"r": 1, "t": "Glaube die Fruchtfliegen wissen einfach was das ist . Sie umgehen das Teil wie Weltmeister.  Also ein absolutes no-Go für dieser Produkt.", "tags": ["efficacy_works", "fruit_flies", "ease"]}, {"r": 4, "t": "This works wonders for those annoying little flies that live in the soil of houseplants.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 1, "t": "Ich habe die Gelbsticker gekauft um endlich die Fruchtfliegen loszu werden, funktioniert gar nicht. Die Fruchtfliegen interessieren sich gar nicht dafür. Ein richtiger Fehlkauf.", "tags": ["efficacy_works", "fruit_flies"]}, {"r": 2, "t": "werde ich nie wieder bestellen", "tags": []}, {"r": 1, "t": "Abitando vicino a un bosco e avendo anche del prato sotto casa nel periodo estivo ho sempre problemi di moscerini ma purtroppo queste trappole non hanno funzionato come speravo. Le ho posizionate seguendo le istruzioni, ma dopo diversi giorni non hanno catturato nessun insetto. L’idea è buona, ma nel mio caso si sono rivelate inutili. Non le ricomprerei.", "tags": []}, {"r": 1, "t": "Après plusieurs mois d'essai et utilisation, totalement inefficace, aucun intérêt", "tags": []}, {"r": 3, "t": "Efficacent pour les moucherons mais pas facile à installer", "tags": []}, {"r": 1, "t": "C'est nul", "tags": []}, {"r": 1, "t": "Pas efficace", "tags": []}, {"r": 3, "t": "N attrape pas vraiment les moucherons dans mon cas, c est moi qui va les attraper avec les pièges car les pièges sont très collants.", "tags": []}, {"r": 1, "t": "Articles collés entre eux", "tags": []}, {"r": 1, "t": "Complètement inutile", "tags": []}, {"r": 4, "t": "Fait le taffe", "tags": []}, {"r": 1, "t": "Aucune efficacité.  J'en ai mit partout et aucun moucherons de attraper", "tags": []}, {"r": 1, "t": "No funcionan", "tags": []}, {"r": 2, "t": "Ça colle bien c'est sur. Mais ça n'attire pas du tout les moucherons. J'en ai mis partout à la réception il y a deux mois maintenant, les moucherons ne vont pas dessus.", "tags": []}, {"r": 1, "t": "99% inefficace. Un seul moucheron attrape en sept jours !", "tags": []}, {"r": 1, "t": "Tout était  collé ensemble,  impossible de le prendre un par un avec mes doigts", "tags": []}, {"r": 1, "t": "Inutil, no comprar", "tags": []}, {"r": 1, "t": "Ne sert strictement à rien !une perte d’argent totale", "tags": []}, {"r": 1, "t": "No sirven para nada...", "tags": []}, {"r": 1, "t": "Não faz nada horivel mesmo ! Não comprem dinheiro para o lixo", "tags": []}, {"r": 1, "t": "Ces pièges  à  insectes  ne fonctionne pas du tout! Cela fait quelques  jours  que je les ai installés,  mais aucun moucheron ne s'est  posé  dessus ! Je suis très  déçue !", "tags": []}, {"r": 1, "t": "No valen para nada, mientras otras pegatinas que tengo se llenan de mosquitos a estas pegatinas ni se acercan", "tags": []}, {"r": 1, "t": "Absolument inefficace sur les moucherons .. ils semblent plus craindr emon torchon que les\"pièges\" par ailleurs jolis ( pour une déco peut être?) . Après le vinaigre cidre: deuxième échec! désolée...", "tags": []}, {"r": 3, "t": "Pas franchement très efficace, quelques mouchettes capturées, mais la plupart passe au travers. Je n'en commenderais plus.", "tags": []}, {"r": 1, "t": "Une étoile parce que je suis obligé. Après une semaine, aucune mouchette n'est c'est posée dessus. Cionclusion, à la poubelle. Je déconseille fortement.", "tags": []}, {"r": 3, "t": "i moscerini non volano sugli autonomamente sugli adesivi. per catturare gli insetti bisogna sventolarli in giro per la stanza e allora rimangono incollati.", "tags": []}, {"r": 2, "t": "Cela fait deux jours que je les ai installés. J'ai toujours des moucherons qui volent et aucun sur les pièges à voir dans le temps!", "tags": []}, {"r": 1, "t": "Nul nul nul les moucherons se posent autour sans jamais être dessus !", "tags": []}, {"r": 1, "t": "À fuir, ne marche absolument pas. J'ai respecté les instructions, les moucherons volent autour sans JAMAIS ce poser.", "tags": []}, {"r": 1, "t": "Pas un moucheron attrapé !!!", "tags": []}, {"r": 4, "t": "Conforme et efficace", "tags": []}, {"r": 1, "t": "No ha sido nada eficaz, puse cuatro repartidos en varios sitios y se pegaron un total de 2 moscas de la fruta, y no sería por falta de ellas...", "tags": []}, {"r": 1, "t": "Au bout de 48 seul 1 seul moucheron égaré c'est collé à un des 6 \"pièges \" de la cuisine qui continuent a voleter autour de la nourriture 😡", "tags": []}, {"r": 1, "t": "Colle peu, les mouches n'y vont même pas, et repartent sans être collées", "tags": []}, {"r": 1, "t": "En 1 seul mot : nullissime ! Les moucherons passent à côté et doivent bien rigoler. J’en ai essayé plusieurs, plantés dans les fruits et à côté de l’évier…. Rien d’attraper ! J’y arrive mieux à la main.", "tags": ["plants_gnats"]}, {"r": 4, "t": "the butterfly shape with the antennae are hard to remove the paper sometimes, with the other design removing easily. bugs stick very very readily. i think it reduced population in my indoor plants. i don't want to bother with other means of control aside from watering less so i'm glad these exist. and it's true, if you get them wet when you mist your plants they stay sticky once dry. just be careful not to get the plant leaves on them!", "tags": ["plants_gnats"]}, {"r": 4, "t": "Pas trop efficace", "tags": []}, {"r": 3, "t": "Pas très efficace mais au moins je ne l’ai pas payé cher", "tags": []}, {"r": 4, "t": "C’est pratique mais j’ai l’impression que ça ne colle plus les bêtes au bout d’un moment alors que c’est encore bien collant. Dans l’ensemble plutôt pas mal ah oui j’ai collé deux feuilles desssus qui se retirent pas du coup j’ai été obligée de déchirer la feuille donc faites attention.", "tags": []}, {"r": 1, "t": "Nul Nul nul Surtout ne pas acheter", "tags": []}, {"r": 1, "t": "La jolie forme fait qu'il est impossible de décoller le papier protecteur en une seule fois, quelle que soit le bout par lequel on le prend - et surtout pas la partie basse non collé prévue à cet effet. Si on tire d'un coté on arrache, si on tire de l'autre on arrache (normal c'est la même forme en miroir), si on tire au milieu on arrache des 2 cotés. On est obligé de s'y reprendre à plusieurs fois et on se met immanquablement de la colle plein les doigts. Il doit y avoir plus pratique.", "tags": []}, {"r": 4, "t": "Les pièges sont pratiques ! Je recommande", "tags": []}, {"r": 1, "t": "Ce produit ne mérite aucune étoile car il ne fonctionne pas du tout.", "tags": []}, {"r": 4, "t": "Bien reçu Conforme aux commentaires", "tags": []}, {"r": 1, "t": "Fumisterie Zéro moucheron dessus après 4 jours Direction poubelle", "tags": []}, {"r": 1, "t": "totalement inutile", "tags": []}, {"r": 2, "t": "Ne fonctionne absolument pas si vous avez quelques moucherons... Certainement si vous en avez beaucoup, quelques uns doivent s’y coller. Argent jeté par les fenêtres pour les moucherons en tous cas..", "tags": []}, {"r": 1, "t": "Très déçu", "tags": []}, {"r": 1, "t": "produit inefficace mis en place depuis presque 3 semaines pas un seul moucherons ne c'est collé dessus. Grosse arnaque", "tags": ["size_issue"]}, {"r": 4, "t": "Conforme à la description. Très pratique pour attirer les moucherons de terreau. La protection du modèle papillon est un peu plus dure à retirer (se déchire)", "tags": []}, {"r": 1, "t": "Totalement inutile, les moucherons volent joyeusement autour des pièges en me regardant avec un sourire narquois...", "tags": []}, {"r": 3, "t": "Bof, n'attire rien du tout. Mais quand un moucheron s'y pose, effectivement, il est bien collé.", "tags": ["efficacy_works"]}, {"r": 1, "t": "A mí no me ha dado ningún resultado. Sigue habiendo mosquitas y eso que he puesto varios por toda la cocina y no tengo nada de fruta o alimentos fuera del frigorífico.", "tags": []}, {"r": 1, "t": "Ne fonctionne pas....", "tags": []}, {"r": 2, "t": "Efficacité ? .2 mouches en 2 semaines ?", "tags": []}, {"r": 4, "t": "colle bien les moucherons", "tags": []}, {"r": 3, "t": "Efficace des l achat . Mais apres quelques semaines les plaques non utilise ne fonctionnent pas", "tags": []}, {"r": 1, "t": "Nul ne fonctionne pas, pas un moucheron de collé par contre ils volent et s'en foutent complet!!! Je recommande pas du tout.", "tags": []}, {"r": 2, "t": "Pièges à insectes de couleur jaune, de la marque KEWUZY. J'ai installé quelques pièges dans les corbeilles à fruits et dans d'autres endroits de la cuisine, mais à ce jour je ne peux pas affirmer qu'ils sont efficaces, car aucun insecte - moucheron notamment - n'est venu s'y coller (?) Une dépense inutile ? Commentaire actualisé : je confirme l'inefficacité de ce produit. A éviter donc.", "tags": []}, {"r": 4, "t": "Les moucherons ne redécole plus une fois posé le produit est fait le taf cependant il faut compter sur le hasard car il n'y a pas d'odeur attractive...", "tags": ["aesthetic"]}, {"r": 1, "t": "Aucun intérêt, ne sert à rien, à se demander pourquoi il y a de si bonnes notes !", "tags": []}, {"r": 1, "t": "Aucune efficacité, simplement un morceau de plastique collant :-(", "tags": ["ease"]}, {"r": 4, "t": "Produit très efficace avec cependant un bémol concernant la difficulté à enlever les films protecteurs", "tags": []}, {"r": 1, "t": "Les moucherons ne regardent même pas en direction de ces pièges, ne pas acheté", "tags": []}, {"r": 1, "t": "No funciona. Dinero tirado a la basura. 😡", "tags": []}, {"r": 1, "t": "Ne sert à rien... J ai toujours mes moucherons", "tags": []}, {"r": 4, "t": "Fais le job, même si parfois la protection papier se déchire et est difficile à séparer de la colle", "tags": []}, {"r": 3, "t": "Ouai bof... les moucherons ne semblent pas mega attités par la choses", "tags": []}, {"r": 1, "t": "Les moucherons se baladent autour! Inefficace ! Je déconseille fortement", n. Komisch, denn die Karten, die wir davor benutzt haben, waren innerhalb von Tagen voller Mücken. Seltsam, dass die meisten Kommentare hier so positiv sind. Wir sind überhaupt nicht zufrieden", "tags": ["efficacy_works"]}, {"r": 3, "t": "Ein paar bleiben hängen der Rest nicht", "tags": []}, {"r": 3, "t": "Ich weiß auch nicht auf meine alten gelben gelben Sticker fliegen die trauermücken eher und kleben fest wie auf diese schönen neuen Sticker ikeine Ahnung warum vielleicht ist es der duftstoff.", "tags": ["plants_gnats"]}, {"r": 1, "t": "Die Blooven Gelbsticker gegen Trauermücken haben bei mir leider überhaupt nicht funktioniert. Trotz korrekter Platzierung direkt in den Blumentöpfen wurden kaum oder gar keine Insekten angezogen oder gefangen. Die Sticker sehen zwar dekorativ aus und lassen sich einfach anwenden, das ändert aber nichts daran, dass sie ihren eigentlichen Zweck nicht erfüllen. Selbst bei deutlich sichtbarem Befall blieb die Fangfläche nahezu leer. Im Vergleich zu anderen Gelbstickern ist die Klebewirkung sehr schwach. Fazit: Optisch nett, in der Praxis jedoch komplett wirkungslos. Für Trauermücken leider keine H", "tags": ["efficacy_fails", "plants_gnats", "ease"]}, {"r": 2, "t": "Das Papier lässt sich sehr schlecht von den Gelbstickern entfernen, so daß man ständig den Kleber an den Fingern hat.", "tags": ["efficacy_fails"]}, {"r": 1, "t": "Kann man bei Obstfliegen vergessen. Nicht eine dran geflogen in 3 Tagen.", "tags": ["fruit_flies"]}, {"r": 1, "t": "funktioniert nicht", "tags": ["efficacy_fails"]}, {"r": 4, "t": "Die Blooven Gelbsticker gegen Trauermücken (30 Stück) bekommen von mir eine glatte 4. Die Klebekraft ist nicht so stark wie bei den Originalen, aber dafür haben sie coole Formen 😄.", "tags": ["plants_gnats"]}, {"r": 4, "t": "Erfüllen absolut ihren Zweck.", "tags": []}, {"r": 1, "t": "Kann die guten Bewertungen nicht nachvollziehen. Hab die Aufkleber an 5 Pflanzen im Haus korrekt angebracht. Nach 3 Wochen, keine einzige Fruchtfliege ist
