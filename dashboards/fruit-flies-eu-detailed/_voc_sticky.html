icacy_fails"]}, {"r": 5, "t": "Sehr wirksam, wenn schon Trauermücken da sind. Damit sie erst gar nicht schlüpfen, empfehle ich einen Feuchtigkeitsmesser für die Erde oder Umstellung auf Substrat.", "tags": ["plants_gnats"]}, {"r": 1, "t": "Keine einzige trauermücke bleibt kleben! Die, die sich auf die Karte verirren, fliegen problemlos wieder weg.", "tags": []}, {"r": 5, "t": "Die Gelbstecker, DIE Waffe , machen den Trauermücken den Garaus !!!", "tags": ["plants_gnats"]}, {"r": 1, "t": "Leider erfüllt der Artikel nicht seinen Zweck: Die Klebeintensität auf der Oberfläche ist so schwach, dass die Trauermücken problemlos wieder davon weg fliegen können.", "tags": ["plants_gnats"]}, {"r": 5, "t": "Bin mit dem Produkt sehr zufrieden ! Und die Preis Leistung ist top Menge , Größe und doppelte klebkraft auf beiden Seiten ! Würde ich wieder kaufen !", "tags": ["efficacy_works", "price_value", "size_issue", "repeat"]}, {"r": 1, "t": "Verschwendetes Geld, die Trauermücken laufen einfach drüber ohne kleben zu bleiben.", "tags": ["plants_gnats", "ease"]}, {"r": 1, "t": "Leider mussten wir sehr schlechte Erfahrungen mit den Gelbtafeln machen. Ich habe die Gelbtafeln platziert und musste mit ansehen wie die Trauermücken über die klebefläche laufen und anschließend weg fliegen...", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 1, "t": "Ein Stern ist noch zu viel. Trauermücken bleiben nicht an den Gelbstickern kleben. Ganz klar …. KEINE EMPFEHLUNG", "tags": ["plants_gnats"]}, {"r": 4, "t": "Habe eine Fehlerhafte Charge erhalten. Dank des super Kundenservice, habe ich das Geld zurück erhalten.", "tags": ["efficacy_works", "not_sticky"]}, {"r": 5, "t": "Top", "tags": []}, {"r": 5, "t": "Klasse fuer Trauermuecken etc. Laeesst sich gut in die Erde stecken und bei Bedarf auch doppelt lange nutzen. Erst eine Seite aufdecken, dann die andere.", "tags": ["efficacy_works"]}, {"r": 2, "t": "Im Vergleich zu Gelbstickern von anderen Herstellern, kleben diese hier nicht besonders stark. I s das Produkt pünktlich angekommen ist.", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 5, "t": "Diese Klebe fallen sind wirklich gut hab sie schon mal gehabt und sie waren hilfreich", "tags": ["efficacy_works"]}, {"r": 1, "t": "Funktioniert überhaupt nicht. Hatte schon leider einige Gelbsticker ausprobiert, aber diese funktionieren überhaupt nicht. Die Fliegen laufen einfach über die Sticker drüber. Habe die Sticker jetzt seit einer Woche in den Pflanzen stecken und es ist noch keine einzige Mücke kleben geblieben, obwohl genügend Mücken da sind.", "tags": ["efficacy_works", "not_sticky", "plants_gnats", "ease"]}, {"r": 1, "t": "Fängt keine Trauermücken, lieber ein anderes Produkt nehmen", "tags": ["plants_gnats"]}, {"r": 2, "t": "Leider bleiben die kleinen Mücken nicht immer kleben und krabbeln darauf lustig weiter.", "tags": ["aesthetic"]}, {"r": 5, "t": "KLARE Kaufempfehlung  Klasse Qualität", "tags": []}, {"r": 5, "t": "Kleine stylische gelbtafeln", "tags": []}, {"r": 1, "t": "Keinen Stern Wert, die Tiere steigen munter über die Kärtchen drüber, kaum eines bleibt auch wirklich kleben und somit keinerlei Wirkung. Absoluter Fehlkauf!", "tags": ["efficacy_fails"]}, {"r": 2, "t": "Ich habe mir mehr von diesem Produkt  erhofft. Ich habe in 5 Töpfe je 1 gelbes Blatt gesteckt. Nach 3 Tagen hatte ich sehr wenige Mücken auf den Blättern.", "tags": ["plants_gnats"]}, {"r": 4, "t": "helfen, die Fliegenplage im Griff zu halten. Leider kein Patentrezept, dass es auf Dauer hilft. Aber für einen Ausbruch hilfreich. Wenn man das öfter hat, besser im Fachhandel Larven besorgen, die die Trauermücken in der Erde bekämpfen.", "tags": ["plants_gnats"]}, {"r": 5, "t": "Ich hatte in letzter Zeit zunehmend Probleme mit Trauermücken bei meinen Zimmerpflanzen und habe verschiedene Methoden ausprobiert - diese Gelbtafeln gehören definitiv zu den effektivsten Lösungen. Die Anwendung ist denkbar einfach: Die Tafeln werden direkt in die Erde gesteckt und beginnen sofort zu wirken. Bere ei", "tags": ["efficacy_works"]}, {"r": 5, "t": "Super Produkt und gute Preisleistungsverhältnis.", "tags": ["efficacy_works"]}, {"r": 1, "t": "Wie auf den Fotos ersichtlich, rechts eine Gelbtafel einer anderen Firma und links die von Super Ninja. Beide Pflanzen sind von Trauermücken  befallen. Aus beiden Pflanzen fliegen die Tiere, sobald man daran rüttelt. Nur, dass bei den Gelbtafeln von Super Ninja keine einzige Trauermücke kleben bleibt. Auch bei allen anderen Pflanzen, bei denen ich diese Gelbtafeln benutzt habe, bleibt keine einzige Trauermücke hängen. Ich werde zukünftig wieder etwas mehr Geld in die Hand nehmen und die Gelbtafeln der anderen Firma kaufen.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 1, "t": "Die Fliegen ignoriern die Gelben Tafel total", "tags": []}, {"r": 1, "t": "Hallo, die Trauermücken lachen sich kaputt. Die fliegen die Tafeln an, tippeln zum Rand und fliegen wieder davon. Nutzlos!", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 1, "t": "Wie auf dem Bild zu sehen, kleben an diesem Produkt kaum Trauermücken dran. An anderen Produkten die etwa zur selben Zeit eingesteckt wurden, kleben dagegen hunderte.  Selbst wenn ich die Mücken aktiv fange und festkleben will, laufen die einfach über den „Kleber“ und fliegen weiter. Auch ist die Fläche viel kleiner als bei vergleichbaren Produkten.  Zusammengefasst: überhaupt nicht zu gebrauchen.", "tags": ["plants_gnats", "size_issue", "ease"]}, {"r": 3, "t": "Kurzfristig ok, verhindern allerdings nicht das ständige wieder kommen der Mücken.", "tags": []}, {"r": 4, "t": "Die Ware kam schnell an. Nun muß das Produkt nur noch seinem angedachten Zweck zugeführt werden und funktionieren, dann bin ich zufrieden.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Works as intended. Good quality. Recommended.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Macht was es soll, es fängt Trauermücken.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 5, "t": "Lieferung ging sehr schnell bin zu Frieden damit", "tags": ["efficacy_works"]}, {"r": 1, "t": "Wirken gar nicht. Leider kann man nicht 0 Sterne vergeben. Habe in einem anderen Zimmer Fallen einer anderen Marke, darauf häufen sich die Trauermücken. An diesen Fallen kleben 0 Tiere. Habe mittlerweile die ganze Packung um die Blumentöpfe rundum verteilt und hoffe auf den Zufall dass mal was aus Versehen kleben bleibt - aber auch damit nach 2 Tagen keine Erfolge... Das Geld kann man sich sparen. Kann nicht nachvollziehen wo die guten Bewertungen herkommen", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 3, "t": "Hochwirksam ist übertrieben. Die Tiere kleben nicht wirklich an der Falle Sehr schnelle Antwort des Verkäufers und sehr schnelle Hilfe bekommen! Verkäufer ist Top 10 Sterne für die Kommunikation!", "tags": ["efficacy_works"]}, {"r": 5, "t": "Sehr gut sind die", "tags": ["efficacy_works"]}, {"r": 1, "t": "klebt nicht gut, kaum Fliegen dran", "tags": ["efficacy_fails", "not_sticky"]}, {"r": 5, "t": "Super Support, Anliegen werden zügig bearbeitet und korrigiert. Vielen lieben Dank. Klare Kauf Empfehlung 👍", "tags": ["efficacy_works"]}, {"r": 5, "t": "und hält lang", "tags": ["efficacy_works"]}, {"r": 3, "t": "Ok, manche Mücken bleiben hängen hab aber auch schon ein paar abfliegen sehen.", "tags": []}, {"r": 5, "t": "Hälfte der Fliegen bleibt dran kleben, die anderen fliegen wieder los. Kann aber auch ein Einzelfall gewesen sein mit dem Produkt. Nach Kontakt mit dem Anbieter habe ich den Artikel erstattet bekommen. Super Service.", "tags": ["efficacy_works"]}, {"r": 3, "t": "Die Neudorf lassen sich besser in die Blumenbeete stecken, aber für den Preis erstmal ok, mal sehen ob sie auch so gut Mücken fangen", "tags": ["efficacy_works"]}, {"r": 1, "t": "Vollkommener Unsinn die Dinger funktionieren so gut wie garnicht !!! An 10 Stück hängt nach über einer Woche nur eine einzige Fliege !!! Geld ohne anzufragen zurück bekommen!", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 1, "t": "0 Sterne Trauermücken laufen einfach über die Klebefläche drüber ohne kleben zu bleiben.", "tags": ["efficacy_fails", "plants_gnats", "ease"]}, {"r": 2, "t": "Naja, es lagen eigentlich mehr tote Trauermücken vorm Fenster. Am Kleber hingen nur ein paar.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Funktionieren einwandfrei und die unerwünschten Tierchen bleiben zahlreich kleben - sofern man es denn schafft, die Schutzfolie \"unfallfrei\" von der Klebefläche abzuziehen. Denn auch die Folie haftet stark an, ist aber leider nicht sehr stabil und reißt schnell. Wobei die putzige Blümchenform der Gelbtafeln dem genau entgegenkommt, denn exakt an den Einbuchtungen bleibt das Folienmaterial hängen und reißt ein. Glatte, gerade Ränder wären sinnvoller. Denn es ist eine ziemlich nervige Fummelei und klappt kaum ohne Fingerkontakt mit der Klebefläche, die Folienreste zu entfernen. Deshalb würde ich", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 1, "t": "Kleben sehr schlecht. Viele Fliegen, die sich auf die Gelbtafeln drauf setzen, fliegen einfach wieder davon weg.", "tags": ["efficacy_fails", "not_sticky", "ease"]}, {"r": 1, "t": "Hat im Gegensatz zu anderen gekauften Gelbtafeln kaum Haftwirkung.", "tags": []}, {"r": 5, "t": "Einfach in die Erde stecken und schön hat man Ruhe vor den Mücken Sie bleiben an den Tafeln kleben und man kann sie leicht entfernen", "tags": ["ease"]}, {"r": 5, "t": "Es funktioniert", "tags": ["efficacy_works"]}, {"r": 1, "t": "Die Klebchen haben nicht genug Haftkraft. Trauermücken bleiben nicht daran kleben. Von mir keine Kaufempfehlung.", "tags": ["plants_gnats"]}, {"r": 1, "t": "Zieht definitiv keine Mücken an!", "tags": []}, {"r": 1, "t": "Die Fruchtfliegen laufen da einfach drüber und bleiben nicht kleben. Nie wieder!!", "tags": ["fruit_flies", "ease"]}, {"r": 1, "t": "Funktioniert leider überhaupt nicht", "tags": ["efficacy_fails"]}, {"r": 2, "t": "Hochwirksam ist leider übertrieben,nach drei Tagen kümmern sich nur wenige Trauermücken um die Tafeln.", "tags": ["plants_gnats"]}, {"r": 4, "t": "Schon ordentlich Viecher gefangen. Man muss die nur regelmäßig tauschen da sie schnell trocknen und nicht mehr kleben.", "tags": ["efficacy_works"]}, {"r": 2, "t": "nicht so wirksam wie erwartet", "tags": ["plants_gnats"]}, {"r": 5, "t": "Ich war überrascht von diesen Gelbtafeln. Sie sind etwas kleiner und handlicher, als die Tafeln, die ich davor hatte. Deshalb ist die Handhabung angenehmer, insbesondere bei kleinen Blumentöpfen, aber auch bei größeren.", "tags": ["efficacy_works", "plants_gnats", "size_issue"]}, {"r": 4, "t": "Der Vorteil an diesem Produkt ist die Menge an Tafeln. Jedoch kleben diese nicht so gut wie vergleichbare andere Produkte", "tags": ["efficacy_works"]}, {"r": 1, "t": "dieser Artikel ist kommplet unwirksam da ist das Geld zum Fenster rausgeschmissen note 6", "tags": ["efficacy_fails"]}, {"r": 1, "t": "Die Fallen haben noch nicht eine Trauermücke gefangen. Manchmal landen sie sogar auf den Fallen und laufen wieder runter/fliegen weg. Musste mir andere bestellen.", "tags": []}, {"r": 2, "t": "die mücken fliegen oder krabbeln einfach drum herum. und wenn sich mal welche drauf setzen, dann fliegen die meisten einfach wieder weg...", "tags": ["efficacy_fails", "ease"]}, {"r": 4, "t": "Hat etwas länger gedauert, bis die kleinen Biester daran geflogen sind, aber nun helfen die gelben Fallen sehr gut. Preis ist gut", "tags": ["efficacy_works"]}, {"r": 5, "t": "Hilft absolut", "tags": []}, {"r": 2, "t": "Sieht gut aus, leicht anzuwenden, leider sind die Mücken überhaupt nicht dran gegangen  ---- Sehr freundlicher Kundenservice bei Super Ninja :)", "tags": ["efficacy_fails"]}, {"r": 1, "t": "Ich habe leider einen sehr starken Befall von Trauermücken durch neue Blumenerde und habe an 3 Tafeln an der besagten Pflanze eine einzige Trauermücke kleben. Beim reinstecken habe ich sogar gesehen, wie eine Mücke über die Klebetafel drübergelaufen ist... Ich hab noch nie so schlechte Gelbtafeln erlebt!", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 1, "t": "Poor quality and didn’t work.", "tags": ["not_sticky"]}, {"r": 2, "t": "Funktionieren mittelmäßig... kein Vergleich zu den etwas teureren aus dem lokalen Pflanzengeschäft. Ein paar Viecher bleiben zwar kleben, aber ich habe schon häufiger beobachtet, wie sie sich total einfach wieder befreien.", "tags": ["plants_gnats", "ease"]}, {"r": 3, "t": "Lassen sich nur schwer in der Erde befestigen. Vorgesehene Stanzungen  zur Halterung durch Stäbchen (nicht enthalten) nur angedeutet. Wenn Sie dann aber irgendwie einigermaßen stabil angebracht werden konnten, erfüllen Sie sicher Ihren Zweck.", "tags": []}, {"r": 1, "t": "Hat nicht meine Erwartungen erfüllt, klebt nicht gut.", "tags": ["efficacy_works", "not_sticky"]}, {"r": 1, "t": "Absoluter Müll kaum eine Trauermücke geht auf die Schilder, da sind die billig Dinger ausm Wressmann oder Thomas Philipp s tausendmal besser !!!!", "tags": ["efficacy_fails", "price_value"]}, {"r": 1, "t": "nicht kaufen, keine Fliege klebt drauf, kein  Effekt", "tags": ["efficacy_fails"]}, {"r": 4, "t": "Das Produkt ist zwar gut, aber nicht für andere Zwecke wie zum Fangen von Mücken geeignet. Der Kleber zieht die Mücken nicht an; es ist eher speziell für Pflanzen spezialisiert, wofür er wirklich sehr gut ist. Für andere Zwecke ist er wirkungslos, weil die Mücken nicht angelockt werden.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 1, "t": "hochwirksam, stimmt schon mal nicht. Wenn man aber die Eintagsfliegen mit der Hand gegen die Gelbtafel jagt, kleben sie schon oft dran.", "tags": ["efficacy_fails", "very_sticky"]}, {"r": 1, "t": "Diese Gelbtafeln sind komplett enttäuschend. Sie kleben kaum - „zart haftend“ trifft es noch am ehesten, aber von echter Klebewirkung kann keine Rede sein. Damit sind sie praktisch wirkungslos und erfüllen ihren Zweck nicht einmal ansatzweise. Für mich ist das Produkt schlicht unbrauchbar. Ehrlich gesagt wäre eine Reklamation mit Erstattung mehr als gerechtfertigt. Das Design ist optisch schön.", "tags": ["ease"]}, {"r": 4, "t": "I received a free replacement for the first bad batch, and these new plates are good, there's already some flies sticking to it. The client service was exceptionally good.", "tags": []}, {"r": 1, "t": "Die Tafeln helfen überhaupt nicht! Zu weniger Kleber dran, sodass die Fliegen wieder von der Tafel sich befreien können.", "tags": []}, {"r": 2, "t": "Seit 4 Tagen im Gebrauch, bisher ist noch kein Insekt kleben geblieben :-(", "tags": []}, {"r": 3, "t": "Die kleben irgendwie nicht ganz so gut. Hatte schon bessere", "tags": ["efficacy_works"]}, {"r": 4, "t": "Anfangs,keine Mücke rangegangen,aber als die erste dran war,zeigte das Produkt seine Wirkung ,Preis/Leistung super", "tags": ["efficacy_works"]}, {"r": 2, "t": "Meine Trauermücken wurden kurz gefangen, sind dann jedoch nach ca 5 Minuten trotzdem runtergekrabbelt gewesen. Reicht um zu sehen, ob welche da sind, nicht zur Beseitigung. Vielleicht habe ich hier einfach eine Charge mit zu altem Kleber erwischt?", "tags": ["plants_gnats", "ease"]}, {"r": 2, "t": "Leider sind die Fliegen geblieben Zum Schluss half nur Insektenspray", "tags": []}, {"r": 4, "t": "wie beschrieben", "tags": []}, {"r": 3, "t": "Edit 13.03.26: Einen zusätzlichen Stern gibt es für den guten Support. Mir wurden neue Gelbtafeln zugesendet, wo die Mücken besser drauf kleben bleiben sollen. Dies konnte ich nicht richtig testen, weil ich mein Problem mittlerweile in den Griff bekommen habe. Gelbtafeln + Nematoden + Quarzsand auf die Erde.  Es funktioniert so lala. Die Trauermücken laufen teilweise über die Fläche und fliegen dann weiter, so war das ja nicht gedacht. Es bleiben auch viele hängen aber wenn schon eine darauf landet, dann soll sie auch direkt kleben bleiben. Ich habe jetzt quadatische bei denen das so ist. Zusä", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 2, "t": "Ein Paar wenige Fliegen bleiben kleben Würde ich nicht nochmal kaufen", "tags": ["very_sticky"]}, {"r": 2, "t": "Die Dinger kleben viel zu wenig. Eine Trauermücke ist über die ganze Fläche einfach rübergelaufen und hat mich angeschaut als wäre ich ein Witz. Der zweite Stern ist für die cuten Designs", "tags": ["ease"]}, {"r": 4, "t": "Fliegen kleben gut", "tags": ["efficacy_works"]}, {"r": 2, "t": "Helfen leider nicht so gut", "tags": ["efficacy_works"]}, {"r": 1, "t": "Ich weiß nicht, ob unsere Trauermücken Superkräfte haben aber sie spazieren einfach über die Gelbtafeln als wären sie ein Catwalk! Ich habe 8 Stück, jeweils eine in einer Pflanze, verteilt und nach Tagen klebte keine einzige an den Tafeln. Und die Blumenerde, geschweigedenn unser ganzes Haus, ist voll mit den Plagegeistern! Wirklich super ärgerlich und absolut nicht zu empfehlen. Ich werde nun andere Gelbtafeln von einer seriösen Firma testen.", "tags": ["efficacy_works", "plants_gnats", "ease"]}, {"r": 3, "t": "Sind okay, kleben aber nicht so gut.", "tags": ["efficacy_works"]}, {"r": 1, "t": "Funktioniert bei uns leider überhaupt nicht. Bis jetzt klebt keine einzige Mücke dran.", "tags": ["efficacy_fails"]}, {"r": 4, "t": "Zum erkennen ob ein Befall vorhanden ist gut, zum Befall minimieren mittelmäßig.", "tags": ["efficacy_works"]}, {"r": 3, "t": "Kleben nicht wirklich fest die Flieglein.", "tags": []}, {"r": 1, "t": "Nutzlos. Hier haftet keine einzige Mücke dran.", "tags": ["efficacy_fails"]}, {"r": 1, "t": "Kleben leider 0. Traermücken fliegen auf die winzige Fläche des Gelbblatts, strengen sich ein bisschen an und krabbeln drüber. Leider 60 Stück davon. hab 12 auf einmal eingesteckt aber funktioniert leider nicht mal das Motto: Viel hilft viel.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 2, "t": "Die Fliegen krabbeln lustig darauf herum. Leider bleibt nur vereinzelt eine kleben :( Habe mir unter \"hochwirksam\" etwas anderes vorgestellt...", "tags": []}, {"r": 4, "t": "Super Artikel", "tags": ["efficacy_works"]}, {"r": 3, "t": "Ich hätte einen größeren, besseren Effekt erwartet.", "tags": ["siz von fliegt… die bringen nichts.", "tags": ["plants_gnats"]}, {"r": 4, "t": "Könnten stabiler sein.", "tags": ["efficacy_works", "price_value"]}, {"r": 1, "t": "Funktioniert nicht gut. Nur wenige Mücken bleiben kleben.", "tags": ["efficacy_fails", "very_sticky"]}, {"r": 1, "t": "Die Klebkraft ist leider zu gering. Die Mücken fliegen auf der Gelbtafel aber bleiben nicht kleben. Ich bin sehr unzufrieden mit diesem Kauf und kann diese Produkt nicht empfehlen.", "tags": ["efficacy_works"]}, {"r": 1, "t": "Naja also die Fliegen spazieren fröhlich auf den Stickern umher und entkommen dann in 50% der Fälle. Dementsprechend enttäuschend und nicht zu empfehlen..", "tags": ["efficacy_works", "not_sticky"]}, {"r": 1, "t": "Fliegen ernähren sich noch davon krabbeln rüber. Klebt so schlecht dass sie wieder wegfliegen !  Leider Müll !", "tags": ["efficacy_fails", "not_sticky"]}, {"r": 1, "t": "Total wirkungslos. Absolut nicht zu empfehlen.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Klappt sehr gut und wirkt sichtbar gegen die kleinen Plagegeister, allerdings entsteht sehr viel Kunststoff-Müll.", "tags": ["efficacy_works"]}, {"r": 3, "t": "Ich habe insgesamt 8 dieser gelben Fallen im ganzen Raum verteilt. Über 3 Tage hat sich nicht eine einzige Trauermücke festgeklebt. Bei 3 Pflanzen stecken die Fallen in der Erde, 2 direkt am Fenster und die restlichen quer durch den Raum verteilt.  Den Preis finde ich sehr gut. Die Fallen sind steif und flexibel. Die Klebekraft ist sehr schlecht.  Ich kann diese gute Bewertung nicht nachvollziehen.  Edit 10.07.2026: Die Firma hat meine negative Bewertung gelesen und bedauert es, dass es nicht wie erhofft funktioniert hat. Daraufhin kam der Vorschlag von der Super Ninja Firma, dass sie mir das ", "tags": ["efficacy_works", "efficacy_fails", "plants_gnats"]}, {"r": 4, "t": "Schnelle Lieferung,gute Verpackung", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 1, "t": "Die Trauermücken fliegen fröhlich in der Gegend rum aber nich ": "Leider funktioniert das gar nicht. Nicht eine Trauermücke dran nach 1 Woche. Und ich habe hier eine Plage", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 3, "t": "Funktioniert überhaupt nicht. Die Fliegen laufen einfach über die Tafeln. Die ganzen guten Bewertungen kommen wahrscheinlich von einem Produktionszeitraum als die Klebewirkung noch vorhanden war. Das Produkt sollte so nicht mehr Verkauft werden.  Edit: Nach ein paar Wochen kleben endlich ein paar Fliegen an den Tafeln. Von \"Extrem Haftend\" kann man aber nicht wirklich sprechen wenn die Fliegen auch einfach drüber laufen können.", "tags": ["efficacy_works", "ease"]}, {"r": 3, "t": "Ich habe sie bereits zwei Stück eine Woche lang in einem Kleinen Blumentopf, es sind ein paar kleine Fliegen daran kleben geblieben aber das die fliegen bewusst die Gelbe Fläche anfliegen ist nicht zu beobachten. Ich halte es für mehr Zufall das die ein oder andere Fliege beim umherlaufen daran kleben bleibt. Finde ich nicht wirklich zielführend. Und es wimmelt weiterhin von Fliegen in dem Planzgefäß.", "tags": ["plants_gnats"]}, {"r": 1, "t": "Ich habe mich gewundert warum ich immer noch soviele Trauer Mücken habe obwohl ich jede Pflanze. Mit den Artikel bestückt habe und siehe da die Mücken laufen drüber, zwar mit Mühe jedoch bleiben Sie nur kleben wenn sie bereits kraftlos sind. Definitiv nicht zu empfehlen.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 1, "t": "Entweder sind unsere Trauermücken besonders intelligent, oder die Fallen funktionieren nicht. Die gelben Dinger sind für die Mücken bei uns jedenfalls völlig uninteressant. Es klebt nichts dran, und die Mücken sind weiterhin überall unterwegs. Ergänzung: Aber sehr kulanter Verkäufer, der eine Rückerstattung des Kaufpreises anbietet, freiwillig, ohne dass man angefragt hat.", "tags": ["not_sticky", "plants_gnats"]}, {"r": 4, "t": "Funktionieren leider so semi. Es sind zwar Fliegen drauf, das Hausmittel aus Essig, Zucker und Apfelsaft ist hier aber viel effektiver.  Nachtrag: Kundenservice hat Kaufpreis zurück erstattet und anderes Fangset angeboten, daher vier Sterne.", "tags": []}, {"r": 1, "t": "Die Trauermücken laufen zum Großteil einfach darüber ohne kleben zu bleiben.", "tags": ["plants_gnats", "ease"]}, {"r": 2, "t": "Keine Fliege geht da ran 👎", "tags": ["efficacy_works"]}, {"r": 4, "t": "Es dauert bis die Dinger funktionieren. Hoffe aber dass es klappt.", "tags": []}, {"r": 4, "t": "Schnelle Lieferung , gutes Preisleidtungs Verhältnis", "tags": ["efficacy_works", "price_value"]}, {"r": 2, "t": "Kleber relativ wirkungslos, Kundenservice aber kulant und hat Geld zurückerstattet.", "tags": []}, {"r": 4, "t": "Hat nix geholfen, null Fliegen blieben kleben Meine Rezension wurde schnell beantwortet und ich bekam umgehend eine Entschuldigung und ein Erstattungsangebot. Dafür ein dickes Lob", "tags": ["efficacy_works"]}, {"r": 2, "t": "Funktioniert bei mir leider nicht. Die Mücken interessiert das nicht. Ich habe noch andere Gelbsticker eines anderen Herstellers, die sind voll mit Mücken, aber ab diese hier fliegen kaum welche. Ich kann mit den guten Bewertungen hier nicht mitgehen. Hab sie jetzt schon mehrere Wochen in den Blumentöpfen stecken.", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 4, "t": "Funktioniert!!!!!!", "tags": ["efficacy_works"]}, {"r": 2, "t": "Die Trauermücken scheinen sich weder besonders von den Klebern angezogen zu fühlen, noch bleiben sie jedes Mal kleben. Hab schon beobachtet wie sie wieder weggeflogen sind. Kein besonders tolles Ergebnis", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Es funktioniert und bringt Abhilfe, aber nicht alle Mücken lassen sich darauf ein und die Eier die sie in der Erde der Pflanzen hinterlassen bringen immer wieder neue Mücken hervor somit man das Problem auf andere Weise angehen muss um die Pflanze endgültig zu befreien.", "tags": ["efficacy_works", "plants_gnats", "repeat"]}, {"r": 2, "t": "Na richtig helfen tut es leider nicht Die stecker rein stecken brechen Sie weg Folie ab machen ist schwierig da man die Stecker dabei raus zieht", "tags": []}, {"r": 3, "t": "Leider klein", "tags": []}, {"r": 3, "t": "Lässt sich schwer in die Erde stecken, Material sehr dünn. Erfüllt aber seinen Zweck .", "tags": []}, {"r": 3, "t": "Gut geeignet, wenn du eine schnelle, saubere Lösung für die fliegenden Trauermücken über den Pflanzen suchst. Am besten kombinieren mit: weniger gießen, Oberflächenerde austauschen oder Nematoden, damit du auch die Larven loswirst und das Problem dauerhaft verschwindet", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 3, "t": "Nett, aber keine Lösung.", "tags": []}, {"r": 4, "t": "Funktioniert", "tags": ["efficacy_works"]}, {"r": 4, "t": "Die Sticker sind super ! Es hat funktioniert, die Trauermücken sind auf den Leim gegangen.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Mücken fühlen es anziehend, minimiert zum glück den Bestand. Stinkt nicht.", "tags": ["efficacy_works"]}, {"r": 4, "t": "…. Wirkt", "tags": ["efficacy_works"]}, {"r": 2, "t": "Für Trauermücken garnicht geeignet leider", "tags": ["plants_gnats"]}, {"r": 2, "t": "Bisher nicht so erfolgreich. Irgendwie bleiben die kleinen Fliegen daran nicht kleben oder fliegen da nicht hin. Ich werde es noch länger beobachten ( bisher eine Woche).", "tags": []}, {"r": 3, "t": "Die Trauermücken interessiert das wohl nicht so richtig fliegen nur drum rum", "tags": ["plants_gnats"]}, {"r": 4, "t": "Die Ware kam schnell und gut verpackt an. Habe sofort alle Pflanzen damit versehen, was nicht ganz einfach ist, da beide Seiten sehr klebrig sind. Meistens bekommt man die Tiere mit der Blumenerde, ob billig oder teuer gleich mitgeliefert. Jetzt nach 14 Tagen haben sich die Tierchen wirklich sehr reduziert und die Sticker sind voll damit. Aber ganz weg sind sie leider nicht. Habe mir jetzt noch etwas für das Gießwasser bestellt. Da meine Pflanzen inzwischen sehr angeschlagen sind. Daher nur 4 Sterne", "tags": ["efficacy_works", "very_sticky", "plants_gnats", "price_value", "ease", "fast_result"]}, {"r": 4, "t": "Klappt nicht zu 100%, aber ist irgendwie ok.", "tags": []}, {"r": 4, "t": "Works just fine. Not sure if it kills the larva, but adult gnats stick on it.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Sehr klein und in die Erde stecken ohne Hilfsmittel ist lästig. Klebekraft passt.", "tags": []}, {"r": 2, "t": "Der Kleber ist viel schlechter als bei teureren Konkurrenzprodukten. Die erste Trauermücke klebte kurz und hat sich dann frei gekämpft. Wenn man mit dem Finger an den Kleber kommt dann klebt der auch viel weniger stark. Andere Produkte kriegt man dann gar nicht mehr vom Finger, diese Gelbtafeln schon.", "tags": ["efficacy_works", "efficacy_fails", "not_sticky"]}, {"r": 4, "t": "Sehr gut", "tags": ["efficacy_works"]}, {"r": 4, "t": "Ich bin von den Super Ninja Gelbtafeln etwas enttäuscht. Sie haben kaum Lockstoffe für die kleinen Mücken. Auch wenn ich direkt in den Blumentopf sie reinlege, gehen keine drauf. Nochmal würde ich sie nicht kaufen. Nachträglich: Der Verkäufer hat eine zufriedenstellende Lösung für mein Problem angeboten, die akzeptabel war, daher nur ein Stern weniger. Vielleicht waren die Mücken bei mir zu schlau und sind nicht in die Falle gegangen ;-)", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 3, "t": "Naja die Trauerfliegen sind nicht überzeugt.", "tags": []}, {"r": 4, "t": "Es nicht so viel Erfolg wie ich dachte", "tags": []}, {"r": 2, "t": "Hat leider meine Erwartungen nicht erfüllt. Die Trauermücken vermeiden den Kontakt mit den Plättchen ...", "tags": ["plants_gnats"]}, {"r": 4, "t": "Erfüllt seinen Zweck, bin erstaunt wie viele kleine Fliegen gefangen wurden.", "tags": []}, {"r": 4, "t": "Ich hoffe das es ich damit die Trauermücken bekämpft bekomme", "tags": ["plants_gnats", "repeat"]}, {"r": 4, "t": "Gut", "tags": ["efficacy_works"]}, {"r": 4, "t": "Lassen sich manchmal etwas schwer in den Boden stecken, funktionieren aber ansonsten einwandfrei und vernichten Fliegenbefall auf den Pflanzen", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 2, "t": "Ich sehe, wie die Trauermücken darauf herumlaufen. Der Kleber ist zu schwach, das bringt nichts!", "tags": ["plants_gnats"]}, {"r": 3, "t": "Klebeflächen kleben nicht genügend. Viele kleine Fliegen bleiben nicht kleben.", "tags": []}, {"r": 4, "t": "Funktioniert gut um die \"fertigen\" Mücken abzufangen! Aber ohne Mittelchen wird man die Biester nicht los. Ich benutze sie in Verbindung mit dem Neem-Öl, bin sie los geworden, wenn es auch ein wenig dauert!", "tags": ["efficacy_works"]}, {"r": 2, "t": "Die Klebefallen sehen toll aus,kleben auch,..aber da geht keine,oh sorry eine, Trauermücke dran.Die Dinger sind jetzt seit 3Tagen in den Töpfen und so wie es aussieht,sterben die Trauermücken eher an Altersschwäche,oder unsere Hausspinne ist sehr fleißig 🤔2Sterne weil die Dinger nett aussehen und vielleicht gehen die Mücken ja doch noch dran.", "tags": ["plants_gnats"]}, {"r": 4, "t": "Geht mehr als in Ordnung", "tags": ["efficacy_works"]}, {"r": 4, "t": "Das Super Ninja Trauermücken-Set (30 Stück) ist insgesamt in Ordnung. Die Klebekraft lässt gegenüber den Originalen etwas zu wünschen übrig, aber ansonsten funktionieren sie und helfen, die Trauermücken zu reduzieren.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 2, "t": "fängt keine Fliege oder Insekten", "tags": []}, {"r": 2, "t": "Hat nicht geklappt bei Fruchtfliegen", "tags": ["fruit_flies"]}, {"r": 4, "t": "Hat geholfen die Epidemie der Erwachsenen trauermücken einzudämmen. Die Klebe Blumen sind sehr schnell voll. Erfüllt den Zweck und preislich finde ich es auch in Ordnung. Das alleine hilft aber nicht das trauermücken Problem loszuwerden. Ein Mittel gegen Larven muss auch besorgt werden", "tags": ["plants_gnats", "fast_result"]}, {"r": 4, "t": "Tut was es soll", "tags": []}, {"r": 3, "t": "Preis-Leistung ist gut. Zweck erfüllt!", "tags": ["efficacy_works", "price_value"]}, {"r": 4, "t": "Erfüllt seinen Zweck absolut. Zum emphelen wenn man ärger mit Trauermücken hatt!!!", "tags": ["plants_gnats"]}, {"r": 4, "t": "Passt. Es klebt und erfüllt seine Aufgabe. Ich mag es, dass die Aufkleber ein bisschen kleiner sind, als die, die ich bisher hatte. So sind sie dezenter und erfüllen trotzdem ihren Job", "tags": []}, {"r": 3, "t": "Ausgepackt, ausprobiert und kannst du vergessen! -- muss ich dazu schreiben das es sich wahrscheinlich um ein Montagsprodukt gehandelt hat.  Klebekraft reicht nicht aus. Da tanzen die Trauerfliegen über die Klebefläche. Bei meinen letzten (anderer Hersteller) war es schwer den eigenen Finger bei Berührung wieder abzubekommen. Hier merkt man es kaum. Also alles nur Müll - kauft die vernünftigen. Produktsupport war 1A. Sehr freundlich und hat mich zufrieden gestellt. Somit kann ich auch auf 3 Punkte hochgehen. Mehr Sterne sind nicht möglich da ich nicht weiß wie ein normales Produkt funktioniert", "tags": ["efficacy_works", "not_sticky"]}, {"r": 4, "t": "fangen die Viecher weg. Kleben sofort an.", "tags": ["plants_gnats", "fast_result"]}, {"r": 3, "t": "Fliegen bleiben teilweise kleben und fliegen wieder weg", "tags": []}, {"r": 2, "t": "Ich habe eine Trauermücke einfach so über die Karte spazieren sehen, ohne dass sie festgeklebt ist. Sehr klein.", "tags": ["efficacy_works", "not_sticky", "ease"]}, {"r": 4, "t": "Erfüllt seinen zweck, der Stiel könnte stabiler sein, um das reinstecken in die Erde zu erleichtern.", "tags": []}, {"r": 4, "t": "Erfüllt den Zweck,nur beim abziehen des Schutzpapier ist schwierig.", "tags": []}, {"r": 4, "t": "Tut was es soll. Es klebt richtig gut. Kaum eingesteckt, schon die ersten Fliegen dran.", "tags": ["efficacy_works"]}, {"r": 4, "t": "Bin sehr zufrieden 👍", "tags": ["efficacy_works"]}, {"r": 3, "t": "Die Fliegen kleben schnell an den Blüten", "tags": ["efficacy_works"]}, {"r": 4, "t": "Schon ganz in Ordnung.", "tags": []}, {"r": 2, "t": "Bin leider enttäuscht. Habe es mehrfach beobachtet, wie sich die Mücken von den Karten wieder befreien können. Die Haftung ist nicht stark genug. Ich hatte daneben eine Karte von einer anderen Firma, an der ca 3x so viele Mücken haften geblieben sind….", "tags": ["efficacy_works"]}, {"r": 4, "t": "Hat super funktioniert", "tags": ["efficacy_works"]}, {"r": 3, "t": "Der Stiel, der in die Erde kommt, ist ganz schön kurz...Klebefläche ist gut, Preis ist ok", "tags": ["efficacy_works"]}, {"r": 2, "t": "Ich habe diese Gelbsticker vor einigen Wochen gekauft wegen geringem Trauermückenbefall. Überall aufgestellt bzw hingelegt und die Trauermücken wurden immer mehr. An den Gelbstickern keine zu finden. Vorhin beobachte ich, wie eine Mücke ganz entspannt über die Klebefläche läuft, sich putzt, ein bisschen chillt und dann wegfliegt. Also ist ja schön, dass die Trauermücken diese Gelbsticker so gerne mögen, aber eigentlich habe ich sie gekauft damit die Trauermücken daran festkleben, nicht damit sie sich unendlich weiter vermehren.", "tags": ["plants_gnats"]}, {"r": 2, "t": "Eigentlich gut aber bei der Hälfte der Aufkleber lässt sich die Folie nicht abziehen", "tags": ["efficacy_works"]}, {"r": 3, "t": "Hat und weder gegen Trauermücken noch gegen weiße Fliegen viel geholfen", "tags": ["plants_gnats"]}, {"r": 4, "t": "Ein paar Fliegen sind drauf, aber noch viele in blumentopf", "tags": ["plants_gnats"]}, {"r": 4, "t": "Diese sehr kleinen lästigen Fliegen haben mich sehr gestört.  Sind sehr schnell verschwunden. Hier und da fliegt noch mal eine rum, aber nicht der Rede wert.", "tags": ["efficacy_works"]}, {"r": 3, "t": "Viele Fliegen gehen nicht dran", "tags": []}, {"r": 3, "t": "Hab gesehen wie sich eine trauermücke befreien konnte... allgemein bleiben weniger dran haften als bei anderen Herstellern. Für draußen Balkon werde ich sie noch benutzen aber dann doch die alt bewerten weiterhin nehmen.", "tags": ["efficacy_works"]}, {"r": 2, "t": "Only catches some small amount of insects, the other intescts are dancing around it...", "tags": ["efficacy_works"]}, {"r": 3, "t": "Ich bin von den Tafeln nicht überzeugt. Sie sehen gut aus, kleben auch gut aber wirklich \"anziehen\" tun die die Trauermücken nicht wirklich. Wenn mal zufällig eine drauf landet, bleibt sie zuverlässig drauf kleben.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 3, "t": "Sehr praktisch, erfüllen ihren Zweck  Minuspunkte für: sehr groß, die gelbe Farbe ist auffällig  und lenken von Blumen ab. Das sind wie so kleine gelbe Schilder die sofort auffallen und das stört mich", "tags": ["ease", "fast_result"]}, {"r": 4, "t": "Zum fangen der Trauermücken ist es super leider führt es nicht zur Bekämpfung deshalb 1 Stern Abzug", "tags": ["efficacy_works", "efficacy_fails", "plants_gnats"]}, {"r": 4, "t": "gute Erfindung", "tags": ["efficacy_works"]}, {"r": 4, "t": "Ist hilfreich sollte aber wiederholt werden", "tags": ["plants_gnats"]}, {"r": 2, "t": "Die beiden Pflanzen, um die es geht, sind sehr klein. Trotzdem haben wir je 2 Fallen eingesteckt. Nach knapp 5 Wochen ist das Fazit: die herumfliegenden Mücken haben sich kaum reduziert; an den vier Fallen kleben aber insgesamt nur 5 Viecher! Die Fallen sind gut sichtbar platziert. Allerdings haben wir uns mehr Wirkung erhofft.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Funktioniert super", "tags": ["efficacy_works"]}, {"r": 3, "t": "Trauermücken kleben dran Ja. Jedoch ist das so, das man die Gelbsticker schwer in die Erde bekommt die verbiegen sich.  Dazu kommt das die Klebereste am Sticker hängenbleiben beim abziehen. Fummelarbeit.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Produkt można polecić muchy się wyłapały", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Die Trauermückenplage war enorm und die Super Ninja Gelbsticker haben sehr schnell geholfen, die Plage zu bekämpfen", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 2, "t": "Wir hatten pro Pflanze zwei von den Klebern und trotzdem flogen Millionen von kleinen Mücken und ein paar einzelne klebten daran", "tags": ["plants_gnats"]}, {"r": 4, "t": "Vielen Dank, sehr gerne wieder!", "tags": ["efficacy_works", "repeat"]}, {"r": 2, "t": "Soll ne Bewertung von ein Produkt machen das ich bis jetzt noch nicht bekommen habe...Was ein tolles Produuukktt.", "tags": []}, {"r": 3, "t": "Kleben gut, aber die Stecker sind sehr klein man muss mindestens 2 bis 3 pro Topf nehmen.", "tags": ["efficacy_works"]}, {"r": 4, "t": "Helfen sehr gut, wenn Befall nicht zu stark. Austausch nach ca. 4 Wochen.", "tags": ["efficacy_works"]}, {"r": 4, "t": "Produkt ist am nächsten Tag geliefert worden und war ordentlich verpackt. Habe die Sticker gleich in die Töpfe gesteckt damit Bad die kleinen Fliegen waren nach kurzer Zeit weg.", "tags": ["fast_result"]}, {"r": 3, "t": "tun was sie sollen teilweise beim abziehen der deckblätter zu gut. (A)ber sind echt schwer in die pfl.erde zu bekommen, sind echt instabil! so n Exoskelett unteres drittel  oder so wäre netter oder halt mit nem buttermesser die erde/wurzeln/??? an/vorstechen dann gehts auch!!", "tags": ["efficacy_works"]}, {"r": 4, "t": "Die Trauermücken nutzen die Sticker reichlich und ich hoffe diese reichen erstmal aus. Bin froh Super Ninja gekauft zu haben und kann das Produkt empfehlen.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 2, "t": "Ich bin ein wenig enttäuscht über die Klebekraft der Sticker, ich habe empf beobachtet wie eine Trauermücke auf einem gelanded  und danach wieder einfach weiter geflogen ist  daß sollte eigentlich alles sagen", "tags": ["efficacy_works", "ease"]}, {"r": 4, "t": "Schnelle Lieferung und gute Wirkung", "tags": ["efficacy_works"]}, {"r": 4, "t": "Hab die Gelb Sticker schon zum zweiten Mal bestellt. Tun was sie sollten. Waren gut verpackt, schnell da . Alles tippi top .", "tags": ["efficacy_works"]}, {"r": 3, "t": "Habe die Gelbtafeln gekauft um die bereits geschlüpften Trauermücke  zu fangen. Habe sie jetzt 5 Tage im Einsatz und bin nicht sonderlich begeistert.  Da die Tafeln selbst keine lockstoffe oder ähnliches enthalten sind zumindest meine Mücken relativ unbeeindruckt davon.  Es kleben zwar welche dran aber der Großteil fliegt nach 2 Tagen noch munter durch die Gegend. Mehr hilft leider auch nicht mehr. Gibt sogar Tafeln auf denen noch gar keine sitzt und das obwohl auf der Erdoberfläche und unter dem Topf reges Treiben herrscht", "tags": []}, {"r": 3, "t": "Wenn nicht zufällig eine hinfliegt und picken bleibt, ändert sich nicht viel. Ist das bei allen Mitteln so?", "tags": []}, {"r": 4, "t": "Funktionieren einwandfrei. Schwierig nur kein Kleber ab zu bekommen. Stabiler könnten sie auch sein zum reinstecken", "tags": ["efficacy_works"]}, {"r": 4, "t": "Lockt zuverlässig die Trauerfliegen an", "tags": ["efficacy_works"]}, {"r": 3, "t": "Leider nicht so wie erhofft und beschrieben", "tags": []}, {"r": 4, "t": "Schnelle, pünktliche Lieferung. Erfüllt seinen Zweck, danke!", "tags": []}, {"r": 4, "t": "A", "tags": []}, {"r": 3, "t": "Bei mir bleibt die Hälfte der Schutzfolie dran kleben weil sie beim abziehen einreißt…", "tags": ["efficacy_fails"]}, {"r": 4, "t": "Habe schon viele Gelbsticker probiert und muss sagen, sie tun genau, was sie sollen. Der Lockstoff ist hervorragend. Leider muss ich einen Stern abziehen, denn die Schutzfolie geht nicht gut ab. Aufgrund der Rundungen reisst die Folie beim Abziehen und man muss ein, zwei Kreise von der Folie befreien und dabei gelangt der Klebstoff an die Hände.", "tags": ["efficacy_works"]}, {"r": 3, "t": "The Super Ninja Fungus Gnats Control works fairly well for smaller infestations. The yellow stickers are easy to use and do attract a lot of gnats. However, it's not a complete fix for larger or persistent issues. It helps reduce the problem but didn’t fully eliminate all the gnats.", "tags": ["efficacy_works", "plants_gnats", "ease"]}, {"r": 4, "t": "Ich habe kürzlich eine Fruchtfliegenfalle ausprobiert und bin wirklich beeindruckt von ihrer Wirksamkeit! Die Falle ist einfach zu handhaben und benötigt keine komplizierte Einrichtung. Ich habe sie in meiner Küche aufgestellt, wo ich oft mit Fruchtfliegen zu kämpfen hatte, und schon nach kurzer Zeit konnte ich eine deutliche Reduzierung der Fliegen feststellen.  Die Falle zieht die Fliegen mit einem angenehmen Duft an, und ich war überrascht, wie viele Fliegen sie innerhalb weniger Tage gefangen hat. Das Design ist unauffällig und passt gut in meine Kücheneinrichtung. Außerdem ist die Reinigu", "tags": ["efficacy_works", "plants_gnats", "fruit_flies", "ease", "fast_result", "aesthetic"]}, {"r": 4, "t": "Gelbe Plastiksticker mit Klebeleim, ohne Lockstoff, Chemie o.ä. Funktioniert super.", "tags": ["efficacy_works"]}, {"r": 3, "t": "Die Sticker kleben gut. Aber die \"Easy Peel Off\" Folie ist nicht wirklich einfach zum Abziehen. Durch die Blütenform reißt die Folie immer ein und man muss noch rumpuhlen, um die Folie komplett abzukriegen. Und dann ist es echt schwierig, die Dinger in die Erde zu stecken. Aber wie gesagt: sie KLEBEN echt gut - an den Händen, an den Fingern, an den Pflanzenblättern, an der Erde....", "tags": ["efficacy_works", "plants_gnats", "ease"]}, {"r": 4, "t": "Die Trauermücken kleben en masse.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 2, "t": "Bereits beim rausnehmen aus der Verpackung fangen die Finger an zu kleben. Man sieht direkt, dass der Kleber aus dem Schutzpapier rausquillt. Nimmt man das Schutzpapier ab, reißt es leicht und löst sich nicht vollständig von der Falle. Lieber mehr ausgeben und was vernünftiges haben", "tags": ["not_sticky"]}, {"r": 4, "t": "Reibungsloser Ablauf!", "tags": []}, {"r": 4, "t": "Würde ich wieder bestellen 😆", "tags": ["efficacy_works"]}, {"r": 3, "t": "Hat sein zweck erfüllt, nach paar Tagen klebten Trauerfliegen und Fruchtfliegen dran. Leider ist der unter Teil zu schwach für in dem Boden zu stecken ( ich habe lockere Erde). Beim reinmachen knickte das untere Teil ab, so daß es an der Hand klebte, teilweise haben meine Blätter auch darunter gelitten, was voll ärgerlich ist.", "tags": ["efficacy_works", "very_sticky", "fruit_flies"]}, {"r": 3, "t": "Das Problem ist das der Teil der in die Erde gesteckt wird etwas dünn ist und schnell knickt", "tags": []}, {"r": 4, "t": "Erfüllt seinen Zweck, die kleinen Fruchtfliegen einzufangen. Allerdings einen Stern Abzug, da die größeren nicht hängenbleiben bzw. nicht darauf „reinfallen“", "tags": ["fruit_flies", "size_issue"]}, {"r": 4, "t": "Hilft sehr gut", "tags": ["efficacy_works"]}, {"r": 4, "t": "Hallo,die Plätzchen gegen die kleinen Mücken wo ich habe ihn der Wohnung ist soweit gut,kann ich gerne weiter entfehlen, Grüße an sie.", "tags": ["efficacy_works"]}, {"r": 4, "t": "Gut", "tags": ["efficacy_works"]}, {"r": 3, "t": "Die Funktion ist soweit okay, allerdings ist das einsetzen fast unmöglich, weil der Streifen immer an den Händen kleben bleibt.", "tags": []}, {"r": 4, "t": "Bei diesem Produkt stimmt das Preis-Leistungsverhältnis. Die Stecker lassen sich relativ unauffällig in die Blumentöpfe stecken, durch ihre Farbe fallen sie kaum auf. Sie funktionieren wie alle Klebefallen, aber ihr Format und Farbe sind sehr passend für die lästigen Eintagsfliegen.", "tags": ["plants_gnats", "price_value", "aesthetic"]}, {"r": 4, "t": "Kam schnell und problemlos, der Kleber klebt und das Ungeziefer bleibt haften..", "tags": []}, {"r": 4, "t": "Grundsätzlich sind diese Gelbsticker eine gewohnt gute Lösung. Allerdings lassen sich die Schutzfolien relativ schlecht abziehen. Dies macht die Handhabung etwas schwierig. Die Gelbsticker selbst erfüllen dann aber Ihren Zweck. Bezogen auf die Menge ist der Preis gerechtfertigt.", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 2, "t": "Die Fliegen bleiben kleben, keine Frage. Aber das Plastik ist so weich, dass es fast unmöglich ist, die Karte in die Erde zu stecken. Letztendlich steckt sie nach einigen Mühen so tief drinnen, dass nur noch zwei Drittel der sowieso schon kleinen Karte herausschauen. (anders hält sie nicht). Oft kleben darauf dann auch schon Erde oder Blattreste nach den mühseligen Versuchen die Karte in der Erde zu befestigen. Ich bin normalerweise sehr geschickt und finde immer eine Lösung. Hier gibt es keine, außer man bastelt sich irgendwas dazu. Was meines Erachtens nicht dafür steht. Es gibt wesentlich b", "tags": ["efficacy_works", "very_sticky", "size_issue"]}, {"r": 4, "t": "Es erfüllt seinen Zweck!Ein Stern habe ich nur angezogen,weil auf einer Seite die Folie nicht gut abgegangen ist!", "tags": ["efficacy_works"]}, {"r": 4, "t": "Funktioniert recht gut - allerdings nur bei Trauermücken. Obstfliegen werden eher weniger angelockt.", "tags": ["efficacy_works", "plants_gnats", "fruit_flies"]}, {"r": 4, "t": "Sie helfen gut gegen die lästigen Fliegen. Einen Punkt Abzug gibt es jedoch, da man sie nur schwer in die Erde bekommt ohne an den Klebestreifen zu kommen.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 3, "t": "Kleben relativ gut aber Schutzfolie lässt sich schlecht abziehen.", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 4, "t": "Weniger fliegen", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Erfüllt den Zweck", "tags": []}, {"r": 4, "t": "Haben aber immer noch Trauermücken", "tags": ["plants_gnats"]}, {"r": 3, "t": "Erfüllt seinen Zweck", "tags": []}, {"r": 2, "t": "Habe die Dinger jetzt schon fast 3 Wochen an 20 Blumen angebracht und es geht keine Trauermücke ran.  Kann es daher nicht empfehlen. Sorry", "tags": ["efficacy_works"]}, {"r": 3, "t": "Fliegen fliegen drann vorbei !", "tags": []}, {"r": 3, "t": "Funktioniert schon. Aber so ein richtig langfristige Lösung ist es nicht.", "tags": ["efficacy_works"]}, {"r": 3, "t": "... Trauermückenfrei ist anders. Da sind noch einige übrig.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Ich hätte normalerweise 5 Sterne gegeben. Das Produkt ist sehr gut und funktioniert und deswegen habe ich es auch schon zum 2. Mal bestellt. Allerdings waren diesmal in der Packung nur 8 statt 10 Stecker drin!", "tags": ["efficacy_works"]}, {"r": 2, "t": "Gute Fliegenfalle, sieht jedoch ab 10 Fliegen immer unschönen aus. Fliegen gab es jedoch trotzdem", "tags": ["efficacy_works"]}, {"r": 3, "t": "Hat aber gereicht , konnte helfen", "tags": []}, {"r": 3, "t": "Die Trauermücken bleiben zwar auch an den gelben Klebeblüten hängen- aber sie fliegen und kriechen weiterhin überall rum. Die Trauermücken werden nicht bekämpft, sondern nur zum Teil abgefangen. Gegen die Ursache und die Verbreitung helfen diese Sticker gar nicht! Habe meine Pflanze auf die Terrasse gestellt.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Die Gelbschilder wirken schnell, in der Form, dass sie Trauermücken anziehen und diese dann kleben bleiben. Nach ein paar Tagen ist das Gelbschild \"voll\" und muss gewechselt werden.  Wirklich bekämpfen konnten wir die Trauermücken leider nicht und wir mussten mir Chemie ran.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Ich habe sie in die Blumentöpfe gesteckt. So richtig wirken sie nicht.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Leider hat es das Problem nicht gelöst. Einige Fliegen sind halt noch übrig und die Kärtchen mittlerweile verbraucht", "tags": []}, {"r": 3, "t": "Die Trauermücken bleiben dran kleben und die Dinger sind OK. Aber das Problem wird nur in Kombination mit einem Mittel gelöst, welches auch die Larven bekämpft.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Um Trauermücken zu bekämpfen", "tags": ["plants_gnats"]}, {"r": 3, "t": "Die Sticker sind schwierig in den Topf zu stecken, der Stiel ist viel zu weich und knickt immer um.", "tags": []}, {"r": 2, "t": "Das Produkt ist okay. Es ist wirksam, aber nicht das beste auf dem Markt.", "tags": []}, {"r": 3, "t": "Die Aufkleber machen was sie sollen und helfen echt gut, gegen Trauermücken.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 3, "t": "Kaufabwicklung, Versand, Preis/Leistung ok, weiterhin positiv - ungiftig.  Erfolg gegen die Mücken - ich würde sagen 70% weniger von den Viechern.  Langfristig hilft nur eines: Pflanzen komplett sauber umtopfen, in hochwertige Erde - die billig Bio Erde möglichst weit weg entsorgen - viele Trauermückenplagen sind durch günstige Bio Erde eines namhaften und deutchlqndweit vertretenen Garten-Pflanzen-Tierbedarf-Center entstanden.  Kleiner Befall: Die Klebefallen wirken. Großer Befall: kurzfristig Erleichterung - langfristig aber Erde komplett erneuern, sicherheitshalber dann nochmal Klebefallen ", "tags": ["plants_gnats", "price_value", "ease"]}, {"r": 2, "t": "Die Gelbsticker erfüllen ihren Job. Was allerdings sehr nervt ist das unbedachte Design. Sie lassen sich schwer in die Erde stecken und sobald der Aufkleber ab ist, kleben sie an der Hand und/oder werden wieder rausgezogen (da die Kleber von unten nach oben abgezogen werden). Kein Weltuntergang nur etwas nervig. Besser wäre es die Aufkleber von oben nach unten abziehen zu können, nicht umgekehrt. Würde nächstes Mal andere kaufen. Dennoch zwei Sterne, denn sie funktionieren.", "tags": []}, {"r": 3, "t": "Ich hatte vorher das gängige Produkt und dachte mir, ich probier mal etwas Neues, da ich diese blöden Ficher nicht losbekommen habe. Die alten Fallen hatten immer wesentlich mehr Fliegen eingefangen, als dieses Produkt. Die Fläche ist auch ziemlich klein, sodaß ich wieder zum bewährten Produkt zurück gewechselt habe.", "tags": ["size_issue"]}, {"r": 2, "t": "Schaue ich mir die Sticker an, denke ich: Wow! Ganz schön viele Mücken drauf. Schaue ich mir meine Pflanzen an, sind dort mindestens immer noch genauso viele. Auch Wochen später wird der Befall nicht weniger. Ja, die Mücken gehen auf die Sticker. Aber der Befall ist nach wie vor da, also fangen die Sticker ein paar der Viecher, stoppen aber nicht den Befall. Ich habe meine Pflanzen heute morgen nun chemisch behandelt, weil ich mir nicht mehr anders zu helfen weiß und bin gespannt auf das Ergebnis.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Die Gelbfahnen sind kleiner als die anderen hier, und auch schlechter zu handhaben. Man bekommt sie schlechter in den Boden gesteckt, das Ende biegt oft um, so das man nachgreifen muss und oft an die Leimschicht stößt. Ferner haben sie am Spießende keinen Knickwinkel, sie fallen auch viel leichter um.", "tags": ["efficacy_fails", "size_issue"]}, {"r": 3, "t": "Ist okay", "tags": []}, {"r": 3, "t": "Leider geht es nicht so gutEs hat leider nicht die Mücken getötet", "tags": ["efficacy_works"]}, {"r": 3, "t": "Ich habe diesen produkt als fliegen klache benutz.", "tags": []}, {"r": 3, "t": "Sage und schreibe eine Fliege die ich selber noch dahin gepustet habe ist hängen geblieben von locker 40-50 Stück die hier Rum schwirren", "tags": []}, {"r": 3, "t": "Bis heute klebt nichts dran.", "tags": ["not_sticky"]}, {"r": 3, "t": "Diese Gelbtafeln gegen Trauermücken funktionieren grundsätzlich. Allerdings hatte ich schon bessere Varianten im Einsatz. Die hier angebotenen Gelbtafeln sind verhältnismäßig klein und aus Kunststoff (was in der Nassen Erde natürlich von Vorteil ist). Das Plastik ist sehr dünn, sodass man mit beiden Händen unterstützen muss, um sie in die Erde zu stecken. Der Kleber ist kaum intensiv und nach mehreren Tagen konnte ich noch keine Trauermücken entdecken, die an den Tafeln kleben, obwohl bei uns wenigstens ein paar durch die Luft fliegen.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Aber man kann damit super hinter den Obstfliegen her. Und wenn man eine erwischt klebt die Super daran. Vielleicht muss man ein (Super Ninja) sein um noch mehr von denen zu erwischen.", "tags": ["efficacy_works", "fruit_flies"]}, {"r": 2, "t": "Qualität und Preis passen nicht zusammen.", "tags": ["price_value"]}, {"r": 3, "t": "Erfüllt seinen Zweck.", "tags": ["price_value"]}, {"r": 3, "t": "Verarbeitung gut, geruchslos, klebt gut. Trotzdem mögen die Trauerfliegen nicht drüber laufen. In ca. 4 Tagen nur 3 Fliegen, an der Rückseite keine. Dafür um die 20 Fliegen mit der Klatsche verabschiedet. Na ja, erwartet habe ich mehr. Versuche gleichzeitig den Trick mit den Streichhölzern.", "tags": ["efficacy_works", "very_sticky"]}, {"r": 3, "t": "Fonctionne bien mais pour le maintient dans la terre c'est léger", "tags": []}, {"r": 2, "t": "Me la esperaba mas efectiva. Se han pegado una o dos moscas pero otras son capaces de andar por encima", "tags": []}, {"r": 3, "t": "efficacité à revoir, au début les moucherons tournent autour sans plus après ils se collent enfin !", "tags": []}, {"r": 3, "t": "intérêt moyen", "tags": []}, {"r": 2, "t": "pas terrible regrette cette achat", "tags": []}, {"r": 3, "t": "Attiré effectivement les moucherons mais ne règle pas réellement le problème. Il va aider en complément d’autres produits", "tags": ["efficacy_works"]}, {"r": 3, "t": "Non ha risolto il problema dei moscerini, ma solo attenuato.", "tags": []}, {"r": 3, "t": "Pas très efficace", "tags": []}, {"r": 2, "t": "Très peu de moucherons sont piègés", "tags": []}, {"r": 3, "t": "Pas très efficace", "tags": []}, {"r": 2, "t": "Ho la casa piena di moscerini e il prodotto acquistato non mi sta dando nessun risultato positivo che cercavo.  Ho acquistato altri prodotti da negozi di cinesi che ha funzionato decisamente meglio.", "tags": []}, {"r": 3, "t": "This is ineffective. On the product pamphlet it claims the yellow colour attracts the fungus gnats. It doesn’t really. The gnats just fly into it or get caught when landing on it. However if placed in a heavily infested pot, it can catch many gnats over time.", "tags": ["efficacy_works", "efficacy_fails", "plants_gnats"]}, {"r": 3, "t": "Pas tres efficace", "tags": []}, {"r": 2, "t": "Ho una monstera interessata da sciaridi, sto combattendo le larve un altro modo e cercando di catturare gli adulti con queste trappole.  Alcuni dei moscerini si attaccato e riescono ad essere catturati, ma purtroppo ho l’impressione che la colla non sia così potente, ho visto con i miei occhi alcuni di loro appoggiarsi e riuscire subito dopo a staccarsi e volare via. Mi aspettavo una colla più potente. Ho anche quello raid con la luce, lì la colla è molto più potente e i moscerini non hanno scampo.  Tutto sommato: qualcosa catturano ma mi aspettavo meglio, rimangono in giro sul vaso e intorno ", "tags": []}, {"r": 3, "t": "Parecchi foglietti funzionano solo sono molto leggeri per metterli nelle piante li ho dovuti incollare al vaso, però funzionano", "tags": []}, {"r": 3, "t": "Too soon to tell if effective.", "tags": ["efficacy_works"]}, {"r": 3, "t": "these are cuter than most and seem like a good deal but unfortunately they're not sticky enough. there was another review with a video that showed the fungus gnats dancing off the trap and the same thing happened to me. I saw 3 stick and then the trap was empty. The fungus gnats just slowly walk off the trap... the ones that are sticking for everyone else are probably flying around and their wings get stuck.", "tags": ["not_sticky", "plants_gnats"]}, {"r": 2, "t": "I have one each on my several plants and technically, It does stick. However, it does not attract flies. I have had several mosquitos and biting black flies in here and they only stick if I masterfully swap them with it. They don’t give a rats 🍑", "tags": ["plants_gnats"]}, {"r": 2, "t": "Je ne trouve pas que la colle soit assez efficace, j'ai vu des petites mouches de terreaux marcher dessus pour au final s'en aller sans être collés. Ceci dit quelques-unes se sont collées quand même...", "tags": []}, {"r": 3, "t": "Pega poquisimas moscas del sustrato, he visto a mosquitas de esas andar por la superficie y salir volando despues. Además no las llama mucho.  Edit: Actualizo tras el maravilloso trato del vendedor. Pocas veces he tenido una atención pos venta tan buena como la que he tenido con este vendedor. Tras mi mala experiencia con el producto se ofreció a enviarme uno diferente por si la plaga que tenía no la que el producto que compré eliminaba. Siempre estuvo atento a la recepción y seguimiento del envío así como a la experiencia que tenía con su producto por lo que simplemente por esta forma de actu", "tags": ["efficacy_works", "plants_gnats", "ease"]}, {"r": 2, "t": "Alcuni moscerini li trovi attaccati… ma molti altri li vedi che si appoggiano e se ne vanno come se niente fosse", "tags": []}, {"r": 3, "t": "Es un poco pequeño y endeble creo q se va a caer", "tags": []}, {"r": 3, "t": "I would not recommend it to buy But their customer service is excellent!  This product only marks the plant which has infestation by catching 1 or 2 flies while the larvae are happily running around it. This does not help to solve the problem.  Customer sevice: They contacted me and offered full refund. Fair and square offer and exceptional business.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Je ne sais pas trop si ça marche, je ne vois pas trop de moucherons collés dessus", "tags": []}, {"r": 2, "t": "Les moucherons semblent l'éviter... Par contre, service client impeccable. Une autre solution m'a été proposée après remboursement.", "tags": []}, {"r": 2, "t": "Articolo inutile per il mio problema con i moscerini. Purtroppo nonostante ci siano molti moscerini nemmeno uno viene attirato dal prodotto. Ho preso una pianta carnivora e ci sta pensando lei. Il venditore si è comunque scusato e premurato di eseguire il rimborso e si è proposto di inviare un altro articolo. Ho declinato l'offerta ma il venditore si è dimostrato disponibile.", "tags": []}, {"r": 2, "t": "Inefficace", "tags": []}, {"r": 3, "t": "Cattura molti moscerini adulti ma purtroppo non è risolutivo", "tags": []}, {"r": 3, "t": "Pas très efficace", "tags": []}, {"r": 3, "t": "Waste of money. Have a big infestation, and yet has caught almost no gnats. I’ve even seen them crawling over the ‘sticky’ surface then flying away - but good customer service", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 2, "t": "Sans effet", "tags": []}, {"r": 3, "t": "I have bought these in the past and they have worked really well but the last batch were not sticky enough and watched gnats walk across them, I sent a message, great customer service and they sent another batch but still had the same problem. They used to be so sticky it was hard to put them in the pot. It’s a shame as won’t buy again", "tags": ["not_sticky", "plants_gnats", "repeat"]}, {"r": 3, "t": "Moderatamente efficace un po' troppo sottile da utilizzare", "tags": []}, {"r": 2, "t": "helas pas de moucherons sur super ninja, et je continue à être envahie.", "tags": ["efficacy_works"]}, {"r": 2, "t": "Inutile nel mio caso. Ho una piantina invasa da moscerini della frutta ma il prodotto non li cattura per nulla", "tags": []}, {"r": 2, "t": "I found that the spike that goes into the soil was far to bendy should have been made from wood or tougher cardboard as it would just buckle also the covering to the sticky sides  would have been better peeling off from the sides instead of bottom up, but was incredibly sticky which was i found the only real plus.", "tags": ["plants_gnats"]}, {"r": 2, "t": "Efficacité très moyenne contrairement à d’autres marques qui fonctionnent très bien. Je ne recommande pas", "tags": []}, {"r": 2, "t": "Not having success with this. Sprayed plant and still have the gnats", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 2, "t": "Quick delivery but not so quick at catching anything. I’ve had one out for two days, plenty of little flies/gnats flying around but not one has landed on the trap. These insects are obviously more clever than I thought. Back to the drawing board", "tags": ["plants_gnats"]}, {"r": 2, "t": "Not too much sticky", "tags": []}, {"r": 2, "t": "La colle est totalement inefficace, les moucherons s'y promènent sans être stoppés", "tags": []}, {"r": 2, "t": "En nuestro caso no han funcionado. Las mosquitas no se quedan pegadas porque no emite ningún olor que las atraiga, aunque el pegamento es eficaz no llega a hacer su trabajo porque las moscas ni se acercan.", "tags": []}, {"r": 2, "t": "Ou les collants sont trop vieux ou bien la colle employée n’est pas vraiment efficace. Déjà acheté produit similaire chez Aldi je peux vous dire je la colle est hyper efficace.", "tags": []}, {"r": 2, "t": "Não resulta. tenho uns antigos, que por acaso já nao vendem na amazon, que funcionavam super bem, estes não vejo lá muitos mosquitos.", "tags": ["efficacy_works"]}, {"r": 2, "t": "Very sticky on both sides, which I thought would do the job in catching the fungus gnats. Unfortunately the one houseplant which has had a serious problem, it was completely ineffective. Note this doesn't have any insecticide, purely sticky. Not really worth the money. It caught one with circa 5 a day flying free all week and not attracted to it at all. So to those with a fungus gnat problem, I have applied pumice gravel on top which helped reduce but not eliminated, these sticky pads ineffective. My final attempt will be 3% hydroperoxide watered down 4:1 which apparently kills the larvae. Upd", "tags": ["efficacy_works", "efficacy_fails", "very_sticky", "plants_gnats"]}, {"r": 2, "t": "Ne colle pas colle ceux qui sont en forme de papillon,fleur , cette ci et moins efficace les moucherons ne ce colle pas dessus", "tags": []}, {"r": 2, "t": "L’ho ordinato a causa dei maledetti moscerini che si diffondono in primavera ma purtroppo nel mio caso non ha funzionato.. 😔", "tags": []}, {"r": 2, "t": "Aucun moucheron ne s'y est collé.", "tags": []}, {"r": 2, "t": "I moscerini sono andati ovunque tranne che sulle trappole", "tags": []}, {"r": 2, "t": "Non attira niente. Speravo di prendere i moscerini che girano intorno alle piante.", "tags": []}, {"r": 2, "t": "Pour l’instant, les moucherons volent autour sans être piégés.. je me pose la question sur l’efficacité du produit.", "tags": []}, {"r": 2, "t": "Purtroppo non funziona. I moscerini delle piante ci camminano sopra ma non rimangono incollati. Ho atteso qualche giorno ma non ha efficacia. Non so se sia capitato solo a me. Ho aperto 15 adesivi dei 30 della scatola e purtroppo nessuno è riuscito a bloccarli.", "tags": []}, {"r": 2, "t": "dopo 2 settimane solamente 6 moscerini appiccicati su un adesivo... direi che non li riprenderò", "tags": []}, {"r": 2, "t": "70% of the gnats fly away after getting trap.. I placed about 5 traps in the same plant and even though the color attracted the gnats to the trap, it wasn't strong enough to keep each of them trapped.", "tags": ["plants_gnats"]}, {"r": 2, "t": "🥴", "tags": []}, {"r": 2, "t": "Deberían probar el efecto del producto en la sensibilidad de los usuarios ya que puede influir…", "tags": []}, {"r": 2, "t": "Ne tiennent pas dans la plante et les moucherons ne sont pas attirés. Sinon c'est joli....", "tags": ["plants_gnats"]}, {"r": 2, "t": "J'avais commandé ce produit il y a quelques mois et ça marchait très bien. Puis j'ai commandé à nouveau il y a 2 semaines pour remplacer les anciens, mais j'ai dû tomber sur un lot soit trop vieux/mal conservé ou défectueux car les moucherons de terreau adultes peinent à se coller dessus.", "tags": []}, {"r": 2, "t": "Arrived on time look good but don't  seem to have reduced  the amount of gnats", "tags": ["plants_gnats"]}, {"r": 2, "t": "I had high hopes for these due to all the positive reviews, and whilst they’re not bad, they unfortunately have not helped our fungus gnat problem. They have caught one larger fly (slightly larger than our fungus gnats) so they work for some but the tiny little flies I can’t seem to get rid of just walk over these without getting stuck :( I will say they are at least in a cute design, I just wish they worked!", "tags": ["plants_gnats"]}, {"r": 2, "t": "Sturdy and easy to use, but not sticky enough. I can see flies sticking to it and then managing to get away.", "tags": ["not_sticky", "ease"]}, {"r": 2, "t": "Il ne fait pas son travail", "tags": []}, {"r": 2, "t": "I moscerini non vanno tutti", "tags": []}, {"r": 2, "t": "flies will stick to them but they do nothing to fix the flies being produced in the first place so it doesnt stop them", "tags": []}, {"r": 5, "t": "Top Produkt!! Endlich Ruhe vor den lästigen Fliegen!! Kann ich nur empfehlen!!", "tags": ["efficacy_works"]}, {"r": 5, "t": "Super zur Fliegenbekämpfung", "tags": ["efficacy_works", "fruit_flies"]}, {"r": 4, "t": "Für den Anfang gut, aber um die kleinen Trauermücken wirklich komplett auszurotten, nicht ausreichend. Ich nutze sie zur Vorsorge und Kontrolle und dafür reicht es aus.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 5, "t": "Die ein oder andere Platte klebt an der anderen, aber bei dem Preis ist das ok.", "tags": ["price_value"]}, {"r": 4, "t": "Hallo,  die Gelbtafeln sind recht günstig, vor allem wenn man mehr kauft. Es sind immer mehrere zusammen auf einem Layee, sie lassen sich aber gut einzeln rauslösen. Von ihrer Wirkung her bin ich zufrieden. Sie ziehen zwar Fliegen nicht magisch aus dem ganzen Zimmer an, aber die die eine Pflanze plagen oder zufällig dran vorbei fliegen werden angelockt und gefangen. Bin zufrieden.", "tags": ["efficacy_works", "plants_gnats", "price_value", "ease"]}, {"r": 4, "t": "Insekten fahren darauf  ab", "tags": []}, {"r": 4, "t": "Macht was es soll nur beim einsetzen aufpassen", "tags": ["efficacy_works", "price_value"]}, {"r": 5, "t": "Nach ein par Wochen waren alle Trauermücken weg.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Es haftet sehr gut und erfüllt daher seinen Zweck hervorragend. Allerdings habe ich in meinen Blumentöpfen weiche Erde, weshalb sie Schwierigkeiten hatten, fest zu stehen, und der Teil, der in die Erde gesteckt wird, ist meiner Meinung nach zu kurz, aber insgesamt ist es wirklich ein gutes Produkt.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Funktionen super aber sind durch den kräftigen Klebstoff nicht ganz so einfach zu händeln. Beim einsetzen in den Wunschstandort sollte man vorsichtig arbeiten, mein Tipp: Schutzfolie erst nach einsetzen vorsichtig abziehen.", "tags": ["efficacy_works", "ease"]}, {"r": 5, "t": "Super und effektiv", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Es hat einige Tage gedauert, aber diese Blättchen haben durchaus ihre Wirkung. Gut, ich habe zusätzlich noch ein Mittel für das Blumenwasser hinzugefügt, um die Wirkung zu verstärken. Aber alleine schon diese Blättchen lohnen sich schon. Man kann sich nicht vorstellen, wieviele von diesen Plagegeistern an den klebrigen Blättern hingen. Gerade die ersten 3-4 Tage haben viel gebracht. Ich würde dieses Produkt jederzeit wieder kaufen!", "tags": ["efficacy_works", "repeat"]}, {"r": 5, "t": "Endlich mal ein kleines Formst!", "tags": []}, {"r": 5, "t": "Schnelle Lieferung, Wäre wie erwartet", "tags": []}, {"r": 5, "t": "Als zusätzliche Falle zu Gießmittel hervorragend geeignet.", "tags": ["efficacy_works"]}, {"r": 5, "t": "⭐️⭐️⭐️⭐️⭐️ Sehr effektiv gegen Trauermücken - super schnelle Lieferung!  Die Gelbsticker haben bei mir wirklich gut gegen Trauermücken geholfen. Schon nach kurzer Zeit waren deutlich viele der kleinen Fliegen daran gefangen, und man merkt schnell eine Verbesserung bei den Zimmerpflanzen.  Besonders positiv war die extrem schnelle Lieferung - die Ware kam bereits am nächsten Tag bei mir an, was ich so nicht erwartet hatte. Das war wirklich top!  Die Anwendung ist sehr einfach: Sticker in die Erde stecken oder in Pflanzennähe platzieren, fertig. Sie sind zwar optisch nicht besonders schön, aber ", "tags": ["efficacy_works", "plants_gnats", "price_value", "ease", "fast_result"]}, {"r": 3, "t": "Es gibt eine Alternative z.b. Backpulver in Wasser auflösen und die  Blumen Töpfe ab und zu Gießen ......", "tags": []}, {"r": 5, "t": "Tolle tafeln", "tags": ["efficacy_works"]}, {"r": 5, "t": "Super Produkt", "tags": ["efficacy_works"]}, {"r": 5, "t": "Ich nutze die PIC Gelbtafeln zusammen mit SF-Nematoden zur Bekämpfung von Trauermücken in meinen Zimmerpflanzen und die Kombination funktioniert bei mir ausgezeichnet. Die Gelbsticker lassen sich schnell und einfach in die Erde stecken und fallen aufgrund ihrer dezenten Größe kaum auf.  Bereits nach kurzer Zeit waren zahlreiche adulte Trauermücken auf den Tafeln zu sehen, sodass man den Befall gut überwachen und gleichzeitig deutlich reduzieren kann. Nach etwa zwei Wochen konnte ich zusammen mit der Nematoden-Behandlung einen spürbaren Rückgang feststellen. In den meisten Fällen waren danach p", "tags": ["efficacy_works", "very_sticky", "plants_gnats", "size_issue", "ease", "fast_result"]}, {"r": 5, "t": "schnelle lieferung, sehr gute ergebnisse ! kaum i die erde gesteckt, tummeln sich schon die ersten trauerfliegen im leim.", "tags": ["efficacy_works"]}, {"r": 5, "t": "empfehlen", "tags": ["efficacy_works"]}, {"r": 5, "t": "Gute Qualität", "tags": ["efficacy_works"]}, {"r": 5, "t": "Die Plage hatte in kürzester Zeit ihr Ende gefunden. Absolut brauchbar!", "tags": []}, {"r": 2, "t": "Ich weiß nicht wie es Ihnen geht, aber die Tafeln sind nicht praktikabel. Wenn die Erde zu hart ist lassen sie sich nicht in den Boden stecken . Sie knicken um . Wenn ich das Schutzpapier abziehe nachdem ich die Tafeln in den Boden gesteckt habe, zieht man die Tafel wieder aus dem Boden heraus. Man kann sie auch beim abziehen der Folie niergendwo festhalten, sonst klebt die Tafel an den Fingern fest. Und wenn man die Folie vorher abzieht , bekommt man die Tafel nicht gesteckt. Ok- Fliegen bleiben darauf hängen. Das war's dann auch.", "tags": []}, {"r": 5, "t": "Mit die besten und effektivsten Sticker die ich je hatte. Ohne Schnickschnack aber funktionieren hervorragend!", "tags": ["efficacy_works"]}, {"r": 5, "t": "Die Oberfläche ist so klebrig, dass Fluginsekten keine Chance haben, zu entkommen. Funktioniert perfekt.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Funktioniert. Sind auch echt eine Menge in der VPE, das hält bis zum Ende meiner Tage.😂😂😂", "tags": ["efficacy_works", "fast_result"]}, {"r": 5, "t": "Alles in Ordnung  schnelle Lieferung", "tags": ["efficacy_works"]}, {"r": 5, "t": "Bei der Anzucht nerven die Trauermücken. Produkt zum günstigen Preis. Erfüllt seinen Job. Zu Beachten ist aber immer, dass es nur zum Monitoring dient, die Larven fressen an den Wurzeln, nicht die Mücken. Hier braucht man dann schon die passenden Nematoden um der Ursache auf den Grund zu gehen.", "tags": ["plants_gnats", "price_value"]}, {"r": 5, "t": "Sehr gut", "tags": ["efficacy_works"]}, {"r": 2, "t": "Kleben, aber locken die Trauermücken nicht an. Fehlt offensichtlich der Lockstoff.", "tags": ["plants_gnats"]}, {"r": 5, "t": "Einfache Anwendung knicken Klebestreifen abziehen und warten es klappt", "tags": ["ease"]}, {"r": 4, "t": "Die Lieferung erfolgte sehr schnell, was ich als großen Pluspunkt empfinde. Die Handhabung ist allerdings etwas umständlich, da die Klebeflächen sehr stark haften - auch der abziehbare Schutzstreifen bleibt bei erneuter Berührung sofort wieder kleben. Das erschwert das Anbringen etwas. Positiv hervorzuheben ist jedoch genau diese starke Klebekraft, da sie ihren Zweck hervorragend erfüllt: Bereits am nächsten Morgen waren alle Trauermücken zuverlässig gefangen. Insgesamt ein effektives Produkt mit kleinen Abzügen in der Anwendung.", "tags": ["efficacy_works", "plants_gnats", "fast_result"]}, {"r": 5, "t": "Gut", "tags": ["efficacy_works"]}, {"r": 2, "t": "Ja, die Tafeln kleben und einige Trauermücken landen da auch. Aber leider nicht alle .... auch nicht, wenn man die Sticker dicht setzt. Sie vermehren sich also fröhlich weiter", "tags": ["plants_gnats"]}, {"r": 5, "t": "Gutes Produkt. Dachte erst, daß ich es garnicht nutzen wollte, aber nachdem ich sie in die Blumentöpfe gesteckt hatte, waren sie innerhalb kürzester Zeit voll mit Insekten!", "tags": ["efficacy_works", "plants_gnats", "size_issue"]}, {"r": 5, "t": "Super", "tags": ["efficacy_works"]}, {"r": 5, "t": "Sehr gutes Produkt!!! Ich habe mir durch Verwendung von Terra Preta beim Umtopfen meiner Zimmerpflanzen zahlreiche Trauermücken eingeschleppt und war skeptisch, ob Gelbtafeln allein ausreichen, um die Population auszumerzen. Nach einmal wiederholtem Aufstellen/Hängen der Gelbtafeln innerhalb von 8-14 Tagen war ich sehr angenehm überrascht, dass sich das Problem erledigt hat. Besonders effektiv war das Ankleben einer frei hängenden Gelbtafel am oberen Fensterrahmen mit Hilfe eines Klebefilmstreifens, was an der Anzahl der darauf klebenden Trauermücken zu sehen war. Etwas aufpassen sollte man be", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 5, "t": "Alles OK!!!", "tags": []}, {"r": 5, "t": "Funktioniert sehr gut 👍. Nach einem Tag kleben schon einige Trauermücken an dem Kleber. Zuvor hatte ich andere Sticks probiert, an denen vier Wochen lang keine Trauermücke kleben blieb. Also meine uneingeschränkte Empfehlung.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 5, "t": "Gutes Produkt", "tags": ["efficacy_works"]}, {"r": 5, "t": "Nicht das top vom top aber macht was es soll", "tags": ["efficacy_works"]}, {"r": 5, "t": "Super, funktioniert Top. Jederzeit wieder", "tags": ["efficacy_works"]}, {"r": 5, "t": "Die Gelbtafeln sind sehr klebrig. Die ersten Trauermücken klebten bereits nach kurzer Zeit an den Tafeln. Sehr einfache Handhabung!", "tags": ["very_sticky", "plants_gnats", "ease", "fast_result"]}, {"r": 5, "t": "Ziehen die Mücken in kürzester Zeit an", "tags": ["efficacy_works"]}, {"r": 5, "t": "After discovering an infestation of fungus gnats in the majority of my indoor plants in winter, I didnt want to throw all the plants out so I thought i would try these stickers first. I made the mistake of using them once and not keeping up so once the eggs of the gnats hatched, I had a problem again. YOU HAVE TO KEEP GOING FOR WEEKS until you know you have eradicated the complete cycle and the eggs still hatching from the soil. Once I did that, my problem was gone. Highly recommend if you want to save your plants.", "tags": ["plants_gnats"]}, {"r": 5, "t": "Sehr gute Wirkung", "tags": ["efficacy_works"]}, {"r": 5, "t": "Die Gelbtafeln kamen gut verpackt und tun anstandslos ihren Dienst.", "tags": ["efficacy_works"]}, {"r": 1, "t": "Material ist zu weich um es in die Erde zu stecken…", "tags": ["efficacy_fails"]}, {"r": 5, "t": "Trauermpckenbekämpfing", "tags": ["efficacy_works"]}, {"r": 5, "t": "Tun, was sollen: Trauermücken anlocken. Top", "tags": ["plants_gnats"]}, {"r": 5, "t": "Absolut empfehlenswert bei korrekter Anwendung. Problem in Kombination mit gelben Klebepads zur Kontrolle effektiv gelöst.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Cought a lots of flies 😆", "tags": []}, {"r": 5, "t": "Spitze", "tags": ["efficacy_works"]}, {"r": 5, "t": "Super", "tags": ["efficacy_works"]}, {"r": 5, "t": "Top Produkt. Ich hatte vorher welche die in Blumenform waren, da sind die Trauermücken teilweise einfach drübergelaufen als wenn nix wäre. Bei diesen Gelbtafeln passiert das nicht, sie bleiben sofort kleben. Hervorragend. Nun hoffe ich, dass die Nematoden, die ich zur Bekämpfung eingesetzt habe, ihren Job tun und ich den Befall los bin.", "tags": ["efficacy_works", "plants_gnats", "ease", "fast_result"]}, {"r": 5, "t": "Kann die Dinger nur wärmstens weiterempfehlen", "tags": ["efficacy_works"]}, {"r": 5, "t": "Das Produkt macht absolut, was es soll. Es eignet sich super, um überhaupt erst mal zu sehen, ob und wie stark man einen Befall von Trauermücken hat. Die adulten Tiere werden zuverlässig gefangen und bleiben gut kleben. Auch das Preis-Leistungs-Verhältnis stimmt hier absolut. Klare Empfehlung!", "tags": ["efficacy_works", "plants_gnats", "price_value"]}, {"r": 5, "t": "Preis leistung top....", "tags": ["plants_gnats", "price_value"]}, {"r": 5, "t": "Hatten im Büro massenhaft Trauermücken. Habe mir die Teile fast schon aus Verzweiflung gekauft.  Nach wenigen Minuten klebten schon die ersten. Nach ein paar Wochen waren sie alle an den Tafeln geklebt und wir können wieder ungestört arbeiten", "tags": ["plants_gnats"]}, {"r": 5, "t": "Habe das Gefühl, dass es hilft!", "tags": ["efficacy_works" tags": ["plants_gnats", "fruit_flies"]}, {"r": 5, "t": "Gut", "tags": ["efficacy_works"]}, {"r": 5, "t": "Die Gelbsticker sind eine praktische und einfache Lösung, um Trauermücken in Pflanzen und Blumen schnell zu reduzieren. Die 60 Gelbtafeln ziehen die Insekten zuverlässig an und fangen sie effektiv, sodass die Ausbreitung deutlich verringert wird.  Die Handhabung ist unkompliziert: einfach die Sticker auspacken, in Erde oder Pflanzgefäße stecken und warten. Besonders positiv ist, dass die Methode chemiefrei ist und somit für Zimmerpflanzen unbedenklich eingesetzt werden kann.  Fazit: Ein einfaches, wirkungsvolles Mittel, um Trauermücken unter Kontrolle zu bringen - ideal für Hobbygärtner und Pf", "tags": ["efficacy_works", "plants_gnats", "ease"]}, {"r": 5, "t": "Gutes Produkt. Die Kleinen fliegen sind verrückt nach gelb und kleben", "tags": ["efficacy_works"]}, {"r": 5, "t": "Einfach in die Erde stecken und abwarten.  Bereits nach einem Tag kleben viele Fliegen am Sticker. Zur Bekämpfung der Trauermücken empfiehlt sich die Kombination mit Nematoden gegen die Larven in der Erde.", "tags": ["plants_gnats", "ease"]}, {"r": 5, "t": "Als Pflanzen-Fan kommt man um diese gelben Zettel einfach nicht herum.  Sie fangen eine gute Menge an Trauermücken ein.  Wenn man allerdings einen zu starken Befall hat sollte man lieber zu anderen Maßnahmen greifen.  Die Gelbsticker eignen sich eher Vorbeugend um stärkere Befälle zu vermeiden.", "tags": ["efficacy_works", "plants_gnats", "price_value", "ease"]}, {"r": 5, "t": "Funktionieren super 5/5 Sterne :)", "tags": ["efficacy_works"]}, {"r": 4, "t": "Habe mir mehr erwartet. Bei mir stehen die Trauermücken nicht drauf.", "tags": ["plants_gnats"]}, {"r": 5, "t": "Die gelbsticker sind sehr gut und erfüllen ihren Zweck. Ich bin froh sie gekauft zu haben. Preis sehr gut, schneller Versand gute Qualität.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 5, "t": "This product is amazing! So far, it only works for this specific type of sleistung gut, optisch leider auffällig", "tags": ["efficacy_works"]}, {"r": 2, "t": "Die Verpackung kam bereits total zerrissen bei mir an, wodurch bereits bei ein paar Tafeln die Schutzfolie von der Klebefläche entfernt wurde. Die Umverpackung/Karton ist unbeschädigt, also war das Produkt bereits vor dem Versand schon so. Ich behalte es trotzdem und werde die noch guten weiter verwenden.", "tags": ["efficacy_works"]}, {"r": 4, "t": "Das Design ist sehr dürftig, man denkt es ist Abfallwiederverwendung XD aber Funktion ist 100% gegeben. Gerne wieder", "tags": ["efficacy_works", "repeat"]}, {"r": 1, "t": "Leider haften die Trauermücken nicht an der gelben Oberfläche (Folie ist abgezogen).", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 1, "t": "Nicht zu gebrauchen", "tags": []}, {"r": 4, "t": "Ich bin sehr zufrieden mit den PIC Gelbestickern zur Bekämpfung von Trauermücken. Die Sticker kleben wirklich hervorragend und sind super einfach zu installieren. Sie bleiben stabil in der Erde stehen und erfüllen ihren Zweck optimal.  Ein kleiner Hinweis: Die Klebewirkung ist so stark, dass man beim Umgang vorsichtig sein sollte - vor allem, wenn man Haustiere hat, da sie sich schnell in den Hundehaaren verfangen können. Insgesamt sind diese Gelbsticker eine effektive und praktische Lösung, um die lästigen Mücken in Schach zu halten. Sehr empfehlenswert!", "tags": ["efficacy_works", "plants_gnats", "ease"]}, {"r": 2, "t": "Nicht eine einzige kleine schwarze Fliege ist da ran geflogen, obwohl wir viele Blättchen aufgestellt hatten. Wir mussten dann doch zum Insektenspray greifen.", "tags": []}, {"r": 4, "t": "Ich habe die Gelbsticker Trauermücken bekämpfen 60x ausprobiert, um den winzigen Fliegen in meiner Blumenerde den Kampf anzusagen. Die gelben Tafeln sind wie kleine Magneten für die Trauermücken - nach kurzer Zeit sahen sie aus wie überfüllte Tanzflächen für Insekten!  Sie halfen definitiv dabei, die Flut an Fliegen einzudämmen. Allerdings konnten sie die Plagegeister
