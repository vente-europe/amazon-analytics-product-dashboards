gt überhaupt nichts. Es bleibt keine einzige Mücke daran hängen. Sie fliegen weiter munter herum.", "tags": ["fruit_flies"]}, {"r": 3, "t": "Ich habe die Gelbsticker bestellt, da ich in einigen meiner Zimmerpflanzen mit einem Trauermückenproblem zu kämpfen hatte. Die Anwendung ist sehr einfach: Sticker aus der Packung nehmen, in die Erde stecken und schon nach kurzer Zeit bleiben die ersten Mücken daran kleben. Das funktioniert tatsächlich erstaunlich gut, die Klebefläche ist stark genug und die Sticker fangen innerhalb weniger Stunden schon eine Menge der kleinen Fliegen ab.  Allerdings muss man ganz klar sagen: Die Sticker bekämpfen nicht die eigentliche Ursache des Problems. Die Trauermücken kommen aus der Erde, und solange man ", "tags": ["efficacy_works", "plants_gnats", "price_value", "ease", "fast_result"]}, {"r": 2, "t": "Die Farbe der Gelbtafeln ist eher senfgelb als richtig gelb und die Obstfliegen haben keine Lust auf diesen Farbton. (:", "tags": ["efficacy_works", "fruit_flies"]}, {"r": 3, "t": "Haut nur zum Teil hin", "tags": []}, {"r": 1, "t": "Leider haben die Gelbsticker rein gar nichts gebracht, was aber nichts heißt. Wie sich herausstellte waren es Fruchtfliegen und keine Trauermücken.", "tags": ["plants_gnats", "fruit_flies"]}, {"r": 1, "t": "Irreführende Produkt Beschreibung. Es werden 20 Stück geliefert keine 40 Stück.", "tags": []}, {"r": 1, "t": "Fliegen bleiben nicht klebe .", "tags": []}, {"r": 2, "t": "Vielleicht liegt es ja an der Farbe, aber freiwillig gehen die Fliegen hier nicht dran. Die Viecher lachen sich wahrscheinlich schlapp. Hatte extra Schwarze bestellt, da in der Küche weniger auffällig. Zumindest sind die Dinger anständig klebrig und wenn sich dennoch mal eine kleine Fliege darauf verirrt, bleibt sie auch kleben. Würde ich mir nicht mehr kaufen.", "tags": []}, {"r": 1, "t": "Wenn du die weiße verdeckung abziehen möchtest reichst du die immer wieder in Stücken ab", "tags": ["repeat"]}, {"r": 2, "t": "Das Teil in die Blumenerde zu stecken klappt nicht da ja das spitze Teil aus demselben Material besteht und weich ist", "tags": ["efficacy_works"]}, {"r": 2, "t": "Ich habe die Gelbsticker hauptsächlich zur Bekämpfung von Trauermücken bestellt, da meine Zitrone und meine Tomatenpflanzen stark davon befallen sind. Leider ist das Ergebnis nicht sehr zufriedenstellend. Es hat lediglich ein paar wenige (Frucht)Fliegen angezogen. Habe mir tatsächlich mehr erhofft.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 1, "t": "Es ist wirklich schlecht, es funktioniert nicht. Ich habe es für Ameisen gekauft, sie werden nicht davon angezogen.", "tags": ["efficacy_fails"]}, {"r": 1, "t": "Nicht eine Mücke gefangen bringt gar nichts", "tags": []}, {"r": 3, "t": "Das Produkt ist effektiv bei der Bekämpfung von fliegenden Insekten wie Trauermücken und Weißen Fliegen. Es ist einfach in der Anwendung - die Schutzfolie lässt sich problemlos entfernen. Das ansprechende Design beeinträchtigt nicht das Aussehen der Pflanzen. Zudem ist das Produkt geruchlos und sicher für den Einsatz in Innenräumen. Allerdings ist das Material sehr dünn, was das Einstecken in die Erde erschwert, da es leicht verbiegt. Der Preis erscheint im Verhältnis zur gebotenen Qualität und Menge etwas zu hoch. Insgesamt ist das Produkt nützlich und wirkungsvoll, könnte aber in Bezug auf S", "tags": ["plants_gnats", "price_high", "ease"]}, {"r": 1, "t": "SCHROTT!!!", "tags": ["efficacy_fails"]}, {"r": 3, "t": "Leider löst sich das Schutzpapier bei einigen Formen mit spitzen Ohren/Fühlern  usw.  nicht vollständig an den Ecken und reißt ab.", "tags": ["not_sticky"]}, {"r": 1, "t": "Letzter dreck mach 3 wochen keine einzige fliege gefangen macht es richtig und kauft die gelben auch wenn sie 1 Euro mehr kosten Auf eine Nachfrage beim Verkäufer kommt keine Reaktion könnt ihr euch auch sparen die letzte abzocke mit dem drecksladen", "tags": []}, {"r": 3, "t": "OK", "tags": []}, {"r": 3, "t": "Insekten kleben einwandfrei daran fest. Das Anbringen ist sehr fummelig und ohne klebrige Hände nicht zu machen.", "tags": ["efficacy_works"]}, {"r": 1, "t": "Essigfliegen gehen auf alles nur nicht auf diese Produkt", "tags": []}, {"r": 1, "t": "Klebeteil nach 1 Tag viel zu trocken,die Ficher laufen einfach drüber.", "tags": ["ease"]}, {"r": 1, "t": "Dias Schitzpapier lässt sich nicht ablösen - unbrauchbar", "tags": ["efficacy_works"]}, {"r": 1, "t": "Gelbsticker", "tags": []}, {"r": 1, "t": "Ich habe sie wegen der guten Bewertungen gekauft, aber selbst nach einer Woche habe ich nur 2 Trauermücken an den Stickern entdeckt. Und das, obwohl ich extra in jedem Raum gleich 2 Stück verteilt habe.", "tags": ["efficacy_works", "plants_gnats", "fast_result"]}, {"r": 2, "t": "Leider hatte ich gemeint, dass sie auf den Baumstamm kleben bleibt da sie doppelseitig klebrig sind! Aber sie sind nach ca. 30 Minuten am Boden gelandet…", "tags": []}, {"r": 3, "t": "Die Gelbsticker ziehen tatsächlich einige Trauermücken an, und man sieht auch, dass sich Insekten darauf sammeln. Allerdings ist die Wirkung eher begrenzt - das Problem wurde nicht vollständig gelöst. Für kleinere Befälle okay, aber bei stärkerem Befall sollte man noch andere Maßnahmen ergänzen. Die Anwendung ist einfach, aber die Klebekraft könnte besser sein. Insgesamt ganz okay, aber kein Wundermittel.", "tags": ["plants_gnats", "ease"]}, {"r": 1, "t": "Die Trauermücken fliegen nur zu gelben Klebetafeln, die schwarzen bleiben „sauber“", "tags": ["plants_gnats"]}, {"r": 1, "t": "Die Gelbsticker halten nicht, wenn man sie auf Oberflächen (Küchenschränke) klebt, man muss sie zusätzlich mit Tesafilm ankleben. Bei mir sind die Gelbsticker zudem leider völlig wirkungslos, die kleinen Fliegen sitzen oft genau neben den Stickern", "tags": ["efficacy_fails"]}, {"r": 1, "t": "Die Spitzen lassen sich nicht gut in die Erde stecken und die Trauermücken fliegen setzen sich drauf und fliegen weiter, heißt der Kleber ist nicht stark genug. Nach einer Woche sind alle Sticker leer und Trauermücken habe ich immer noch.", "tags": ["efficacy_works", "plants_gnats", "fast_result"]}, {"r": 3, "t": "Ist in Ordnung, aber leider bleiben da nicht so viele Trauermücken hängen wie erhofft. Man muss viele aufstellen, um einen relevanten Effekt zu erzielen. Würde aber behaupten, dass diese Schilder eher zur Prävention als zur Behandlung des Problems geeignet sind, daher nur 3 Sterne. Kleben tun sie jedoch gut.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 1, "t": "Montags Produkt , meine kleben nicht", "tags": ["not_sticky"]}, {"r": 3, "t": "Sie aus dem Baumarkt sind besser", "tags": ["efficacy_works"]}, {"r": 1, "t": "Sie helfen nicht. Die Fruchtfliegen ignorieren diese gelben Dinger. Geldverschwendung...", "tags": ["fruit_flies"]}, {"r": 2, "t": "🌼 Blooven Gelbsticker - Leider nicht überzeugt 🌼⭐⭐  Die Blooven Gelbsticker sollen gegen Trauermücken helfen, aber leider bin ich enttäuscht. Die Trauermücken schaffen es teils, von den Tafeln runterzulaufen, was den Zweck komplett verfehlt. Für 6 Euro gibt es bessere Alternativen, die wirklich halten.  Der Versand war gut und ohne Probleme 🚚✨ - schnell und unkompliziert! Leider kann ich daher nur 2 Sterne vergeben.⭐⭐", "tags": ["efficacy_works", "plants_gnats", "ease"]}, {"r": 1, "t": "Nein, Pflanzen habe ich weg geschmissen", "tags": ["plants_gnats"]}, {"r": 1, "t": "Leider nicht für Fruchtfliegen geeignet :-( Nach Tagen keine einzige Fliege gefangen", "tags": ["efficacy_fails", "fruit_flies"]}, {"r": 1, "t": "Trauermücken reagieren einfach nicht auf diese Gelbsticker", "tags": ["efficacy_fails", "plants_gnats", "ease"]}, {"r": 1, "t": "Wirkt bei mir leider nicht. Keine einzige Mücke auf den Gelbtafeln.", "tags": ["efficacy_works"]}, {"r": 1, "t": "Ich habe die Sticker in allen Töpfen innerhalb des Hauses gesteckt. Aber es klebt nicht ein Tier dran. Bei mir zeigen sie leider keine Wirkung.", "tags": ["not_sticky"]}, {"r": 3, "t": "Ganz weg dauert seine Zeit  !", "tags": ["plants_gnats"]}, {"r": 1, "t": "Ich habe gesehen wie die fliegen sich drauf setzen und wieder wegfliegen", "tags": []}, {"r": 2, "t": "Haben den Trauermückenbefall nur sehr bedingt reduziert, es scheint so als ob die Trauermücken nur durch Zufall den Weg auf die Gelbsticker finden", "tags": ["plants_gnats"]}, {"r": 1, "t": "Ich kenne Gelbsticker seit einigen Jahren, aber so wirkungslos wie diese waren noch keine. Da fehlt irgendein Lockstoff oder ähnliches. Die tun nichts ausser kleben, da muss sich eine Fruchtfliege (oder Trauermücke) zufällig drauf verirren.", "tags": ["fruit_flies"]}, {"r": 2, "t": "Wirken kaum, leider, Die viecher gehen nicht richtig ran an die Dinger.", "tags": []}, {"r": 3, "t": "Leider keine vollständige Lösung", "tags": []}, {"r": 3, "t": "Leider gehen unsere Trauerfliegen nur sehr ungern auf die gelben Klebefallen. Von den bis jetzt verwendeten 6 Klebefallen war nur eine ein bisschen erfolgreich. Die Trauermücken sind immer noch unterwegs.", "tags": ["plants_gnats"]}, {"r": 3, "t": "So gut wie die gehen die Frucht fliegen funktiert es nicht", "tags": ["efficacy_works"]}, {"r": 3, "t": "Schwierig zu Befestigung, habe  immer klebrigen Finger wennich sie befestige. Möglicherweise mache ich etwas unrichtig. ABER SEHR WIRKSAM!", "tags": []}, {"r": 2, "t": "Leider hat es bei mir überhaupt garnicht geholfen, muss mir noch eine alternative suchen", "tags": []}, {"r": 2, "t": "Leider sind sie wahrscheinlich überlagert und die Schutzfolie lässt sich nicht mehr leicht entfernen ! Auf einer Seite ist es nicht mehr möglich. Wenn sie dann im Einsatz sind erfüllen sie ihren Zweck", "tags": []}, {"r": 1, "t": "Die Lockstreifen kleben schlecht an Küchenmöbeln und locken innerhalb ca 1 Woche kaum Obstfliegen an also praktisch wirkungslos!!", "tags": ["efficacy_fails", "fruit_flies", "ease"]}, {"r": 3, "t": "Das Produkt entspricht meinen Erwartungen und Angaben!", "tags": ["ease"]}, {"r": 3, "t": "Sie sind schwer wegzubekommen.", "tags": ["plants_gnats"]}, {"r": 2, "t": "Ansich ist das Produkt okay, es sind immer Fliegen dran, aber nicht so viele! Für Topf mit Blumenerde nicht so geeignet!", "tags": []}, {"r": 1, "t": "Funktioniert überhaupt garnicht. Wenn sich schonmal ein Tier darauf verirrt kann es sich problemlos davon wieder entfernen.", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 1, "t": "Leider nicht vollständig geliefert", "tags": []}, {"r": 3, "t": "Die Trauermücken fliegen um die Fallen herum. Es scheint sie nicht so recht anzulocken.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Hat mir erstmal sehr geholfen. Nach einem Pflanzen Kauf, der mit Insekten befallen war. Erfolg noch nicht einschätzbar. Schauen wir nächstes Jahr .", "tags": ["plants_gnats"]}, {"r": 1, "t": "Aufgrund einer vergammelten Kartoffel hatte ich bestimmt mindestens 50 Fruchtfliegen.. Sie saßen auf den geputzten Küchenschränken und an der Scheibe, nur nicht auf den gelben Fliegenfängern. Keine einzige! Nach ein paar Tagen habe ich die gelben Tafeln wieder zurückgeschickt.", "tags": ["efficacy_fails", "fruit_flies"]}, {"r": 1, "t": "ich würde sie nicht wieder kaufen", "tags": ["repeat"]}, {"r": 3, "t": "Die Gelbsticker kleben sehr gut, da kann man nichts sagen. Bei mir ist es dennoch sehr schwierig, die Sticker in die Erde zu bekommen, da der untere Teil einfach nicht starr genug ist. Insgesamt völlig okay, aber nächstes Mal würde ich wieder zu den klassischen mit  den \"metallischen\" Aufstellern greifen.", "tags": ["efficacy_works", "ease"]}, {"r": 2, "t": "Lieferung wie immer super! Die kleber sehen auch von den Motiven lustig aus! Einziger Haken- sooo gut funktionieren die bei uns leider nicht... ich hab sie gleich nach Lieferung an unterschiedlichen Punkten in der Küche, vorwiegend bei Blumen und einem Obstkorb  eingesetzt! Fazit: Nach mehreren Tagen und  5 eingesetzten klebemotiven an unterschiedlichen Bereichen kleben zwar vereinzelt fliegen drauf- viele sind aber immer noch unterwegs... ich hätte mir ehrlichgesagt mehr von diesem Produkt erhofft! Ich hatte schon bessere klebefallen...Also ich persönlich kann die Kleber daher nur bedingt emp", "tags": ["efficacy_works"]}, {"r": 1, "t": "Funktioniert nicht", "tags": ["efficacy_fails"]}, {"r": 3, "t": "Ja na ja OK", "tags": []}, {"r": 3, "t": "Hilft nur Sie zu vernichten. Problem damit aber leider nicht gelöst.", "tags": []}, {"r": 1, "t": "Ich habe die Dinger gekauft, um der Fruchtfliegenplage Herr zu werden. Leider ohne Erfolg. Die Viecher finden die Dinger uninteressant bzw laufen einfach drüber ohne festzukleben.", "tags": ["efficacy_fails", "fruit_flies", "ease"]}, {"r": 3, "t": "Gelbsticker zu dünn, knicken im Blumentopf um. Ansonsten recht große Fläche.", "tags": ["plants_gnats"]}, {"r": 2, "t": "Ist nicht so wie ich dachte,,Obst fliegen gehen nicht ran,", "tags": []}, {"r": 1, "t": "Die Fliegenfalle hängt jetzt fast seit einer Woche - nichts. Ich habe sogar beobachtet, wie die Fliegen auf der Klebefläche umherlaufen und anschließend wieder wegfliegen.", "tags": ["efficacy_fails"]}, {"r": 1, "t": "Bei 30 Stück, in der Wohnung verteilt, waren vier Mücken drauf. Der Rest hat sich fröhlich im Kaffeeautomaten vermehrt.", "tags": []}, {"r": 1, "t": "Wenn dieses Produkt vorgeschlagen wird, wenn ich nach FRUCHTFLIEGENfallen suche, dann erwarte ich auch, dass diese funktionieren. Nach 8 Wochen haben sich wohl mehr oder weniger aus Versehen 2 Fruchtfliegen in die Fallen verirrt. Der Rest hat sich dafür nicht interessiert.  Absolut unbrauchbar gegen Fruchtfliegen", "tags": ["efficacy_works", "fruit_flies"]}, {"r": 2, "t": "Meine Trauermücken mögen offensichtlich KEIN Gelb. Sinnlose Aktion diese Sticker zu kaufen.", "tags": ["plants_gnats"]}, {"r": 1, "t": "Die Mücken waren kaum interessiert. Die wenigen, die daran kleben blieben, waren vermutlich versehentlich dagegen geflogen. Viel besser halfen die selbst gebauten Fallen: kleine Gläschen mit Saft, Wasser und Spülmittel", "tags": []}, {"r": 1, "t": "Nach zwei Wochen nur ein paar Fliegen gefangen. Ein großer Teil der anderen Fliegen ist im Zimmer weitergeflogen.", "tags": ["efficacy_fails"]}, {"r": 1, "t": "Ich habe 40 Gelbtafeln ausgewählt und bestellt. Aber Vorsicht: Eigentlich sind es nur 20 Stück! Die Gelbtafeln sind so konzipiert, dass sie in der Mitte teilbar sind. Daher ist auch auf einem Bild 20x2 abgebildet. Dennoch: Ausgewählt habe ich 40 Stück und habe auch mit 40 großen Tafeln gerechnet. Die Angaben führen zu Missverständnissen. Und ja, wenn man aus der Bestellung eine \"Doktorarbeit\" macht, kann es einem sicherlich auffallen. Aber: Ich (und sicherlich viele andere Kunden) checke bei einem Produkt unter 10 Euro lediglich die Bewertungen und stelle keine detailreiche und zeitintensive A", "tags": ["efficacy_works"]}, {"r": 1, "t": "I bought these to get fruit flies. Put them everywhere in the kitchen/living room and none was caught. Going to return the item", "tags": ["fruit_flies"]}, {"r": 3, "t": "Kauft euch die Normalen Plättchen. Sieht schön aus, aber die Fischer Kleben besser an den Quadratischen Gelbstickern. Und da sind oft mehr drin", "tags": []}, {"r": 3, "t": "Gewisse Arten von Mücken und Fliegendes Getier kann man zwar damit fangen, leider aber nicht die versprochenen. Zudem ist auch die Fangquote zu gering (etwa 10%). Ich werde sie nicht mehr kaufen. Sorry.", "tags": []}, {"r": 2, "t": "Ich habe keine einzige Fruchtfliege damit gefangen. Aber in der Gebrauchsanweisung wird auch auf den bekannten Apfelessig Tip hingewiesen. Also einfach eine Schüssel oder so nehmen, flüssige Seife hinein und gut mit Apfelessig vermischen. Es darf nicht zu wenig sein. Und wenn ihr Obst und Gemüse etc. kauft, erst abwaschen.", "tags": ["efficacy_works", "fruit_flies", "ease"]}, {"r": 1, "t": "Die Gelbtafeln kleben kaum bis gar nicht, daher kaum Wirkung", "tags": []}, {"r": 1, "t": "Der Artikel bringt garnichts es wurde nicht eine Fruchtfliege mit gefangen", "tags": ["fruit_flies"]}, {"r": 1, "t": "Habe mehrere dieser Sticker in Töpfe und an Haken an den Fensterbänken angebracht .  Anziehung der Trauer Mücken kann ich nicht bestätigen. Überall fliegen die Fliegen herum und gehen nicht an die Sticker ? Deshalb keine Empfehlung von mir !", "tags": []}, {"r": 1, "t": "Keine einzige Fliege wurde damit gefangen", "tags": []}, {"r": 2, "t": "Handhabung gut der Erfolg bisher noch nicht so gut", "tags": ["efficacy_works"]}, {"r": 1, "t": "Habe 5 Blätter aufgestellt, allerdings es waren nur 2!!! Fliegen innerhalb von 8 Std aufgeklebt, alle andere hunderte Fliegen haben sich sehr wohl nebenan gefüllt und frei bewegt! Schade ums mein Geld!!!", "tags": []}, {"r": 1, "t": "Finde das es absolut keine Wirkung hat. Die Fliegen sind trotzdem da, aber minimal auf dem Klebepapier. Keine Kaufempfehlung", "tags": []}, {"r": 1, "t": "Die Obstfliegen wurden davon wohl nicht angezogen. Stand tagelang und hat max. drei angezogen.", "tags": ["efficacy_works", "fruit_flies"]}, {"r": 3, "t": "Über den Erfolg kann ich noch nichts sagen, aber allein das Entfernen des Schutzpapieres am „Schmetterlings-Sticker“ hat schon Nerven gekostet. Nicht nur bei einem, bei allen die ich nutzen wollte. Letztendlich muss man auf die Klebeflächen fassen um das Papier abzuziehen. Das passiert bei den anderen beiden Mustern nicht. Somit fliegen 33% der Packung in die Mülltonne, weil den Ärger beim Abziehen, macht man nur einmal mit.", "tags": []}, {"r": 2, "t": "Lockt nicht ausreichend", "tags": []}, {"r": 1, "t": "Nur gelbe deko, sonst nichts", "tags": ["efficacy_fails"]}, {"r": 2, "t": "Not so effective in my view", "tags": ["efficacy_fails"]}, {"r": 3, "t": "Wirkung mäßig.", "tags": []}, {"r": 3, "t": "Erfüllt seinen Zweck, die kleinen Fliegen bleiben kleben, es  ist etwas instabil und nicht so einfach es in die Blumenerde zu stecken aber es geht ich persönlich finde den Preis etwas zu hoch.", "tags": ["very_sticky", "plants_gnats", "price_high", "ease"]}, {"r": 3, "t": "Wirkt relativ gut", "tags": ["efficacy_works"]}, {"r": 3, "t": "Klebt nicht besonders", "tags": ["efficacy_fails", "not_sticky"]}, {"r": 2, "t": "and i wish they had at least a different colour. it is impossible to unglue them if they accidentaly catch a leaf of my plant. imagine, how this look like when 700 little flies get glued. what is the point? i thougt this thing has something that kills the eggs. i am not recommending this to anyone.", "tags": ["plants_gnats"]}, {"r": 2, "t": "Wir hatten bereits früher gelbe Kleber von einem anderen Anbieter. Dort blieben immer viele Mücken kleben. Bei diesem Produkt ist das leider nicht so.", "tags": []}, {"r": 2, "t": "Meine Mücken fliegen um den Stecker herum. Hab es jetzt seit über einer Woche und es klebt keine einzige Mücke dran. Funktioniert bei mir leider nicht.", "tags": ["efficacy_works"]}, {"r": 3, "t": "Leider lösen sich die Fliegen dort immer mal wieder und lösen sich leider.", "tags": []}, {"r": 3, "t": "Sticker brechen schnell ab. Qualität nicht so gut !!!", "tags": ["efficacy_works"]}, {"r": 2, "t": "Ich habe mir die Teile gekauft, um meine Fruchtfliegen loszuwerden. Davor habe ich es immer mit Apfelessig und Spülmittel probiert, aber ich dachte mit etwas professionellem geht es vielleicht schneller… leider habe ich mit diesem Produkt aber nur 2 Stück innerhalb von mehr als einer Woche gefangen :/", "tags": ["efficacy_works", "fruit_flies"]}, {"r": 3, "t": "Soweit in Ordnung", "tags": []}, {"r": 3, "t": "Die Formen sind nich benutzerfreundlich gewählt. Aufgrund der Form lässt sich der Sticker nicht gut entfernen.  Ansonsten wirken sie und die Trauermücken/Tripse bleiben hängen.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 3, "t": "Ich habe bei mir eine Thripsen Plage und dafür das ich gefühlt Millionen an meinen Fenstern kleben habe, sie schon in meinen Bilderrahmen kriechen und eins fast in mein 5 Wochen altes Baby, ins Auge Gegangen wäre. Ist es sehr schade das dieses Produkt nicht dafür geeignet ist. Ich würde es gerne zeigen Aber die Viecher sind so klein, dass man sie auf Bildern nicht sieht.", "tags": []}, {"r": 3, "t": "Ich habe die Gelb Tafeln unter anderem an den Wasser speichern verteilt, weil dort auch Mücken laufen, nisten. Allerdings bin ich überrascht wie wenig doch auf die Gelb Tafeln anspringen. Ich hatte das gleiche Mal am Kirschbaum probiert, und auch da waren die Kirschen im nächsten Jahr trotzdem mit Insekten", "tags": []}, {"r": 2, "t": "Sehr leichte und schnelle Anwendung aber da es keinen anlockenden Duft hat funktioniert es sehr schlecht.Würde ich nicht nochmal kaufen und auch nicht empfehlen", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 3, "t": "Für den Preis sind die Tafeln sind OK, aber ich hab das Gefühl das die Trauermücken nicht wirklich daran kleben bleiben.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Es sind kaum Tiere an den Stickern. Vermutlich wegen der Farbe.", "tags": []}, {"r": 3, "t": "Erfüllt den Zweck", "tags": []}, {"r": 3, "t": "Sehr gut", "tags": ["efficacy_works"]}, {"r": 2, "t": "Bisher habe ich immer die Klebefallen aus den bekannten Drogeriemärkten verwendet. Da ich auf eine günstigere Alternative umsteigen wollte, habe ich mir diese Fallen bestellt, allerdings ist die Qualität und Wirkung deutlich schlechter! Man kann quasi beobachten wie die Fliegen über die Falle laufen ohne kleben zu bleiben und dann wieder weg fliegen. Es bleiben deutlich weniger Insekten haften als bei teureren Produkten. Schade! Aber der Versuch war es wert.", "tags": ["efficacy_fails", "price_value"]}, {"r": 3, "t": "Doch viel zu wenige Stäbchen.", "tags": ["efficacy_works"]}, {"r": 2, "t": "Die Lieferung kam wie angegeben. Die Gelbtafeln sind zwar stabil, aber ohne Funktion. Die Fliegen interessieren sich für die gelben Tafeln überhaupt nicht. Neben den Tafeln laufen die Fliegen rum und auch über die Tafeln. Klebekraft für Fliegen nicht ausreichend. Da die Fliegen von den Tafeln auch nicht angelockt werden, ist das Produkt nutzlos. Fliegen sitzen überall in der Küche nur nicht auf den Tafeln.  Keine Kaufempfehlung hierfür", "tags": ["efficacy_fails"]}, {"r": 2, "t": "Sehen eigentlich gut aus, obwohl das Material dünner als bei anderen Gelbsticker Produkten ist. Leider auch hier wie schon bei vielen anderen getesteten Gelbstickern in den letzten Jahren, der Leim/Kleber ist einfach nur lächerlich. Hatte gehofft mit diesem Chinaprodukt noch eine ordentliche Chemiekeule zu bekommen, aber weit gefehlt. Auch bei diesen Gelbstickern laufend die Trauermücken lachend über die Oberfläche.  Gut, wenn Sie bei Gießen gerne mal einen Sticker modisch am Ärmel hängen haben wollen, aber gegen Trauermücken bringen sie leider nichts.", "tags": ["efficacy_works", "plants_gnats", "ease"]}, {"r": 2, "t": "Leider funktionieren diese nicht so gut. Schade. Die Fliegen fliegen nicht von selbst drauf, so wie bei anderen. Vielleicht braucht es Zeit, wir warten ab.", "tags": ["efficacy_works"]}, {"r": 2, "t": "Leider viel zu breit und sieht deshalb im Blumentopf mit kleineren Pflanzen nicht gut aus. Man kann das Blatt teilen,  allerdings bekommt man die Schutzfolie ganz schlecht ab und dann hat man den Klebstoff für die Mücke am Finger. Das geht verdammt schwer ab.", "tags": ["efficacy_works", "efficacy_fails", "plants_gnats"]}, {"r": 2, "t": "Ich habe schonmal andere Gelbfallen gekauft, die haben besser funktioniert. Diese fangen nur wenige Tiere", "tags": ["efficacy_works"]}, {"r": 2, "t": "Die Trauermücken scheinen sich überhaupt nicht für diese Klebefallen zu interessieren. Nach 5 Tagen hatten sich erst 2 Tierchen darauf niedergelassen. Im Zimmer fliegen weitere Mücken munter herum.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Für Blumentöpfe( Zimmerpflanzen)", "tags": ["plants_gnats"]}, {"r": 2, "t": "Klebeflächen haben keine besonders gute Haftkraft. Vermutlich schon ausgetrocknet, vielleicht alte Lagerware.", "tags": ["efficacy_works"]}, {"r": 3, "t": "Die Fliegen bleiben überwiegend kleben. Einige können sich aber losreißen. Es lockt leider die Fliegen auch nicht an.", "tags": []}, {"r": 2, "t": "Deckblatt lässt sich schlecht abziehen", "tags": ["efficacy_fails"]}, {"r": 3, "t": "Due Fallen sind ein wenig dünn und deshalb kann man sie schlecht in die Erde stecken. Sonst aber erfüllen sie ihren Zweck.", "tags": ["efficacy_fails"]}, {"r": 2, "t": "Ich habe diese Gelbsticker auf Grund des guten Preises gekauft. Sie sehen nett aus, aber das Material ist sehr dünn und deshalb ist es schwierig, das die Sticker vernünftig in die Erde gehen und in der gewünschten Position stehen bleiben. Auch der Kleber ist recht dünn aufgetragen. Bisher haben sich nur sehr wenige Fliegen darauf verirrt. Somit werde ich beim nächsten Kauf wieder tiefer in die Tasche und zum Markenprodukt greifen, damit war die Fliegenjagd deutlich erfolgreicher und die Sticker gingen problemlos in die Erde.", "tags": ["efficacy_works"]}, {"r": 3, "t": "Tut was es soll", "tags": []}, {"r": 2, "t": "nach drei Wochen zero Auswirkung - null Insekten drauf 🤷♂️", "tags": []}, {"r": 3, "t": "Eigentlich sind sie voll gut Sie helfen aber nicht das Problem grundsätzlich zu lösen also man braucht etwas was effektiver ist", "tags": ["efficacy_works"]}, {"r": 2, "t": "Ein paar fliegen hat es gefangen aber nur da wo sie auch waren. Es hat sie nicht angelockt. Da gibt’s deutlich bessere Alternativen um Fruchtfliegen los zu werden. Direkt bei den Pflanzen hat es mehr gefangen wer also dort die Problem Zone hat macht nichts falsch", "tags": ["plants_gnats", "fruit_flies"]}, {"r": 2, "t": "Leider können die Trauermpcken auf der Oberfläche laufen und können so entkommen somit hilft es bis jetzt so gut wie nichts", "tags": ["efficacy_works"]}, {"r": 2, "t": "Es lockt ein paar Trauermücken an aber hilft nicht bei einem Befall. Präventiv aber brauchbar", "tags": ["plants_gnats"]}, {"r": 3, "t": "Funktioniert aber das Verhältnis Erfolg zu Müllproduktion ist nicht zumutbar", "tags": ["efficacy_works"]}, {"r": 2, "t": "Vielleicht hätte man es als große gelbe Trauermücke formen müssen. Ich warte schon ne Woche...aber nichts.", "tags": []}, {"r": 2, "t": "Hat eigentlich nichts gebracht , nach mehr als zwei Tagen waren zwei oder drei Mücken an sie geklebt.", "tags": ["efficacy_works"]}, {"r": 2, "t": "I bought this product to help vs. the gnats on our plants in combination with nematodes after our other brand of pricier yellow stickers had run out. However, these ones don't stick enough and you can see the gnats literally walk on the supposedly sticky bits and fly away again. Some plants still have quite a few gnats but none got caught so this product doesn't fulfill its duty at all.", "tags": ["not_sticky", "plants_gnats"]}, {"r": 3, "t": "Ich nutze die Gelbtafeln in meinen Boxen mit Wirbellosen. Leider hab ich das Gefühl dass diese Tafeln nicht so gut kleben und bei erhöhter Luftfeuchtigkeit abfallen könnten. Die Sorte die ich zuvor hatte klebt hingegen Bombe.", "tags": ["efficacy_works"]}, {"r": 3, "t": "Ist eine günstige Methode, um die Schädlinge zu bekämpfen, aber alle habe ich damit nicht los bekommen.", "tags": ["price_value"]}, {"r": 3, "t": "Ich habe mehrere Tafeln in den topf gesteckt bei diesen hier kann ich leider nur einzeln gefangene Mücken sehen die anderen laufen lachend an den fest klebenden vorbei fliegen mir dann um die Nase und zeigen mir den stinke Flügel", "tags": []}, {"r": 2, "t": "In der Hoffnung unser Fruchtfliegen-Problem damit in den Griff zu bekommen, habe ich es bestellt! Aber leider finden die es nicht sehr anziehend! Habe dann einen Tropfen Essig darüber laufen lassen und damit war es etwas besser!", "tags": ["fruit_flies"]}, {"r": 3, "t": "Achtung nicht für Obstfliegen geeignet.", "tags": ["fruit_flies"]}, {"r": 3, "t": "Das Produkt war zwar nicht teuer, aber auch nicht wirklich nützlich. Es wird nichts dadurch angelockt was festkleben könnte und das wars. Unnütz", "tags": ["price_value"]}, {"r": 2, "t": "Besonders schwer sind die Folien von den Schmetterlingen abzuziehen. Der meiste Klebstoff bleibt hier an den Fingern hängen. Am besten lassen sich die Folien von den Tulpen abziehen. Effiziente Fänger sind sie nicht. Im Vergleich zu einem nach oben verjüngten Schnapsglas, welches ich mit Apfelessig und Zucker gefüllt habe, ist die Fangquote dagegen 3-4 mal so hoch. Man sollte neben dem Sticker eine Zwiebel oder ein Apfelstück als Lockstoff legen, um die Effizienz zu erhöhen.", "tags": []}, {"r": 3, "t": "Der Kleber ist nicht so gut", "tags": ["efficacy_works"]}, {"r": 3, "t": "Ist für die Zwecke sehr gut,schlecht in die Erde zubekommen und lässt sich schlecht das Papier abtrennen", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 3, "t": "Also es dauert ja sie fliegen rein aber es dauert ewig glaube da gibts Alternativen ich denke es fehlt der Geruch es ist halt gelb das soll sie anlocken aber mit Geruch wäre es um einiges besser", "tags": ["efficacy_works"]}, {"r": 3, "t": "leider nur mit mäßigem Erfolg", "tags": []}, {"r": 3, "t": "Erfüllen ihren Zweck; die Fliegen und Trauermücken bleiben sehr gut an der Klebefläche kleben, aber der Stiel könnte etwas stabiler sein. Es ist schwierig den Stiel in die Erde zu bringen.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 3, "t": "Just okay", "tags": []}, {"r": 2, "t": "I didn't find it very useful", "tags": []}, {"r": 3, "t": "Im Großen und Ganzen ließ sich der Blechschuppen gut aufbauen. Beim Dach gab s Probleme mit der Lochung, die zum Teil nur angepresst wurde aber nicht ausgestanzt waren. Das justieren der Türen ist leider nicht möglich weil immer ein kleiner Spalt unten bleibt obwohl die Türen oben schließen. Bei einer Tür war der umgelegte Pfalz auf der Griffseite komplett eingedrückt, obwohl der Trañsportkarton mit Holz ausgeschlagen war. Das lässt vermuten daß die Tür vorher schon eingedrückt war und trotzdem verpackt wurde.", "tags": ["efficacy_works"]}, {"r": 2, "t": "Leider ist diese nicht geeignet und entspricht nicht den Artikel Beschreibung.", "tags": []}, {"r": 3, "t": "Zieht zwar die kleinen Fliegen an aber hilft auch nicht sie los zu werden. Ich habe jetzt was besseres gefunden, und zwar Bio blumenerde von neudorff. Ich habe die befallenen Pflanzen umgetopft und die Fliegen gehen nicht mehr ran", "tags": ["plants_gnats"]}, {"r": 3, "t": "ok", "tags": []}, {"r": 2, "t": "The cards are too floppy to stand up. They bend over and stick to the leaves and ruin the plant.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Habe sie in die Blumenkästen gesteckt, aber keine klebt dran 🤷", "tags": []}, {"r": 3, "t": "mit Lockstoff wäre vielleicht noch wirksamer, für einige Trauermücken möchte ich auf keinen Fall die Umwelt belasten. Tut was es soll, kleines Getier klebt an.", "tags": ["plants_gnats"]}, {"r": 2, "t": "Die Sticker sind günstig und wirken auf den ersten Blick und Finger-Test auch \"genug klebrig\", aber leider schaffen es die Trauermücken, trotzdem darauf rumzulaufen und sich wieder zu lösen 😕", "tags": ["plants_gnats", "price_value"]}, {"r": 2, "t": "Man muß ganz vorsichtig sein, nicht dass alle Blätter darauf geklebt werden. Relativ weich Plastik, daher nicht stabil genug, insb. mit Anhänger.", "tags": ["price_value"]}, {"r": 3, "t": "Über die Zeit hatten sich einige Trauermücken dort niedergelassen und klebten auch fest. Wer denkt damit das Problem zu lösen wird allerdings enttäuscht. Die Kleber können meiner Meinung nach nur unterstützend eingesetzt werden. Wir hatten wirklich erst Ruhe, als wir mit Nematoden angefangen haben.", "tags": ["plants_gnats"]}, {"r": 2, "t": "Fangen Trauermücken ein ,wie sie sollen. Wir nutzen parallel noch Nematoden, um die Larven abzutöten. Ob diese Kombination nachhaltig wirkt, wird sich erst in ein paar Wochen zeigen. Was mich an diesen Karten aber tierisch nervt, ist ihre Form. Eigentlich ist mir das Aussehen egal, aber wenn der Zuschnitt dafür sorgt, dass sich das Schutzpapier garantiert nicht im Ganzen abziehen lässt sondern an den Einschnitten zerreißt - dann ist das Produkt kaputtdesignt.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 3, "t": "Preis-Leistungs-Verhältnis ist gut, sie sehen auch ganz niedlich aus (wobei das nicht ausschlaggebend ist, sondern dass sie funktionieren), jedoch ist das Einbringen in die Erde extrem schlecht zu bewerkstelligen. Machst du erst das Papier ab, klebst du selbst fest, steckst - besser buddelst du sie erst in die Erde, weil stecken geht sehr schlecht, dann bekommst du das Papier kaum ab bzw. ziehst die Klebetafeln wieder mir heraus. Das geht bei anderen Herstellern definitiv besser. Würde diese deshalb nicht noch einmal kaufen.", "tags": ["efficacy_works", "efficacy_fails", "price_value"]}, {"r": 3, "t": "Schnell geliefert sehen niedlich aus und macht was es machen soll , günstig. Aber diese werde ich nicht mehr kaufen da Sie sich sehr schwer in der Erde einsetzen lassen 🙃", "tags": ["price_value"]}, {"r": 3, "t": "Wieder mal sehr nerviges abknibbeln der Schutzfolie.", "tags": []}, {"r": 2, "t": "Die Mückenfalle ist leider für eine andere Art entwickelt worden. Meinige erkennen die Mückenfalle nicht an und meiden sie", "tags": []}, {"r": 2, "t": "Nicht zu empfehlen, da Duft-/Lockstoffe fehlen, Fliegen nicht angelockt werden. Zudem lässt sich das Schutzpapier nur schwer bzw. umständlich entfernen. Made in China eben - kaufe ich nicht wieder! Gelbsticker aus deutscher Herstellung sind zwar etwas teurer, dafür aber deutlich besser.", "tags": ["efficacy_works"]}, {"r": 2, "t": "Fängt alle Fliegen", "tags": []}, {"r": 2, "t": "Klein, sehr dünn, kleben an den Fingern weil es keine Ränder gibt. Es gibt andere die nicht wesentlich teuerer sind, aber von der Qualität um einiges hochwertiger. Mücken bleiben aber schon dran hängen deswegen 2*.", "tags": []}, {"r": 3, "t": "Funktioniert", "tags": ["efficacy_works"]}, {"r": 2, "t": "Komisch. Aber kein Erfolg.", "tags": ["efficacy_works", "efficacy_fails"]}, {"r": 3, "t": "no", "tags": []}, {"r": 2, "t": "Diese Teile haben den Anschein das diese die Fliegen meiden. Die sind lieber vorm hellen PC Bildschirm als dort wo diese haften sollten!", "tags": ["plants_gnats"]}, {"r": 3, "t": "Es waren sehr viele Insekten drauf aber in der Erde hat es immer noch gewimmelt von ihnen. Hab aber auch gehört dass die kommen wenn die Erde zu nass ist", "tags": []}, {"r": 3, "t": "Leider hat es mein Problem nicht lösen können. Preis war OK.", "tags": []}, {"r": 3, "t": "Ich verwende die Sticker für Zimmerpflanzen.", "tags": ["plants_gnats"]}, {"r": 3, "t": "...wie etwas hochpreisigere Gelbschilder.  Hatte zuerst ein 10er Set Gelbschilder eines anderen Herstellers bestellt. Diese waren top und die Trauermücken waren ruckzuck an den Schildern. Allerdings haben 10 Stück nicht zur gänzlichen Beseitigung gereicht.  Also hab ich nochmal geschaut und dieses 60er Set lediglich zum doppelten Preis der 10er bestellt, weil die Bewertungen okay sind.  Allerdings sind diese hier deutlich weniger effektiv. Es sind schon immer Trauermücken drauf, aber deutlich weniger als bei den anderen und einige Trauermücken fliegen und krabbeln einfach drum rum.  Wirkung ge", "tags": ["plants_gnats", "ease"]}, {"r": 2, "t": "Auch nach 5 Tagen direkt an der Quelle sind nur 2 Trauermücken an der Tafel. Entweder sind die Mücken zu schlau oder das Zeug funktioniert nicht", "tags": ["efficacy_fails", "plants_gnats"]}, {"r": 3, "t": "Sehen gut aus und sie machen was sie sollen. Fliegen fangen.", "tags": ["efficacy_works"]}, {"r": 2, "t": "Die Mücken schwirren lustig daran vorbei. Sehr selten eine darauf.", "tags": ["plants_gnats"]}, {"r": 3, "t": "Insgesamt brauchbar. Fängt wie versprochen die kleinen Quälgeister. Preis ist allerdings für die Menge zu hoch.", "tags": ["price_high"]}, {"r": 2, "t": "Sooooo sorry at first I thought these were useful but not for long. They are extremely difficult to stick on anything and they're frustrating, they don't stick and keep falling off hence the frustration. I wouldn't have bought them had I known this. I am sorry for the negativity but I also believe in honesty,  so please listen to me", "tags": ["not_sticky"]}, {"r": 2, "t": "Pas très collant", "tags": []}, {"r": 2, "t": "Doesn’t work for us. Not a single fly got trapped. We have a big problem with fruit flies and they literally fly by", "tags": ["fruit_flies"]}, {"r": 2, "t": "Really not what I wanted, they don't actually attract the flies, a jar with a hole in the top and vinegar inside does a much better job.", "tags": []}, {"r": 2, "t": "Didn't work at all well. The traditional saucer with apple cider vinegar and a couple of drops of washing up liquid worked much better-Catching hundreds of fruit flies, whereas five of these sheets managed to catch six flies between them, and a solitary spider.", "tags": ["efficacy_works", "fruit_flies"]}, {"r": 2, "t": "Maybe I was the unlucky one, but I’ve been using for a week and it didn’t catch any fruit flies. I saw one fly land in the glue trap and it just flew away like nothing, either they are not being attracted or the glue is not strong enough.", "tags": ["fruit_flies", "aesthetic"]}, {"r": 2, "t": "Not the best difficult to peel off backing paper!I", "tags": []}, {"r": 2, "t": "They don’t work. I still have just as much greenfly and whitefly in my greenhouse.", "tags": []}, {"r": 3, "t": "Work ok and very sticky but I find my plants also get stuck to them. Not sure how to solve it unless you make them very long but then you’d miss some of the tiny flies hovering around the soil", "tags": ["very_sticky", "plants_gnats"]}, {"r": 2, "t": "Difficult to put together and hang.  Have put these sticky sheets around my house and never caught one fly.  They are very sticky - hence two stars.  Flies seem to avoid!!", "tags": ["very_sticky"]}, {"r": 3, "t": "There is no doubt that these traps work exactly as advertised; they have heavily reduced the fruit fly population near my kitchen compost bin. However, I’ve knocked off two stars for the user experience. The glue on these traps is exceptionally strong and covers both sides completely. Trying to peel off the white protective backing paper without accidentally sticking the trap to your fingers, your sleeves, or the leaves of your plants is a massive challenge. Once it touches something, it leaves a stubborn, gooey residue behind. They also look a bit unsightly poking out of your lovely decorativ", "tags": ["efficacy_works", "plants_gnats", "fruit_flies"]}, {"r": 2, "t": "These didn’t really do anything for us unfortunately", "tags": []}, {"r": 3, "t": "Not as good as expected", "tags": []}, {"r": 3, "t": "Moyen", "tags": []}, {"r": 2, "t": "Les moucherons  ne vont pas dessus hyper déçu", "tags": []}, {"r": 2, "t": "Only 5 tiny cheap plasticky sticks for this price… I would say it’s overpriced.  It didn’t catch some fungus gnats, but the glue doesn’t seem ultra strong.", "tags": ["plants_gnats", "price_value", "price_high"]}, {"r": 2, "t": "Pour l’instant, aucun moucheron ne s’est collé dessus !", "tags": []}, {"r": 2, "t": "aucun moucheron ne se colle dessus", "tags": []}, {"r": 2, "t": "Unhappy", "tags": ["efficacy_fails"]}, {"r": 2, "t": "Load of crap didn’t do nothing", "tags": []}, {"r": 2, "t": "not very effective", "tags": ["efficacy_works"]}, {"r": 2, "t": "Flies ignore these, not fit for purpose", "tags": ["efficacy_fails"]}, {"r": 2, "t": "Ça fonctionne pas", "tags": []}, {"r": 2, "t": "Didn't do the job", "tags": []}, {"r": 2, "t": "Aucun  moucherons attirés  par cette appareil", "tags": []}, {"r": 2, "t": "Pas efficace du tout", "tags": []}, {"r": 2, "t": "The sticky is not sticky enough. The fruit flies land on it and then fly off", "tags": ["not_sticky", "fruit_flies"]}, {"r": 2, "t": "2 star because its misleading advertising. This is simply sticky plastic.", "tags": []}, {"r": 5, "t": "Gern wieder", "tags": ["repeat"]}, {"r": 4, "t": "Es hilft, ich finde die Sticker nur etwas groß im Topf.", "tags": ["efficacy_works", "size_issue"]}, {"r": 5, "t": "Blumenstick", "tags": ["efficacy_works"]}, {"r": 5, "t": "Die gelben Klebesticker funktionieren sehr gut, auch sehr kleine Fliegen bleiben haften. Ebenfalls die Verwendung einzelner, in den verschiedenen Formen, ist sehr gut. Ich hoffe zwar, dass die Nutzung der Sticker nicht notwendig ist, aber wenn dann volle Empfehlung", "tags": ["efficacy_works", "very_sticky", "aesthetic"]}, {"r": 5, "t": "Sind ok.", "tags": []}, {"r": 4, "t": "Gern wieder👍", "tags": ["repeat"]}, {"r": 5, "t": "Gut", "tags": ["efficacy_works"]}, {"r": 1, "t": "Leider ohne Erfolg. Die kleine Rhododendronzikade landet und fliegt wieder weg. Auch sonst keine Viecher an den Tafeln. Ein Versuch war es Wert abet Ergebnis ist gleich Null.", "tags": ["efficacy_works"]}, {"r": 1, "t": "Ich habe mir dieses Produkt gekauft weil es gegen die weiße Fliege sein soll. Bei mir hat es nicht geholfen, habe meine Orchideen vorher umgetopft und danach diese Sticker in den Topf gesteckt. Nach wie vor habe ich das Problem mit der weißen Fliege.", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 2, "t": "leider nicht gut 👎", "tags": ["efficacy_works"]}, {"r": 1, "t": "Habe die Fallen gekauft um unseren Rhododendron vor Zikaden zu schützen. Ich konnte leider live beobachten, wie die Zikaden auf die Fallen und wieder runterspringen. Der Klebstoff ist mangelhaft, hält die Tiere nicht fest.", "tags": []}, {"r": 5, "t": "Funktionierte wie erwartet sehr verlässlich. Konnten damit den massiven Schädlingsbefall (bei uns Graurüssler)  innerhalb von zwei Wochen stark eindämmen da die adulden Tiere vor der Fortpflanzung gefangen werden. Es benötigt aber viele Tafeln. Wir haben ca. 4x40 benötigt.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Works well. And the adhesive lasts long even when you have them for outside plants", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 5, "t": "Die Gelbsticker kann man sowohl in die Blumenerde stecken als auch Dank der Lochungen aufhängen. Größe und Klebekraft ist gut.", "tags": ["efficacy_works", "size_issue"]}, {"r": 1, "t": "Für Einsatz im Garten nicht geeignet.Junge Vögel bleiben an den Tafeln kleben-Vorsicht!", "tags": []}, {"r": 5, "t": "Fängt alles ein was vorallem auf gelb steht oder fliegt..haben wir in fast jeder Pflanze zu stecken, können wir weiter empfehlen", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 5, "t": "Sind wertvolle Sticker habe in allen Blumentöpfe", "tags": ["plants_gnats"]}, {"r": 5, "t": "Wie erwartet super und ich finde die Motive toll", "tags": ["efficacy_works"]}, {"r": 5, "t": "Meine Tomate ist gerettet", "tags": []}, {"r": 5, "t": "Zuverlässig und prakrisch für den Haushalt einsetzbar", "tags": ["efficacy_works", "ease"]}, {"r": 5, "t": "Tun was sie sollen, sehen zwischen dem Gemüse gut aus. Kleben richtig gut.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Sehr gut", "tags": ["efficacy_works"]}, {"r": 5, "t": "Es funktioniert einwandfrei.  Aber  der papierschutz klebt sehr fest.", "tags": ["efficacy_works", "price_value"]}, {"r": 5, "t": "Schnell und gut", "tags": ["efficacy_works"]}, {"r": 5, "t": "Sehr wirksam", "tags": ["efficacy_works"]}, {"r": 3, "t": "Extrem dünn und deshalb schwierig gerade, bzw überhaupt in die Erde zu bekommen. Immerhin funktionieren sie aber anscheinend. Nach nichtmal 10 Sekunden waren die ersten 4 Fliegen dran.", "tags": []}, {"r": 5, "t": "Funktioniert!!!", "tags": ["efficacy_works"]}, {"r": 5, "t": "Einfach in der Anwendung, hübsch und effektiv", "tags": ["ease", "aesthetic"]}, {"r": 4, "t": "Für die Wirkung kann ich 5 Sterne vergeben. 1 Stern Abzug, weil sich das Schutzpapier nicht so schön entfernen läßt.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Für wenig Geld", "tags": []}, {"r": 4, "t": "Schnelle Lieferung", "tags": ["price_value"]}, {"r": 4, "t": "Machen was sie machen sollen. Lockt die kleinen Fliegen an und diese bleiben kleben. Damit wird das Problem aber nur gemindert und nicht gelöst, weil immer wieder , aus dem Gelege, neue Fliegen nachkommen.", "tags": ["very_sticky", "repeat"]}, {"r": 5, "t": "Fruchtfliegen und andere kleine Insekten, die sich häufig in oder auf Blumenerde befinden werden angelockt und haften auf dem Gelbsticker: sehr effektiv! Preis ist für diese Menge sehr gut! Empfehlenswert!", "tags": ["efficacy_works", "fruit_flies"]}, {"r": 5, "t": "Oberflächlich super", "tags": ["efficacy_works"]}, {"r": 5, "t": "Past", "tags": []}, {"r": 5, "t": "Schnell und zuverlässig geliefert", "tags": ["efficacy_works"]}, {"r": 4, "t": "allerdings werde ich sie nicht mehr benutzen, seit ich neben den unerwünschten Kleininsekten auch eine junge Biene daran kleben hatte. Dann bringe ich es nicht mehr übers Herz. Denn ich habe sie auf dem Balkon verwendet. Im Zimmer sind sie vorbehaltlos zu empfehlen", "tags": ["efficacy_works"]}, {"r": 4, "t": "Sehr hilfreich", "tags": []}, {"r": 5, "t": "Perfekt! Endlich habe meine Pflanzen geschützt", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 5, "t": "Wie beschrieben", "tags": ["efficacy_works"]}, {"r": 5, "t": "Ist für die erhofften Zwecke sehr gut", "tags": ["efficacy_works"]}, {"r": 5, "t": "Produkt ist perfekt,sehr praktisch.", "tags": ["efficacy_works", "ease"]}, {"r": 5, "t": "Bin sehr zufrieden!!!!", "tags": ["efficacy_works"]}, {"r": 5, "t": "Schön das es nicht nur die einfachen gelben Karten gibt. Die Blumentöpfe sehen freundlicher aus Die Qualität ist sehr gut und erfüllt voll seinen Zweck.", "tags": ["efficacy_works", "plants_gnats", "ease"]}, {"r": 5, "t": "Artikel genau wie beschrieben. Gute Klebekraft der Sticker, funktioniert einwandfrei. Schneller und einwandfreier Versand.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Genauso effektiv wie die teuren Marken-Gelbsticker. Die Packung war etwas zerdrückt bei der Lieferung, und sie wirkten nicht wie \"neu vom Band\", aber ihren Zweck erfüllen sie komplett.", "tags": ["efficacy_works"]}, {"r": 5, "t": "Machen was sie sollen.", "tags": []}, {"r": 5, "t": "alles bestens", "tags": []}, {"r": 5, "t": "Sehr erfolgreich! Streichhölzer in die Erde + Drei Sticker Seit zwei Wochen Ruhe", "tags": []}, {"r": 5, "t": "jederzeit wieder", "tags": ["efficacy_works"]}, {"r": 5, "t": "Sehr wirksam", "tags": []}, {"r": 5 iert. Bei einigen Figuren lässt sich die Schutzfolie etwas schweren abziehen, wegen der kleinen Formen, ist aber auch keine Hürde und es sieht schön aus, im Gegensatz zu einfachen Gelbtafeln.", "tags": ["efficacy_works", "ease", "aesthetic"]}, {"r": 1, "t": "Die Lieferung erfolgte schnell. Das Paket hatte oben eine kleine Delle aber da die Gelbsticker in einer separaten Folie verpackt und die Klebeseiten geschützt waren sollte es eher an der Qualität des Klebers liegen. Die halten nicht mal an der Wand meines Gewächshauses, wie sollen dann da Fliegen drauf haften. Leider ein Fehlkauf.", "tags": ["efficacy_works"]}, {"r": 4, "t": "Die Klebefänger tun was sie sollen, allerdings nicht so schnel wie gewünscht. Die kleinen Mücken ignorieren sie tagelang bevor sie auf den Leim gehen. Ich mit Lockstoffen getränkt hätte man mehr Erfolg. NA gut, nach zwei Wochen kleben einige Insekten fest, übrige Mücken sind inzwischen wohl anderen Tod gegangen.", "tags": ["efficacy_works"]}, {"r": 4, "t": "Sehr effektiv gegen Trauermücken", "tags": ["efficacy_works", "plants_gnats"]}, {"r": 4, "t": "Gut für Blumenmücken fangen geeignet. Essigmücken halt weniger.", "tags": ["efficacy_works"]}, {"r": 4, "t": "Die Teile funktionieren gut. Alle Klebeteile im Haus haben ordentlich Fruchtfliegen eingefangen, aber die Plage verschwindet dadurch nicht. Irgendwie sind trotzdem immer noch ziemlich viele der Fruchtfliegen vorhanden, viele von denen ignorieren auch die gelben Sticker. Irgendwie nützlich ist es schon, aber der gewünschte Effekt dass die Fruchtfliegen irgendwann komplett verschwinden ist doch nicht da. Aber die Plage wird dadurch wahrscheinlich in Grenzen gehalten.", "tags": ["efficacy_works", "fruit_flies"]}, {"r": 4, "t": "Die Gelbsticker kleben sehr stark, weshalb man aufpassen muss, dass keine Blätter der Pflanzen daran hängenbleiben, da sie sonst abreißen könnten. Das Entfernen der Schutzfolie ist ziemlich fummelig, da sie bei Modellen mit vielen Ecken und Kurven schnell reißt und ise etwas schwierig. Ich nehme an, der Kleber ist bei einigen Stickern etwas fest oder schon am Aushärten. Trauermücken habe ich indoor - obwohl vorhanden - damit nicht eine einzige gefangen, wohl aber andere winzige Bodenbewohner, deren Art ich nicht kenne.  Zur Anwendung kamen die Gelbsticker stehend im Erdboden oder (mit besserem Ergebnis) auf der", "tags": ["efficacy_works", "plants_gnats", "ease"]}, {"r": 4, "t": "Die Sticker fangen sehr gut die Schädlinge. Das Abziehen der Schutzfolie ist nicht immer einfach. Manchmal reißt die Folie und dann kleben die Finger.", "tags": ["efficacy_works", "ease"]}, {"r": 3, "t": "Gleich 30 Gelbsticker in drei verschiedenen Formen, Vogel, Schmetterling und Blume, sind in dem kleinen Karton. Allerdings ist der Einsatz schwierig. Der Stecker, der in die Erde gesteckt wird, ist sehr weich und lässt sich nur schwer hineindrücken. Das Schutzpapier lässt sich auch nur sehr schwer abziehen. Immer nur fetzenweise und wenn man dann neu ansetzt, fasst man auf die Klebefläche. Und der Klebstoff ist stark!  Die Bewertung ist von der Teilnahme am Vine-Pogramm unbeeinflusst und eine ganz persönliche Meinung  Vielen Dank für die Bereitstellung", "tags": ["efficacy_works"]}, {"r": 3, "t": "super", "tags": ["efficacy_works"]}, {"r": 4, "t": "Die Trauermücken fliegen drauf. Bei leichtem Befall absolut hilfreich gegen die nervenden Viecher. Einziger Verbesserungsvorschlag: könnten eine etwas größere Fläche haben.", "tags": ["efficacy_works", "plants_gnats", "size_issue"]}, {"r": 4, "t": "Die Packung enthält großzügige 30 Stück, was für eine effektive Kontrolle der Insektenpopulation in meinen Zimmerpflanzen mehr als ausreichend ist.  Die Gelbsticker sind einfach anzubringen und ihre klebrige Oberfläche fängt sofort die lästigen Trauermücken ein. Ich habe bemerkt, dass die Anzahl der Insekten in meinen Pflanzen seit der Verwendung dieser Gelbsticker drastisch gesunken ist. Die Fänger sind sowohl für den Innen- als auch für den Außenbereich geeignet, was ihre Vielseitigkeit noch erhöht.  Ein weiterer positiver Aspekt ist, dass sie wasserdicht und ungiftig sind, was mir ein zusät", "tags": ["efficacy_works", "plants_gnats", "ease", "fast_result"]}]};
function renderReviewsSticky(D, root){

  
  
  if (!D) { root.innerHTML = '<div class="card"><p style="color:#64748b;font-size:.85rem">Brak danych VOC dla tego rynku.</p></div>'; return; }

  // ─── inline helpers (self-contained) ───────────────────────────────────
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function fmtInt(n) { return Math.round(+n || 0).toLocaleString('en-US'); }
  function fmtMoney(n) { return (D.currency || '') + Math.round(+n || 0).toLocaleString('en-US'); }
  function fmtMoneyShort(n) {
    n = Math.round(+n || 0); var cur = D.currency || '';
    if (n >= 1e6) return cur + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return cur + (n / 1e3).toFixed(0) + 'K';
    return cur + n;
  }
  function fmtShort(n) {
    n = Math.round(+n || 0);
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return String(n);
  }
  function pct(v, t) { return (t > 0) ? ((v / t) * 100).toFixed(1) + '%' : '0%'; }
  function bw(pctStr, maxPct) { var v = parseFloat(pctStr); return Math.round(v / maxPct * 100) + '%'; }

  var BRAND_PALETTE = D.brandPalette || ['#2563eb','#dc2626','#16a34a','#f59e0b','#8b5cf6','#0891b2','#db2777','#65a30d'];
  function brandColor(name, i) {
    if (typeof name === 'string' && name.indexOf('Other (') === 0) return '#94a3b8';
    return BRAND_PALETTE[i % BRAND_PALETTE.length];
  }

  // ─── Sortable tables ───────────────────────────────────────────────────
  function parseSortValue(td) {
    if (td.dataset && td.dataset.val != null && td.dataset.val !== '') {
      var n = parseFloat(td.dataset.val);
      if (!isNaN(n)) return n;
    }
    var txt = (td.textContent || '').trim();
    var cleaned = txt.replace(/[\s, €$£%]/g, '').replace(/·/g, '');
    if (cleaned !== '' && !isNaN(parseFloat(cleaned))) return parseFloat(cleaned);
    return txt.toLowerCase();
  }
  function sortTableByColumn(table, colIdx, dir) {
    var tbody = table.tBodies[0]; if (!tbody) return;
    var rows = Array.prototype.slice.call(tbody.rows);
    rows.sort(function(a, b) {
      var va = parseSortValue(a.cells[colIdx]);
      var vb = parseSortValue(b.cells[colIdx]);
      if (va < vb) return dir === 'asc' ? -1 : 1;
      if (va > vb) return dir === 'asc' ? 1 : -1;
      return 0;
    });
    rows.forEach(function(r) { tbody.appendChild(r); });
  }
  function makeAllTablesSortable() {
    var tables = root.querySelectorAll('table');
    tables.forEach(function(table) {
      var ths = table.tHead ? table.tHead.rows[0].cells : table.rows[0].cells;
      Array.prototype.forEach.call(ths, function(th, idx) {
        if (th.dataset.sortable === '1') return;
        th.dataset.sortable = '1';
        th.style.cursor = 'pointer';
        th.style.userSelect = 'none';
        th.dataset.sortDir = '';
        var arrow = document.createElement('span');
        arrow.className = 'sort-arrow';
        arrow.style.cssText = 'margin-left:6px;opacity:.6;font-size:1.5em;color:#0f172a;vertical-align:middle;line-height:1';
        arrow.textContent = '▴▾';
        th.appendChild(arrow);
        th.addEventListener('click', function() {
          var dir = th.dataset.sortDir === 'asc' ? 'desc' : 'asc';
          Array.prototype.forEach.call(ths, function(other) {
            other.dataset.sortDir = '';
            var a = other.querySelector('.sort-arrow');
            if (a) { a.textContent = '▴▾'; a.style.opacity = '.6'; }
          });
          th.dataset.sortDir = dir;
          arrow.textContent = dir === 'asc' ? '▴' : '▾';
          arrow.style.opacity = '1';
          sortTableByColumn(table, idx, dir);
        });
      });
    });
  }

  var _charts = [];

  // Pie helper · legend SORTED BY VALUE DESC, "Other (…)" pinned last ────
  function pie(canvasId, labels, data, colors, moneyFmt) {
    var el = document.getElementById(canvasId);
    if (!el) return;
    var idx = labels.map(function(_, i){ return i; });
    idx.sort(function(a, b){
      var la = labels[a], lb = labels[b];

      var ob = typeof lb === 'string' && lb.indexOf('Other (') === 0;
      if (oa && !ob) return 1;
      if (ob && !oa) return -1;
      return (+data[b] || 0) - (+data[a] || 0);
    });
    var sLabels = idx.map(function(i){ return labels[i]; });
    var sData   = idx.map(function(i){ return data[i]; });
    var sColors = idx.map(function(i){ return colors[i]; });
    var total = sData.reduce(function(a,b){return a+(+b||0);}, 0);
    var ctx = el.getContext('2d');
    var chart = new Chart(ctx, {

      data: { labels: sLabels, datasets: [{ data: sData, backgroundColor: sColors, borderWidth: 2, borderColor: '#fff' }] },
      options: {
        responsive: true, maintainAspectRatio: false,

              });

          datalabels: { color: '#fff', font: { size: 11, weight: 'bold' }, formatter: function(v) { var p = total > 0 ? (v/total*100) : 0; return p >= 5 ? p.toFixed(0) + '%' : ''; } }
        }
      },
      plugins: window.ChartDataLabels ? [ChartDataLabels] : []
    });

  }

  // ─── Empty-state guard ────────────────────────────────────────────────

      '<p style="color:#64748b;font-size:.85rem;line-height:1.6">Brak danych recenzji' + (countryName || segment ? ' for <strong>' + esc(countryName) + (segment ? ' · ' + esc(segment) : '') + '</strong>' : '') + '.</p></div>';
    return;
  }

  // ─── Render ────────────────────────────────────────────────────────────

  var pos = (D.starDist[3] || 0) + (D.starDist[4] || 0);

  var posPct = (pos / total * 100).toFixed(1);

  h += '<div class="kpis" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px">';

  h += '<div class="kpi"><div class="kpi-v">' + (D.avgRating ? (+D.avgRating).toFixed(2) + ' ★' : '-') + '</div><div class="kpi-l">Średnia ocena (próbka)</div></div>';
  h += '<div class="kpi"><div class="kpi-v">' + ratio + ' : 1</div><div class="kpi-l">Sentyment (poz:neg)</div></div>';
  h += '<div class="kpi"><div class="kpi-v" style="color:#16a34a">' + posPct + '%</div><div class="kpi-l">Pozytywne (4★+5★)</div></div>';

  // Sub-tab bar

  h += '<div class="sec-header"><div class="sec-title">Scenariusz użycia</div></div>';
  h += '<div class="card" style="padding:0;overflow:hidden"><table class="us-table"><thead><tr><th style="width:22%">Scenariusz użycia</th><th>Powód</th><th style="width:140px;text-align:right">Udział %</th></tr></thead><tbody>';
  if (D.usageScenarios && D.usageScenarios.length) {
    var usMax = parseFloat(D.usageScenarios[0].pct);
    D.usageScenarios.forEach(function(s) {
      h += '<tr><td class="us-label">' + s.label + '</td><td class="us-reason">' + s.reason + '</td>';
      h += '<td class="us-pct" data-val="' + parseFloat(s.pct) + '"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(s.pct, usMax) + '"></div></div><span>' + s.pct + '</span></td></tr>';
    });
  }
  h += '</tbody></table></div></div>';

  // Customer Sentiment
  h += '<div id="urv-sec-cs" style="margin-top:36px">';
  h += '<div class="sec-header"><div class="sec-title">Sentyment klientów</div></div>';
  if (D.csSummary) h += '<div class="sec-summary">' + D.csSummary + '</div>';
  h += '<div class="cs-neg-zone">';
  h += '<div class="card" style="padding:0;overflow:hidden;border:1.5px solid #fecaca"><table class="us-table"><thead><tr style="background:#fef2f2"><th style="width:22%;border-left:3px solid #dc2626">Temat negatywnej opinii</th><th>Powody negatywnej opinii</th><th style="width:140px;text-align:right">Udział %</th></tr></thead><tbody id="urvNegBody"></tbody></table></div>';
  h += '<div class="card" style="margin-top:22px;border:1.5px solid #fca5a5"><div class="sec-header" style="margin-bottom:10px"><div class="sec-title">Wnioski z negatywnych recenzji · Strategia</div></div>';
  h += '<table class="si-table"><thead><tr><th style="width:130px">Typ analizy</th><th>Ustalenie (z recenzji 1★+2★)</th><th>Implikacja strategiczna</th></tr></thead><tbody id="urvNegInsights"></tbody></table></div>';
  h += '</div>';
  h += '<div class="cs-pos-zone">';
  h += '<div class="card" style="padding:0;overflow:hidden;border:1.5px solid #bbf7d0"><table class="us-table"><thead><tr style="background:#f0fdf4"><th style="width:22%;border-left:3px solid #16a34a">Temat pozytywnej opinii</th><th>Powody pozytywnej opinii</th><th style="width:140px;text-align:right">Udział %</th></tr></thead><tbody id="urvPosBody"></tbody></table></div>';
  h += '<div class="card" style="margin-top:22px"><div class="sec-header" style="margin-bottom:10px"><div class="sec-title">Wnioski z pozytywnych recenzji · Strategia</div></div>';
  h += '<table class="si-table"><thead><tr><th style="width:130px">Typ analizy</th><th>Ustalenie (z recenzji 4★+5★)</th><th>Implikacja strategiczna</th></tr></thead><tbody id="urvPosInsights"></tbody></table></div>';
  h += '</div>';
  h += '</div>';

  // Buyers Motivation
  h += '<div id="urv-sec-bm" style="margin-top:36px">';
  h += '<div class="sec-header"><div class="sec-title">Motywacja kupujących</div></div>';
  h += '<div class="card" style="padding:0;overflow:hidden"><table class="us-table"><thead><tr><th style="width:22%">Motywacja kupujących</th><th>Powód</th><th style="width:140px;text-align:right">Udział %</th></tr></thead><tbody>';
  if (D.buyersMotivation && D.buyersMotivation.length) {
    var bmMax = parseFloat(D.buyersMotivation[0].pct);
    D.buyersMotivation.forEach(function(m) {
      h += '<tr><td class="us-label">' + m.label + '</td><td class="us-reason">' + m.reason + '</td>';
      h += '<td class="us-pct" data-val="' + parseFloat(m.pct) + '"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(m.pct, bmMax) + '"></div></div><span>' + m.pct + '</span></td></tr>';
    });
  }
  h += '</tbody></table></div></div>';

  // Customer Expectations
  h += '<div id="urv-sec-ce" style="margin-top:36px">';
  h += '<div class="sec-header"><div class="sec-title">Oczekiwania klientów</div></div>';
  h += '<div class="card" style="padding:0;overflow:hidden"><table class="us-table"><thead><tr><th style="width:22%">Niezaspokojona potrzeba</th><th>Powód</th><th style="width:140px;text-align:right">Udział %</th></tr></thead><tbody>';
  if (D.customerExpectations && D.customerExpectations.length) {
    var ceMax = parseFloat(D.customerExpectations[0].pct);
    D.customerExpectations.forEach(function(e) {
      h += '<tr><td class="us-label">' + e.label + '</td><td class="us-reason">' + e.reason + '</td>';
      h += '<td class="us-pct" data-val="' + parseFloat(e.pct) + '"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(e.pct, ceMax) + '"></div></div><span>' + e.pct + '</span></td></tr>';
    });
  }
  h += '</tbody></table></div></div>';

  h += '</div>'; // end urv-ci

  // ── SUB-PANEL: Review Browser ──
  h += '<div id="urv-ca" class="voc-sub-panel">';
  h += '<div class="card"><h3>Przeglądarka recenzji <span style="font-size:.72rem;font-weight:400;color:#64748b;margin-left:8px">Filtruj wg oceny, tematu lub słowa kluczowego</span></h3>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
  h += '<select id="urvFilterRating" style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 8px;background:#fff"><option value="">Wszystkie oceny</option><option value="1">1★</option><option value="2">2★</option><option value="3">3★</option><option value="4">4★</option><option value="5">5★</option></select>';
  h += '<select id="urvFilterTheme" style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 8px;background:#fff"></select>';
  h += '<input id="urvFilterSearch" placeholder="Szukaj słowa kluczowego..." style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 8px;width:160px">';
  h += '<button id="urvClearBtn" style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 10px;background:#f8fafc;cursor:pointer">Wyczyść</button>';
  h += '</div>';
  h += '<div id="urvResultCount" style="font-size:.72rem;color:#64748b;margin-bottom:6px"></div>';
  h += '<div class="tbl-wrap" style="max-height:520px"><table><thead><tr><th style="width:40px">★</th><th>Review</th></tr></thead><tbody id="urvReviewBody"></tbody></table></div>';
  h += '</div></div>';

  root.innerHTML = h;

  // ─── Wiring ────────────────────────────────────────────────────────────
  if (window.Chart && window.ChartDataLabels) { try { Chart.register(ChartDataLabels); } catch(e){} }

  // Sub-tab switching
  root.querySelectorAll('.voc-sub-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      root.querySelectorAll('.voc-sub-tab').forEach(function(t) { t.classList.remove('active'); });
      root.querySelectorAll('.voc-sub-panel').forEach(function(p) { p.classList.remove('active'); });
      tab.classList.add('active');
      var panel = document.getElementById(tab.dataset.panel);
      if (panel) panel.classList.add('active');
      if (window.Chart && Chart.instances) Object.values(Chart.instances).forEach(function(c) { c.resize(); });
    });
  });

  // Anchor scroll
  root.querySelectorAll('.voc-anchor-nav a').forEach(function(a) {
    a.addEventListener('click', function(e) {
      e.preventDefault();
      var target = document.getElementById(a.dataset.target);
      if (target) {
        var y = target.getBoundingClientRect().top + window.pageYOffset - 90;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
      root.querySelectorAll('.voc-anchor-nav a').forEach(function(x) { x.classList.remove('active'); });
      a.classList.add('active');
    });
  });

  // Customer Profile stacked bars
  function makeStackedBar(canvasId, dataObj) {
    var ctx = document.getElementById(canvasId);
    if (!ctx || !dataObj) return;
    var chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: dataObj.labels,
        datasets: [
          { label: '4-5 stars', data: dataObj.pos, backgroundColor: '#22c55e', borderRadius: { topLeft: 3, topRight: 3 }, barPercentage: 0.7 },
          { label: '1-3 stars', data: dataObj.neg.map(function(v) { return -v; }), backgroundColor: '#ef4444', borderRadius: { bottomLeft: 3, bottomRight: 3 }, barPercentage: 0.7 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, datalabels: { display: false },
          tooltip: { callbacks: { label: function(c) { return c.dataset.label + ': ' + Math.abs(c.raw); } } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#64748b', maxRotation: 35 } },
          y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 }, color: '#94a3b8', callback: function(v) { return Math.abs(v); } } }
        }
      }
    });
    _charts.push(chart);
  }
  if (D.cpWho)   makeStackedBar('urvCpWho',   D.cpWho);
  if (D.cpWhen)  makeStackedBar('urvCpWhen',  D.cpWhen);
  if (D.cpWhere) makeStackedBar('urvCpWhere', D.cpWhere);
  if (D.cpWhat)  makeStackedBar('urvCpWhat',  D.cpWhat);

  // Negative topics (expandable rows)
  if (D.negativeTopics && D.negativeTopics.length) {
    var negMax = parseFloat(D.negativeTopics[0].pct);
    var negHtml = '';
    D.negativeTopics.forEach(function(t) {
      var bullets = (t.bullets || []).map(function(b) { return '<li>' + b + '</li>'; }).join('');
      var quotes = (t.quotes || []).map(function(q) { return '<p>' + q + '</p>'; }).join('');
      negHtml += '<tr class="nf-row" style="cursor:pointer"><td class="us-label"><span class="nf-arrow">▶</span> ' + t.label + '</td>';
      negHtml += '<td class="us-reason">' + t.reason + '</td>';
      negHtml += '<td class="us-pct" data-val="' + parseFloat(t.pct) + '"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(t.pct, negMax) + ';background:#fca5a5"></div></div><span>' + t.pct + '</span></td></tr>';
      var foundIn = t.foundIn ? '<p style="margin:0 0 8px;font-weight:700;color:#991b1b;font-size:.78rem">' + esc(t.foundIn) + '</p>' : '';
      negHtml += '<tr class="nf-detail"><td colspan="3"><div class="nf-body">' + foundIn + '<ul>' + bullets + '</ul><div class="nf-quotes">' + quotes + '</div></div></td></tr>';
    });
    document.getElementById('urvNegBody').innerHTML = negHtml;
  }
  if (D.negativeInsights) {
    document.getElementById('urvNegInsights').innerHTML = D.negativeInsights.map(function(i) {
      return '<tr><td><span class="si-badge" style="background:' + i.badgeBg + ';color:' + i.badgeColor + '">' + i.type + '</span></td><td>' + i.finding + '</td><td>' + i.implication + '</td></tr>';
    }).join('');
  }

  // Positive topics
  if (D.positiveTopics && D.positiveTopics.length) {
    var posMax = parseFloat(D.positiveTopics[0].pct);
    var posHtml = '';
    D.positiveTopics.forEach(function(t) {
      var bullets = (t.bullets || []).map(function(b) { return '<li>' + b + '</li>'; }).join('');
      var quotes = (t.quotes || []).map(function(q) { return '<p>' + q + '</p>'; }).join('');
      posHtml += '<tr class="pf-row" style="cursor:pointer"><td class="us-label"><span class="pf-arrow">▶</span> ' + t.label + '</td>';
      posHtml += '<td class="us-reason">' + t.reason + '</td>';
      posHtml += '<td class="us-pct" data-val="' + parseFloat(t.pct) + '"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(t.pct, posMax) + ';background:#86efac"></div></div><span>' + t.pct + '</span></td></tr>';
      var pFound = t.foundIn ? '<p style="margin:0 0 8px;font-weight:700;color:#166534;font-size:.78rem">' + esc(t.foundIn) + '</p>' : '';
      posHtml += '<tr class="pf-detail"><td colspan="3"><div class="pf-body">' + pFound + '<ul>' + bullets + '</ul><div class="pf-quotes">' + quotes + '</div></div></td></tr>';
    });
    document.getElementById('urvPosBody').innerHTML = posHtml;
  }
  if (D.positiveInsights) {
    document.getElementById('urvPosInsights').innerHTML = D.positiveInsights.map(function(i) {
      return '<tr><td><span class="si-badge" style="background:' + i.badgeBg + ';color:' + i.badgeColor + '">' + i.type + '</span></td><td>' + i.finding + '</td><td>' + i.implication + '</td></tr>';
    }).join('');
  }

  // Toggle expandable rows
  root.querySelectorAll('.nf-row').forEach(function(row) {
    row.addEventListener('click', function() {
      var detail = row.nextElementSibling;
      var isOpen = row.classList.contains('open');
      root.querySelectorAll('.nf-row.open').forEach(function(r) { r.classList.remove('open'); r.nextElementSibling.classList.remove('open'); });
      if (!isOpen) { row.classList.add('open'); detail.classList.add('open'); }
    });
  });
  root.querySelectorAll('.pf-row').forEach(function(row) {
    row.addEventListener('click', function() {
      var detail = row.nextElementSibling;
      var isOpen = row.classList.contains('open');
      root.querySelectorAll('.pf-row.open').forEach(function(r) { r.classList.remove('open'); r.nextElementSibling.classList.remove('open'); });
      if (!isOpen) { row.classList.add('open'); detail.classList.add('open'); }
    });
  });

  // Review Browser
  if (D.themeFilters) {
    document.getElementById('urvFilterTheme').innerHTML = '<option value="">Wszystkie tematy</option>' + D.themeFilters.map(function(f) {
      return '<option value="' + f.value + '">' + f.label + '</option>';
    }).join('');
  }

  var reviews = D.reviews || [];

  function urvFilter() {
    var rating = document.getElementById('urvFilterRating').value;
    var theme  = document.getElementById('urvFilterTheme').value;
    var search = (document.getElementById('urvFilterSearch').value || '').toLowerCase();
    var filtered = reviews.filter(function(r) {
      if (rating && r.r != rating) return false;
      if (theme && (r.tags || []).indexOf(theme) === -1) return false;
      if (search && (r.t || '').toLowerCase().indexOf(search) === -1) return false;
      return true;
    });
    document.getElementById('urvResultCount').textContent = 'Wyświetlono ' + filtered.length + ' z ' + reviews.length + ' recenzji';
    var html = '';
    var limit = Math.min(filtered.length, 1000);
    for (var i = 0; i < limit; i++) {
      var r = filtered[i];
      var starHtml = '<span style="color:' + STAR_COLORS[r.r] + ';font-weight:700">' + r.r + '★</span>';
      var tagsHtml = (r.tags || []).map(function(t) {
        return '<span class="pill ' + ((D.tagStyles && D.tagStyles[t]) || 'pill-blue') + '">' + t.replace(/_/g, ' ') + '</span>';
      }).join('');
      html += '<tr><td>' + starHtml + '</td><td><div class="review-text">' + (r.t || '').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>' +
        (tagsHtml ? '<div style="margin-top:4px">' + tagsHtml + '</div>' : '') + '</td></tr>';
    }
    if (filtered.length > 1000) html += '<tr><td colspan="2" style="text-align:center;color:#64748b;font-size:.72rem;padding:12px">Pierwsze 1000 z ' + filtered.length + '. Użyj filtrów/wyszukiwarki, aby dotrzeć do pozostałych.</td></tr>';
    document.getElementById('urvReviewBody').innerHTML = html;
  }
  document.getElementById('urvFilterRating').addEventListener('change', urvFilter);
  document.getElementById('urvFilterTheme').addEventListener('change', urvFilter);
  document.getElementById('urvFilterSearch').addEventListener('input', urvFilter);
  document.getElementById('urvClearBtn').addEventListener('click', function() {
    document.getElementById('urvFilterRating').value = '';
    document.getElementById('urvFilterTheme').value = '';
    document.getElementById('urvFilterSearch').value = '';
    urvFilter();
  });
  urvFilter();

  // ─── Polish ────────────────────────────────────────────────────────────
  makeAllTablesSortable();

}
window.__vocStickyRender = function(){ renderReviewsSticky(VOC_DATA_STICKY, document.getElementById("u-reviews-voc-sticky-root")); };
</script>
