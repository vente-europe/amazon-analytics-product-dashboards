  }

  // ─── Render ────────────────────────────────────────────────────────────
  var STAR_COLORS = { 1: '#dc2626', 2: '#ea580c', 3: '#f59e0b', 4: '#22c55e', 5: '#16a34a' };
  var h = '';

  // KPI row
  var total = D.totalReviews;
  var segLower = segment ? esc(segment.toLowerCase()) : '';
  var analyzed = (D.reviews || []).length;
  var tld = D.countryTld || (countryCode ? countryCode.toLowerCase() : '');

  h += '<h2 style="margin-bottom:6px">Recenzje (VOC)' + (countryName ? ' · ' + esc(countryName) : '') + '</h2>';
  h += '<p style="margin:0 0 14px;color:#64748b;font-size:.78rem">Ocena i liczba recenzji pochodzą z danych X-Ray (Amazon). Analiza jakościowa (motywy, cytaty) na podstawie <b>' + analyzed.toLocaleString() + '</b> recenzji zebranych z najlepszych produktów' + (tld ? ' na amazon.' + esc(tld) : '') + '.</p>';
  h += '<div class="kpis" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px">';
  h += '<div class="kpi"><div class="kpi-v">' + (D.avgRating ? (+D.avgRating).toFixed(1) + ' ★' : '-') + '</div><div class="kpi-l">Średnia ocena (X-Ray)</div></div>';
  h += '<div class="kpi"><div class="kpi-v">' + analyzed.toLocaleString() + '</div><div class="kpi-l">Analizowane recenzje</div></div>';
  h += (D.productCount ? '<div class="kpi"><div class="kpi-v">' + D.productCount + '</div><div class="kpi-l">Produkty (X-Ray)</div></div>' : '');
  h += '</div>';

  // Rozkład gwiazdek Bar - rozkład ze scrape'u (197 recenzji, próbka krytyczna vs X-Ray)
  var dist = D.starDist;
  var sc = dist.reduce(function(a,b){return a+b;},0) || 1;
  var scAvg = dist.reduce(function(a,c,i){return a+c*(i+1);},0)/sc;
  h += '<div class="card" style="padding:12px 16px;margin-bottom:20px">';
  h += '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">';
  h += '<div style="font-size:.78rem;font-weight:600;color:#475569;white-space:nowrap">Rozkład gwiazdek (próbka ' + sc + ')</div>';
  h += '<div style="font-size:1.1rem;font-weight:800;color:#0f2942">' + scAvg.toFixed(1) + ' <span style="font-size:.7rem;font-weight:400;color:#64748b">śr. próbki</span></div>';
  h += '<div style="flex:1;display:flex;height:22px;border-radius:4px;overflow:hidden;min-width:200px">';
  dist.forEach(function(count, i) {
    var p = (count / sc * 100).toFixed(1);
    h += '<div style="width:' + p + '%;background:' + STAR_COLORS[i+1] + ';display:flex;align-items:center;justify-content:center;color:#fff;font-size:.68rem;font-weight:600">' + (parseFloat(p) >= 5 ? p + '%' : '') + '</div>';
  });
  h += '</div>';
  h += '<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:.68rem;color:#475569">';
  dist.forEach(function(count, i) {
    h += '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + STAR_COLORS[i+1] + ';margin-right:3px"></span>' + (i+1) + '★ ' + count + '</span>';
  });
  h += '</div></div>';
  h += '<div style="font-size:.66rem;color:#94a3b8;margin-top:8px">Uwaga: to rozkład zebranej próbki (197), skośny krytycznie względem oceny X-Ray (' + (+D.avgRating).toFixed(1) + '★). Nagłówek używa oceny X-Ray jako reprezentatywnej dla całej populacji recenzji.</div></div>';

  // Sub-tab bar
  h += '<div class="voc-sub-tabs">';
  h += '<div class="voc-sub-tab active" data-panel="urv-ci">Wnioski o klientach</div>';
  h += '<div class="voc-sub-tab" data-panel="urv-ca">Przeglądarka recenzji</div>';
  h += '</div>';

  // ── SUB-PANEL: Customer Insights ──
  h += '<div id="urv-ci" class="voc-sub-panel active">';
  h += '<div class="voc-anchor-nav">';
  h += '<a href="#urv-sec-cp" class="active" data-target="urv-sec-cp">Profil klienta</a>';
  h += '<a href="#urv-sec-us" data-target="urv-sec-us">Scenariusz użycia</a>';
  h += '<a href="#urv-sec-cs" data-target="urv-sec-cs">Sentyment klientów</a>';
  h += '<a href="#urv-sec-bm" data-target="urv-sec-bm">Motywacja kupujących</a>';
  h += '<a href="#urv-sec-ce" data-target="urv-sec-ce">Oczekiwania klientów</a>';
  h += '</div>';

  // Customer Profile
  h += '<div id="urv-sec-cp">';
  h += '<div class="sec-header"><div class="sec-title">Profil klienta</div></div>';
  if (D.cpSummary) h += '<div class="sec-summary">' + D.cpSummary + '</div>';
  h += '<div class="cp-charts">';
  h += '<div class="cp-chart-box"><h4>Who</h4><div class="cp-chart-wrap"><canvas id="urvCpWho"></canvas></div></div>';
  h += '<div class="cp-chart-box"><h4>When</h4><div class="cp-chart-wrap"><canvas id="urvCpWhen"></canvas></div></div>';
  h += '<div class="cp-chart-box"><h4>Where</h4><div class="cp-chart-wrap"><canvas id="urvCpWhere"></canvas></div></div>';
  h += '<div class="cp-chart-box"><h4>What</h4><div class="cp-chart-wrap"><canvas id="urvCpWhat"></canvas></div></div>';
  h += '</div>';
  h += '<div class="cp-legend">■ recenzje 4-5 gwiazdek · <span style="color:#ef4444">■</span> recenzje 1-3 gwiazdek</div>';
  h += '</div>';

  // Usage Scenario
  h += '<div id="urv-sec-us" style="margin-top:36px">';
  h += '<div class="sec-header"><div class="sec-title">Scenariusz użycia</div></div>';
  h += '<div class="card" style="padding:0;overflow:hidden"><table class="us-table"><thead><tr><th style="width:22%">Scenariusz użycia</th><th>Powód</th><th style="width:140px;text-align:right">Udział %</th></tr></thead><tbody>';
  if (D.usageScenarios && D.usageScenarios.length) {
    var usMax = parseFloat(D.usageScenarios[0].pct);
    D.usageScenarios.forEach(function(s) {
      h += '<tr><td class="us-label">' + s.label + '</td><td class="us-reason">' + s.reason + '</td>';
      h += '<td class="us-pct" data-val="' + parseFloat(s.pct) + '"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(s.pct, usMax) + '"></div></div><span>' + s.pct + '</span></td></tr>';
    });
  }
  h += '</tbody></table></div></div>';

  // Customer Sentiment
  h += '<div id="urv-sec-cs" style="margin-top:36px">';
  h += '<div class="sec-header"><div class="sec-title">Sentyment klientów</div></div>';
  if (D.csSummary) h += '<div class="sec-summary">' + D.csSummary + '</div>';
  h += '<div class="cs-neg-zone">';
  h += '<div class="card" style="padding:0;overflow:hidden;border:1.5px solid #fecaca"><table class="us-table"><thead><tr style="background:#fef2f2"><th style="width:22%;border-left:3px solid #dc2626">Temat negatywnej opinii</th><th>Powody negatywnej opinii</th><th style="width:140px;text-align:right">Udział %</th></tr></thead><tbody id="urvNegBody"></tbody></table></div>';
  h += '<div class="card" style="margin-top:22px;border:1.5px solid #fca5a5"><div class="sec-header" style="margin-bottom:10px"><div class="sec-title">Wnioski z negatywnych recenzji · Strategia</div></div>';
  h += '<table class="si-table"><thead><tr><th style="width:130px">Typ analizy</th><th>Ustalenie (z recenzji 1★+2★)</th><th>Implikacja strategiczna</th></tr></thead><tbody id="urvNegInsights"></tbody></table></div>';
  h += '</div>';
  h += '<div class="cs-pos-zone">';
  h += '<div class="card" style="padding:0;overflow:hidden;border:1.5px solid #bbf7d0"><table class="us-table"><thead><tr style="background:#f0fdf4"><th style="width:22%;border-left:3px solid #16a34a">Temat pozytywnej opinii</th><th>Powody pozytywnej opinii</th><th style="width:140px;text-align:right">Udział %</th></tr></thead><tbody id="urvPosBody"></tbody></table></div>';
  h += '<div class="card" style="margin-top:22px"><div class="sec-header" style="margin-bottom:10px"><div class="sec-title">Wnioski z pozytywnych recenzji · Strategia</div></div>';
  h += '<table class="si-table"><thead><tr><th style="width:130px">Typ analizy</th><th>Ustalenie (z recenzji 4★+5★)</th><th>Implikacja strategiczna</th></tr></thead><tbody id="urvPosInsights"></tbody></table></div>';
  h += '</div>';
  h += '</div>';

  // Buyers Motivation
  h += '<div id="urv-sec-bm" style="margin-top:36px">';
  h += '<div class="sec-header"><div class="sec-title">Motywacja kupujących</div></div>';
  h += '<div class="card" style="padding:0;overflow:hidden"><table class="us-table"><thead><tr><th style="width:22%">Motywacja kupujących</th><th>Powód</th><th style="width:140px;text-align:right">Udział %</th></tr></thead><tbody>';
  if (D.buyersMotivation && D.buyersMotivation.length) {
    var bmMax = parseFloat(D.buyersMotivation[0].pct);
    D.buyersMotivation.forEach(function(m) {
      h += '<tr><td class="us-label">' + m.label + '</td><td class="us-reason">' + m.reason + '</td>';
      h += '<td class="us-pct" data-val="' + parseFloat(m.pct) + '"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(m.pct, bmMax) + '"></div></div><span>' + m.pct + '</span></td></tr>';
    });
  }
  h += '</tbody></table></div></div>';

  // Customer Expectations
  h += '<div id="urv-sec-ce" style="margin-top:36px">';
  h += '<div class="sec-header"><div class="sec-title">Oczekiwania klientów</div></div>';
  h += '<div class="card" style="padding:0;overflow:hidden"><table class="us-table"><thead><tr><th style="width:22%">Niezaspokojona potrzeba</th><th>Powód</th><th style="width:140px;text-align:right">Udział %</th></tr></thead><tbody>';
  if (D.customerExpectations && D.customerExpectations.length) {
    var ceMax = parseFloat(D.customerExpectations[0].pct);
    D.customerExpectations.forEach(function(e) {
      h += '<tr><td class="us-label">' + e.label + '</td><td class="us-reason">' + e.reason + '</td>';
      h += '<td class="us-pct" data-val="' + parseFloat(e.pct) + '"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(e.pct, ceMax) + '"></div></div><span>' + e.pct + '</span></td></tr>';
    });
  }
  h += '</tbody></table></div></div>';

  h += '</div>'; // end urv-ci

  // ── SUB-PANEL: Review Browser ──
  h += '<div id="urv-ca" class="voc-sub-panel">';
  h += '<div class="card"><h3>Przeglądarka recenzji <span style="font-size:.72rem;font-weight:400;color:#64748b;margin-left:8px">Filtruj wg oceny, tematu lub słowa kluczowego</span></h3>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
  h += '<select id="urvFilterRating" style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 8px;background:#fff"><option value="">Wszystkie oceny</option><option value="1">1★</option><option value="2">2★</option><option value="3">3★</option><option value="4">4★</option><option value="5">5★</option></select>';
  h += '<select id="urvFilterTheme" style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 8px;background:#fff"></select>';
  h += '<input id="urvFilterSearch" placeholder="Szukaj słowa kluczowego..." style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 8px;width:160px">';
  h += '<button id="urvClearBtn" style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 10px;background:#f8fafc;cursor:pointer">Wyczyść</button>';
  h += '</div>';
  h += '<div id="urvResultCount" style="font-size:.72rem;color:#64748b;margin-bottom:6px"></div>';
  h += '<div class="tbl-wrap" style="max-height:520px"><table><thead><tr><th style="width:40px">★</th><th>Review</th></tr></thead><tbody id="urvReviewBody"></tbody></table></div>';
  h += '</div></div>';

  root.innerHTML = h;

  // ─── Wiring ────────────────────────────────────────────────────────────
  if (window.Chart && window.ChartDataLabels) { try { Chart.register(ChartDataLabels); } catch(e){} }

  // Sub-tab switching
  root.querySelectorAll('.voc-sub-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      root.querySelectorAll('.voc-sub-tab').forEach(function(t) { t.classList.remove('active'); });
      root.querySelectorAll('.voc-sub-panel').forEach(function(p) { p.classList.remove('active'); });
      tab.classList.add('active');
      var panel = document.getElementById(tab.dataset.panel);
      if (panel) panel.classList.add('active');
      if (window.Chart && Chart.instances) Object.values(Chart.instances).forEach(function(c) { c.resize(); });
    });
  });

  // Anchor scroll
  root.querySelectorAll('.voc-anchor-nav a').forEach(function(a) {
    a.addEventListener('click', function(e) {
      e.preventDefault();
      var target = document.getElementById(a.dataset.target);
      if (target) {
        var y = target.getBoundingClientRect().top + window.pageYOffset - 90;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
      root.querySelectorAll('.voc-anchor-nav a').forEach(function(x) { x.classList.remove('active'); });
      a.classList.add('active');
    });
  });

  // Customer Profile stacked bars
  function makeStackedBar(canvasId, dataObj) {
    var ctx = document.getElementById(canvasId);
    if (!ctx || !dataObj) return;
    var chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: dataObj.labels,
        datasets: [
          { label: '4-5 stars', data: dataObj.pos, backgroundColor: '#22c55e', borderRadius: { topLeft: 3, topRight: 3 }, barPercentage: 0.7 },
          { label: '1-3 stars', data: dataObj.neg.map(function(v) { return -v; }), backgroundColor: '#ef4444', borderRadius: { bottomLeft: 3, bottomRight: 3 }, barPercentage: 0.7 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, datalabels: { display: false },
          tooltip: { callbacks: { label: function(c) { return c.dataset.label + ': ' + Math.abs(c.raw); } } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#64748b', maxRotation: 35 } },
          y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 }, color: '#94a3b8', callback: function(v) { return Math.abs(v); } } }
        }
      }
    });
    _charts.push(chart);
  }
  if (D.cpWho)   makeStackedBar('urvCpWho',   D.cpWho);
  if (D.cpWhen)  makeStackedBar('urvCpWhen',  D.cpWhen);
  if (D.cpWhere) makeStackedBar('urvCpWhere', D.cpWhere);
  if (D.cpWhat)  makeStackedBar('urvCpWhat',  D.cpWhat);

  // Negative topics (expandable rows)
  if (D.negativeTopics && D.negativeTopics.length) {
    var negMax = parseFloat(D.negativeTopics[0].pct);
    var negHtml = '';
    D.negativeTopics.forEach(function(t) {
      var bullets = (t.bullets || []).map(function(b) { return '<li>' + b + '</li>'; }).join('');
      var quotes = (t.quotes || []).map(function(q) { return '<p>' + q + '</p>'; }).join('');
      negHtml += '<tr class="nf-row" style="cursor:pointer"><td class="us-label"><span class="nf-arrow">▶</span> ' + t.label + '</td>';
      negHtml += '<td class="us-reason">' + t.reason + '</td>';
      negHtml += '<td class="us-pct" data-val="' + parseFloat(t.pct) + '"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(t.pct, negMax) + ';background:#fca5a5"></div></div><span>' + t.pct + '</span></td></tr>';
      var foundIn = t.foundIn ? '<p style="margin:0 0 8px;font-weight:700;color:#991b1b;font-size:.78rem">' + esc(t.foundIn) + '</p>' : '';
      negHtml += '<tr class="nf-detail"><td colspan="3"><div class="nf-body">' + foundIn + '<ul>' + bullets + '</ul><div class="nf-quotes">' + quotes + '</div></div></td></tr>';
    });
    document.getElementById('urvNegBody').innerHTML = negHtml;
  }
  if (D.negativeInsights) {
    document.getElementById('urvNegInsights').innerHTML = D.negativeInsights.map(function(i) {
      return '<tr><td><span class="si-badge" style="background:' + i.badgeBg + ';color:' + i.badgeColor + '">' + i.type + '</span></td><td>' + i.finding + '</td><td>' + i.implication + '</td></tr>';
    }).join('');
  }

  // Positive topics
  if (D.positiveTopics && D.positiveTopics.length) {
    var posMax = parseFloat(D.positiveTopics[0].pct);
    var posHtml = '';
    D.positiveTopics.forEach(function(t) {
      var bullets = (t.bullets || []).map(function(b) { return '<li>' + b + '</li>'; }).join('');
      var quotes = (t.quotes || []).map(function(q) { return '<p>' + q + '</p>'; }).join('');
      posHtml += '<tr class="pf-row" style="cursor:pointer"><td class="us-label"><span class="pf-arrow">▶</span> ' + t.label + '</td>';
      posHtml += '<td class="us-reason">' + t.reason + '</td>';
      posHtml += '<td class="us-pct" data-val="' + parseFloat(t.pct) + '"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(t.pct, posMax) + ';background:#86efac"></div></div><span>' + t.pct + '</span></td></tr>';
      var pFound = t.foundIn ? '<p style="margin:0 0 8px;font-weight:700;color:#166534;font-size:.78rem">' + esc(t.foundIn) + '</p>' : '';
      posHtml += '<tr class="pf-detail"><td colspan="3"><div class="pf-body">' + pFound + '<ul>' + bullets + '</ul><div class="pf-quotes">' + quotes + '</div></div></td></tr>';
    });
    document.getElementById('urvPosBody').innerHTML = posHtml;
  }
  if (D.positiveInsights) {
    document.getElementById('urvPosInsights').innerHTML = D.positiveInsights.map(function(i) {
      return '<tr><td><span class="si-badge" style="background:' + i.badgeBg + ';color:' + i.badgeColor + '">' + i.type + '</span></td><td>' + i.finding + '</td><td>' + i.implication + '</td></tr>';
    }).join('');
  }

  // Toggle expandable rows
  root.querySelectorAll('.nf-row').forEach(function(row) {
    row.addEventListener('click', function() {
      var detail = row.nextElementSibling;
      var isOpen = row.classList.contains('open');
      root.querySelectorAll('.nf-row.open').forEach(function(r) { r.classList.remove('open'); r.nextElementSibling.classList.remove('open'); });
      if (!isOpen) { row.classList.add('open'); detail.classList.add('open'); }
    });
  });
  root.querySelectorAll('.pf-row').forEach(function(row) {
    row.addEventListener('click', function() {
      var detail = row.nextElementSibling;
      var isOpen = row.classList.contains('open');
      root.querySelectorAll('.pf-row.open').forEach(function(r) { r.classList.remove('open'); r.nextElementSibling.classList.remove('open'); });
      if (!isOpen) { row.classList.add('open'); detail.classList.add('open'); }
    });
  });

  // Review Browser
  if (D.themeFilters) {
    document.getElementById('urvFilterTheme').innerHTML = '<option value="">Wszystkie tematy</option>' + D.themeFilters.map(function(f) {
      return '<option value="' + f.value + '">' + f.label + '</option>';
    }).join('');
  }

  var reviews = D.reviews || [];

  function urvFilter() {
    var rating = document.getElementById('urvFilterRating').value;
    var theme  = document.getElementById('urvFilterTheme').value;
    var search = (document.getElementById('urvFilterSearch').value || '').toLowerCase();
    var filtered = reviews.filter(function(r) {
      if (rating && r.r != rating) return false;
      if (theme && (r.tags || []).indexOf(theme) === -1) return false;
      if (search && (r.t || '').toLowerCase().indexOf(search) === -1) return false;
      return true;
    });
    document.getElementById('urvResultCount').textContent = 'Wyświetlono ' + filtered.length + ' z ' + reviews.length + ' recenzji';
    var html = '';
    var limit = Math.min(filtered.length, 1000);
    for (var i = 0; i < limit; i++) {
      var r = filtered[i];
      var starHtml = '<span style="color:' + STAR_COLORS[r.r] + ';font-weight:700">' + r.r + '★</span>';
      var tagsHtml = (r.tags || []).map(function(t) {
        return '<span class="pill ' + ((D.tagStyles && D.tagStyles[t]) || 'pill-blue') + '">' + t.replace(/_/g, ' ') + '</span>';
      }).join('');
      html += '<tr><td>' + starHtml + '</td><td><div class="review-text">' + (r.t || '').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>' +
        (tagsHtml ? '<div style="margin-top:4px">' + tagsHtml + '</div>' : '') + '</td></tr>';
    }
    if (filtered.length > 1000) html += '<tr><td colspan="2" style="text-align:center;color:#64748b;font-size:.72rem;padding:12px">Pierwsze 1000 z ' + filtered.length + '. Użyj filtrów/wyszukiwarki, aby dotrzeć do pozostałych.</td></tr>';
    document.getElementById('urvReviewBody').innerHTML = html;
  }
  document.getElementById('urvFilterRating').addEventListener('change', urvFilter);
  document.getElementById('urvFilterTheme').addEventListener('change', urvFilter);
  document.getElementById('urvFilterSearch').addEventListener('input', urvFilter);
  document.getElementById('urvClearBtn').addEventListener('click', function() {
    document.getElementById('urvFilterRating').value = '';
    document.getElementById('urvFilterTheme').value = '';
    document.getElementById('urvFilterSearch').value = '';
    urvFilter();
  });
  urvFilter();

  // ─── Polish ────────────────────────────────────────────────────────────
  makeAllTablesSortable();

}
window.__vocRender = function(){ renderReviews(VOC_DATA_UK, document.getElementById("u-reviews-voc-root")); };
</script>
