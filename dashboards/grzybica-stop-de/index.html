bad_smell", "expensive"]}, {"r": 2, "t": "Gegen den Geruch in meinen Schuhen hilft es jedenfalls NICHT! Ich bin enttäuscht, da das Spray nur leicht nach Chlor riecht und die Sportschuhe am nächsten Tag noch genauso stark gerochen haben wie vorher. Ob das Spray wirklich desinfiziert, könnte man als Verbraucher nur im Labor nachweisen. Da der Geruch meist von Bakterien stammt, vermute ich, dass diese in meinem Fall vielleicht nicht vollständig neutralisiert wurden obwohl ich auf eine vollständige Benetzung geachtet habe, sogar von außen. Ich musste extrem viel Spray verwenden, was die 1-Liter-Flasche schnell leer macht. Für mich leider kein überzeugendes Ergebnis.“", "title": "In meinem Fall wirkungslos gegen Geruch!", "date": "Reviewed in Germany on 2 December 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective", "fast_results", "no_effect"]}, {"r": 2, "t": "Das Produkt ist mit Sicherheit wirksam. Wäre nicht der penetrante Geruch nach Chlor, der einfach nicht mehr verschwinden will, würde ich es vielleicht wieder kaufen. Aber so nicht, und da interessiert es mich auch nicht, ob es nachhaltig, CO2-neutral ohne Tierversuche, koscher und bei Vollmond hergestellt wurde.", "title": "Riecht wie WC-Reiniger.", "date": "Reviewed in Germany on 20 May 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective", "easy_use"]}, {"r": 3, "t": "Das Desinfektionsspray lässt sich einfach anwenden und ist praktisch für die schnelle Hygiene von Füßen und Schuhen. Der Sprühkopf funktioniert gut und das Spray verteilt sich gleichmäßig. Positiv ist auch, dass es gegen Bakterien, Pilze und unangenehme Gerüche wirken soll und direkt gebrauchsfertig ist.Allerdings hat mich das Produkt nicht komplett überzeugt. Der Geruch erinnert deutlich an Chlor, was zwar nach einiger Zeit verfliegt, aber beim Aufsprühen etwas unangenehm ist. Außerdem hatte ich den Eindruck, dass starke Gerüche in Schuhen nicht immer vollständig verschwinden und man das Spray regelmäßig anwenden muss.Für die gelegentliche Nutzung ist es in Ordnung, aber ich hatte mir eine stärkere und länger anhaltende Wirkung erhofft. Insgesamt ein brauchbares Produkt, aber mit Luft nach oben.", "title": "Ganz okay, aber nicht perfekt", "date": "Reviewed in Germany on 15 March 2026", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective", "fast_results", "easy_use"]}, {"r": 3, "t": "Das Desinfektionsspray erfüllt seinen Zweck, allerdings ist der Geruch sehr penetrant – erinnert stark an Schwimmbad. Außerdem braucht es lange, bis es vollständig eingewirkt und nicht mehr feucht ist.Für gelegentliche Nutzung okay, für den schnellen Einsatz eher ungeeignet.", "title": "Grundsätzlich in Ordnung, aber mit Nachteilen", "date": "Reviewed in Germany on 7 January 2026", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective", "fast_results", "slow_results"]}, {"r": 3, "t": "Mag für den Zweck gut sein aber es riecht nur nach Chlor...da hatte ich schon Besseres.", "title": "Riecht nur nach Chlor", "date": "Reviewed in Germany on 27 November 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": []}, {"r": 3, "t": "Der Chlorgeruch ist sehr angenehm und vermittelt ein reines keimfreies Gefühl. Ich bin mir jedoch nicht sich, ob ich das Spray auf der Haut anwenden würde.Der Sprühkopf ist leider nicht dicht und der Reiniger läuft am Griff aus, wenn man sprüht. Hier sehe ich Nachbesserungspotential. Da lässt sich bestimmt etwas optimieren.", "title": "Sauberes Gefühl, leider undichter Sprühkopf", "date": "Reviewed in Germany on 8 July 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": []}, {"r": 3, "t": "Spray wirkt sofort, es riecht ein wenig nach Schwimmbad scheint aber zu wirken. Leider hält die Wirkung nicht solange vor wie bei dem normlen SOS Deinfektion Füße- und Schuhe", "title": "Wirkt sofort aber nicht lange", "date": "Reviewed in Germany on 28 July 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective", "fast_results", "slow_results"]}, {"r": 3, "t": "Ich habe leider bei dem Produkt gleich in mehrerlei Hinsicht bedenken. Ein paar der Punkte werden auch schon in anderen Rezensionen genannt. Vor allem jener, dass die Flasche nach Anbruch nur 3 Monate lang genutzt werden soll, sie mit 1 Liter aber schon ziemlich groß ist...Das könnte dazu führen, dass man eher öfter zur Flasche greift als nötig.Gemäß Internetrecherche ist eine Lösung mit 0,1% zu stark dosiert, um diese direkt auf der Haut anzuwenden. Empfohlen wird hier eine halb so starke Dosierung und insbesondere keine regelmäßige Anwendung, da das die Hautbarriere schädigen würde.Auch ist ja bei anderen Chlorhaltigen Mitteln immer direkt davon die Rede damit Vorsicht ran zu gehen und ggf gut auszuspülen.Der dritte Bedenkliche Punkt ist der, dass davon geschrieben wird, dass der \"chlorige\" Geruch zeigen soll, dass das Mittel wirkt - und diese Aussage halte ich für absoluten Quatsch, da das Mittel ja schon direkt riecht, wenn es aus der Flasche kommt.Das heißt natürlich nicht, dass es nicht wirken kann - das tut es bei meinen in die Jahre gekommenen Hausschuhen auch, aber dass der Geruch die Indikation für die Wirksamkeit darstellt finde ich einfach nicht nachvollziehbar.Mein Fazit: Nutzung in Schuhen und anderen Dingen ja, aber nicht auf der Haut.Vine Produkttest Hinweis:Ich habe dieses Produkt innerhalb des VINE Produkttester Programmes gratis erhalten, um eine hilfreiche und ehrliche Rezension für Käufer und Verkäufer zu verfassen, die dazu dient voreingenommene Rezensionen zu vermeiden.Auch wenn ich das Produkt kostenfrei erhalte ist der Produktpreis aber dennoch Teil meiner Bewertungskriterien. Davon unabhängig spreche ich Dinge an, die mir beim testen im guten wie im negativen Auffallen.Warum dieser Hinweis: Im Kontext der Testung kann es vorkommen, dass ich davon spreche, dass ich das Produkt zum testen erhalten habe. Dadurch kann der Eindruck entstehen, dass meine Meinung/Rezension vom Verkäufer beeinflusst wäre, was dann zur Ablehnung meiner Rezension führt und ich diese ausbessern muss. Aufgrund dessen seht ihr (nicht nur bei mir) diese wiederkehrenden Hinweistexte, um diese Information klarzustellen. Da dies aber an sich nicht Bewertungsrelevant ist stelle ich diesen Hinweis ans Ende meiner Rezension.", "title": "Ich habe bedenken...", "date": "Reviewed in Germany on 14 March 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective", "easy_use", "recurrence"]}, {"r": 3, "t": "Das PI Desinfektionsspray macht auf den ersten Blick einen soliden Eindruck und ist praktisch in der Anwendung. Es hat einen sehr starken Chlorgeruch, der unangenehme Schweißgerüche zuverlässig überdeckt – zumindest kurzfristig.Positiv:Wirkt sofort geruchsneutralisierend – Schweißgeruch wird effektiv überdeckt.Große 1L-Flasche – ergiebig und lange nutzbar.Made in Germany – mit vertrauenswürdigem Herkunftsnachweis.Kritikpunkte:Sehr starker Chlorgeruch – intensiv und nicht jedermanns Sache.Bei mir kein Langzeiteffekt – die Wirkung verfliegt schnell, dauerhafte Verbesserung konnte ich nicht feststellen.Fazit:Ein Desinfektionsspray, das kurzfristig gegen Gerüche hilft, aber bei mir keinen nachhaltigen Effekt gezeigt hat. Der starke Chlorgeruch ist Geschmackssache.", "title": "Überdeckt Gerüche, aber bei mir ohne Langzeiteffekt", "date": "Reviewed in Germany on 27 March 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective", "fast_results", "easy_use", "slow_results"]}, {"r": 4, "t": "Hilft bei der Fusspulzbekämpfung.Riecht zwar nach Chlor, aber die Wirkung ist auf jeden Fall da. Nutze es sowohl für Füsse als auch Schuhe", "title": "Macht was es soll", "date": "Reviewed in Germany on 3 November 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective"]}, {"r": 4, "t": "Benutze ich regelmäßig nach dem Sport in Kombination mit einem Schuhtrockner.Riecht wirklich stark nach Chlor, da ich es aber nicht im Wohnraum benutze, stört es mich nicht.Ich weiß nicht ob es das Material eventuell ausbleicht, da ich weiße Schuhe habe.Ich habe schon das Gefühl, dass es den Geruch minimiert, aber nicht komplett entfernt.Würde es dennoch wieder bestellen.Die Flasche wird aber noch für eine ganze Weile reichen.", "title": "Ok", "date": "Reviewed in Germany on 1 November 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": []}, {"r": 4, "t": "Erfüllt seinen Zweck sehr gut.Komisch bis bedenklich ist,dass meine beiden Katzen das Mittel lieben. Sie können kaum davon ablassen und schlecken an den Stellen  an denen es aufgebracht wurde.Also sollte man vorsichtig und achtsam  sein.", "title": "Katzenlockstoff??", "date": "Reviewed in Germany on 21 January 2026", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective"]}, {"r": 4, "t": "Richt beim sprühen nach chlor", "title": "Füße, Schuhe stinken nicht mehr", "date": "Reviewed in Germany on 4 December 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": []}, {"r": 4, "t": "Schnell und gut", "title": "Sray", "date": "Reviewed in Germany on 20 November 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["fast_results"]}, {"r": 4, "t": "Leider keine kleine Flasche mehr", "title": "alles ok", "date": "Reviewed in Germany on 26 October 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": []}, {"r": 4, "t": "Füße stinken nicht mehr aber das Zeug stinkt etwas nach Schwimmbad 😅", "title": "Schwimmbadfeeling 🤣", "date": "Reviewed in Germany on 27 August 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["bad_smell"]}, {"r": 4, "t": "Super Produkt, da es keine Oberflächen beschädigt und nicht brennt. Leider ein starker Chlorgeruch, daher ein Stern Abzug!", "title": "Super aber mit Chlorgeruch", "date": "Reviewed in Germany on 23 June 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective", "skin_irritation", "packaging"]}, {"r": 4, "t": "Richt etwas streng nach klor.", "title": "Brennt nicht auf der Haut.", "date": "Reviewed in Germany on 25 July 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": []}, {"r": 4, "t": "Wir sind sehr zufrieden mit dem Artikel.", "title": "Schuhdesinfektionsmittel", "date": "Reviewed in Germany on 2 July 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": []}, {"r": 4, "t": "Dieses Spray, erfreulicherweise «Made in Germany», bekämpft Fußpilz umfassend, indem man es auf der Haut ebenso anwenden kann wie auf Strümpfen oder in Schuhen.Die Inhaltsstoffe werden elektrolytisch aus Wasser und Salz (NaCl) gewonnen, deshalb auch der Chlorgeruch bei der Anwendung. Chlor ist an sich recht aggressiv, hier aber in einer chemischen Form, die für Menschen und Tiere verträglich ist.Stoffe können sich ggf. farblich verändern, deshalb sicherheitshalber an unauffälliger Stelle testen!In Anbetracht der Menge, die man hier bekommt, ist das «Flüssige SOS von Planet Sensitive» recht günstig, insbesondere zu antimykotischen Mitteln aus der Apotheke.Einen Versuch, die lästigen «Untermieter» damit los zu werden, sollte man mit dem Mittel auf jeden Fall starten, schließlich ist wenig so lästig wie Fußpilz und hiermit kann man ihn auf verschiedenen Ebenen bekämpfen!", "title": "SOS Desinfektionsspray, u.a. gegen Fußpilz", "date": "Reviewed in Germany on 1 August 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["skin_friendly", "good_value"]}, {"r": 4, "t": "Ich habe das Canvas PI 1L SOS Desinfektionsspray kostenlos zum Testen erhalten und es über mehrere Wochen hinweg ausprobiert. Das Produkt ist vielseitig einsetzbar, besonders für die Desinfektion von Schuhen und Füßen, was es ideal für den Einsatz nach dem Sport oder in Gemeinschaftsduschen macht.Wirksamkeit & AnwendungDas Spray ist alkoholfrei und basiert auf Natriumhypochlorit, was als aktive Desinfektionskomponente dient. Es bekämpft laut Hersteller Keime, Bakterien und Pilze innerhalb von fünf Minuten und hinterlässt ein Gefühl von Hygiene und Frische. In der Praxis habe ich festgestellt, dass es unangenehme Gerüche in Schuhen deutlich reduziert und meine Füße nach der Anwendung angenehm sauber wirken.Geruch & HautverträglichkeitEin markanter Punkt ist der chlorige Geruch, der an Schwimmbäder erinnert. Dieser signalisiert zwar die desinfizierende Wirkung, kann jedoch für empfindliche Nasen etwas unangenehm sein. Die Hautverträglichkeit war in meinem Test gut, allerdings würde ich es nicht auf bereits gereizter oder offener Haut anwenden.Verpackung & ErgiebigkeitDie 1-Liter-Flasche reicht lange aus, da man pro Anwendung nur wenig Produkt benötigt. Ein Sprühkopf wäre praktisch, um die Handhabung zu erleichtern, da es sich um eine einfache Flasche handelt, die ohne zusätzlichen Zerstäuber kommt.FazitDas Canvas PI Desinfektionsspray ist eine sinnvolle Ergänzung für alle, die Wert auf hygienische Schuhe und Füße legen. Es ist wirksam gegen Keime und Gerüche, jedoch mit einem typischen Chlorgeruch verbunden. Die alkoholfreie Formulierung macht es zu einer guten Alternative für empfindliche Haut.Vorteile:✅ Effektive Desinfektion gegen Fußpilz und Bakterien✅ Alkoholfrei und hautfreundlich✅ Ergiebige 1L-Flasche✅ Made in Germany mit nachgewiesener WirksamkeitNachteile:❌ Starker Chlorgeruch❌ Kein Sprühkopf enthaltenWer mit dem Geruch klarkommt und eine zuverlässige Hygiene-Lösung sucht, wird mit diesem Produkt zufrieden sein.", "title": "Praktische und effektive Desinfektion für Füße und Schuhe", "date": "Reviewed in Germany on 17 March 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective", "easy_use", "skin_friendly", "slow_results", "packaging"]}, {"r": 4, "t": "Das Desinfektionsspray ist speziell formuliert, um wirksam gegen Fußpilz, Schweißgerüche, Bakterien und Hefepilze zu wirken. Der Hauptbestandteil des Sprays ist Natriumhypochlorit, das als freigesetztes Aktivchlor fungiert.Chlor ist bekannt für seine desinfizierenden Eigenschaften und wird häufig in Schwimmbädern eingesetzt.Der unverkennbare Chlorgeruch erinnert beim Aufsprühen sofort an diese Umgebung – ein Zeichen dafür, dass das Produkt tatsächlich wirkt.Die Anwendung des Sprays ist denkbar einfach: Es kann direkt auf die Füße oder in die Schuhe gesprüht werden. Nach dem Aufsprühen bleibt der charakteristische Geruch von Chlor zurück, was darauf hinweist, dass das Produkt aktiv ist. Ich habe keine Hautreizungen festgestellt, was ein positiver Aspekt ist, da viele Menschen empfindliche Haut haben. Die Wirksamkeit gegen Fußgerüche ist ebenfalls gegeben; nach der Anwendung fühlt man sich frisch und hygienisch.Ein wichtiger Punkt bei der Verwendung von Desinfektionsmitteln ist die Haltbarkeit nach dem Öffnen.Bei diesem Spray beträgt die Haltbarkeit nur drei Monate. Dies könnte für einige Nutzer problematisch sein, insbesondere wenn sie alleine leben oder das Produkt nicht regelmäßig verwenden. Mit einem Inhalt von 1 Liter handelt es sich um eine große Menge, die für eine Einzelperson möglicherweise zu viel ist.Daher wäre es sinnvoll gewesen, wenn der Hersteller kleinere Flaschen angeboten hätte – vielleicht in Größen von 250 ml oder 500 ml. So könnte man sicherstellen, dass man das Produkt innerhalb der Haltbarkeitsdauer aufbraucht und keine Reste entsorgen muss.", "title": "frisch und hygienisch", "date": "Reviewed in Germany on 13 March 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective", "fast_results", "easy_use", "skin_irritation", "recurrence"]}, {"r": 4, "t": "Da die Sport- und Arbeitsschuhe meines Mannes regelmäßig gut gereinigt werden müssen – und zwar nicht nur äußerlich – habe ich bei diesem Angebot von PI gerne zugegriffen. Ich war neugierig, ob ein Produkt auf Chlorbasis gegenüber den herkömmlichen Drogerie-Sprays einen Mehrwert bietet. Geliefert wurde eine große 1 Liter Sprühflasche, die dennoch gut händelbar ist.Das Spray verteilt sich fein im Schuh und trocknet schnell ab. Am besten sprüht man die Schuhe abends ein und lässt sie über Nacht gut auslüften. Der Chlor-Geruch ist zwar am nächsten Tag noch leicht wahrnehmbar, aber die unangenehmen Gerüche sind tatsächlich verschwunden. Das ist schon mal super!Den Härtetest habe ich dann mit den „müffelnden“ Sneakers meines Sohns gemacht, die er oft barfuß trägt. Hier hat das Spray erst nach wiederholter Anwendung Erfolg gezeigt. (Sprays anderer Hersteller schwächeln an dieser Stelle aber auch.) Insgesamt bin ich zufrieden und kann eine Empfehlung aussprechen.", "title": "Hilft manchmal erst nach wiederholter Anwendung", "date": "Reviewed in Germany on 27 April 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective", "fast_results"]}, {"r": 4, "t": "Geliefert wird gleich 1 Liter Desinfektionsspray mit einem praktischen Pumpspender. Meine Flasche war ab Lieferung für fast 12 Monate verwendbar. Zeit genug, um die Flüssigkeit aufzubrauchen.Wie schon von anderen Rezensenten geschrieben ist der Geruch nach Chlor unverkennbar. Das schreibt der Hersteller ja auch in der Produktbeschreibung. Allerdings verfliegt der Geruch nach der Nutzung in wenigen Minuten.Die Anwendung ist recht einfach. Man muss die Füße einfach nur einsprühen und ein paar Minuten warten, damit die Wirkung sich entfaltet.Auch die Schuhe können gut eingesprüht werden, was Bakterien und Keime beseitigen soll. Inwieweit Pilze und Viren tatsächlich abgetötet werden, vermag ich nicht sicher zu sagen. Zumindest werden Gerüche ziemlich schnell eliminiert.Sicher kann ich sagen, dass die Füße sich durch das Einsprühen für längere Zeit gut gekühlt und gepflegt anfühlen.Für den Preis von knapp 10,-€ werde ich mir das Spray auf jeden Fall wieder bestellen, sollte mein Vorrat zu ende gehen.", "title": "Gute Wirkung und reichliche Menge", "date": "Reviewed in Germany on 30 March 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["fast_results", "easy_use"]}, {"r": 4, "t": "Das SOS Desinfektionsspray für Füße & Schuhe wurde uns im Rahmen des Vine-Programmes zum Testen zur Verfügung gestellt.Geliefert wird eine große Kunststoffflasche, aufgetragen wird das Spray über einen Drucksprüher.Der funktioniert zuverlässig, ohne zu tropfen.Das Spray selber riecht recht stark nach Chlor, irgendwie sträube ich mich deshalb, es für die Füße zu verwenden. In den Schuhen jedoch darf es seine Wirkung entfalten :)Die Flasche finde ich für einen normalen Haushalt zu groß, die Größe wäre eher was für Bowlingbahnbetreiber ;)", "title": "sehr große Flasche, starker Chlorgeruch", "date": "Reviewed in Germany on 28 April 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective"]}, {"r": 4, "t": "Von der Marke P Planet ein Fuß und Schuhe Desinfektionsmittel hier finden ich den Preis für  1 Liter Desinfektion ganz günstig  Wir haben ein Produkt made in Germany dieser Hersteller hat ein großes Sortiment an Produkten  welche alle in hochwertiger Qualität sind wie auch das  Desinfektionsmittel für die Füße und Schuhe um Fußpilz zu behandeln . Es ist basierend auf Natriumhyboclorit als freigesetztes Aktivchlor  was bei mir sehr effektiv und wirkungsvoll ist , es nimmt auch die unangenehme Gerüche von den Arbeitsschuhe meines Mannes gut weg . Natürlich habe ich bei dem Mittel den typischen Geruch nach dem Chlor man könnte auch sagen wie im Schwimmbad  , ist aber auszuhalten einfach lüften und die Schuhe nach draußen stellen ist meine Lösung.  Der Wirkungsgrad ist perfekt und Preis günstig für ein so gutes qualitativ  Desinfektionsmittel von mir aus gerne Vier Sterne ⭐⭐⭐⭐", "title": "Qualität", "date": "Reviewed in Germany on 6 March 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["easy_use", "good_value"]}, {"r": 4, "t": "Habe dieses Schuh-Deo im Rahmen des Vine Programms erwerben und testen dürfen. Die Teilnahme am Vine-Programm hat selbstverständlich keinen Einfluß auf die Bewertung.Bekommen habe ich das  abgebildete Schuh-Deo in einer PlastikflascheDie Fakten:- funktioniert gut, habe es bei Sportschuhen ausprobiert- Geruch gewöhnungsbedürftig, starke Chlornote- leider kurze Haltbarkeit des angebrochenen SpraysKann dieses Schuh-Deo nur empfehlen wenn man den Chlorgeruch ertragen kann oder eine Möglichkeit zum Lüften der behandelten Schuhe hat.", "title": "Geruch etwas unangenehm", "date": "Reviewed in Germany on 10 April 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective"]}, {"r": 4, "t": "Die Sprühdesinfektion kommt in einer Handsprühflasche. Ich habe das für meine Sportschuhe benutzt, die Schuhe innen gut eingesprüht und dann die Schuhe zum Trocknen in die Sonne gestellt. Das hat die Gerüche gut neutralisiert, die Schuhe gehen durch häufiges Waschen in der Maschine schnell kaputt, deswegen ist das Produkt gut für eine Reinigung zwischendurch.", "title": "Gut für Sportschuhe", "date": "Reviewed in Germany on 21 March 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["fast_results", "packaging"]}, {"r": 4, "t": "Ich wollte einmal ein spezielles Produkt für die Schuh und Fußdesinfektion testen, weil die alkoholischen Produkte nicht immer gut verträglich sind.Was erhält man nun, keinen spezielles Produkt, sondern ein Chlordesinfektionsmittel. Nun ja, erfüllt seinen Zwecke, aber es ist und bleibt ein Chlorprodukt.Der Preis ist vollkommen ok und nicht übertrieben.", "title": "Chlordesinfektion", "date": "Reviewed in Germany on 23 March 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["skin_friendly"]}, {"r": 4, "t": "Ob es gegen Fußpilz hilft kann ich zum Glück nicht herausfinden, den Geruch nach Fuß minimiert es.Allerdings bin ich auch vorsichtig in der Anwendung, da ich ehrlich gesagt keine Lust auf verfärbte Schuhe habe.Bei Chloranwendung ist das nur eine Frage der Zeit. Die Vorstellung finde ich nicht ganz prickelnd.", "title": "Funktioniert - Vorsicht mit Chlor, auch wenn es sehr reduziert enthalten ist.", "date": "Reviewed in Germany on 7 March 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective"]}, {"r": 4, "t": "1 Liter Flüssigkeit wird in einer Sprühflasche mit Beschriftung in deutscher Sprache geliefert. Das Mindesthaltbarkeitsdatum in fast einem Jahr ist okay. Mit dem kräftigen, aber feinen Sprühnebel bin ich sehr zufrieden. S n würde, so dass man nach drei Monate nicht einen Teil  entsorgen muss, sondern einfach mit einer neuen Flasche weitermachen kann. Das wäre auch praktisch für diejenigen, die so eine Flasche mobil ins Schwimmbad, zum Sport oder Camping mitzunehmen gedenken und sich nicht mit einer schweren 1 Liter-Flasche schleppen möchten.", "title": "Produkttest: Wirkungsvoller Desinfektionsspray mit kurzer Haltbarkeit", "date": "Reviewed in Germany on 8 March 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective", "fast_results", "easy_use", "skin_irritation"]}, {"r": 5, "t": "Ich habe das Desinfektionsspray jetzt einige Zeit getestet und bin insgesamt zufrieden mit der Wirkung. Es entfernt zuverlässig unangenehme Gerüche und ist besonders praktisch für Schuhe, Füße oder auch Sporttaschen. Gerade nach langen Tagen oder intensivem Training ist es ein hilfreiches Produkt.✅ Positives:• Wirkt effektiv gegen Fußpilz, Bakterien und Schweißgeruch• Einfache Anwendung – einfach aufsprühen, trocknen lassen, fertig• Alkoholfreie Zusammensetzung – brennt nicht auf der Haut• Hergestellt in Deutschland❌ Negatives:• Der starke Chlorgeruch ist gewöhnungsbedürftig und bleibt eine Zeit lang erhalten• Die Haltbarkeit nach dem Öffnen könnte länger sein – nach wenigen Monaten ist das Produkt nicht mehr ganz so wirksam• 1 Liter ist eine große Menge – kleinere Flaschen wären für Einzelpersonen praktischerFazit:Für alle, die Wert auf Hygiene legen, ist das Spray eine gute Wahl. Wer jedoch empfindlich auf Chlorgeruch reagiert oder nur eine kleinere Menge braucht, sollte vielleicht nach einer kompakteren Alternative suchen. 😊", "title": "Hygienisch und wirksam – aber starke Chlor-Note", "date": "Reviewed in Germany on 17 March 2025", "asin": "B0DY1SW2D1", "segment": "Spray", "tags": ["effective", "easy_use", "skin_irritation", "slow_results"]}, {"r": 5, "t": "Ich durfte das Produkt im Rahmen von Amazon Vine gratis testen, dies hat keinen Einfluss auf meine Bewertung.Das Paket kam gut verpac serfolg ist die regelmäßige und ausreichend lange Anwendung", "INHALT: ALIUD PHARMA Clotrimazol AL 1% Creme ist in Packungen mit 50 g Creme erhältlich. 1 g Creme enthält 0,01 g Clotrimazol"], "description": "<p>Bis zu 15% der Erwachsenen in Deutschland leiden unter Fußpilz. Besonders häufig sind auch Hautfalten betroffen. Die häufigsten Beschwerden sind Jucken, Rötung, Brennen, Hautveränderungen und Entzündungen.<p>Für die Behandlung einer Pilzinfektion der Haut gibt es verschiedene Wirkstoffe. Clotrimazol wird seit Jahren erfolgreich als Antimykotikum angewendet. Während der Wachstumsphase des Pilzes greift es dessen Zellmembran an, die dadurch undicht wird. In der Folge verliert der Pilz die Fähigkeit sich zu vermehren und stirbt schließlich ab.</p><b>Clotrimazol AL 1%</b><ul><li>Mit dem bewährten Wirkstoff Clotrimazol </li><li>Zur Behandlung von oberflächlichen Pilzinfektionen (Mykosen) der Füße und der Haut/Hautfalten </li><li>Zur äußeren Anwendung</li></ul><b>Anwendungsempfehlung</b><p>Soweit ärztlich nicht anders verordnet, wird Clotrimazol AL 1% Creme konsequent 2- bis 3-mal täglich dünn auf die erkrankten Bereiche aufgetragen und eingerieben. Es genügt meist eine kleine Menge Clotrimazol AL 1% Creme. Wichtig für den Behandlungserfolg ist die regelmäßige und ausreichend lange Anwendung von Clotrimazol AL 1% Creme. Die Behandlungsdauer hängt dabei unter anderem vom Ausmaß und der betroffenen Region ab.<br><br> Um eine komplette Ausheilung zu erreichen und Rückfälle vorzubeugen, sollte die Behandlung mit Clotrimazol AL 1% Creme nicht nach dem Abklingen der akuten Symptome abgebrochen werden, sondern bis zu einer Dauer von mindestens 4 Wochen fortgeführt werden. Bei Fußpilz sollte trotz rascher subjektiver Besserung etwa 2 Wochen über das Verschwinden aller Krankheitszeichen hinaus weiter behandelt werden.</p><b>Lesen Sie die gesamte Packungsbeilage sorgfältig durch, bevor Sie mit der Anwendung dieses Arzneimittels beginnen, denn sie enthält wichtige Informationen.</b>", "themes": ["active_ingredient", "broad_spectrum", "effectiveness"], "claimCount": 3}, {"asin": "B0DY1SW2D1", "segment": "Spray", "brand": "PI", "title": "1L SOS Desinfektionsspray für Füße & Schuhe | Planet Sensitive® wirksam gegen Fußpilz, Bakterien, Viren, Hefepilze & Gerüche | Fuß-Desinfektion-Spray | Made in Germany | Sprühflasche", "price": 11.97, "rating": 4.3, "reviews": 317, "bsr": 625, "rev30d": 34646.76, "mainImage": "https://m.media-amazon.com/images/I/61iLA-9DY2L.jpg", "images": ["https://m.media-amazon.com/images/I/61iLA-9DY2L.jpg", "https://m.media-amazon.com/images/I/3136lfZEPmL.jpg", "https://m.media-amazon.com/images/I/3136lfZEPmL._SL75_.jpg", "https://m.media-amazon.com/images/I/71jdWkEqstL.jpg", "https://m.media-amazon.com/images/I/41rBsmXSq0L.jpg", "https://m.media-amazon.com/images/I/41rBsmXSq0L._SL75_.jpg", "https://m.media-amazon.com/images/I/81dB92NTpkL.jpg", "https://m.media-amazon.com/images/I/41DLgBJbxTL.jpg", "https://m.media-amazon.com/images/I/41DLgBJbxTL._SL75_.jpg", "https://m.media-amazon.com/images/I/71tLekXgcoL.jpg", "https://m.media-amazon.com/images/I/41QYFsju-oL.jpg", "https://m.media-amazon.com/images/I/41QYFsju-oL._SL75_.jpg", "https://m.media-amazon.com/images/I/81FCUt8vXcL.jpg", "https://m.media-amazon.com/images/I/41oHptCLWvL.jpg", "https://m.media-amazon.com/images/I/41oHptCLWvL._SL75_.jpg", "https://m.media-amazon.com/images/I/71kBvvCWUXL.jpg", "https://m.media-amazon.com/images/I/41tDiC4u32L.jpg", "https://m.media-amazon.com/images/I/41tDiC4u32L._SL75_.jpg", "https://m.media-amazon.com/images/I/71AST7JIjUL.jpg", "https://m.media-amazon.com/images/I/41KQtcroUiL.jpg", "https://m.media-amazon.com/images/I/41KQtcroUiL._SL75_.jpg", "https://m.media-amazon.com/images/I/710ho-t6QHL.jpg", "https://m.media-amazon.com/images/I/41ZkDQUOa9L.jpg", "https://m.media-amazon.com/images/I/41ZkDQUOa9L._SL75_.jpg"], "bullets": ["🦠 REDUZIERT KEIME AN FÜßEN UND SCHUHEN – Wirkt gegen Fußpilz (Trichophyton rubrum), Bakterien, Hefepilz s/I/41HoQ9mt3KL.jpg", "https://m.media-amazon.com/images/I/41HoQ9mt3KL._SL75_.jpg"], "bullets": ["BEI PILZINFEKTIONEN: Clotrimazol AL 1% wird angewendet zur Behandlung von oberflächlichen Pilzinfektionen bzw. Mykosen der Füße, der Haut sowie in Hautfalten", "CLOTRIMAZOL: Der Wirkstoff Clotrimazol ist ein bewährtes Antimykotikum der Haut, das während der Wachstumsphase die Zellmembran des Pilzes angreift, die dadurch undicht wird und den Pilz absterben lässt", "GEEIGNET BEI VERSCHIEDENARTIGEN PILZINFEKTIONEN DER HAUT: Clotrimazol AL 1% eignet sich für die Behandlung von Pilzinfektionen durch Dermatophyten, Hefen (z.B. Candida-Arten), Schimmelpilzen und anderen Pilzen", "ANWENDUNGSEMPFEHLUNG: 2- bis 3-mal täglich eine kleine Menge Clotrimazol AL 1% dünn auftragen und einreiben. Wichtig für den Behandlungserfolg ist die regelmäßige und ausreichend lange Anwendung", "INHALT: ALIUD PHARMA Clotrimazol AL 1% Creme ist in Packungen mit 50 g Creme erhältlich. 1 g Creme enthält 0,01 g Clotrimazol"], "description": "<p>Bis zu 15% der Erwachsenen in Deutschland leiden unter Fußpilz. Besonders häufig sind auch Hautfalten betroffen. Die häufigsten Beschwerden sind Jucken, Rötung, Brennen, Hautveränderungen und Entzündungen.<p>Für die Behandlung einer Pilzinfektion der Haut gibt es verschiedene Wirkstoffe. Clotrimazol wird seit Jahren erfolgreich als Antimykotikum angewendet. Während der Wachstumsphase des Pilzes greift es dessen Zellmembran an, die dadurch undicht wird. In der Folge verliert der Pilz die Fähigkeit sich zu vermehren und stirbt schließlich ab.</p><b>Clotrimazol AL 1%</b><ul><li>Mit dem bewährten Wirkstoff Clotrimazol </li><li>Zur Behandlung von oberflächlichen Pilzinfektionen (Mykosen) der Füße und der Haut/Hautfalten </li><li>Zur äußeren Anwendung</li></ul><b>Anwendungsempfehlung</b><p>Soweit ärztlich nicht anders verordnet, wird Clotrimazol AL 1% Creme konsequent 2- bis 3-mal täglich dünn auf die erkrankten Bereiche aufgetragen und eingerieben. Es genügt meist eine kleine Menge Clotrimazol AL 1% Creme. Wichtig für den Behandlungserfolg ist die regelmäßige und ausreichend lange Anwendung von Clotrimazol AL 1% Creme. Die Behandlungsdauer hängt dabei unter anderem vom Ausmaß und der betroffenen Region ab.<br><br> Um eine komplette Ausheilung zu erreichen und Rückfälle vorzubeugen, sollte die Behandlung mit Clotrimazol AL 1% Creme nicht nach dem Abklingen der akuten Symptome abgebrochen werden, sondern bis zu einer Dauer von mindestens 4 Wochen fortgeführt werden. Bei Fußpilz sollte trotz rascher subjektiver Besserung etwa 2 Wochen über das Verschwinden aller Krankheitszeichen hinaus weiter behandelt werden.</p><b>Lesen Sie die gesamte Packungsbeilage sorgfältig durch, bevor Sie mit der Anwendung dieses Arzneimittels beginnen, denn sie enthält wichtige Informationen.</b>", "themes": ["active_ingredient", "broad_spectrum", "effectiveness"], "claimCount": 3}, {"asin": "B0DY1SW2D1", "segment": "Spray", "brand": "PI", "title": "1L SOS Desinfektionsspray für Füße & Schuhe | Planet Sensitive® wirksam gegen Fußpilz, Bakterien, Viren, Hefepilze & Gerüche | Fuß-Desinfektion-Spray | Made in Germany | Sprühflasche", "price": 11.97, "rating": 4.3, "reviews": 317, "bsr": 625, "rev30d": 34646.76, "mainImage": "https://m.media-amazon.com/images/I/61iLA-9DY2L.jpg", "images": ["https://m.media-amazon.com/images/I/61iLA-9DY2L.jpg", "https://m.media-amazon.com/images/I/3136lfZEPmL.jpg", "https://m.media-amazon.com/images/I/3136lfZEPmL._SL75_.jpg", "https://m.media-amazon.com/images/I/71jdWkEqstL.jpg", "https://m.media-amazon.com/images/I/41rBsmXSq0L.jpg", "https://m.media-amazon.com/images/I/41rBsmXSq0L._SL75_.jpg", "https://m.media-amazon.com/images/I/81dB92NTpkL.jpg", "https://m.media-amazon.com/images/I/41DLgBJbxTL.jpg", "https://m.media-amazon.com/images/I/41DLgBJbxTL._SL75_.jpg", "https://m.media-amazon.com/images/I/71tLekXgcoL.jpg", "https://m.media-amazon.com/images/I/41QYFsju-oL.jpg", "https://m.media-amazon.com/images/I/41QYFsju-oL._SL75 rungen und Entzündungen.<p>Für die Behandlung einer Pilzinfektion der Haut gibt es verschiedene Wirkstoffe. Clotrimazol wird seit Jahren erfolgreich als Antimykotikum angewendet. Während der Wachstumsphase des Pilzes greift es dessen Zellmembran an, die dadurch undicht wird. In der Folge verliert der Pilz die Fähigkeit sich zu vermehren und stirbt schließlich ab.</p><b>Clotrimazol AL 1%</b><ul><li>Mit dem bewährten Wirkstoff Clotrimazol </li><li>Zur Behandlung von oberflächlichen Pilzinfektionen (Mykosen) der Füße und der Haut/Hautfalten </li><li>Zur äußeren Anwendung</li></ul><b>Anwendungsempfehlung</b><p>Soweit ärztlich nicht anders verordnet, wird Clotrimazol AL 1% Creme konsequent 2- bis 3-mal täglich dünn auf die erkrankten Bereiche aufgetragen und eingerieben. Es genügt meist eine kleine Menge Clotrimazol AL 1% Creme. Wichtig für den Behandlungserfolg ist die regelmäßige und ausreichend lange Anwendung von Clotrimazol AL 1% Creme. Die Behandlungsdauer hängt dabei unter anderem vom Ausmaß und der betroffenen Region ab.<br><br> Um eine komplette Ausheilung zu erreichen und Rückfälle vorzubeugen, sollte die Behandlung mit Clotrimazol AL 1% Creme nicht nach dem Abklingen der akuten Symptome abgebrochen werden, sondern bis zu einer Dauer von mindestens 4 Wochen fortgeführt werden. Bei Fußpilz sollte trotz rascher subjektiver Besserung etwa 2 Wochen über das Verschwinden aller Krankheitszeichen hinaus weiter behandelt werden.</p><b>Lesen Sie die gesamte Packungsbeilage sorgfältig durch, bevor Sie mit der Anwendung dieses Arzneimittels beginnen, denn sie enthält wichtige Informationen.</b>", "themes": ["active_ingredient", "broad_spectrum", "effectiveness"], "claimCount": 3}, {"asin": "B00E67K012", "segment": "Cream", "brand": "Lamisil", "title": "Lamisil Creme – Schonende Behandlung von Fußpilz & Hautpilz - Schnelle Linderung von Symptomen - 1% Terbinafinhydrochlorid - Antipilz-Creme 30g", "price": 17.24, "rating": 4.5, "reviews": 2602, "bsr": 171473, "rev30d": 2807
