  }

  function fmtUnits(v) {
    if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
    if (v >= 1e3) return Math.round(v / 1e3) + 'K';
    return v.toLocaleString();
  }

  // ── Title ──
  h += '<h2>Main Segments \u2014 Total Market (12M)</h2>';

  // ── Total Category KPI bar ──
  h += '<div class="card" style="border-left:4px solid #1e293b;padding:14px 20px;display:flex;align-items:center;gap:36px;flex-wrap:wrap;margin-bottom:14px">';
  h += '<div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748b;min-width:120px">Total Category</div>';
  h += '<div><div style="font-size:1.6rem;font-weight:700;color:#1e293b;line-height:1">' + fmtMoney(totalRev) + '</div>';
  h += '<div style="font-size:.75rem;color:#64748b;margin-top:3px">Revenue \u00b7 12M' + (seasonality ? ' (seasonality-adjusted)' : ' (30d \u00d712)') + '</div></div>';
  h += '<div><div style="font-size:1.6rem;font-weight:700;color:#1e293b;line-height:1">' + totalUnits.toLocaleString() + '</div>';
  h += '<div style="font-size:.75rem;color:#64748b;margin-top:3px">Units Sold \u00b7 12M</div></div>';
  h += '<div><div style="font-size:1.6rem;font-weight:700;color:#1e293b;line-height:1">' + totalAsins + '</div>';
  h += '<div style="font-size:.75rem;color:#64748b;margin-top:3px">ASINs Tracked</div></div>';
  h += '</div>';

  // ── Per-segment KPI cards ──
  var cols = segments.length <= 2 ? '1fr 1fr' : segments.length === 3 ? '1fr 1fr 1fr' : 'repeat(auto-fill,minmax(280px,1fr))';
  h += '<div style="display:grid;grid-template-columns:' + cols + ';gap:14px;margin-bottom:22px">';
  segments.forEach(function(seg) {
    h += '<div class="card" style="border-left:4px solid ' + seg.color + ';padding:14px 16px">';
    h += '<div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:' + seg.color + ';margin-bottom:10px">' + seg.name + ' <span style="font-weight:400;color:#94a3b8">(' + seg.asins + ' ASINs)</span></div>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">';
    h += '<div class="kpi" style="box-shadow:none;background:#f8fafc;padding:8px 10px"><div class="kpi-v" style="font-size:.95rem">' + fmtUnits(seg.units12m) + '</div><div class="kpi-l">Units sold (12M)</div></div>';
    h += '<div class="kpi" style="box-shadow:none;background:#f8fafc;padding:8px 10px"><div class="kpi-v" style="font-size:.95rem">' + fmtMoney(seg.revenue12m) + '</div><div class="kpi-l">Segment Value (12M)</div></div>';
    h += '</div></div>';
  });
  h += '</div>';

  // ── Auto-generated insight box ──
  h += '<div class="insight">' + generateInsight(segments, totalUnits, totalRev, totalAsins, cur) + '</div>';

  function generateInsight(segs, totU, totR, totAsins, c) {
    var n = segs.length;
    var byRev = segs.slice().sort(function(a, b) { return b.revenue12m - a.revenue12m; });
    var byUnits = segs.slice().sort(function(a, b) { return b.units12m - a.units12m; });

    var topRev = byRev[0];
    var topUnits = byUnits[0];
    var topRevShare = (topRev.revenue12m / totR * 100).toFixed(1);
    var topUnitShare = (topUnits.units12m / totU * 100).toFixed(1);

    var parts = [];
    var methodNote = salesFilesFound > 0
      ? salesFilesFound + ' ASINs with actual sales data (seasonality-adjusted), ' + salesFilesMissing + ' projected from X-Ray ' + exportMonthName + ' snapshot.'
      : 'All ASINs projected from X-Ray 30d snapshot (\u00d712).';
    parts.push('<strong>Segment-level view.</strong> ' + totAsins + ' ASINs across ' + n + ' segments. ' + methodNote);

    // Dominant segment
    if (topRev.name === topUnits.name) {
      parts.push(topRev.name + ' dominates both revenue (' + topRevShare + '%) and units (' + topUnitShare + '%).');
    } else {
      parts.push(topRev.name + ' leads revenue (' + topRevShare + '%), while ' + topUnits.name + ' leads units (' + topUnitShare + '%).');
    }

    // Compare top 2 if close
    if (byRev.length >= 2) {
      var r1 = byRev[0].revenue12m / totR * 100;
      var r2 = byRev[1].revenue12m / totR * 100;
      if (r1 - r2 < 5) {
        parts.push(byRev[0].name + ' and ' + byRev[1].name + ' are nearly equal in revenue share (' + r1.toFixed(1) + '% vs ' + r2.toFixed(1) + '%).');
      }
    }

    // Smallest segment
    var smallest = byRev[byRev.length - 1];
    var smallShare = (smallest.revenue12m / totR * 100).toFixed(1);
    if (parseFloat(smallShare) < 5) {
      parts.push(smallest.name + ' is a niche segment (' + smallShare + '% revenue share).');
    }

    // Revenue vs unit share divergence (indicates pricing differences)
    segs.forEach(function(s) {
      var uPct = s.units12m / totU * 100;
      var rPct = s.revenue12m / totR * 100;
      if (rPct - uPct > 10) {
        parts.push(s.name + ' captures ' + rPct.toFixed(1) + '% of revenue with only ' + uPct.toFixed(1) + '% of units \u2014 higher price point.');
      } else if (uPct - rPct > 10) {
        parts.push(s.name + ' has ' + uPct.toFixed(1) + '% of units but only ' + rPct.toFixed(1) + '% of revenue \u2014 lower price point.');
      }
    });

    return parts.join(' ');
  }

  // ── Revenue & Units pies ──
  h += '<div class="g2" style="align-items:start">';
  h += '<div class="card"><h3>Revenue by Segment (12M)</h3><div class="cw" style="height:280px"><canvas id="tmFocusRevPie"></canvas></div>';
  h += '<div class="note">Revenue figures = 12M units \u00d7 listed ASIN price.</div></div>';
  h += '<div class="card"><h3>Units by Segment (12M)</h3><div class="cw" style="height:280px"><canvas id="tmFocusUnitsPie"></canvas></div>';
  h += '<div class="note">Unit volumes by segment (12M).</div></div>';
  h += '</div>';

  // ── Segment Summary table ──
  h += '<div class="card"><h3>Segment Summary (12M)</h3>';
  h += '<div class="tbl-wrap"><table class="num-right" id="tmSegTable">';
  h += '<thead><tr><th style="text-align:left">Segment</th><th>Units (12M)</th><th>Revenue (12M)</th><th>Unit Share</th><th>Rev Share</th></tr></thead>';
  h += '<tbody>';
  segments.forEach(function(seg) {
    var uShare = (seg.units12m / totalUnits * 100).toFixed(1);
    var rShare = (seg.revenue12m / totalRev * 100).toFixed(1);
    h += '<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + seg.color + ';margin-right:6px"></span>' + seg.name + '</td>';
    h += '<td data-val="' + seg.units12m + '">' + seg.units12m.toLocaleString() + '</td>';
    h += '<td data-val="' + seg.revenue12m + '">' + cur + seg.revenue12m.toLocaleString() + '</td>';
    h += '<td data-val="' + uShare + '">' + uShare + '%</td>';
    h += '<td data-val="' + rShare + '">' + rShare + '%</td></tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="note">Revenue = 12M units \u00d7 listed ASIN price.</div></div>';

  // ── Brand Share by Segment — Units ──
  var brandsBySegment = C.brandsBySegment || {};
  h += '<div class="g2" style="align-items:start;margin-top:18px">';
  segments.forEach(function(seg) {
    var bd = brandsBySegment[seg.name];
    if (!bd || bd.length === 0) return;
    h += '<div class="card"><h3>Brand Share \u2014 ' + seg.name + ' (Units, 12M)</h3>';
    h += '<div class="cw" style="height:340px"><canvas id="tmBrand' + seg.name.replace(/\s/g,'') + 'UnitPie"></canvas></div>';
    h += '<div class="note">' + seg.name + ' segment. ' + seg.units12m.toLocaleString() + ' total units (12M). ' + seg.asins + ' ASINs.</div></div>';
  });
  h += '</div>';

  // ── Brand Share by Segment — Revenue ──
  h += '<div class="g2" style="align-items:start">';
  segments.forEach(function(seg) {
    var bd = brandsBySegment[seg.name];
    if (!bd || bd.length === 0) return;
    h += '<div class="card"><h3>Brand Share \u2014 ' + seg.name + ' (Revenue, 12M)</h3>';
    h += '<div class="cw" style="height:340px"><canvas id="tmBrand' + seg.name.replace(/\s/g,'') + 'RevPie"></canvas></div>';
    h += '<div class="note">' + seg.name + ' segment. ' + fmtMoney(seg.revenue12m) + ' total revenue (12M). ' + seg.asins + ' ASINs.</div></div>';
  });
  h += '</div>';

  // ── Segment × Marketplace heatmap (revenue + units, 12M) ──
  // Skipped when only one marketplace is present (single-market dashboards).
  var heatProducts = (C.products || []).filter(function(p) { return p.marketplace; });
  var uniqueMarkets = {};
  heatProducts.forEach(function(p) { uniqueMarkets[p.marketplace] = true; });
  if (heatProducts.length > 0 && Object.keys(uniqueMarkets).length > 1) {
    var marketSet = {};
    heatProducts.forEach(function(p) { marketSet[p.marketplace] = (marketSet[p.marketplace] || 0) + p.revenue12m; });
    var markets = Object.keys(marketSet).sort(function(a, b) { return marketSet[b] - marketSet[a]; });

    function buildPivot(metric) {
      var grid = {};
      var colTotals = {}; var rowTotals = {}; var grandTotal = 0;
      segments.forEach(function(seg) { grid[seg.name] = {}; rowTotals[seg.name] = 0; });
      markets.forEach(function(m) { colTotals[m] = 0; });
      heatProducts.forEach(function(p) {
        var seg = p.type || 'Other';
        if (!grid[seg]) { grid[seg] = {}; rowTotals[seg] = 0; }
        grid[seg][p.marketplace] = (grid[seg][p.marketplace] || 0) + p[metric];
        rowTotals[seg] += p[metric];
        colTotals[p.marketplace] += p[metric];
        grandTotal += p[metric];
      });
      return { grid: grid, rowTotals: rowTotals, colTotals: colTotals, grandTotal: grandTotal };
    }

    function maxCellValue(pivot) {
      var max = 0;
      Object.keys(pivot.grid).forEach(function(seg) {
        markets.forEach(function(m) {
          var v = pivot.grid[seg][m] || 0;
          if (v > max) max = v;
        });
      });
      return max;
    }

    function heatColor(v, max) {
      if (!v || max === 0) return '#ffffff';
      var ratio = v / max;
      if (ratio >= 0.8) return '#1e40af';
      if (ratio >= 0.6) return '#3b82f6';
      if (ratio >= 0.4) return '#93c5fd';
      if (ratio >= 0.2) return '#dbeafe';
      return '#eff6ff';
    }
    function heatTextColor(v, max) {
      if (!v || max === 0) return '#cbd5e1';
      return (v / max) >= 0.6 ? '#fff' : '#1e293b';
    }

    function renderHeatTable(title, fmt, metric) {
      var pivot = buildPivot(metric);
      var max = maxCellValue(pivot);
      var s = '<div class="card" style="margin-top:18px"><h3>' + title + '</h3>';
      s += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.78rem">';
      s += '<thead><tr><th style="text-align:left;padding:8px 12px;background:#f8fafc;font-size:.65rem;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #e2e8f0">Segment</th>';
      markets.forEach(function(m) {
        s += '<th style="text-align:right;padding:8px 12px;background:#f8fafc;font-size:.65rem;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #e2e8f0">' + m + '</th>';
      });
      s += '<th style="text-align:right;padding:8px 12px;background:#f8fafc;font-size:.65rem;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #e2e8f0">Total</th>';
      s += '</tr></thead><tbody>';
      var sortedSegs = Object.keys(pivot.rowTotals).sort(function(a, b) { return pivot.rowTotals[b] - pivot.rowTotals[a]; });
      sortedSegs.forEach(function(segName) {
        s += '<tr><td style="text-align:left;padding:8px 12px;font-weight:600;color:#1e293b;border-bottom:1px solid #f1f5f9">' + segName + '</td>';
        markets.forEach(function(m) {
          var v = pivot.grid[segName][m] || 0;
          var bg = heatColor(v, max);
          var fg = heatTextColor(v, max);
          s += '<td style="text-align:right;padding:8px 12px;background:' + bg + ';color:' + fg + ';font-weight:600;border-bottom:1px solid #f1f5f9">' + (v > 0 ? fmt(v) : '<span style="color:#cbd5e1">—</span>') + '</td>';
        });
        s += '<td style="text-align:right;padding:8px 12px;font-weight:700;color:#0f172a;border-bottom:1px solid #f1f5f9;background:#f8fafc">' + fmt(pivot.rowTotals[segName]) + '</td>';
        s += '</tr>';
      });
      s += '<tr style="background:#f8fafc"><td style="text-align:left;padding:10px 12px;font-weight:700;color:#0f172a;border-top:2px solid #e2e8f0">Total</td>';
      markets.forEach(function(m) {
        s += '<td style="text-align:right;padding:10px 12px;font-weight:700;color:#0f172a;border-top:2px solid #e2e8f0">' + fmt(pivot.colTotals[m]) + '</td>';
      });
      s += '<td style="text-align:right;padding:10px 12px;font-weight:700;color:#0f172a;border-top:2px solid #e2e8f0">' + fmt(pivot.grandTotal) + '</td>';
      s += '</tr></tbody></table></div></div>';
      return s;
    }

    h += renderHeatTable('Revenue by Segment & Marketplace \u2014 12M', fmtMoney, 'revenue12m');
    h += renderHeatTable('Units by Segment & Marketplace \u2014 12M', function(v) { return fmtUnits(v); }, 'units12m');
  }

  // ── Seasonality chart ──
  if (seasonality && seasonality.orderedIndices) {
    h += '<div class="card" style="margin-top:18px"><h3>Monthly Seasonality Index (1.0 = average month)</h3>';
    h += '<div class="cw" style="height:260px"><canvas id="tmSeasIdxChart"></canvas></div>';
    h += '<div class="note">Built from ' + salesFilesFound + ' ASINs with full daily sales history. Months ordered from export month (' + exportMonthName + '). Index above 1.0 = above-average month, below 1.0 = below-average. Used to project 12M units for ASINs without sales history (baseline = 30d ÷ export-month index, then × sum of all 12 indices).</div></div>';
  }

  // ── Methodology note (auto-generated) ──
  h += '<div class="note" style="margin-top:18px">';
  h += '<strong>Data source:</strong> Helium 10 X-Ray (30-day snapshot, ' + exportMonthName + ') + per-ASIN daily sales CSVs. ';
  if (salesFilesFound > 0) {
    h += '<strong>Methodology:</strong> ' + salesFilesFound + ' ASINs with sales history \u2014 12M units summed from actual daily data. ';
    if (salesFilesMissing > 0) {
      h += salesFilesMissing + ' ASINs without sales files \u2014 projected using category seasonality index (derived from ASINs with data). ';
    }
  } else {
    h += '<strong>Methodology:</strong> 30-day X-Ray \u00d712 flat projection (no sales data available). ';
  }
  h += 'Revenue = 12M units \u00d7 listed ASIN price. ';
  h += totalAsins + ' ASINs across ' + segments.length + ' segments (' + segNames.join(', ') + ').';
  h += '</div>';

  root.innerHTML = h;

  // ═══ CHART RENDERING ═══
  Chart.register(ChartDataLabels);

  var PALETTE = ['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#ea580c','#059669','#e11d48','#8b5cf6','#94a3b8'];

  function makePie(id, labels, data, colors, fmtLeg, fmtTip) {
    var el = document.getElementById(id);
    if (!el) return;
    var total = data.reduce(function(a, b) { return a + b; }, 0);
    new Chart(el, {
      type: 'doughnut',
      data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
      options: {
        maintainAspectRatio: false, cutout: '48%',
        plugins: {
          legend: {
            position: 'right',
            labels: {
              font: { size: 10.5 }, padding: 7, boxWidth: 11, boxHeight: 11,
              generateLabels: function(chart) {
                return chart.data.labels.map(function(label, i) {
                  var val = chart.data.datasets[0].data[i];
                  var pct = (val / total * 100).toFixed(1);
                  return { text: label + '  ' + (fmtLeg ? fmtLeg(val) : pct + '%'), fillStyle: colors[i], strokeStyle: colors[i], lineWidth: 0, index: i, hidden: false };
                });
              }
            }
          },
          tooltip: { callbacks: { label: function(ctx) { var pct = (ctx.parsed / total * 100).toFixed(1); return fmtTip ? ' ' + fmtTip(ctx.parsed) + ' (' + pct + '%)' : ' ' + pct + '%'; } } },
          datalabels: {
            display: function(ctx) { return (ctx.dataset.data[ctx.dataIndex] / total * 100) >= 5; },
            formatter: function(v) { return (v / total * 100).toFixed(1) + '%'; },
            color: '#fff', font: { size: 10.5, weight: '700' }
          }
        }
      }
    });
  }

  // Segment pies
  makePie('tmFocusRevPie', segNames, segRevenue, segColors,
    function(v) { return fmtMoney(v); }, function(v) { return cur + v.toLocaleString(); });
  makePie('tmFocusUnitsPie', segNames, segUnits, segColors,
    function(v) { return v.toLocaleString(); }, function(v) { return v.toLocaleString() + ' units'; });

  // Brand pies per segment — each pie is sorted by its own metric so the largest
  // slice always appears first. "Other" is pinned last. Colors are keyed by brand
  // name so the same brand has the same color across the units and revenue pies.
  segments.forEach(function(seg) {
    var bd = brandsBySegment[seg.name];
    if (!bd || bd.length === 0) return;

    var brandColorMap = {};
    bd.forEach(function(b, i) { brandColorMap[b.name] = PALETTE[i % PALETTE.length]; });

    function sortForPie(arr, metric) {
      return arr.slice().sort(function(a, b) {
        if (a.name === 'Other') return 1;
        if (b.name === 'Other') return -1;
        return b[metric] - a[metric];
      });
    }

    var unitSorted = sortForPie(bd, 'units');
    var revSorted  = sortForPie(bd, 'rev');

    makePie('tmBrand' + seg.name.replace(/\s/g,'') + 'UnitPie',
      unitSorted.map(function(b) { return b.name; }),
      unitSorted.map(function(b) { return b.units; }),
      unitSorted.map(function(b) { return brandColorMap[b.name]; }),
      function(v) { return v.toLocaleString(); }, function(v) { return v.toLocaleString() + ' units'; });

    makePie('tmBrand' + seg.name.replace(/\s/g,'') + 'RevPie',
      revSorted.map(function(b) { return b.name; }),
      revSorted.map(function(b) { return b.rev; }),
      revSorted.map(function(b) { return brandColorMap[b.name]; }),
      function(v) { return fmtMoney(v); }, function(v) { return cur + v.toLocaleString(); });
  });

  // Seasonality bar chart
  if (seasonality && seasonality.orderedIndices) {
    var seasEl = document.getElementById('tmSeasIdxChart');
    if (seasEl) {
      var seasColors = seasonality.orderedIndices.map(function(v) {
        return v >= 1.15 ? '#16a34a' : v >= 0.95 ? '#3b82f6' : v >= 0.75 ? '#f59e0b' : '#dc2626';
      });
      new Chart(seasEl, {
        type: 'bar',
        data: {
          labels: seasonality.orderedMonths,
          datasets: [{
            data: seasonality.orderedIndices.map(function(v) { return Math.round(v * 100) / 100; }),
            backgroundColor: seasColors,
            borderRadius: 4,
            borderSkipped: false,
          }]
        },
        options: {
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: function(ctx) { return 'Index: ' + ctx.parsed.y.toFixed(2); } } },
            datalabels: {
              anchor: 'end', align: 'end',
              formatter: function(v) { return v.toFixed(2); },
              font: { size: 10, weight: '600' }, color: '#1e293b'
            }
          },
          layout: { padding: { top: 18 } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 11 } } },
            y: {
              beginAtZero: true,
              grid: { color: '#e2e8f0' },
              ticks: { stepSize: 0.25, font: { size: 10 } },
              title: { display: true, text: 'Seasonality Index', font: { size: 11 } }
            }
          }
        }
      });
    }
  }

  // Make all tables sortable
  DataEngine.makeAllTablesSortable(root);
})();
</script>
</template>
<template id="tpl-market-structure"><!-- Market Structure Tab Template -->
<div id="ms-root"></div>

<script>
(function msInit() {
  var dashData = window._DASH_DATA;
  var root = document.getElementById('ms-root');

  if (!dashData || !dashData._computed || !dashData._computed.segments) {
    root.innerHTML = '<div class="card"><h3>Market Structure</h3><p style="color:#64748b;font-size:.85rem">No X-Ray data loaded.</p></div>';
    return;
  }

  var C = dashData._computed;
  var cur = C.currency || '$';
  var segments = C.segments;
  var PALETTE = DataEngine.SEGMENT_PALETTE;
  var BRAND_PALETTE = ['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#ea580c','#059669','#e11d48','#8b5cf6','#94a3b8'];

  Chart.register(ChartDataLabels);

  // ── Build segment sub-tab selector ──
  var h = '<h2>Market Structure (12M)</h2>';

  h += '<div class="seg-tab-btns" id="msSegBtns">';
  segments.forEach(function(seg, i) {
    h += '<button class="seg-tab-btn' + (i === 0 ? ' active' : '') + '" data-seg="' + i + '" style="border-color:' + seg.color + '">' + seg.name + ' <span style="font-weight:400;color:#94a3b8">(' + seg.asins + ')</span></button>';
  });
  h += '</div>';

  // ── One panel per segment ──
  segments.forEach(function(seg, si) {
    var pid = 'ms-seg-' + si;
    h += '<div id="' + pid + '" class="ms-seg-panel" style="' + (si > 0 ? 'display:none' : '') + '">';
    h += buildSegmentPanel(seg, si);
    h += '</div>';
  });

  root.innerHTML = h;

  // ── Wire segment sub-tab switching ──
  var btns = root.querySelectorAll('.seg-tab-btn');
  btns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var idx = parseInt(btn.dataset.seg);
      btns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      root.querySelectorAll('.ms-seg-panel').forEach(function(p, i) {
        p.style.display = i === idx ? 'block' : 'none';
      });
      // Resize charts in newly visible panel
      Object.values(Chart.instances).forEach(function(c) { c.resize(); });
    });
  });

  // ── Render charts for first (visible) segment ──
  renderSegmentCharts(segments[0], 0);

  // Make all tables sortable
  DataEngine.makeAllTablesSortable(root);

  // Lazy-render charts for other segments on first switch
  var renderedSegs = { 0: true };
  btns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var idx = parseInt(btn.dataset.seg);
      if (!renderedSegs[idx]) {
        renderSegmentCharts(segments[idx], idx);
        // Make tables in newly rendered segment sortable
        var panel = document.getElementById('ms-seg-' + idx);
        if (panel) DataEngine.makeAllTablesSortable(panel);
        renderedSegs[idx] = true;
      }
    });
  });

  // ══════════════════════════════════════════════════════════════════════════
  // BUILD SEGMENT PANEL HTML
  // ══════════════════════════════════════════════════════════════════════════
  function buildSegmentPanel(seg, si) {
    var products = seg.products;
    var totalSegRev = seg.revenue12m;
    var totalSegUnits = seg.units12m;
    var prefix = 'ms' + si;
    var s = '';

    // ── Concentration KPIs ──
    var sorted = products.slice().sort(function(a, b) { return b.revenue12m - a.revenue12m; });
    var top1Share = sorted.length > 0 ? (sorted[0].revenue12m / totalSegRev * 100) : 0;
    var top3Rev = sorted.slice(0, 3).reduce(function(a, p) { return a + p.revenue12m; }, 0);
    var top5Rev = sorted.slice(0, 5).reduce(function(a, p) { return a + p.revenue12m; }, 0);
    var top10Rev = sorted.slice(0, 10).reduce(function(a, p) { return a + p.revenue12m; }, 0);

    // Top brand
    var brandMap = {};
    products.forEach(function(p) {
      brandMap[p.brand] = (brandMap[p.brand] || 0) + p.revenue12m;
    });
    var topBrand = Object.keys(brandMap).sort(function(a, b) { return brandMap[b] - brandMap[a]; })[0] || '';
    var topBrandShare = topBrand ? (brandMap[topBrand] / totalSegRev * 100) : 0;

    s += '<div class="kpis" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">';
    s += '<div class="kpi"><div class="kpi-v">' + top1Share.toFixed(1) + '%</div><div class="kpi-l">Top 1 ASIN Revenue Share</div></div>';
    s += '<div class="kpi"><div class="kpi-v">' + (top3Rev / totalSegRev * 100).toFixed(1) + '%</div><div class="kpi-l">Top 3 ASINs Share</div></div>';
    s += '<div class="kpi"><div class="kpi-v">' + (top5Rev / totalSegRev * 100).toFixed(1) + '%</div><div class="kpi-l">Top 5 ASINs Share</div></div>';
    s += '<div class="kpi"><div class="kpi-v">' + (top10Rev / totalSegRev * 100).toFixed(1) + '%</div><div class="kpi-l">Top 10 ASINs Share</div></div>';
    s += '<div class="kpi"><div class="kpi-v">' + topBrandShare.toFixed(1) + '%</div><div class="kpi-l">Top Brand (' + topBrand + ')</div></div>';
    s += '</div>';

    // ── Auto-generated insight ──
    var hhi = 0;
    products.forEach(function(p) {
      var share = p.revenue12m / totalSegRev;
      hhi += share * share;
    });
    hhi = Math.round(hhi * 10000);
    var concentration = hhi > 2500 ? 'Highly concentrated' : hhi > 1500 ? 'Moderately concentrated' : 'Competitive / fragmented';
    s += '<div class="insight">';
    s += '<strong>' + seg.name + ' segment:</strong> ' + seg.asins + ' ASINs, ' + DataEngine.fmtMoney(totalSegRev, cur) + ' revenue (12M). ';
    s += concentration + ' market (HHI: ' + hhi.toLocaleString() + '). ';
    s += 'Top brand: ' + topBrand + ' (' + topBrandShare.toFixed(1) + '% revenue share). ';
    s += 'Top ASIN captures ' + top1Share.toFixed(1) + '% of segment revenue.';
    s += '</div>';

    // ── Brand pies (units + revenue) ──
    s += '<div class="g2" style="align-items:start">';
    s += '<div class="card"><h3>Brand Share \u2014 Units (12M)</h3><div class="cw" style="height:340px"><canvas id="' + prefix + 'BrandUnitPie"></canvas></div></div>';
    s += '<div class="card"><h3>Brand Share \u2014 Revenue (12M)</h3><div class="cw" style="height:340px"><canvas id="' + prefix + 'BrandRevPie"></canvas></div></div>';
    s += '</div>';

    // ── Price vs Revenue scatter ──
    s += '<div class="card"><h3>Price vs Revenue (12M) \u2014 ' + seg.name + '</h3>';
    s += '<div class="cw" style="height:320px"><canvas id="' + prefix + 'PriceScatter"></canvas></div>';
    s += '<div class="note">Bubble size = 12M units. X = listed price. Y = 12M revenue.</div></div>';

    // ── Brand Summary table ──
    s += '<div class="card"><h3>Brand Summary \u2014 ' + seg.name + ' (12M)</h3>';
    s += '<div class="tbl-wrap"><table class="num-right" id="' + prefix + 'BrandTable">';
    s += '<thead><tr><th style="text-align:left">Brand</th><th>Rev (12M)</th><th>Share</th><th>Units (12M)</th><th>ASINs</th><th>Avg Rating</th><th>Total Reviews</th></tr></thead>';
    s += '<tbody>';

    var brands = DataEngine.aggregateByBrand(products);
    brands.forEach(function(b) {
      var bProducts = products.filter(function(p) { return p.brand === b.name; });
      var avgRating = bProducts.length > 0 ? bProducts.reduce(function(a, p) { return a + p.rating; }, 0) / bProducts.length : 0;
      var totalReviews = bProducts.reduce(function(a, p) { return a + p.reviewCount; }, 0);
      var share = totalSegRev > 0 ? (b.rev / totalSegRev * 100).toFixed(1) : '0.0';

      s += '<tr>';
      s += '<td>' + b.name + '</td>';
      s += '<td data-val="' + b.rev + '">' + DataEngine.fmtMoney(b.rev, cur) + '</td>';
      s += '<td data-val="' + share + '">' + share + '%</td>';
      s += '<td data-val="' + b.units + '">' + b.units.toLocaleString() + '</td>';
      s += '<td data-val="' + b.asins + '">' + b.asins + '</td>';
      s += '<td data-val="' + avgRating.toFixed(2) + '">' + avgRating.toFixed(1) + '</td>';
      s += '<td data-val="' + totalReviews + '">' + totalReviews.toLocaleString() + '</td>';
      s += '</tr>';
    });
    s += '</tbody></table></div></div>';

    // ── Top ASINs table ──
    s += '<div class="card"><h3>Top ASINs \u2014 ' + seg.name + ' by Revenue (12M)</h3>';
    s += '<div class="tbl-wrap"><table class="num-right" id="' + prefix + 'AsinTable">';
    s += '<thead><tr><th style="text-align:left">ASIN</th><th style="text-align:left">Brand</th><th style="text-align:left">Title</th><th>Price</th><th>Units (12M)</th><th>Revenue (12M)</th><th>Rev Share</th><th>Rating</th><th>Reviews</th></tr></thead>';
    s += '<tbody>';

    var top20 = sorted.slice(0, 20);
    top20.forEach(function(p) {
      var share = totalSegRev > 0 ? (p.revenue12m / totalSegRev * 100).toFixed(1) : '0.0';
      var shortTitle = p.title.length > 60 ? p.title.substring(0, 57) + '...' : p.title;
      s += '<tr>';
      s += '<td><a href="https://www.amazon.com/dp/' + p.asin + '" target="_blank">' + p.asin + '</a></td>';
      s += '<td>' + p.brand + '</td>';
      s += '<td style="max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left" title="' + p.title.replace(/"/g, '&quot;') + '">' + shortTitle + '</td>';
      s += '<td data-val="' + p.price + '">' + cur + p.price.toFixed(2) + '</td>';
      s += '<td data-val="' + p.units12m + '">' + p.units12m.toLocaleString() + '</td>';
      s += '<td data-val="' + p.revenue12m + '">' + DataEngine.fmtMoney(p.revenue12m, cur) + '</td>';
      s += '<td data-val="' + share + '">' + share + '%</td>';
      s += '<td data-val="' + p.rating + '">' + p.rating.toFixed(1) + '</td>';
      s += '<td data-val="' + p.reviewCount + '">' + p.reviewCount.toLocaleString() + '</td>';
      s += '</tr>';
    });
    s += '</tbody></table></div>';
    s += '<div class="note">' + seg.name + ' segment \u2014 top ' + Math.min(20, sorted.length) + ' of ' + seg.asins + ' ASINs by 12M revenue. Revenue = 12M units \u00d7 listed price.</div>';
    s += '</div>';

    return s;
  }

  // ══════════════════════════════════════════════════════════════════════════
  // RENDER CHARTS FOR A SEGMENT
  // ══════════════════════════════════════════════════════════════════════════
  function renderSegmentCharts(seg, si) {
    var prefix = 'ms' + si;
    var products = seg.products;
    var totalSegRev = seg.revenue12m;
    var totalSegUnits = seg.units12m;

    // ── Brand pies ──
    // Each pie is sorted by its own metric (units for the unit pie, revenue for the
    // revenue pie). "Other" is always pinned last regardless of size. Brand colors are
    // keyed by brand name so the same brand has the same color in both pies.
    var brands = DataEngine.topBrandsWithOther(DataEngine.aggregateByBrand(products), 8);
    var brandColorMap = {};
    brands.forEach(function(b, i) { brandColorMap[b.name] = BRAND_PALETTE[i % BRAND_PALETTE.length]; });

    function sortForPie(arr, metric) {
      return arr.slice().sort(function(a, b) {
        if (a.name === 'Other') return 1;
        if (b.name === 'Other') return -1;
        return b[metric] - a[metric];
      });
    }

    var unitSorted = sortForPie(brands, 'units');
    var revSorted  = sortForPie(brands, 'rev');

    makePie(prefix + 'BrandUnitPie',
      unitSorted.map(function(b) { return b.name; }),
      unitSorted.map(function(b) { return b.units; }),
      unitSorted.map(function(b) { return brandColorMap[b.name]; }),
      function(v) { return v.toLocaleString(); }, function(v) { return v.toLocaleString() + ' units'; });

    makePie(prefix + 'BrandRevPie',
      revSorted.map(function(b) { return b.name; }),
      revSorted.map(function(b) { return b.rev; }),
      revSorted.map(function(b) { return brandColorMap[b.name]; }),
      function(v) { return DataEngine.fmtMoney(v, cur); }, function(v) { return cur + v.toLocaleString(); });

    // ── Price vs Revenue scatter ──
    var scatterEl = document.getElementById(prefix + 'PriceScatter');
    if (scatterEl) {
      var scatterData = products.map(function(p) {
        return { x: p.price, y: p.revenue12m, r: Math.max(3, Math.min(25, Math.sqrt(p.units12m / 500))), label: p.brand };
      });

      // Group by brand for coloring
      var brandGroups = {};
      products.forEach(function(p, i) {
        if (!brandGroups[p.brand]) brandGroups[p.brand] = [];
        brandGroups[p.brand].push(scatterData[i]);
      });

      var datasets = Object.keys(brandGroups).slice(0, 10).map(function(brand, i) {
        return {
          label: brand,
          data: brandGroups[brand],
          backgroundColor: BRAND_PALETTE[i % BRAND_PALETTE.length] + '99',
          borderColor: BRAND_PALETTE[i % BRAND_PALETTE.length]
        };
      });

      new Chart(scatterEl, {
        type: 'bubble',
        data: { datasets: datasets },
        options: {
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { font: { size: 10 }, padding: 8, boxWidth: 10 } },
            datalabels: { display: false },
            tooltip: {
              callbacks: {
                label: function(ctx) {
                  var d = ctx.raw;
                  return d.label + ': ' + cur + d.x.toFixed(2) + ' price, ' + DataEngine.fmtMoney(d.y, cur) + ' rev';
                }
              }
            }
          },
          scales: {
            x: { title: { display: true, text: 'Price (' + cur + ')' }, grid: { color: '#f1f5f9' } },
            y: { title: { display: true, text: 'Revenue (12M)' }, ticks: { callback: function(v) { return DataEngine.fmtMoney(v, cur); } }, grid: { color: '#f1f5f9' } }
          }
        }
      });
    }
  }

  // ── Shared pie helper ──
  function makePie(id, labels, data, colors, fmtLeg, fmtTip) {
    var el = document.getElementById(id);
    if (!el) return;
    var total = data.reduce(function(a, b) { return a + b; }, 0);
    new Chart(el, {
      type: 'doughnut',
      data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
      options: {
        maintainAspectRatio: false, cutout: '48%',
        plugins: {
          legend: {
            position: 'right',
            labels: {
              font: { size: 10.5 }, padding: 7, boxWidth: 11, boxHeight: 11,
              generateLabels: function(chart) {
                return chart.data.labels.map(function(label, i) {
                  var val = chart.data.datasets[0].data[i];
                  var pct = (val / total * 100).toFixed(1);
                  return { text: label + '  ' + (fmtLeg ? fmtLeg(val) : pct + '%'), fillStyle: colors[i], strokeStyle: colors[i], lineWidth: 0, index: i, hidden: false };
                });
              }
            }
          },
          tooltip: { callbacks: { label: function(ctx) { var pct = (ctx.parsed / total * 100).toFixed(1); return fmtTip ? ' ' + fmtTip(ctx.parsed) + ' (' + pct + '%)' : ' ' + pct + '%'; } } },
          datalabels: {
            display: function(ctx) { return (ctx.dataset.data[ctx.dataIndex] / total * 100) >= 5; },
            formatter: function(v) { return (v / total * 100).toFixed(1) + '%'; },
            color: '#fff', font: { size: 10.5, weight: '700' }
          }
        }
      }
    });
  }

})();
</script>
</template>
<template id="tpl-reviews"><!-- Reviews VOC Tab Template -->
<div id="voc-root"></div>

<script>
(function vocInit() {
  var D = window._TAB_DATA;
  var root = document.getElementById('voc-root');

  console.log('[reviews] _TAB_DATA:', D ? 'exists, totalReviews=' + D.totalReviews : 'NULL');
  console.log('[reviews] _DASH_DATA:', window._DASH_DATA ? 'exists' : 'NULL');
  console.log('[reviews] _DASH_DATA.baseTabs.reviews:', window._DASH_DATA && window._DASH_DATA.baseTabs ? (window._DASH_DATA.baseTabs.reviews ? 'exists' : 'NULL') : 'no baseTabs');

  // Fallback: if _TAB_DATA is null, try getting it from _DASH_DATA directly
  if (!D && window._DASH_DATA && window._DASH_DATA.baseTabs && window._DASH_DATA.baseTabs.reviews) {
    D = window._DASH_DATA.baseTabs.reviews;
    console.log('[reviews] Fallback to _DASH_DATA.baseTabs.reviews, totalReviews=' + D.totalReviews);
  }

  if (!D || !D.totalReviews) {
    root.innerHTML = '<div class="card"><h3>Reviews</h3><p style="color:#64748b;font-size:.85rem">No review data loaded. Populate <code>baseTabs.reviews</code> in dashboard.json with VOC_DATA structure.</p></div>';
    return;
  }

  var STAR_COLORS = { 1: '#dc2626', 2: '#ea580c', 3: '#f59e0b', 4: '#22c55e', 5: '#16a34a' };

  // Bar width helper — must be before HTML building
  function bw(pctStr, maxPct) {
    var v = parseFloat(pctStr);
    return Math.round(v / maxPct * 100) + '%';
  }

  var h = '';

  // ── KPI ROW ──
  var total = D.totalReviews;
  var pos = D.starDist[3] + D.starDist[4];
  var neg = D.starDist[0] + D.starDist[1] + D.starDist[2];
  var posPct = (pos / total * 100).toFixed(1);
  var negPct = (neg / total * 100).toFixed(1);
  var ratio = neg > 0 ? (pos / neg).toFixed(1) : 'N/A';

  h += '<div class="kpis">';
  h += '<div class="kpi"><div class="kpi-v">' + total.toLocaleString() + '</div><div class="kpi-l">Total Reviews</div></div>';
  h += '<div class="kpi"><div class="kpi-v">' + ratio + ' : 1</div><div class="kpi-l">Sentiment Ratio (pos:neg)</div></div>';
  h += '<div class="kpi"><div class="kpi-v" style="color:#16a34a">' + posPct + '%</div><div class="kpi-l">Positive (4\u2605+5\u2605)</div></div>';
  h += '<div class="kpi"><div class="kpi-v" style="color:#dc2626">' + negPct + '%</div><div class="kpi-l">Negative (1\u2605\u20133\u2605)</div></div>';
  h += '</div>';

  // ── Star Distribution Bar ──
  var dist = D.starDist;
  h += '<div class="card" style="padding:12px 16px;margin-bottom:20px">';
  h += '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">';
  h += '<div style="font-size:.78rem;font-weight:600;color:#475569;white-space:nowrap">Star Distribution</div>';
  h += '<div style="font-size:1.1rem;font-weight:800;color:#0f2942">' + D.avgRating.toFixed(2) + ' <span style="font-size:.7rem;font-weight:400;color:#64748b">avg</span></div>';
  h += '<div style="flex:1;display:flex;height:22px;border-radius:4px;overflow:hidden;min-width:200px">';
  dist.forEach(function(count, i) {
    var star = i + 1;
    var pct = (count / total * 100).toFixed(1);
    h += '<div style="width:' + pct + '%;background:' + STAR_COLORS[star] + ';display:flex;align-items:center;justify-content:center;color:#fff;font-size:.68rem;font-weight:600">' + (parseFloat(pct) >= 5 ? pct + '%' : '') + '</div>';
  });
  h += '</div>';
  h += '<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:.68rem;color:#475569">';
  dist.forEach(function(count, i) {
    h += '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + STAR_COLORS[i+1] + ';margin-right:3px"></span>' + (i+1) + '\u2605 ' + count + '</span>';
  });
  h += '</div></div></div>';

  // ── Sub-tab bar ──
  h += '<div class="voc-sub-tabs">';
  h += '<div class="voc-sub-tab active" data-panel="voc-ci">Customer Insights</div>';
  h += '<div class="voc-sub-tab" data-panel="voc-ca">Review Browser</div>';
  h += '</div>';

  // ══════════ SUB-PANEL: Customer Insights ══════════
  h += '<div id="voc-ci" class="voc-sub-panel active">';

  // Anchor navigation
  h += '<div class="voc-anchor-nav">';
  h += '<a href="#voc-sec-cp" class="active" data-target="voc-sec-cp">Customer Profile</a>';
  h += '<a href="#voc-sec-us" data-target="voc-sec-us">Usage Scenario</a>';
  h += '<a href="#voc-sec-cs" data-target="voc-sec-cs">Customer Sentiment</a>';
  h += '<a href="#voc-sec-bm" data-target="voc-sec-bm">Buyers Motivation</a>';
  h += '<a href="#voc-sec-ce" data-target="voc-sec-ce">Customer Expectations</a>';
  h += '</div>';

  // ── Customer Profile ──
  h += '<div id="voc-sec-cp">';
  h += '<div class="sec-header"><div class="sec-title">Customer Profile</div></div>';
  if (D.cpSummary) h += '<div class="sec-summary">' + D.cpSummary + '</div>';
  h += '<div class="cp-charts">';
  h += '<div class="cp-chart-box"><h4>Who</h4><div class="cp-chart-wrap"><canvas id="vocCpWho"></canvas></div></div>';
  h += '<div class="cp-chart-box"><h4>When</h4><div class="cp-chart-wrap"><canvas id="vocCpWhen"></canvas></div></div>';
  h += '<div class="cp-chart-box"><h4>Where</h4><div class="cp-chart-wrap"><canvas id="vocCpWhere"></canvas></div></div>';
  h += '<div class="cp-chart-box"><h4>What</h4><div class="cp-chart-wrap"><canvas id="vocCpWhat"></canvas></div></div>';
  h += '</div>';
  h += '<div class="cp-legend">\u25A0 reviews 4-5 stars \u00b7 <span style="color:#ef4444">\u25A0</span> reviews 1-3 stars</div>';
  h += '</div>';

  // ── Usage Scenario ──
  h += '<div id="voc-sec-us" style="margin-top:36px">';
  h += '<div class="sec-header"><div class="sec-title">Usage Scenario</div></div>';
  h += '<div class="card" style="padding:0;overflow:hidden"><table class="us-table"><thead><tr><th style="width:22%">Usage Scenario</th><th>Reason</th><th style="width:140px;text-align:right">Percentage</th></tr></thead><tbody>';
  if (D.usageScenarios) {
    var usMax = parseFloat(D.usageScenarios[0].pct);
    D.usageScenarios.forEach(function(s) {
      h += '<tr><td class="us-label">' + s.label + '</td><td class="us-reason">' + s.reason + '</td>';
      h += '<td class="us-pct"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(s.pct, usMax) + '"></div></div><span>' + s.pct + '</span></td></tr>';
    });
  }
  h += '</tbody></table></div></div>';

  // ── Customer Sentiment ──
  h += '<div id="voc-sec-cs" style="margin-top:36px">';
  h += '<div class="sec-header"><div class="sec-title">Customer Sentiment</div></div>';
  if (D.csSummary) h += '<div class="sec-summary">' + D.csSummary + '</div>';

  // Negative zone
  h += '<div class="cs-neg-zone">';
  h += '<div class="card" style="padding:0;overflow:hidden;border:1.5px solid #fecaca"><table class="us-table"><thead><tr style="background:#fef2f2"><th style="width:22%;border-left:3px solid #dc2626">Negative Feedback Topic</th><th>Reasons for Negative Feedback</th><th style="width:140px;text-align:right">Percentage</th></tr></thead><tbody id="vocNegBody"></tbody></table></div>';
  // Negative insights
  h += '<div class="card" style="margin-top:22px;border:1.5px solid #fca5a5"><div class="sec-header" style="margin-bottom:10px"><div class="sec-title">Negative Review Insights \u2014 Strategy</div></div>';
  h += '<table class="si-table"><thead><tr><th style="width:130px">Analysis Type</th><th>Finding (from 1\u2605+2\u2605 reviews)</th><th>Strategic Implication</th></tr></thead><tbody id="vocNegInsights"></tbody></table></div>';
  h += '</div>';

  // Positive zone
  h += '<div class="cs-pos-zone">';
  h += '<div class="card" style="padding:0;overflow:hidden;border:1.5px solid #bbf7d0"><table class="us-table"><thead><tr style="background:#f0fdf4"><th style="width:22%;border-left:3px solid #16a34a">Positive Feedback Topic</th><th>Reasons for Positive Feedback</th><th style="width:140px;text-align:right">Percentage</th></tr></thead><tbody id="vocPosBody"></tbody></table></div>';
  // Positive insights
  h += '<div class="card" style="margin-top:22px"><div class="sec-header" style="margin-bottom:10px"><div class="sec-title">Positive Review Insights \u2014 Strategy</div></div>';
  h += '<table class="si-table"><thead><tr><th style="width:130px">Analysis Type</th><th>Finding (from 4\u2605+5\u2605 reviews)</th><th>Strategic Implication</th></tr></thead><tbody id="vocPosInsights"></tbody></table></div>';
  h += '</div>';
  h += '</div>'; // end sec-cs

  // ── Buyers Motivation ──
  h += '<div id="voc-sec-bm" style="margin-top:36px">';
  h += '<div class="sec-header"><div class="sec-title">Buyers Motivation</div></div>';
  h += '<div class="card" style="padding:0;overflow:hidden"><table class="us-table"><thead><tr><th style="width:22%">Buyers Motivation</th><th>Reason</th><th style="width:140px;text-align:right">Percentage</th></tr></thead><tbody>';
  if (D.buyersMotivation) {
    var bmMax = parseFloat(D.buyersMotivation[0].pct);
    D.buyersMotivation.forEach(function(m) {
      h += '<tr><td class="us-label">' + m.label + '</td><td class="us-reason">' + m.reason + '</td>';
      h += '<td class="us-pct"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(m.pct, bmMax) + '"></div></div><span>' + m.pct + '</span></td></tr>';
    });
  }
  h += '</tbody></table></div></div>';

  // ── Customer Expectations ──
  h += '<div id="voc-sec-ce" style="margin-top:36px">';
  h += '<div class="sec-header"><div class="sec-title">Customer Expectations</div></div>';
  h += '<div class="card" style="padding:0;overflow:hidden"><table class="us-table"><thead><tr><th style="width:22%">Unmet Need</th><th>Reason</th><th style="width:140px;text-align:right">Percentage</th></tr></thead><tbody>';
  if (D.customerExpectations) {
    var ceMax = parseFloat(D.customerExpectations[0].pct);
    D.customerExpectations.forEach(function(e) {
      h += '<tr><td class="us-label">' + e.label + '</td><td class="us-reason">' + e.reason + '</td>';
      h += '<td class="us-pct"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(e.pct, ceMax) + '"></div></div><span>' + e.pct + '</span></td></tr>';
    });
  }
  h += '</tbody></table></div></div>';

  h += '</div>'; // end voc-ci

  // ══════════ SUB-PANEL: Review Browser ══════════
  h += '<div id="voc-ca" class="voc-sub-panel">';
  h += '<div class="card"><h3>Review Browser <span style="font-size:.72rem;font-weight:400;color:#64748b;margin-left:8px">Filter by rating, theme, or keyword</span></h3>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
  h += '<select id="vocFilterRating" style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 8px;background:#fff"><option value="">All Ratings</option><option value="1">1\u2605</option><option value="2">2\u2605</option><option value="3">3\u2605</option><option value="4">4\u2605</option><option value="5">5\u2605</option></select>';
  h += '<select id="vocFilterTheme" style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 8px;background:#fff"></select>';
  h += '<input id="vocFilterSearch" placeholder="Search keyword..." style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 8px;width:160px">';
  h += '<button id="vocClearBtn" style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 10px;background:#f8fafc;cursor:pointer">Clear</button>';
  h += '</div>';
  h += '<div id="vocResultCount" style="font-size:.72rem;color:#64748b;margin-bottom:6px"></div>';
  h += '<div class="tbl-wrap" style="max-height:520px"><table><thead><tr><th style="width:40px">\u2605</th><th>Review</th></tr></thead><tbody id="vocReviewBody"></tbody></table></div>';
  h += '</div></div>';

  root.innerHTML = h;

  // ══════════ RENDERING ══════════
  Chart.register(ChartDataLabels);

  // ── Sub-tab switching ──
  root.querySelectorAll('.voc-sub-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      root.querySelectorAll('.voc-sub-tab').forEach(function(t) { t.classList.remove('active'); });
      root.querySelectorAll('.voc-sub-panel').forEach(function(p) { p.classList.remove('active'); });
      tab.classList.add('active');
      var panel = document.getElementById(tab.dataset.panel);
      if (panel) panel.classList.add('active');
      Object.values(Chart.instances).forEach(function(c) { c.resize(); });
    });
  });

  // ── Anchor scroll ──
  root.querySelectorAll('.voc-anchor-nav a').forEach(function(a) {
    a.addEventListener('click', function(e) {
      e.preventDefault();
      var target = document.getElementById(a.dataset.target);
      if (target) {
        var y = target.getBoundingClientRect().top + window.pageYOffset - 90;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
      root.querySelectorAll('.voc-anchor-nav a').forEach(function(x) { x.classList.remove('active'); });
      a.classList.add('active');
    });
  });

  // ── Customer Profile stacked bars ──
  function makeStackedBar(canvasId, data) {
    var ctx = document.getElementById(canvasId);
    if (!ctx || !data) return;
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: data.labels,
        datasets: [
          { label: '4-5 stars', data: data.pos, backgroundColor: '#22c55e', borderRadius: { topLeft: 3, topRight: 3 }, barPercentage: 0.7 },
          { label: '1-3 stars', data: data.neg.map(function(v) { return -v; }), backgroundColor: '#ef4444', borderRadius: { bottomLeft: 3, bottomRight: 3 }, barPercentage: 0.7 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, datalabels: { display: false },
          tooltip: { callbacks: { label: function(ctx) { return ctx.dataset.label + ': ' + Math.abs(ctx.raw); } } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#64748b', maxRotation: 35 } },
          y: { grid: { color: '#f1f5f9', drawBorder: false }, ticks: { font: { size: 10 }, color: '#94a3b8', callback: function(v) { return Math.abs(v); } } }
        }
      }
    });
  }
  if (D.cpWho) makeStackedBar('vocCpWho', D.cpWho);
  if (D.cpWhen) makeStackedBar('vocCpWhen', D.cpWhen);
  if (D.cpWhere) makeStackedBar('vocCpWhere', D.cpWhere);
  if (D.cpWhat) makeStackedBar('vocCpWhat', D.cpWhat);

  // ── Negative topics (expandable rows) ──
  if (D.negativeTopics) {
    var negMax = parseFloat(D.negativeTopics[0].pct);
    var negHtml = '';
    D.negativeTopics.forEach(function(t) {
      var bullets = (t.bullets || []).map(function(b) { return '<li>' + b + '</li>'; }).join('');
      var quotes = (t.quotes || []).map(function(q) { return '<p>' + q + '</p>'; }).join('');
      negHtml += '<tr class="nf-row" style="cursor:pointer"><td class="us-label"><span class="nf-arrow">\u25B6</span> ' + t.label + '</td>';
      negHtml += '<td class="us-reason">' + t.reason + '</td>';
      negHtml += '<td class="us-pct"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(t.pct, negMax) + ';background:#fca5a5"></div></div><span>' + t.pct + '</span></td></tr>';
      negHtml += '<tr class="nf-detail"><td colspan="3"><div class="nf-body"><ul>' + bullets + '</ul><div class="nf-quotes">' + quotes + '</div></div></td></tr>';
    });
    document.getElementById('vocNegBody').innerHTML = negHtml;
  }

  // ── Negative insights ──
  if (D.negativeInsights) {
    document.getElementById('vocNegInsights').innerHTML = D.negativeInsights.map(function(i) {
      return '<tr><td><span class="si-badge" style="background:' + i.badgeBg + ';color:' + i.badgeColor + '">' + i.type + '</span></td><td>' + i.finding + '</td><td>' + i.implication + '</td></tr>';
    }).join('');
  }

  // ── Positive topics (expandable rows) ──
  if (D.positiveTopics) {
    var posMax = parseFloat(D.positiveTopics[0].pct);
    var posHtml = '';
    D.positiveTopics.forEach(function(t) {
      var bullets = (t.bullets || []).map(function(b) { return '<li>' + b + '</li>'; }).join('');
      var quotes = (t.quotes || []).map(function(q) { return '<p>' + q + '</p>'; }).join('');
      posHtml += '<tr class="pf-row" style="cursor:pointer"><td class="us-label"><span class="pf-arrow">\u25B6</span> ' + t.label + '</td>';
      posHtml += '<td class="us-reason">' + t.reason + '</td>';
      posHtml += '<td class="us-pct"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(t.pct, posMax) + ';background:#86efac"></div></div><span>' + t.pct + '</span></td></tr>';
      posHtml += '<tr class="pf-detail"><td colspan="3"><div class="pf-body"><ul>' + bullets + '</ul><div class="pf-quotes">' + quotes + '</div></div></td></tr>';
    });
    document.getElementById('vocPosBody').innerHTML = posHtml;
  }

  // ── Positive insights ──
  if (D.positiveInsights) {
    document.getElementById('vocPosInsights').innerHTML = D.positiveInsights.map(function(i) {
      return '<tr><td><span class="si-badge" style="background:' + i.badgeBg + ';color:' + i.badgeColor + '">' + i.type + '</span></td><td>' + i.finding + '</td><td>' + i.implication + '</td></tr>';
    }).join('');
  }

  // ── Toggle expandable rows ──
  root.querySelectorAll('.nf-row').forEach(function(row) {
    row.addEventListener('click', function() {
      var detail = row.nextElementSibling;
      var isOpen = row.classList.contains('open');
      root.querySelectorAll('.nf-row.open').forEach(function(r) { r.classList.remove('open'); r.nextElementSibling.classList.remove('open'); });
      if (!isOpen) { row.classList.add('open'); detail.classList.add('open'); }
    });
  });
  root.querySelectorAll('.pf-row').forEach(function(row) {
    row.addEventListener('click', function() {
      var detail = row.nextElementSibling;
      var isOpen = row.classList.contains('open');
      root.querySelectorAll('.pf-row.open').forEach(function(r) { r.classList.remove('open'); r.nextElementSibling.classList.remove('open'); });
      if (!isOpen) { row.classList.add('open'); detail.classList.add('open'); }
    });
  });

  // ── Review Browser ──
  if (D.themeFilters) {
    document.getElementById('vocFilterTheme').innerHTML = D.themeFilters.map(function(f) {
      return '<option value="' + f.value + '">' + f.label + '</option>';
    }).join('');
  }

  var reviews = D.reviews || [];

  function vocFilter() {
    var rating = document.getElementById('vocFilterRating').value;
    var theme = document.getElementById('vocFilterTheme').value;
    var search = (document.getElementById('vocFilterSearch').value || '').toLowerCase();
    var filtered = reviews.filter(function(r) {
      if (rating && r.r != rating) return false;
      if (theme && r.tags.indexOf(theme) === -1) return false;
      if (search && r.t.toLowerCase().indexOf(search) === -1) return false;
      return true;
    });
    document.getElementById('vocResultCount').textContent = 'Showing ' + filtered.length + ' of ' + reviews.length + ' reviews';
    var html = '';
    var limit = Math.min(filtered.length, 200);
    for (var i = 0; i < limit; i++) {
      var r = filtered[i];
      var starHtml = '<span style="color:' + STAR_COLORS[r.r] + ';font-weight:700">' + r.r + '\u2605</span>';
      var tagsHtml = (r.tags || []).map(function(t) {
        return '<span class="pill ' + ((D.tagStyles && D.tagStyles[t]) || 'pill-blue') + '">' + t.replace(/_/g, ' ') + '</span>';
      }).join('');
      html += '<tr><td>' + starHtml + '</td><td><div class="review-text">' + r.t.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>' +
        (tagsHtml ? '<div style="margin-top:4px">' + tagsHtml + '</div>' : '') + '</td></tr>';
    }
    if (filtered.length > 200) html += '<tr><td colspan="2" style="text-align:center;color:#64748b;font-size:.72rem;padding:12px">Showing first 200 of ' + filtered.length + '. Use filters to narrow.</td></tr>';
    document.getElementById('vocReviewBody').innerHTML = html;
  }

  document.getElementById('vocFilterRating').addEventListener('change', vocFilter);
  document.getElementById('vocFilterTheme').addEventListener('change', vocFilter);
  document.getElementById('vocFilterSearch').addEventListener('input', vocFilter);
  document.getElementById('vocClearBtn').addEventListener('click', function() {
    document.getElementById('vocFilterRating').value = '';
    document.getElementById('vocFilterTheme').value = '';
    document.getElementById('vocFilterSearch').value = '';
    vocFilter();
  });

  vocFilter();

  // Make tables sortable
  DataEngine.makeAllTablesSortable(root);
})();
</script>
</template>

<script>
(function mddInit() {
  var D = window._TAB_DATA;
  var root = document.getElementById('mdd-root');
  if (!D || !D.competitors) {
    root.innerHTML = '<div class="card"><h3>Marketing Deep-Dive</h3><p style="color:#64748b;font-size:.85rem">No data loaded. Drop competitor listings into <code>data/competitor-listings/raw/</code> and run <code>scripts/build_mdd.py</code>.</p></div>';
    return;
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function fmtMoney(n) { return D.currency + Number(n || 0).toFixed(0); }

  var h = '';
  // Intro
  h += '<p class="sec-summary" style="margin-bottom:24px">Marketing intelligence across <b>' + D.totalCompetitors + ' top competitors</b> on <b>' + esc(D.marketplace) + '</b>. Listings pulled from SP-API Catalog. Claims tagged across 10 themes and cross-referenced with VOC findings from Tab 3 Reviews.</p>';

  /* ─────────────── 1. Competitor Overview Grid ─────────────── */
  h += '<div class="mdd-section">';
  h += '<div class="mdd-sec-header"><div class="mdd-sec-title">1. Competitor Overview — Top ' + D.totalCompetitors + ' by 30d Revenue</div><div class="mdd-sec-sub">Click a card to see full bullets, claims, and image stack</div></div>';
  h += '<div class="mdd-comp-grid">';
  D.competitors.forEach(function(c, idx) {
    h += '<div class="mdd-comp-card" data-idx="' + idx + '">';
    h += '  <div class="mdd-comp-img">' + (c.mainImage ? '<img src="' + esc(c.mainImage) + '" alt="">' : '<span style="color:#cbd5e1;font-size:.7rem">no image</span>') + '</div>';
    h += '  <div class="mdd-comp-brand">' + esc(c.brand) + '</div>';
    h += '  <div class="mdd-comp-title">' + esc(c.title) + '</div>';
    h += '  <div class="mdd-comp-themes">';
    c.themes.forEach(function(t) {
      h += '<span class="mdd-theme-pill">' + esc(t.replace(/_/g, ' ')) + '</span>';
    });
    h += '  </div>';
    h += '  <div class="mdd-comp-meta">';
    h += '    <span><b>' + fmtMoney(c.price) + '</b> price</span>';
    h += '    <span><b>★' + (c.rating || 0).toFixed(1) + '</b> · ' + (c.reviews || 0).toLocaleString() + '</span>';
    h += '    <span><b>' + fmtMoney(c.rev30d) + '</b> 30d rev</span>';
    h += '  </div>';
    h += '</div>';
  });
  h += '</div></div>';

  /* ─────────────── 2. Claims Matrix ─────────────── */
  var cm = D.claimsMatrix;
  h += '<div class="mdd-section">';
  h += '<div class="mdd-sec-header"><div class="mdd-sec-title">2. Claims Matrix</div><div class="mdd-sec-sub">Rows = competitors, columns = claim themes. Filled = theme present in title/bullets.</div></div>';
  h += '<div class="mdd-matrix-wrap"><table class="mdd-matrix">';
  h += '<thead><tr><th class="mdd-row-h">Brand · ASIN</th>';
  cm.themes.forEach(function(t) { h += '<th>' + esc(t.label) + '</th>'; });
  h += '</tr></thead><tbody>';
  cm.rows.forEach(function(r) {
    h += '<tr><td class="mdd-row-h">' + esc(r.brand) + '<br><span style="font-weight:400;color:#94a3b8;font-size:.62rem">' + esc(r.asin) + '</span></td>';
    r.cells.forEach(function(c) {
      h += '<td>' + (c ? '<span class="mdd-cell-yes"></span>' : '<span class="mdd-cell-no"></span>') + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  /* Claims summary bars */
  h += '<div style="margin-top:20px"><div class="mdd-sec-sub" style="margin-bottom:8px">Claim frequency across all 20 listings</div>';
  D.claimsSummary.forEach(function(s) {
    h += '<div class="mdd-bar-row">';
    h += '  <div style="font-weight:600;color:#1e293b">' + esc(s.label) + '</div>';
    h += '  <div class="mdd-bar-track"><div class="mdd-bar-fill" style="width:' + s.pct + '"></div></div>';
    h += '  <div style="text-align:right;color:#475569"><b>' + s.count + '</b> · ' + s.pct + '</div>';
    h += '</div>';
    h += '<div class="mdd-brands">Top brands: ' + s.topBrands.map(esc).join(' · ') + '</div>';
  });
  h += '</div></div>';

  /* ─────────────── 3. VOC ↔ Claims Gap Analysis ─────────────── */
  h += '<div class="mdd-section">';
  h += '<div class="mdd-sec-header"><div class="mdd-sec-title">3. VOC ↔ Claims Gap Analysis</div><div class="mdd-sec-sub">Customer concerns from Tab 3 reviews vs how many of the 20 competitors address them</div></div>';
  h += '<table class="mdd-gap"><thead><tr>';
  h += '<th>VOC Topic</th><th>Customer %</th><th>Addressed by</th><th>Severity</th><th>Whitespace</th>';
  h += '</tr></thead><tbody>';
  D.vocGap.forEach(function(g) {
    h += '<tr>';
    h += '<td><b>' + esc(g.vocTopic) + '</b></td>';
    h += '<td><b>' + esc(g.customerConcernPct) + '</b></td>';
    h += '<td><b>' + g.addressedByCount + ' / ' + D.totalCompetitors + '</b><br><span style="font-size:.66rem;color:#64748b">' + g.addressedByBrands.map(esc).join(', ') + '</span></td>';
    h += '<td><span class="mdd-sev mdd-sev-' + g.gapSeverity + '">' + g.gapSeverity + '</span></td>';
    h += '<td>' + esc(g.whitespace) + '</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  /* ─────────────── 4. Whitespace + Saturation ─────────────── */
  h += '<div class="mdd-section">';
  h += '<div class="mdd-sec-header"><div class="mdd-sec-title">4. Whitespace Opportunities</div><div class="mdd-sec-sub">High customer demand × low competitor coverage</div></div>';
  h += '<div class="mdd-ws-grid">';
  D.whitespaceOpportunities.forEach(function(w) {
    h += '<div class="mdd-ws-card">';
    h += '  <h4>' + esc(w.opportunity) + '</h4>';
    h += '  <div class="mdd-ws-rationale">' + esc(w.rationale) + '</div>';
    h += '  <div class="mdd-ws-evidence">' + esc(w.evidence) + '</div>';
    h += '</div>';
  });
  h += '</div></div>';

  h += '<div class="mdd-section">';
  h += '<div class="mdd-sec-header"><div class="mdd-sec-title">Saturated Claims — Diminishing Returns</div><div class="mdd-sec-sub">Most-used claims where adding the same message no longer differentiates</div></div>';
  h += '<div class="mdd-ws-grid">';
  D.saturation.forEach(function(s) {
    h += '<div class="mdd-ws-card">';
    h += '  <h4>' + esc(s.label) + ' <span style="float:right;color:#dc2626;font-size:.78rem">' + s.saturationPct + '</span></h4>';
    h += '  <div class="mdd-ws-rationale">' + esc(s.advice) + '</div>';
    h += '</div>';
  });
  h += '</div></div>';

  /* ─────────────── 5. Strategic Recommendations ─────────────── */
  h += '<div class="mdd-section">';
  h += '<div class="mdd-sec-header"><div class="mdd-sec-title">5. Strategic Recommendations</div><div class="mdd-sec-sub">Synthesized findings + actionable implications</div></div>';
  h += '<div class="mdd-insight-grid">';
  D.strategicRecommendations.forEach(function(r) {
    h += '<div class="mdd-insight-card">';
    h += '  <span class="mdd-insight-badge" style="background:' + esc(r.badgeBg) + ';color:' + esc(r.badgeColor) + '">' + esc(r.type) + '</span>';
    h += '  <h4>' + esc(r.finding) + '</h4>';
    h += '  <p><b>→</b> ' + esc(r.implication) + '</p>';
    h += '</div>';
  });
  h += '</div></div>';

  /* Modal */
  h += '<div id="mdd-modal"><div class="mdd-modal-body"><span class="mdd-modal-close">×</span><div id="mdd-modal-content"></div></div></div>';

  root.innerHTML = h;

  // Card click → modal
  var modal = document.getElementById('mdd-modal');
  var modalContent = document.getElementById('mdd-modal-content');
  root.querySelectorAll('.mdd-comp-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var c = D.competitors[parseInt(card.dataset.idx, 10)];
      var m = '';
      m += '<div style="font-size:.72rem;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">' + esc(c.brand) + ' · ' + esc(c.asin) + '</div>';
      m += '<h2 style="margin:0 0 12px;font-size:1.1rem;color:#0f172a;line-height:1.4">' + esc(c.title) + '</h2>';
      m += '<div style="display:flex;gap:14px;font-size:.78rem;color:#475569;flex-wrap:wrap;margin-bottom:14px">';
      m += '  <span><b>' + fmtMoney(c.price) + '</b> price</span>';
      m += '  <span>★ <b>' + (c.rating || 0).toFixed(1) + '</b> (' + (c.reviews || 0).toLocaleString() + ' reviews)</span>';
      m += '  <span>BSR <b>' + (c.bsr || '—').toLocaleString() + '</b></span>';
      m += '  <span><b>' + fmtMoney(c.rev30d) + '</b> 30d revenue</span>';
      m += '</div>';
      m += '<div style="margin-bottom:14px">';
      c.themes.forEach(function(t) { m += '<span class="mdd-theme-pill" style="margin-right:4px">' + esc(t.replace(/_/g, ' ')) + '</span>'; });
      m += '</div>';
      if (c.images && c.images.length) {
        m += '<div class="mdd-modal-imgs">';
        c.images.forEach(function(u) { m += '<img src="' + esc(u) + '" alt="">'; });
        m += '</div>';
      }
      m += '<h3 style="font-size:.82rem;color:#0f172a;margin:18px 0 8px">Bullet Points</h3>';
      if (c.bullets && c.bullets.length) {
        m += '<ul class="mdd-bullets">';
        c.bullets.forEach(function(b) { m += '<li>' + esc(b) + '</li>'; });
        m += '</ul>';
      } else {
        m += '<p style="font-size:.74rem;color:#94a3b8">No bullets available</p>';
      }
      if (c.description) {
        m += '<h3 style="font-size:.82rem;color:#0f172a;margin:18px 0 8px">Description</h3>';
        m += '<p style="font-size:.76rem;color:#475569;line-height:1.55;white-space:pre-wrap">' + esc(c.description) + '</p>';
      }
      modalContent.innerHTML = m;
      modal.classList.add('open');
    });
  });
  modal.querySelector('.mdd-modal-close').addEventListener('click', function() { modal.classList.remove('open'); });
  modal.addEventListener('click', function(e) { if (e.target === modal) modal.classList.remove('open'); });
})();
</script>
</template>
<script>
(function bootstrap() {
  var B = window.__BUNDLE_DATA__;
  var segments = DataEngine.aggregateSegments(B.products);
  segments = DataEngine.assignSegmentColors(segments);
  var totals = DataEngine.computeTotals(segments);
  var brandsBySegment = {};
  segments.forEach(function(seg) {
    var brands = DataEngine.aggregateByBrand(seg.products);
    brandsBySegment[seg.name] = DataEngine.topBrandsWithOther(brands, 8);
  });
  window._DASH_DATA = {
    title: B.title, subtitle: B.subtitle, currency: B.currency,
    baseTabs: { reviews: B.reviews },
    addonTabs: { 'marketing-deep-dive': B.mdd },
    _computed: {
      products: B.products, segments: segments, totals: totals,
      brandsBySegment: brandsBySegment, seasonality: B.seasonality,
      salesFilesFound: B.salesFilesFound, salesFilesMissing: B.salesFilesMissing,
      exportMonth: B.exportMonth, currency: B.currency,
    }
  };
  document.getElementById('hdrTitle').textContent = B.title;
  document.getElementById('hdrSub').textContent = B.subtitle;
  var tabs = [
    { id: 'total-market', label: '1. Total Market' },
    { id: 'market-structure', label: '2. Market Structure' },
  ];
  if (B.reviews) tabs.push({ id: 'reviews', label: '3. Reviews VOC' });
  if (B.mdd) tabs.push({ id: 'marketing-deep-dive', label: (B.reviews ? '4' : '3') + '. Marketing Deep-Dive' });
  var bar = document.getElementById('tabBar');
  bar.innerHTML = tabs.map(function(t, i) {
    return '<button class="tab' + (i === 0 ? ' active' : '') + '" data-tab="' + t.id + '">' + t.label + '</button>';
  }).join('');
  var loaded = {};
  // MDD segment selector — defaults to 'Cream' (largest segment) and renders inside the panel above the tab template.
  var mddSegment = 'Cream';
  function pickMddData(segment) {
    var mdd = window._DASH_DATA.addonTabs['marketing-deep-dive'];
    if (mdd && mdd.bySegment && mdd.bySegment[segment]) return mdd.bySegment[segment];
    return mdd; // fallback: combined view
  }
  function renderMdd() {
    var panel = document.getElementById('dt-marketing-deep-dive');
    var tpl = document.getElementById('tpl-marketing-deep-dive');
    var mdd = window._DASH_DATA.addonTabs['marketing-deep-dive'];
    var segments = (mdd && mdd.bySegment) ? Object.keys(mdd.bySegment) : [];
    // Pill bar HTML
    var pillBar = '';
    if (segments.length > 1) {
      pillBar = '<div class="mdd-seg-pills" style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap">';
      segments.forEach(function(seg) {
        var n = mdd.bySegment[seg].totalCompetitors;
        var label = (seg === 'all') ? 'All Segments' : seg;
        var active = seg === mddSegment;
        pillBar += '<button class="mdd-seg-pill" data-seg="' + seg + '" style="padding:7px 16px;border-radius:18px;border:1px solid ' + (active ? '#0f2942' : '#cbd5e1') + ';background:' + (active ? '#0f2942' : '#fff') + ';color:' + (active ? '#fff' : '#475569') + ';font-size:.78rem;font-weight:' + (active ? '700' : '500') + ';cursor:pointer;transition:all .15s">' + label + ' (' + n + ')</button>';
      });
      pillBar += '</div>';
    }
    window._TAB_DATA = pickMddData(mddSegment);
    panel.innerHTML = pillBar + tpl.innerHTML;
    panel.querySelectorAll('.mdd-seg-pill').forEach(function(btn) {
      btn.addEventListener('click', function() {
        mddSegment = btn.dataset.seg;
        renderMdd();
        if (window.Chart) Object.values(Chart.instances).forEach(function(c) { c.resize(); });
      });
    });
    panel.querySelectorAll('script').forEach(function(oldScript) {
      var s = document.createElement('script');
      s.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(s, oldScript);
    });
  }
  function loadTab(id) {
    if (id === 'marketing-deep-dive') {
      // Always re-render MDD so segment switching works without stale state
      renderMdd();
      loaded[id] = true;
      return;
    }
    if (loaded[id]) return;
    var panel = document.getElementById('dt-' + id);
    var tpl = document.getElementById('tpl-' + id);
    panel.innerHTML = tpl.innerHTML;
    if (id === 'reviews') window._TAB_DATA = window._DASH_DATA.baseTabs.reviews;
    else window._TAB_DATA = null;
    panel.querySelectorAll('script').forEach(function(oldScript) {
      var s = document.createElement('script');
      s.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(s, oldScript);
    });
    loaded[id] = true;
  }
  function showTab(id) {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === id); });
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.toggle('active', p.id === 'dt-' + id); });
    loadTab(id);
    if (window.Chart) Object.values(Chart.instances).forEach(function(c) { c.resize(); });
  }
  bar.querySelectorAll('.tab').forEach(function(btn) {
    btn.addEventListener('click', function() { showTab(btn.dataset.tab); });
  });
  showTab('total-market');
})();
</script>
</body>
</html>
