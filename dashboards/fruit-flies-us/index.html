<div id="u-main-segments-root"></div>

<script>
(function(){
  var D = window._TAB_DATA;
  var root = document.getElementById('u-main-segments-root');
  if (!D) { root.innerHTML = '<div class="card"><p style="color:#64748b;font-size:.85rem">No data loaded for this tab.</p></div>'; return; }

  // ─── inline helpers (self-contained) ───────────────────────────────────
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function fmtInt(n) { return Math.round(+n || 0).toLocaleString('en-US'); }
  function fmtMoney(n) { return D.currency + Math.round(+n || 0).toLocaleString('en-US'); }
  function fmtShort(n) {
    n = Math.round(+n || 0);
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return String(n);
  }
  function fmtMoneyShort(n) {
    n = Math.round(+n || 0);
    if (n >= 1e6) return D.currency + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return D.currency + (n / 1e3).toFixed(0) + 'K';
    return D.currency + n;
  }
  function pct(v, t) { return (t > 0) ? ((v / t) * 100).toFixed(1) + '%' : '0%'; }

  // Position-based brand palette · "Other (N)" → grey ─────────────────
  var BRAND_PALETTE = D.brandPalette || ['#2563eb','#dc2626','#16a34a','#f59e0b','#8b5cf6','#0891b2','#db2777','#65a30d'];
  function brandColor(name, i) {
    if (typeof name === 'string' && name.indexOf('Other (') === 0) return '#94a3b8';
    return BRAND_PALETTE[i % BRAND_PALETTE.length];
  }

  // ─── Sortable tables (every column, every table inside root) ───────────
  function parseSortValue(td) {
    if (td.dataset && td.dataset.val != null && td.dataset.val !== '') {
      var n = parseFloat(td.dataset.val);
      if (!isNaN(n)) return n;
    }
    var txt = (td.textContent || '').trim();
    var cleaned = txt.replace(/[\s, €$£%]/g, '').replace(/·/g, '');
    if (cleaned !== '' && !isNaN(parseFloat(cleaned))) return parseFloat(cleaned);
    return txt.toLowerCase();
  }
  function sortTableByColumn(table, colIdx, dir) {
    var tbody = table.tBodies[0]; if (!tbody) return;
    var rows = Array.prototype.slice.call(tbody.rows);
    rows.sort(function(a, b) {
      var va = parseSortValue(a.cells[colIdx]);
      var vb = parseSortValue(b.cells[colIdx]);
      if (va < vb) return dir === 'asc' ? -1 : 1;
      if (va > vb) return dir === 'asc' ? 1 : -1;
      return 0;
    });
    rows.forEach(function(r) { tbody.appendChild(r); });
  }
  function makeAllTablesSortable() {
    var tables = root.querySelectorAll('table');
    tables.forEach(function(table) {
      var ths = table.tHead ? table.tHead.rows[0].cells : table.rows[0].cells;
      Array.prototype.forEach.call(ths, function(th, idx) {
        if (th.dataset.sortable === '1') return;
        th.dataset.sortable = '1';
        th.style.cursor = 'pointer';
        th.style.userSelect = 'none';
        th.dataset.sortDir = '';
        var arrow = document.createElement('span');
        arrow.className = 'sort-arrow';
        arrow.style.cssText = 'margin-left:6px;opacity:.6;font-size:1.5em;color:#0f172a;vertical-align:middle;line-height:1';
        arrow.textContent = '▴▾';
        th.appendChild(arrow);
        th.addEventListener('click', function() {
          var dir = th.dataset.sortDir === 'asc' ? 'desc' : 'asc';
          Array.prototype.forEach.call(ths, function(other) {
            other.dataset.sortDir = '';
            var a = other.querySelector('.sort-arrow');
            if (a) { a.textContent = '▴▾'; a.style.opacity = '.6'; }
          });
          th.dataset.sortDir = dir;
          arrow.textContent = dir === 'asc' ? '▴' : '▾';
          arrow.style.opacity = '1';
          sortTableByColumn(table, idx, dir);
        });
      });
    });
  }

  // ─── Local chart bin (so we don't leak Chart instances on re-render) ───
  var _charts = [];

  // Pie helper · legend SORTED BY VALUE DESC, "Other (…)" pinned last ────
  function pie(canvasId, labels, data, colors, moneyFmt) {
    var el = document.getElementById(canvasId);
    if (!el) return;
    // Sort labels/data/colors in parallel by data desc, with Other(...) pinned last
    var idx = labels.map(function(_, i){ return i; });
    idx.sort(function(a, b){
      var la = labels[a], lb = labels[b];
      var oa = typeof la === 'string' && la.indexOf('Other (') === 0;
      var ob = typeof lb === 'string' && lb.indexOf('Other (') === 0;
      if (oa && !ob) return 1;
      if (ob && !oa) return -1;
      return (+data[b] || 0) - (+data[a] || 0);
    });
    var sLabels = idx.map(function(i){ return labels[i]; });
    var sData   = idx.map(function(i){ return data[i]; });
    var sColors = idx.map(function(i){ return colors[i]; });

    var total = sData.reduce(function(a,b){return a+(+b||0);}, 0);
    try {
      var ctx = el.getContext('2d');
      var capturedLabels = sLabels.slice();
      var capturedData = sData.slice();
      var capturedColors = sColors.slice();
      var chart = new Chart(ctx, {
        type: 'pie',
        data: { labels: sLabels, datasets: [{ data: sData, backgroundColor: sColors, borderWidth: 2, borderColor: '#fff' }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: {
                boxWidth: 12, padding: 6, font: { size: 11 },
                generateLabels: function() {
                  return capturedLabels.map(function(lbl, i) {
                    var v = capturedData[i];
                    var p = total > 0 ? (v/total*100).toFixed(1) : '0.0';
                    var valStr = moneyFmt ? fmtMoneyShort(v) : fmtInt(v);
                    return {
                      text: lbl + ' · ' + valStr + ' (' + p + '%)',
                      fillStyle: capturedColors[i],
                      strokeStyle: capturedColors[i],
                      lineWidth: 0, hidden: false, index: i
                    };
                  });
                }
              }
            },
            tooltip: { callbacks: { label: function(c) {
              var v = c.parsed; var p = total > 0 ? (v/total*100).toFixed(1) : '0';
              return c.label + ': ' + (moneyFmt ? fmtMoneyShort(v) : fmtInt(v)) + ' (' + p + '%)';
            } } },
            datalabels: {
              color: '#fff', font: { size: 11, weight: 'bold' },
              formatter: function(v) { var p = total > 0 ? (v/total*100) : 0; return p >= 5 ? p.toFixed(0) + '%' : ''; }
            }
          }
        },
        plugins: window.ChartDataLabels ? [ChartDataLabels] : []
      });
      _charts.push(chart);
    } catch(e) {
      console.error('pie() failed for', canvasId, e);
      if (el && el.parentNode) {
        el.parentNode.innerHTML = '<div style="padding:20px;color:#dc2626;font-size:.8rem">Chart error: ' + (e && e.message || e) + '</div>';
      }
    }
  }

  // ─── Render ────────────────────────────────────────────────────────────
  var SEG_NAMES = D.segments || (D.segments_data || []).map(function(s){ return s.name; });
  var SEG_COLORS = D.segmentColors || {};
  var segs = D.segments_data || [];
  var segMap = {};
  segs.forEach(function(s){ segMap[s.name] = s; });
  var segsOrdered = SEG_NAMES.map(function(name){
    return segMap[name] || { name: name, units: 0, revenue: 0, brandsByUnits: [], brandsByRevenue: [] };
  });
  var totalUnits = D.totalUnits || 0;
  var totalRev   = D.totalRevenue || 0;
  var nSeg = segsOrdered.length;
  var countryName = D.countryName || '';
  var countryCode = D.countryCode || '';
  var amazonDom = (countryCode === 'UK') ? 'co.uk' : (countryCode || '').toLowerCase();

  var html = '';
  html += '<h2>Main Segments · Total Market (12M)' + (countryName ? ' · ' + esc(countryName) : '') + '</h2>';

  // Total Category KPI strip
  html += '<div class="card" style="border-left:4px solid #1e293b;padding:14px 20px;display:flex;align-items:center;gap:36px;flex-wrap:wrap">';
  html += '  <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748b;min-width:120px">Total Category</div>';
  html += '  <div><div style="font-size:1.6rem;font-weight:700;color:#1e293b;line-height:1">' + fmtMoneyShort(totalRev) + '</div><div style="font-size:.75rem;color:#64748b;margin-top:3px">Revenue · Last 12M (projected)</div></div>';
  html += '  <div><div style="font-size:1.6rem;font-weight:700;color:#1e293b;line-height:1">' + fmtInt(totalUnits) + '</div><div style="font-size:.75rem;color:#64748b;margin-top:3px">Units Sold · Last 12M</div></div>';
  html += '</div>';

  // Per-segment KPI cards
  html += '<div style="display:grid;grid-template-columns:repeat(' + nSeg + ',1fr);gap:14px;margin-bottom:14px;margin-top:14px">';
  segsOrdered.forEach(function(seg) {
    var color = SEG_COLORS[seg.name] || '#64748b';
    html += '<div class="card" style="border-left:4px solid ' + color + ';padding:14px 16px;margin-bottom:0">';
    html += '  <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:' + color + ';margin-bottom:10px">' + esc(seg.name) + '</div>';
    html += '  <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">';
    html += '    <div class="kpi" style="box-shadow:none;background:#f8fafc;padding:8px 10px"><div class="kpi-v" style="font-size:.95rem">' + fmtShort(seg.units) + '</div><div class="kpi-l">Units sold (12M)</div></div>';
    html += '    <div class="kpi" style="box-shadow:none;background:#f8fafc;padding:8px 10px"><div class="kpi-v" style="font-size:.95rem">' + fmtMoneyShort(seg.revenue) + '</div><div class="kpi-l">Segment Value (12M)</div></div>';
    html += '  </div></div>';
  });
  html += '</div>';

  // Insight: leader by units / revenue + avg price per segment
  var unitLeader = segsOrdered.slice().sort(function(a,b){ return b.units - a.units; })[0] || {name:'', units:0};
  var revLeader  = segsOrdered.slice().sort(function(a,b){ return b.revenue - a.revenue; })[0] || {name:'', revenue:0};
  var avgPriceParts = segsOrdered.map(function(s){
    var avg = s.units > 0 ? s.revenue / s.units : 0;
    return esc(s.name) + ': <strong>' + D.currency + avg.toFixed(2) + '</strong>';
  }).join(' · ');
  html += '<div class="insight">';
  html += 'Unit leader: <strong>' + esc(unitLeader.name) + '</strong> (' + pct(unitLeader.units, totalUnits) + '). ';
  html += 'Revenue leader: <strong>' + esc(revLeader.name) + '</strong> (' + pct(revLeader.revenue, totalRev) + '). ';
  html += 'Avg price · ' + avgPriceParts + '.';
  html += '</div>';

  // Revenue / Units pies
  var pieLabels = segsOrdered.map(function(s){ return s.name; });
  var pieRev    = segsOrdered.map(function(s){ return s.revenue; });
  var pieUnits  = segsOrdered.map(function(s){ return s.units; });
  var pieColors = segsOrdered.map(function(s){ return SEG_COLORS[s.name] || '#64748b'; });
  var revNote   = segsOrdered.map(function(s){ return esc(s.name) + ' ' + fmtMoneyShort(s.revenue) + ' (' + pct(s.revenue, totalRev) + ')'; }).join(' · ');
  var unitsNote = segsOrdered.map(function(s){ return esc(s.name) + ' ' + fmtInt(s.units) + ' units (' + pct(s.units, totalUnits) + ')'; }).join(' · ');
  html += '<div class="g2" style="align-items:start">';
  html += '  <div class="card"><h3>Revenue by Segment (12M)</h3><div class="cw" style="height:280px"><canvas id="ums-focusRevPie"></canvas></div><div class="note">' + revNote + '. Revenue = 12M units × listed ASIN price.</div></div>';
  html += '  <div class="card"><h3>Units by Segment (12M)</h3><div class="cw" style="height:280px"><canvas id="ums-focusUnitsPie"></canvas></div><div class="note">' + unitsNote + '.</div></div>';
  html += '</div>';

  // Segment summary table
  html += '<div class="card"><h3>Segment Summary (12M)</h3><div class="tbl-wrap"><table class="num-right">';
  html += '<thead><tr><th style="text-align:left">Segment</th><th>Units (12M)</th><th>Revenue (12M)</th><th>Unit Share</th><th>Rev Share</th></tr></thead><tbody>';
  segsOrdered.forEach(function(seg) {
    var color = SEG_COLORS[seg.name] || '#64748b';
    html += '<tr><td style="text-align:left"><span class="badge" style="background:' + color + '22;color:' + color + '">' + esc(seg.name) + '</span></td>';
    html += '<td data-val="' + (+seg.units || 0) + '">' + fmtInt(seg.units) + '</td><td data-val="' + (+seg.revenue || 0) + '">' + fmtMoney(seg.revenue) + '</td>';
    html += '<td data-val="' + (totalUnits > 0 ? seg.units / totalUnits * 100 : 0) + '">' + pct(seg.units, totalUnits) + '</td>';
    html += '<td data-val="' + (totalRev > 0 ? seg.revenue / totalRev * 100 : 0) + '">' + pct(seg.revenue, totalRev) + '</td></tr>';
  });
  html += '</tbody></table></div><div class="note">Revenue = 12M units × listed ASIN price. Units use sales-history when available, otherwise the H10 X-Ray 30-day snapshot is corrected by the seasonality index for the export-window months and projected to 12 months.</div></div>';

  // ── Total Market Seasonality ──
  var season = D.seasonality;
  if (season && season.months && season.months.length === 12) {
    var peakRatio = (season.troughIdx > 0) ? (season.peakIdx / season.troughIdx).toFixed(2) : '·';
    var pc        = D.projectionCounts || {};
    var xrayIdx   = D.xrayWindowIndex;
    var xrayMult  = (xrayIdx && xrayIdx > 0) ? (12 / xrayIdx).toFixed(1) : null;
    var xrayWindowText = (D.xrayWindowStart || '') + ' → ' + (D.xrayExportDate || '');

    html += '<h2 style="margin-top:28px;margin-bottom:6px">Total Market Seasonality (12M, 1.0 = average month)</h2>';
    html += '<p style="margin:0 0 14px;color:#64748b;font-size:.78rem;line-height:1.5">' + (countryName ? '<b>This ' + esc(countryName) + ' market only</b> (not combined with other marketplaces). Each country has its own seasonality curve computed from its own sales-data files. ' : '') + '<b>Inputs:</b> ' + season.asinCount + ' top-selling' + (countryName ? ' ' + esc(countryName) : '') + ' ASINs with daily sales history (≈365 daily data points per ASIN within the window). <b>Logic:</b> sum each ASIN’s daily units, bin into calendar months, then each month’s total ÷ 12-month mean = the index shown below. Window: ' + esc(season.startDate) + ' to ' + esc(season.endDate) + '.</p>';
    html += '<div class="kpis" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:12px">';
    html += '  <div class="kpi"><div class="kpi-v" style="color:#15803d">' + esc(season.peakMonth) + ' (' + (+season.peakIdx).toFixed(2) + ')</div><div class="kpi-l">Peak Month</div></div>';
    html += '  <div class="kpi"><div class="kpi-v" style="color:#dc2626">' + esc(season.troughMonth) + ' (' + (+season.troughIdx).toFixed(2) + ')</div><div class="kpi-l">Trough Month</div></div>';
    html += '  <div class="kpi"><div class="kpi-v">' + (+season.peakIdx).toFixed(2) + 'x</div><div class="kpi-l">Peak / Avg (Best Month)</div></div>';
    html += '  <div class="kpi"><div class="kpi-v">' + peakRatio + 'x</div><div class="kpi-l">Peak / Trough Ratio</div></div>';
    html += '</div>';
    html += '<div class="card"><h3>' + (countryName ? esc(countryName) + ' · ' : '') + 'Monthly Seasonality Index</h3><div class="cw" style="height:280px"><canvas id="ums-seasonalityChart"></canvas></div><div class="note">Index = each month’s total units ÷ 12-month mean. <b>1.0</b> = average month; <b>2.0</b> = double; <b>0.1</b> = 10% of average.</div></div>';

    html += '<div class="card" style="margin-top:10px;background:#f8fafc;border-left:4px solid #2563eb">';
    html += '<h3 style="margin-top:0">How this curve drives 12-month projections for every ASIN</h3>';
    html += '<p style="margin:0 0 10px;font-size:.82rem;line-height:1.55;color:#334155">';
    html += 'The X-Ray export captures only a <b>30-day snapshot</b>. Because seasonal categories swing widely, multiplying that 30-day figure by 12 (naive flat projection) <b>under-estimates</b> annual sales when the export window falls outside peak season, and <b>over-estimates</b> if the window is in peak season. The chart above is how we correct for this.';
    html += '</p>';
    if (xrayIdx && xrayMult) {
      var xMultNum = (12 / xrayIdx);
      html += '<div style="margin:10px 0 6px;padding:12px 14px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;font-size:.82rem;line-height:1.6;color:#334155">';
      html += '<b style="color:#0f172a">3-step flow' + (countryName ? ' for ' + esc(countryName) : '') + ':</b>';
      html += '<ol style="margin:6px 0 0;padding-left:22px">';
      html += '  <li><b>Build the curve.</b> The seasonality chart above is computed from <b>' + (pc.history||0) + (countryName ? ' ' + esc(countryName) : '') + ' ASINs</b> that have daily sales history (<code>*-sales-3y.csv</code> files).</li>';
      html += '  <li><b>Read the index for the X-Ray window.</b> The export covers ' + esc(xrayWindowText) + '. Walking each of those 30 days against the monthly curve gives an average index of <b style="color:#2563eb">' + xrayIdx.toFixed(2) + 'x</b> of a normal month (1.0 = average).</li>';
      html += '  <li><b>Apply that one index to ALL no-history ASINs.</b> The same <b style="color:#2563eb">' + xrayIdx.toFixed(2) + 'x</b> figure is reused for every one of the <b>' + (pc.seasonality||0) + (countryName ? ' ' + esc(countryName) : '') + ' ASINs without a sales-history file</b>. Their 12M = 30-day X-Ray sales ÷ ' + xrayIdx.toFixed(2) + ' × 12 = <b>30-day × ' + xrayMult + 'x</b>.</li>';
      html += '</ol>';
      html += '<div style="margin-top:8px;padding:8px 10px;background:#eff6ff;border-radius:5px;font-size:.78rem">';
      html += '<b>Worked example:</b> an ASIN with no history selling 100 units in the X-Ray’s 30 days projects to <b>' + Math.round(100 * xMultNum) + ' units / 12M</b>' + (countryName ? ' in ' + esc(countryName) : '') + ' (100 ÷ ' + xrayIdx.toFixed(2) + ' × 12).';
      html += '</div>';
      html += '<p style="margin:8px 0 0;font-size:.78rem;color:#64748b">ASINs <i>with</i> their own sales history skip this entirely: their 12M is just the actual trailing 365-day sum, no projection.</p>';
      html += '</div>';

      html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px;font-size:.78rem;color:#475569">';
      html += '  <div><b style="color:#0f172a">X-Ray export window:</b><br>' + esc(xrayWindowText) + '</div>';
      html += '  <div><b style="color:#0f172a">Window seasonality index:</b><br>' + xrayIdx.toFixed(2) + ' (avg month = 1.0)</div>';
      html += '  <div><b style="color:#0f172a">30-day to 12M multiplier:</b><br>12 / ' + xrayIdx.toFixed(2) + ' = <b style="color:#2563eb">' + xrayMult + 'x</b></div>';
      html += '  <div><b style="color:#0f172a">' + (countryName ? esc(countryName) + ' ' : '') + 'ASIN breakdown:</b><br>' + (pc.history||0) + ' real history · ' + (pc.seasonality||0) + ' seasonality · ' + (pc.flat||0) + ' flat</div>';
      html += '</div>';
    }
    html += '</div>';
  } else {
    html += '<h2 style="margin-top:28px;margin-bottom:6px">Total Market Seasonality (12M)</h2>';
    html += '<div class="card"><div class="cw" style="height:220px;display:flex;align-items:center;justify-content:center;background:#f8fafc;border:2px dashed #cbd5e1;border-radius:6px;color:#94a3b8;font-size:.85rem">No sales history available' + (countryName ? ' for ' + esc(countryName) : '') + '. Drop per-ASIN sales CSVs into <code>data/sales-data/' + esc(countryCode || 'XX') + '/</code>.</div></div>';
  }

  root.innerHTML = html;

  // ─── Charts ────────────────────────────────────────────────────────────
  if (window.Chart && window.ChartDataLabels) { try { Chart.register(ChartDataLabels); } catch(e){} }

  // Segment pies
  pie('ums-focusRevPie',   pieLabels, pieRev,   pieColors, true);
  pie('ums-focusUnitsPie', pieLabels, pieUnits, pieColors, false);

  // Seasonality bar chart
  if (season && season.months && season.months.length === 12) {
    var seasCtx = document.getElementById('ums-seasonalityChart');
    if (seasCtx) {
      var barColors = season.months.map(function(v) {
        if (v >= 1.2) return '#16a34a';
        if (v >= 0.9) return '#2563eb';
        if (v >= 0.6) return '#f59e0b';
        return '#dc2626';
      });
      var seasChart = new Chart(seasCtx, {
        type: 'bar',
        data: { labels: season.monthLabels, datasets: [{ data: season.months, backgroundColor: barColors, borderRadius: 4 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, datalabels: { display: false } }, scales: { y: { beginAtZero: true, ticks: { callback: function(v){ return v.toFixed(1) + 'x'; } } } } }
      });
      _charts.push(seasChart);
    }
  }

  // ─── Polish ────────────────────────────────────────────────────────────
  makeAllTablesSortable();
})();
</script>

<template id="tpl-segments-market-structure"><!-- u-segments-market-structure tab template
==============================================================================
Tom's standalone-composition tab — Per-Segment Market Structure. Sister tab to
u-main-segments. Renders one segment at a time, switched via a sticky pill bar
that lists every segment with its ASIN count.

Inline this template into a per-dashboard standalone index.html via your
_build_standalone.py. The caller sets window._TAB_DATA to a single object
(already scoped to one country/market) BEFORE this template's <script> runs.

For each pill click the renderer rebuilds the panel underneath: five

Brand colors are keyed by position-by-revenue so a brand keeps the same color
across every pie/table inside one segment.

DATA CONTRACT — window._TAB_DATA shape:

<div id="u-sms-root"></div>

<script>
(function(){
  var D = window._TAB_DATA;
  var root = document.getElementById('u-sms-root');
  if (!D) { root.innerHTML = '<div class="card"><p style="color:#64748b;font-size:.85rem">No data loaded for this tab.</p></div>'; return; }

  // ─── inline helpers (self-contained) ───────────────────────────────────
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function fmtInt(n) { return Math.round(+n || 0).toLocaleString('en-US'); }
  function fmtMoney(n) { return D.currency + Math.round(+n || 0).toLocaleString('en-US'); }
  function fmtShort(n) {
    n = Math.round(+n || 0);
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return String(n);
  }
  function fmtMoneyShort(n) {
    n = Math.round(+n || 0);
    if (n >= 1e6) return D.currency + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return D.currency + (n / 1e3).toFixed(0) + 'K';
    return D.currency + n;
  }
  function pct(v, t) { return (t > 0) ? ((v / t) * 100).toFixed(1) + '%' : '0%'; }

  // Position-based brand palette · "Other (N)" → grey ────────────────────
  var BRAND_PALETTE = D.brandPalette || ['#2563eb','#dc2626','#16a34a','#f59e0b','#8b5cf6','#0891b2','#db2777','#65a30d'];
  function brandColor(name, i) {
    if (typeof name === 'string' && name.indexOf('Other (') === 0) return '#94a3b8';
    return BRAND_PALETTE[i % BRAND_PALETTE.length];
  }

  // ─── Sortable tables (every column, every table inside root) ───────────
  function parseSortValue(td) {
    if (td.dataset && td.dataset.val != null && td.dataset.val !== '') {
      var n = parseFloat(td.dataset.val);
      if (!isNaN(n)) return n;
    }
    var txt = (td.textContent || '').trim();
    var cleaned = txt.replace(/[\s, €$£%]/g, '').replace(/·/g, '');
    if (cleaned !== '' && !isNaN(parseFloat(cleaned))) return parseFloat(cleaned);
    return txt.toLowerCase();
  }
  function sortTableByColumn(table, colIdx, dir) {
    var tbody = table.tBodies[0]; if (!tbody) return;
    var rows = Array.prototype.slice.call(tbody.rows);
    rows.sort(function(a, b) {
      var va = parseSortValue(a.cells[colIdx]);
      var vb = parseSortValue(b.cells[colIdx]);
      if (va < vb) return dir === 'asc' ? -1 : 1;
      if (va > vb) return dir === 'asc' ? 1 : -1;
      return 0;
    });
    rows.forEach(function(r) { tbody.appendChild(r); });
  }
  function makeAllTablesSortable() {
    var tables = root.querySelectorAll('table');
    tables.forEach(function(table) {
      var ths = table.tHead ? table.tHead.rows[0].cells : table.rows[0].cells;
      Array.prototype.forEach.call(ths, function(th, idx) {
        if (th.dataset.sortable === '1') return;
        th.dataset.sortable = '1';
        th.style.cursor = 'pointer';
        th.style.userSelect = 'none';
        th.dataset.sortDir = '';
        var arrow = document.createElement('span');
        arrow.className = 'sort-arrow';
        arrow.style.cssText = 'margin-left:6px;opacity:.6;font-size:1.5em;color:#0f172a;vertical-align:middle;line-height:1';
        arrow.textContent = '▴▾';
        th.appendChild(arrow);
        th.addEventListener('click', function() {
          var dir = th.dataset.sortDir === 'asc' ? 'desc' : 'asc';
          Array.prototype.forEach.call(ths, function(other) {
            other.dataset.sortDir = '';
            var a = other.querySelector('.sort-arrow');
            if (a) { a.textContent = '▴▾'; a.style.opacity = '.6'; }
          });
          th.dataset.sortDir = dir;
          arrow.textContent = dir === 'asc' ? '▴' : '▾';
          arrow.style.opacity = '1';
          sortTableByColumn(table, idx, dir);
        });
      });
    });
  }

  // ─── Local chart bin (so we don't leak Chart instances on re-render) ───
  var _charts = [];
  function destroyCharts() {
    _charts.forEach(function(c){ try { c.destroy(); } catch(e){} });
    _charts = [];
  }

  // Pie helper · legend SORTED BY VALUE DESC, "Other (…)" pinned last ────
  function pie(canvasId, labels, data, colors, moneyFmt) {
    var el = document.getElementById(canvasId);
    if (!el) return;
    var idx = labels.map(function(_, i){ return i; });
    idx.sort(function(a, b){
      var la = labels[a], lb = labels[b];
      var oa = typeof la === 'string' && la.indexOf('Other (') === 0;
      var ob = typeof lb === 'string' && lb.indexOf('Other (') === 0;
      if (oa && !ob) return 1;
      if (ob && !oa) return -1;
      return (+data[b] || 0) - (+data[a] || 0);
    });
    var sLabels = idx.map(function(i){ return labels[i]; });
    var sData   = idx.map(function(i){ return data[i]; });
    var sColors = idx.map(function(i){ return colors[i]; });

    var total = sData.reduce(function(a,b){return a+(+b||0);}, 0);
    try {
      var ctx = el.getContext('2d');
      var capturedLabels = sLabels.slice();
      var capturedData = sData.slice();
      var capturedColors = sColors.slice();
      var chart = new Chart(ctx, {
        type: 'pie',
        data: { labels: sLabels, datasets: [{ data: sData, backgroundColor: sColors, borderWidth: 2, borderColor: '#fff' }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: {
                boxWidth: 12, padding: 6, font: { size: 11 },
                generateLabels: function() {
                  return capturedLabels.map(function(lbl, i) {
                    var v = capturedData[i];
                    var p = total > 0 ? (v/total*100).toFixed(1) : '0.0';
                    var valStr = moneyFmt ? fmtMoneyShort(v) : fmtInt(v);
                    return {
                      text: lbl + ' · ' + valStr + ' (' + p + '%)',
                      fillStyle: capturedColors[i],
                      strokeStyle: capturedColors[i],
                      lineWidth: 0, hidden: false, index: i
                    };
                  });
                }
              }
            },
            tooltip: { callbacks: { label: function(c) {
              var v = c.parsed; var p = total > 0 ? (v/total*100).toFixed(1) : '0';
              return c.label + ': ' + (moneyFmt ? fmtMoneyShort(v) : fmtInt(v)) + ' (' + p + '%)';
            } } },
            datalabels: {
              color: '#fff', font: { size: 11, weight: 'bold' },
              formatter: function(v) { var p = total > 0 ? (v/total*100) : 0; return p >= 5 ? p.toFixed(0) + '%' : ''; }
            }
          }
        },
        plugins: window.ChartDataLabels ? [ChartDataLabels] : []
      });
      _charts.push(chart);
    } catch(e) {
      console.error('pie() failed for', canvasId, e);
      if (el && el.parentNode) {
        el.parentNode.innerHTML = '<div style="padding:20px;color:#dc2626;font-size:.8rem">Chart error: ' + (e && e.message || e) + '</div>';
      }
    }
  }

  // ─── Resolve identity / segment list ───────────────────────────────────
  if (window.Chart && window.ChartDataLabels) { try { Chart.register(ChartDataLabels); } catch(e){} }

  var SEG_NAMES    = D.segments || [];
  var SEG_COLORS   = D.segmentColors || {};
  var msBySeg      = D.marketStructure || {};
  var countryName  = D.countryName || '';
  var countryCode  = D.countryCode || '';
  var amazonDom    = (countryCode === 'UK') ? 'co.uk' : (countryCode || '').toLowerCase();

  // Only show pills for segments that actually have market-structure data.
  var availableSegs = SEG_NAMES.filter(function(s){
    var ms = msBySeg[s];
    return ms && (ms.brands && ms.brands.length || ms.topAsins && ms.topAsins.length);
  });

  // ─── Build shell HTML (heading + sticky pill bar + panel slot) ─────────
  var shell = '';
  shell += '<h2>Market Structure (12M)' + (countryName ? ' · ' + esc(countryName) : '') + '</h2>';

  if (!availableSegs.length) {
    shell += '<div class="card"><p style="color:#64748b;font-size:.85rem">No market-structure data available for any segment' + (countryName ? ' in ' + esc(countryName) : '') + '.</p></div>';
    root.innerHTML = shell;
    return;
  }

  // Sticky pill bar — one pill per segment with ASIN count in parens
  shell += '<div id="u-sms-pillbar" style="position:sticky;top:0;z-index:30;background:#f1f5f9;padding:10px 0;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid #e2e8f0">';
  availableSegs.forEach(function(seg) {
    var color = SEG_COLORS[seg] || '#64748b';
    var ms = msBySeg[seg] || {};
    var n = ms.asinCount || (ms.topAsins ? ms.topAsins.length : 0);
    shell += '<button class="u-sms-pill" data-seg="' + esc(seg) + '" ';
    shell += 'data-color="' + esc(color) + '" ';
    shell += 'style="background:#fff;border:2px solid ' + color + ';color:' + color + ';';
    shell += 'padding:7px 14px;border-radius:999px;font-size:.85rem;font-weight:600;cursor:pointer;line-height:1;';
    shell += 'transition:background .15s,color .15s,border-color .15s">';
    shell += esc(seg) + ' <span style="font-weight:400;opacity:.75">(' + fmtInt(n) + ')</span>';
    shell += '</button>';
  });
  shell += '</div>';

  shell += '<div id="u-sms-panel"></div>';

  root.innerHTML = shell;

  // ─── Concentration label from HHI ──────────────────────────────────────
  function concentrationLabel(hhi) {
    if (hhi == null || isNaN(hhi)) return 'Concentration unknown';
    if (hhi > 2500) return 'Highly concentrated market';
    if (hhi >= 1500) return 'Moderately concentrated market';
    return 'Competitive / fragmented market';
  }

  // ─── Build the panel HTML for one selected segment ─────────────────────
  function buildPanel(segName) {
    var ms = msBySeg[segName] || {};
    var color = SEG_COLORS[segName] || '#64748b';
    var asinCount    = ms.asinCount || (ms.topAsins ? ms.topAsins.length : 0);
    var totalRevenue = +ms.totalRevenue || 0;
    var hhi          = (typeof ms.hhi === 'number') ? ms.hhi : null;
    var tShares      = ms.topAsinShares || [0, 0, 0, 0];
    var topBrand     = ms.topBrand || { name: '', share: 0 };

    var h = '';

    // 3a. Five KPI cards in one row
    h += '<div class="kpis" style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px">';
    h += '  <div class="kpi"><div class="kpi-v">' + (+tShares[0] || 0).toFixed(1) + '%</div><div class="kpi-l">TOP 1 ASIN REVENUE SHARE</div></div>';
    h += '  <div class="kpi"><div class="kpi-v">' + (+tShares[1] || 0).toFixed(1) + '%</div><div class="kpi-l">TOP 3 ASINS SHARE</div></div>';
    h += '  <div class="kpi"><div class="kpi-v">' + (+tShares[2] || 0).toFixed(1) + '%</div><div class="kpi-l">TOP 5 ASINS SHARE</div></div>';
    h += '  <div class="kpi"><div class="kpi-v">' + (+tShares[3] || 0).toFixed(1) + '%</div><div class="kpi-l">TOP 10 ASINS SHARE</div></div>';
    h += '  <div class="kpi"><div class="kpi-v">' + (+topBrand.share || 0).toFixed(1) + '%</div><div class="kpi-l">TOP BRAND (' + esc((topBrand.name || '').toUpperCase()) + ')</div></div>';
    h += '</div>';

    // 3b. Insight box
    h += '<div class="insight">';
    h += '<strong>' + esc(segName) + ' segment:</strong> ' + fmtInt(asinCount) + ' ASINs, ' + fmtMoneyShort(totalRevenue) + ' revenue (12M). ';
    h += concentrationLabel(hhi);
    if (hhi != null) h += ' (HHI: ' + fmtInt(hhi) + ')';
    h += '. ';
    h += 'Top brand: <strong>' + esc((topBrand.name || '').toUpperCase()) + '</strong> (' + (+topBrand.share || 0).toFixed(1) + '% revenue share). ';
    h += 'Top ASIN captures ' + (+tShares[0] || 0).toFixed(1) + '% of segment revenue.';
    h += '</div>';

    // 3c. Two Brand Share pies side-by-side
    var brandsByUnits   = ms.brandsByUnits   || [];
    var brandsByRevenue = ms.brandsByRevenue || [];
    var unitsTotal   = brandsByUnits.reduce(function(a,b){ return a + (+b.units || 0); }, 0);
    var revenueTotal = brandsByRevenue.reduce(function(a,b){ return a + (+b.revenue || 0); }, 0);
    var unitsNote   = fmtInt(unitsTotal) + ' total units across ' + fmtInt(asinCount) + ' ' + esc(segName) + ' ASIN' + (asinCount === 1 ? '' : 's') + ' (12M).';
    var revenueNote = fmtMoneyShort(revenueTotal) + ' total revenue across ' + fmtInt(asinCount) + ' ' + esc(segName) + ' ASIN' + (asinCount === 1 ? '' : 's') + ' (12M).';

    h += '<div class="g2" style="align-items:start">';
    h += '  <div class="card"><h3>Brand Share · ' + esc(segName) + ' (Units, 12M)</h3>';
    h += '    <div class="cw" style="height:340px"><canvas id="u-sms-pie-units"></canvas></div>';
    h += '    <div class="note">' + unitsNote + '</div></div>';
    h += '  <div class="card"><h3>Brand Share · ' + esc(segName) + ' (Revenue, 12M)</h3>';
    h += '    <div class="cw" style="height:340px"><canvas id="u-sms-pie-revenue"></canvas></div>';
    h += '    <div class="note">' + revenueNote + '</div></div>';
    h += '</div>';

    // 3d. Brand Summary table (top-15 cap when many brands)
    var allBrands  = (ms.brands || []).filter(function(b){
      return !(b.brand && b.brand.indexOf('Other (') === 0);
    });
    var BRAND_CAP  = 15;
    var capped     = allBrands.length > BRAND_CAP;
    var brandsShown = capped ? allBrands.slice(0, BRAND_CAP) : allBrands;

    h += '<div class="card"><h3>Brand Summary · ' + esc(segName) + ' (12M)' + (countryName ? ' · ' + esc(countryName) : '') + '</h3>';
    h += '<div class="tbl-wrap"><table class="num-right">';
    h += '<thead><tr><th style="text-align:left">Brand</th><th>Units 12M</th><th>Revenue 12M</th><th>Share</th><th>ASINs</th></tr></thead><tbody>';
    brandsShown.forEach(function(b, i) {
      var bc = brandColor(b.brand, i);
      h += '<tr>';
      h += '<td style="text-align:left"><span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:.78rem;font-weight:600;background:' + bc + '22;color:' + bc + '">' + esc(b.brand) + '</span></td>';
      h += '<td data-val="' + (+b.units || 0) + '">' + fmtInt(b.units) + '</td>';
      h += '<td data-val="' + (+b.revenue || 0) + '">' + fmtMoney(b.revenue) + '</td>';
      h += '<td data-val="' + (+b.share || 0) + '">' + (+b.share || 0).toFixed(1) + '%</td>';
      h += '<td data-val="' + (+b.asins || 0) + '">' + fmtInt(b.asins) + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    var summaryNote = brandsShown.length + ' of ' + allBrands.length + ' brand' + (allBrands.length === 1 ? '' : 's') + ' shown' + (capped ? ' (capped at top ' + BRAND_CAP + ' by revenue)' : '') + ' across ' + fmtInt(asinCount) + ' ' + esc(segName) + ' ASIN' + (asinCount === 1 ? '' : 's') + '. Total revenue: ' + fmtMoneyShort(totalRevenue) + '.';
    h += '<div class="note">' + summaryNote + '</div>';
    h += '</div>';

    // 3e. Top 20 ASINs table
    var allAsins   = ms.topAsins || [];
    var asinsShown = allAsins.slice(0, 20);

    // Brand→color map mirrors the pies (position by revenue, "Other" → grey)
    var brandColorMap = {};
    allBrands.forEach(function(b, i) { brandColorMap[b.brand] = brandColor(b.brand, i); });

    h += '<div class="card"><h3>' + esc(segName) + ' ASINs · Top 20 by Revenue (12M)' + (countryName ? ' · ' + esc(countryName) : '') + '</h3>';
    h += '<div class="tbl-wrap"><table class="num-right">';
    h += '<thead><tr>';
    h += '<th style="text-align:left">ASIN</th>';
    h += '<th style="text-align:left">Brand</th>';
    h += '<th style="text-align:left">Title</th>';
    h += '<th>Units 12M</th><th>Revenue 12M</th><th>Reviews</th><th>Price</th>';
    h += '</tr></thead><tbody>';
    asinsShown.forEach(function(p) {
      var bc = brandColorMap[p.brand] || '#94a3b8';
      var asinCell = amazonDom
        ? '<a href="https://www.amazon.' + amazonDom + '/dp/' + esc(p.asin) + '" target="_blank" rel="noopener"><code style="font-size:.75rem">' + esc(p.asin) + '</code></a>'
        : '<code style="font-size:.75rem">' + esc(p.asin) + '</code>';
      h += '<tr>';
      h += '<td style="text-align:left">' + asinCell + '</td>';
      h += '<td style="text-align:left"><span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:.78rem;font-weight:600;background:' + bc + '22;color:' + bc + '">' + esc(p.brand) + '</span></td>';
      h += '<td style="text-align:left;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(p.title) + '">' + esc(p.title) + '</td>';
      h += '<td data-val="' + (+p.units || 0) + '">' + fmtInt(p.units || 0) + '</td>';
      h += '<td data-val="' + (+p.revenue || 0) + '">' + fmtMoney(p.revenue) + '</td>';
      h += '<td data-val="' + (+p.reviews || 0) + '">' + fmtInt(p.reviews || 0) + '</td>';
      h += '<td data-val="' + (+p.price || 0) + '">' + D.currency + (+p.price || 0).toFixed(2) + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    var asinNote = 'Top ' + asinsShown.length + ' ' + esc(segName) + ' ASIN' + (asinsShown.length === 1 ? '' : 's') + ' by 12M revenue. Brand colours match the Brand Share charts above.';
    if (amazonDom) asinNote += ' Click ASIN to open on amazon.' + amazonDom + '.';
    h += '<div class="note">' + asinNote + '</div>';
    h += '</div>';

    return h;
  }

  // ─── Render one segment into the panel & wire charts ───────────────────
  var panelEl = document.getElementById('u-sms-panel');

  function renderPanel(segName) {
    destroyCharts();
    panelEl.innerHTML = buildPanel(segName);

    var ms = msBySeg[segName] || {};

    // Brand pies
    var bu = ms.brandsByUnits || [];
    var buLabels = bu.map(function(b){ return b.brand; });
    var buData   = bu.map(function(b){ return +b.units || 0; });
    var buColors = bu.map(function(b, j){ return brandColor(b.brand, j); });
    pie('u-sms-pie-units', buLabels, buData, buColors, false);

    var br = ms.brandsByRevenue || [];
    var brLabels = br.map(function(b){ return b.brand; });
    var brData   = br.map(function(b){ return +b.revenue || 0; });
    var brColors = br.map(function(b, j){ return brandColor(b.brand, j); });
    pie('u-sms-pie-revenue', brLabels, brData, brColors, true);

    // Sortable tables (scoped to this root — includes the freshly-injected panel)
    makeAllTablesSortable();
  }

  // ─── Wire pill clicks ──────────────────────────────────────────────────
  var pillBtns = root.querySelectorAll('.u-sms-pill');
  var selected = availableSegs[0];

  function applyPillStyles() {
    Array.prototype.forEach.call(pillBtns, function(btn) {
      var seg   = btn.dataset.seg;
      var color = btn.dataset.color || '#64748b';
      if (seg === selected) {
        btn.style.background   = '#2563eb';
        btn.style.color        = '#fff';
        btn.style.borderColor  = '#2563eb';
      } else {
        btn.style.background   = '#fff';
        btn.style.color        = color;
        btn.style.borderColor  = color;
      }
    });
  }

  Array.prototype.forEach.call(pillBtns, function(btn) {
    btn.addEventListener('click', function() {
      var seg = btn.dataset.seg;
      if (seg === selected) return; // no-op when clicking the active pill
      selected = seg;
      applyPillStyles();
      renderPanel(selected);
    });
  });

  // ─── Initial render ────────────────────────────────────────────────────
  applyPillStyles();
  renderPanel(selected);
})();
</script>

<div id="u-reviews-voc-root"></div>

<script>
(function(){
  var D = window._TAB_DATA;
  var root = document.getElementById('u-reviews-voc-root');
  if (!D) { root.innerHTML = '<div class="card"><p style="color:#64748b;font-size:.85rem">No data loaded for this tab.</p></div>'; return; }

  // ─── inline helpers (self-contained) ───────────────────────────────────
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function fmtInt(n) { return Math.round(+n || 0).toLocaleString('en-US'); }
  function fmtMoney(n) { return (D.currency || '') + Math.round(+n || 0).toLocaleString('en-US'); }
  function fmtMoneyShort(n) {
    n = Math.round(+n || 0); var cur = D.currency || '';
    if (n >= 1e6) return cur + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return cur + (n / 1e3).toFixed(0) + 'K';
    return cur + n;
  }
  function fmtShort(n) {
    n = Math.round(+n || 0);
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return String(n);
  }
  function pct(v, t) { return (t > 0) ? ((v / t) * 100).toFixed(1) + '%' : '0%'; }
  function bw(pctStr, maxPct) { var v = parseFloat(pctStr); return Math.round(v / maxPct * 100) + '%'; }

  var BRAND_PALETTE = D.brandPalette || ['#2563eb','#dc2626','#16a34a','#f59e0b','#8b5cf6','#0891b2','#db2777','#65a30d'];
  function brandColor(name, i) {
    if (typeof name === 'string' && name.indexOf('Other (') === 0) return '#94a3b8';
    return BRAND_PALETTE[i % BRAND_PALETTE.length];
  }

  // ─── Sortable tables ───────────────────────────────────────────────────
  function parseSortValue(td) {
    if (td.dataset && td.dataset.val != null && td.dataset.val !== '') {
      var n = parseFloat(td.dataset.val);
      if (!isNaN(n)) return n;
    }
    var txt = (td.textContent || '').trim();
    var cleaned = txt.replace(/[\s, €$£%]/g, '').replace(/·/g, '');
    if (cleaned !== '' && !isNaN(parseFloat(cleaned))) return parseFloat(cleaned);
    return txt.toLowerCase();
  }
  function sortTableByColumn(table, colIdx, dir) {
    var tbody = table.tBodies[0]; if (!tbody) return;
    var rows = Array.prototype.slice.call(tbody.rows);
    rows.sort(function(a, b) {
      var va = parseSortValue(a.cells[colIdx]);
      var vb = parseSortValue(b.cells[colIdx]);
      if (va < vb) return dir === 'asc' ? -1 : 1;
      if (va > vb) return dir === 'asc' ? 1 : -1;
      return 0;
    });
    rows.forEach(function(r) { tbody.appendChild(r); });
  }
  function makeAllTablesSortable() {
    var tables = root.querySelectorAll('table');
    tables.forEach(function(table) {
      var ths = table.tHead ? table.tHead.rows[0].cells : table.rows[0].cells;
      Array.prototype.forEach.call(ths, function(th, idx) {
        if (th.dataset.sortable === '1') return;
        th.dataset.sortable = '1';
        th.style.cursor = 'pointer';
        th.style.userSelect = 'none';
        th.dataset.sortDir = '';
        var arrow = document.createElement('span');
        arrow.className = 'sort-arrow';
        arrow.style.cssText = 'margin-left:6px;opacity:.6;font-size:1.5em;color:#0f172a;vertical-align:middle;line-height:1';
        arrow.textContent = '▴▾';
        th.appendChild(arrow);
        th.addEventListener('click', function() {
          var dir = th.dataset.sortDir === 'asc' ? 'desc' : 'asc';
          Array.prototype.forEach.call(ths, function(other) {
            other.dataset.sortDir = '';
            var a = other.querySelector('.sort-arrow');
            if (a) { a.textContent = '▴▾'; a.style.opacity = '.6'; }
          });
          th.dataset.sortDir = dir;
          arrow.textContent = dir === 'asc' ? '▴' : '▾';
          arrow.style.opacity = '1';
          sortTableByColumn(table, idx, dir);
        });
      });
    });
  }

  var _charts = [];

  // Pie helper · legend SORTED BY VALUE DESC, "Other (…)" pinned last ────
  function pie(canvasId, labels, data, colors, moneyFmt) {
    var el = document.getElementById(canvasId);
    if (!el) return;
    var idx = labels.map(function(_, i){ return i; });
    idx.sort(function(a, b){
      var la = labels[a], lb = labels[b];
      var oa = typeof la === 'string' && la.indexOf('Other (') === 0;
      var ob = typeof lb === 'string' && lb.indexOf('Other (') === 0;
      if (oa && !ob) return 1;
      if (ob && !oa) return -1;

<script>
(function(){
  var D = window._TAB_DATA;

  if (!D) { root.innerHTML = '<div class="card"><p style="color:#64748b;font-size:.85rem">No data loaded for this tab.</p></div>'; return; }

  // ─── inline helpers (self-contained) ───────────────────────────────────
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function fmtInt(n) { return Math.round(+n || 0).toLocaleString('en-US'); }
  function fmtMoney(n) { return (D.currency || '') + Math.round(+n || 0).toLocaleString('en-US'); }
  function fmtMoneyShort(n) {
    n = Math.round(+n || 0); var cur = D.currency || '';
    if (n >= 1e6) return cur + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return cur + (n / 1e3).toFixed(0) + 'K';
    return cur + n;
  }
  function fmtShort(n) {
    n = Math.round(+n || 0);
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return String(n);
  }
  function pct(v, t) { return (t > 0) ? ((v / t) * 100).toFixed(1) + '%' : '0%'; }
  function bw(pctStr, maxPct) { var v = parseFloat(pctStr); return Math.round(v / maxPct * 100) + '%'; }

  var BRAND_PALETTE = D.brandPalette || ['#2563eb','#dc2626','#16a34a','#f59e0b','#8b5cf6','#0891b2','#db2777','#65a30d'];
  function brandColor(name, i) {
    if (typeof name === 'string' && name.indexOf('Other (') === 0) return '#94a3b8';
    return BRAND_PALETTE[i % BRAND_PALETTE.length];
  }

  // ─── Sortable tables ───────────────────────────────────────────────────
  function parseSortValue(td) {
    if (td.dataset && td.dataset.val != null && td.dataset.val !== '') {
      var n = parseFloat(td.dataset.val);
      if (!isNaN(n)) return n;
    }
    var txt = (td.textContent || '').trim();
    var cleaned = txt.replace(/[\s, €$£%]/g, '').replace(/·/g, '');
    if (cleaned !== '' && !isNaN(parseFloat(cleaned))) return parseFloat(cleaned);
    return txt.toLowerCase();
  }
  function sortTableByColumn(table, colIdx, dir) {
    var tbody = table.tBodies[0]; if (!tbody) return;
    var rows = Array.prototype.slice.call(tbody.rows);
    rows.sort(function(a, b) {
      var va = parseSortValue(a.cells[colIdx]);
      var vb = parseSortValue(b.cells[colIdx]);
      if (va < vb) return dir === 'asc' ? -1 : 1;
      if (va > vb) return dir === 'asc' ? 1 : -1;
      return 0;
    });
    rows.forEach(function(r) { tbody.appendChild(r); });
  }
  function makeAllTablesSortable() {
    var tables = root.querySelectorAll('table');
    tables.forEach(function(table) {
      var ths = table.tHead ? table.tHead.rows[0].cells : table.rows[0].cells;
      Array.prototype.forEach.call(ths, function(th, idx) {
        if (th.dataset.sortable === '1') return;
        th.dataset.sortable = '1';
        th.style.cursor = 'pointer';
        th.style.userSelect = 'none';
        th.dataset.sortDir = '';
        var arrow = document.createElement('span');
        arrow.className = 'sort-arrow';
        arrow.style.cssText = 'margin-left:6px;opacity:.6;font-size:1.5em;color:#0f172a;vertical-align:middle;line-height:1';
        arrow.textContent = '▴▾';
        th.appendChild(arrow);
        th.addEventListener('click', function() {
          var dir = th.dataset.sortDir === 'asc' ? 'desc' : 'asc';
          Array.prototype.forEach.call(ths, function(other) {
            other.dataset.sortDir = '';
            var a = other.querySelector('.sort-arrow');
            if (a) { a.textContent = '▴▾'; a.style.opacity = '.6'; }
          });
          th.dataset.sortDir = dir;
          arrow.textContent = dir === 'asc' ? '▴' : '▾';
          arrow.style.opacity = '1';
          sortTableByColumn(table, idx, dir);
        });
      });
    });
  }

  var _charts = [];

  // Pie helper · legend SORTED BY VALUE DESC, "Other (…)" pinned last ────
  function pie(canvasId, labels, data, colors, moneyFmt) {
    var el = document.getElementById(canvasId);
    if (!el) return;
    var idx = labels.map(function(_, i){ return i; });
    idx.sort(function(a, b){
      var la = labels[a], lb = labels[b];
      var oa = typeof la === 'string' && la.indexOf('Other (') === 0;
      var ob = typeof lb === 'string' && lb.indexOf('Other (') === 0;
      if (oa && !ob) return 1;
      if (ob && !oa) return -1;
      return (+data[b] || 0) - (+data[a] || 0);
    });
    var sLabels = idx.map(function(i){ return labels[i]; });
    var sData   = idx.map(function(i){ return data[i]; });

      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { boxWidth: 12, padding: 6, font: { size: 11 },
            generateLabels: function() {
              return sLabels.map(function(lbl, i) {
                var v = sData[i]; var p = total > 0 ? (v/total*100).toFixed(1) : '0.0';
                var valStr = moneyFmt ? fmtMoneyShort(v) : fmtInt(v);
                return { text: lbl + ' · ' + valStr + ' (' + p + '%)', fillStyle: sColors[i], strokeStyle: sColors[i], lineWidth: 0, hidden: false, index: i };

          tooltip: { callbacks: { label: function(c) { var v = c.parsed; var p = total > 0 ? (v/total*100).toFixed(1) : '0'; return c.label + ': ' + (moneyFmt ? fmtMoneyShort(v) : fmtInt(v)) + ' (' + p + '%)'; } } },
          datalabels: { color: '#fff', font: { size: 11, weight: 'bold' }, formatter: function(v) { var p = total > 0 ? (v/total*100) : 0; return p >= 5 ? p.toFixed(0) + '%' : ''; } }
        }
      },
      plugins: window.ChartDataLabels ? [ChartDataLabels] : []
    });
    _charts.push(chart);
  }

  // ─── Empty-state guard ────────────────────────────────────────────────
  var segment = D.segmentName || '';
  var countryName = D.countryName || '';
  var countryCode = D.countryCode || '';
  if (!D.totalReviews) {
    root.innerHTML = '<div class="card"><h3>Reviews VOC' + (segment ? ' · ' + esc(segment) : '') + (countryName ? ' · ' + esc(countryName) : '') + (countryCode ? ' (' + esc(countryCode) + ')' : '') + '</h3>' +
      '<p style="color:#64748b;font-size:.85rem;line-height:1.6">No review data loaded' + (countryName || segment ? ' for <strong>' + esc(countryName) + (segment ? ' · ' + esc(segment) : '') + '</strong>' : '') + '.</p></div>';

  }

  // ─── Render ────────────────────────────────────────────────────────────
  var STAR_COLORS = { 1: '#dc2626', 2: '#ea580c', 3: '#f59e0b', 4: '#22c55e', 5: '#16a34a' };
  var h = '';

  // KPI row
  var total = D.totalReviews;
  var pos = (D.starDist[3] || 0) + (D.starDist[4] || 0);
  var neg = (D.starDist[0] || 0) + (D.starDist[1] || 0) + (D.starDist[2] || 0);
  var posPct = (pos / total * 100).toFixed(1);
  var negPct = (neg / total * 100).toFixed(1);
  var ratio = neg > 0 ? (pos / neg).toFixed(1) : 'N/A';
  var segLower = segment ? esc(segment.toLowerCase()) : '';

  h += '<h2 style="margin-bottom:6px">Reviews VOC' + (segment ? ' · ' + esc(segment) : '') + (countryName ? ' · ' + esc(countryName) : '') + '</h2>';
  h += '<p style="margin:0 0 14px;color:#64748b;font-size:.78rem">Based on <b>' + total.toLocaleString() + '</b> reviews' + (segment || countryCode ? ' scraped from the top ' + (segment ? esc(segment.toLowerCase()) + ' products' : 'products') + (countryCode ? ' on amazon.' + esc(countryCode.toLowerCase()) : '') : '') + '.</p>';
  h += '<div class="kpis" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px">';
  h += '<div class="kpi"><div class="kpi-v">' + total.toLocaleString() + '</div><div class="kpi-l">Total Reviews</div></div>';
  h += '<div class="kpi"><div class="kpi-v">' + ratio + ' : 1</div><div class="kpi-l">Sentiment Ratio (pos:neg)</div></div>';
  h += '<div class="kpi"><div class="kpi-v" style="color:#16a34a">' + posPct + '%</div><div class="kpi-l">Positive (4★+5★)</div></div>';
  h += '<div class="kpi"><div class="kpi-v" style="color:#dc2626">' + negPct + '%</div><div class="kpi-l">Negative (1★–3★)</div></div>';
  h += '</div>';

  // Star Distribution Bar
  var dist = D.starDist;
  h += '<div class="card" style="padding:12px 16px;margin-bottom:20px">';
  h += '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">';

  h += '<div style="flex:1;display:flex;height:22px;border-radius:4px;overflow:hidden;min-width:200px">';
  dist.forEach(function(count, i) {
    var star = i + 1;

  dist.forEach(function(count, i) {
    h += '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + STAR_COLORS[i+1] + ';margin-right:3px"></span>' + (i+1) + '★ ' + count + '</span>';

  h += '<div class="cp-chart-box"><h4>When</h4><div class="cp-chart-wrap"><canvas id="urvECpWhen"></canvas></div></div>';

  h += '<div class="card" style="padding:0;overflow:hidden;border:1.5px solid #fecaca"><table class="us-table"><thead><tr style="background:#fef2f2"><th style="width:22%;border-left:3px solid #dc2626">Negative Feedback Topic</th><th>Reasons for Negative Feedback</th><th style="width:140px;text-align:right">Percentage</th></tr></thead><tbody id="urvENegBody"></tbody></table></div>';

  h += '</div>';
  h += '<div class="cs-pos-zone">';
  h += '<div class="card" style="padding:0;overflow:hidden;border:1.5px solid #bbf7d0"><table class="us-table"><thead><tr style="background:#f0fdf4"><th style="width:22%;border-left:3px solid #16a34a">Positive Feedback Topic</th><th>Reasons for Positive Feedback</th><th style="width:140px;text-align:right">Percentage</th></tr></thead><tbody id="urvEPosBody"></tbody></table></div>';
  h += '<div class="card" style="margin-top:22px"><div class="sec-header" style="margin-bottom:10px"><div class="sec-title">Positive Review Insights · Strategy</div></div>';
  h += '<table class="si-table"><thead><tr><th style="width:130px">Analysis Type</th><th>Finding (from 4★+5★ reviews)</th><th>Strategic Implication</th></tr></thead><tbody id="urvEPosInsights"></tbody></table></div>';

  h += '</div>';

  // Buyers Motivation
  h += '<div id="urvE-sec-bm" style="margin-top:36px">';
  h += '<div class="sec-header"><div class="sec-title">Buyers Motivation</div></div>';
  h += '<div class="card" style="padding:0;overflow:hidden"><table class="us-table"><thead><tr><th style="width:22%">Buyers Motivation</th><th>Reason</th><th style="width:140px;text-align:right">Percentage</th></tr></thead><tbody>';
  if (D.buyersMotivation && D.buyersMotivation.length) {
    var bmMax = parseFloat(D.buyersMotivation[0].pct);
    D.buyersMotivation.forEach(function(m) {
      h += '<tr><td class="us-label">' + m.label + '</td><td class="us-reason">' + m.reason + '</td>';
      h += '<td class="us-pct" data-val="' + parseFloat(m.pct) + '"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(m.pct, bmMax) + '"></div></div><span>' + m.pct + '</span></td></tr>';
    });
  }
  h += '</tbody></table></div></div>';

  // Customer Expectations
  h += '<div id="urvE-sec-ce" style="margin-top:36px">';
  h += '<div class="sec-header"><div class="sec-title">Customer Expectations</div></div>';
  h += '<div class="card" style="padding:0;overflow:hidden"><table class="us-table"><thead><tr><th style="width:22%">Unmet Need</th><th>Reason</th><th style="width:140px;text-align:right">Percentage</th></tr></thead><tbody>';
  if (D.customerExpectations && D.customerExpectations.length) {
    var ceMax = parseFloat(D.customerExpectations[0].pct);
    D.customerExpectations.forEach(function(e) {
      h += '<tr><td class="us-label">' + e.label + '</td><td class="us-reason">' + e.reason + '</td>';
      h += '<td class="us-pct" data-val="' + parseFloat(e.pct) + '"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(e.pct, ceMax) + '"></div></div><span>' + e.pct + '</span></td></tr>';
    });
  }
  h += '</tbody></table></div></div>';

  h += '</div>'; // end urvE-ci

  // ── SUB-PANEL: Review Browser ──
  h += '<div id="urvE-ca" class="voc-sub-panel">';
  h += '<div class="card"><h3>Review Browser <span style="font-size:.72rem;font-weight:400;color:#64748b;margin-left:8px">Filter by rating, theme, or keyword</span></h3>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
  h += '<select id="urvEFilterRating" style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 8px;background:#fff"><option value="">All Ratings</option><option value="1">1★</option><option value="2">2★</option><option value="3">3★</option><option value="4">4★</option><option value="5">5★</option></select>';
  h += '<select id="urvEFilterTheme" style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 8px;background:#fff"></select>';
  h += '<input id="urvEFilterSearch" placeholder="Search keyword..." style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 8px;width:160px">';
  h += '<button id="urvEClearBtn" style="font-size:.73rem;border:1.5px solid #cbd5e1;border-radius:5px;padding:4px 10px;background:#f8fafc;cursor:pointer">Clear</button>';
  h += '</div>';
  h += '<div id="urvEResultCount" style="font-size:.72rem;color:#64748b;margin-bottom:6px"></div>';
  h += '<div class="tbl-wrap" style="max-height:520px"><table><thead><tr><th style="width:40px">★</th><th>Review</th></tr></thead><tbody id="urvEReviewBody"></tbody></table></div>';
  h += '</div></div>';

  root.innerHTML = h;

  // ─── Wiring ────────────────────────────────────────────────────────────
  if (window.Chart && window.ChartDataLabels) { try { Chart.register(ChartDataLabels); } catch(e){} }

  // Sub-tab switching
  root.querySelectorAll('.voc-sub-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      root.querySelectorAll('.voc-sub-tab').forEach(function(t) { t.classList.remove('active'); });
      root.querySelectorAll('.voc-sub-panel').forEach(function(p) { p.classList.remove('active'); });
      tab.classList.add('active');
      var panel = document.getElementById(tab.dataset.panel);
      if (panel) panel.classList.add('active');
      if (window.Chart && Chart.instances) Object.values(Chart.instances).forEach(function(c) { c.resize(); });
    });
  });

  // Anchor scroll
  root.querySelectorAll('.voc-anchor-nav a').forEach(function(a) {
    a.addEventListener('click', function(e) {
      e.preventDefault();
      var target = document.getElementById(a.dataset.target);
      if (target) {
        var y = target.getBoundingClientRect().top + window.pageYOffset - 90;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
      root.querySelectorAll('.voc-anchor-nav a').forEach(function(x) { x.classList.remove('active'); });
      a.classList.add('active');
    });
  });

  // Customer Profile stacked bars
  function makeStackedBar(canvasId, dataObj) {
    var ctx = document.getElementById(canvasId);
    if (!ctx || !dataObj) return;
    var chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: dataObj.labels,
        datasets: [
          { label: '4-5 stars', data: dataObj.pos, backgroundColor: '#22c55e', borderRadius: { topLeft: 3, topRight: 3 }, barPercentage: 0.7 },
          { label: '1-3 stars', data: dataObj.neg.map(function(v) { return -v; }), backgroundColor: '#ef4444', borderRadius: { bottomLeft: 3, bottomRight: 3 }, barPercentage: 0.7 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, datalabels: { display: false },
          tooltip: { callbacks: { label: function(c) { return c.dataset.label + ': ' + Math.abs(c.raw); } } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#64748b', maxRotation: 35 } },
          y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 }, color: '#94a3b8', callback: function(v) { return Math.abs(v); } } }
        }
      }
    });
    _charts.push(chart);
  }
  if (D.cpWho)   makeStackedBar('urvECpWho',   D.cpWho);
  if (D.cpWhen)  makeStackedBar('urvECpWhen',  D.cpWhen);
  if (D.cpWhere) makeStackedBar('urvECpWhere', D.cpWhere);
  if (D.cpWhat)  makeStackedBar('urvECpWhat',  D.cpWhat);

  // Negative topics (expandable rows)
  if (D.negativeTopics && D.negativeTopics.length) {
    var negMax = parseFloat(D.negativeTopics[0].pct);
    var negHtml = '';
    D.negativeTopics.forEach(function(t) {
      var bullets = (t.bullets || []).map(function(b) { return '<li>' + b + '</li>'; }).join('');
      var quotes = (t.quotes || []).map(function(q) { return '<p>' + q + '</p>'; }).join('');
      negHtml += '<tr class="nf-row" style="cursor:pointer"><td class="us-label"><span class="nf-arrow">▶</span> ' + t.label + '</td>';
      negHtml += '<td class="us-reason">' + t.reason + '</td>';
      negHtml += '<td class="us-pct" data-val="' + parseFloat(t.pct) + '"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(t.pct, negMax) + ';background:#fca5a5"></div></div><span>' + t.pct + '</span></td></tr>';
      negHtml += '<tr class="nf-detail"><td colspan="3"><div class="nf-body"><ul>' + bullets + '</ul><div class="nf-quotes">' + quotes + '</div></div></td></tr>';

    document.getElementById('urvENegBody').innerHTML = negHtml;
  }
  if (D.negativeInsights) {
    document.getElementById('urvENegInsights').innerHTML = D.negativeInsights.map(function(i) {
      return '<tr><td><span class="si-badge" style="background:' + i.badgeBg + ';color:' + i.badgeColor + '">' + i.type + '</span></td><td>' + i.finding + '</td><td>' + i.implication + '</td></tr>';
    }).join('');
  }

  // Positive topics
  if (D.positiveTopics && D.positiveTopics.length) {
    var posMax = parseFloat(D.positiveTopics[0].pct);
    var posHtml = '';
    D.positiveTopics.forEach(function(t) {
      var bullets = (t.bullets || []).map(function(b) { return '<li>' + b + '</li>'; }).join('');
      var quotes = (t.quotes || []).map(function(q) { return '<p>' + q + '</p>'; }).join('');
      posHtml += '<tr class="pf-row" style="cursor:pointer"><td class="us-label"><span class="pf-arrow">▶</span> ' + t.label + '</td>';
      posHtml += '<td class="us-reason">' + t.reason + '</td>';
      posHtml += '<td class="us-pct" data-val="' + parseFloat(t.pct) + '"><div class="us-bar-wrap"><div class="us-bar" style="width:' + bw(t.pct, posMax) + ';background:#86efac"></div></div><span>' + t.pct + '</span></td></tr>';
      posHtml += '<tr class="pf-detail"><td colspan="3"><div class="pf-body"><ul>' + bullets + '</ul><div class="pf-quotes">' + quotes + '</div></div></td></tr>';
    });
    document.getElementById('urvEPosBody').innerHTML = posHtml;
  }
  if (D.positiveInsights) {
    document.getElementById('urvEPosInsights').innerHTML = D.positiveInsights.map(function(i) {
      return '<tr><td><span class="si-badge" style="background:' + i.badgeBg + ';color:' + i.badgeColor + '">' + i.type + '</span></td><td>' + i.finding + '</td><td>' + i.implication + '</td></tr>';
    }).join('');
  }

  // Toggle expandable rows
  root.querySelectorAll('.nf-row').forEach(function(row) {
    row.addEventListener('click', function() {
      var detail = row.nextElementSibling;
      var isOpen = row.classList.contains('open');
      root.querySelectorAll('.nf-row.open').forEach(function(r) { r.classList.remove('open'); r.nextElementSibling.classList.remove('open'); });
      if (!isOpen) { row.classList.add('open'); detail.classList.add('open'); }
    });
  });
  root.querySelectorAll('.pf-row').forEach(function(row) {
    row.addEventListener('click', function() {
      var detail = row.nextElementSibling;
      var isOpen = row.classList.contains('open');
      root.querySelectorAll('.pf-row.open').forEach(function(r) { r.classList.remove('open'); r.nextElementSibling.classList.remove('open'); });
      if (!isOpen) { row.classList.add('open'); detail.classList.add('open'); }
    });
  });

  // Review Browser
  if (D.themeFilters) {
    document.getElementById('urvEFilterTheme').innerHTML = '<option value="">All Themes</option>' + D.themeFilters.map(function(f) {
      return '<option value="' + f.value + '">' + f.label + '</option>';
    }).join('');
  }

  var reviews = D.reviews || [];

  function urvEFilter() {
    var rating = document.getElementById('urvEFilterRating').value;
    var theme  = document.getElementById('urvEFilterTheme').value;
    var search = (document.getElementById('urvEFilterSearch').value || '').toLowerCase();
    var filtered = reviews.filter(function(r) {
      if (rating && r.r != rating) return false;
      if (theme && (r.tags || []).indexOf(theme) === -1) return false;
      if (search && (r.t || '').toLowerCase().indexOf(search) === -1) return false;
      return true;
    });
    document.getElementById('urvEResultCount').textContent = 'Showing ' + filtered.length + ' of ' + reviews.length + ' reviews';
    var html = '';
    var limit = Math.min(filtered.length, 200);
    for (var i = 0; i < limit; i++) {
      var r = filtered[i];
      var starHtml = '<span style="color:' + STAR_COLORS[r.r] + ';font-weight:700">' + r.r + '★</span>';
      var tagsHtml = (r.tags || []).map(function(t) {
        return '<span class="pill ' + ((D.tagStyles && D.tagStyles[t]) || 'pill-blue') + '">' + t.replace(/_/g, ' ') + '</span>';
      }).join('');
      html += '<tr><td>' + starHtml + '</td><td><div class="review-text">' + (r.t || '').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>' +
        (tagsHtml ? '<div style="margin-top:4px">' + tagsHtml + '</div>' : '') + '</td></tr>';
    }
    if (filtered.length > 200) html += '<tr><td colspan="2" style="text-align:center;color:#64748b;font-size:.72rem;padding:12px">Showing first 200 of ' + filtered.length + '. Use filters to narrow.</td></tr>';
    document.getElementById('urvEReviewBody').innerHTML = html;
  }
  document.getElementById('urvEFilterRating').addEventListener('change', urvEFilter);
  document.getElementById('urvEFilterTheme').addEventListener('change', urvEFilter);
  document.getElementById('urvEFilterSearch').addEventListener('input', urvEFilter);
  document.getElementById('urvEClearBtn').addEventListener('click', function() {
    document.getElementById('urvEFilterRating').value = '';
    document.getElementById('urvEFilterTheme').value = '';
    document.getElementById('urvEFilterSearch').value = '';
    urvEFilter();
  });
  urvEFilter();

  // ─── Polish ────────────────────────────────────────────────────────────
  makeAllTablesSortable();
})();
</script>
