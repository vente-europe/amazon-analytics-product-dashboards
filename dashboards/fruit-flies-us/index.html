  #mddL-root .mddL-bar-fill { height:100%; background:linear-gradient(90deg,#3b82f6,#1e40af); border-radius:7px; }
  #mddL-root .mddL-brands { font-size:.66rem; color:#64748b; margin-left:170px; margin-bottom:4px; }
  #mddL-root table.mddL-gap { width:100%; border-collapse:collapse; font-size:.74rem; background:#fff; border:1px solid #e2e8f0; border-radius:8px; overflow:hidden; }
  #mddL-root table.mddL-gap th, #mddL-root table.mddL-gap td { padding:10px 12px; border-bottom:1px solid #f1f5f9; text-align:left; vertical-align:top; }
  #mddL-root table.mddL-gap th { background:#f8fafc; font-size:.66rem; font-weight:600; color:#475569; text-transform:uppercase; letter-spacing:.03em; }
  #mddL-root .mddL-sev { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  #mddL-root .mddL-sev-HIGH { background:#fee2e2; color:#991b1b; }
  #mddL-root .mddL-sev-MEDIUM { background:#fef3c7; color:#92400e; }
  #mddL-root .mddL-sev-LOW { background:#dcfce7; color:#166534; }
  #mddL-root .mddL-ws-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  #mddL-root .mddL-ws-card { background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:14px; }
  #mddL-root .mddL-ws-card h4 { margin:0 0 6px; font-size:.85rem; color:#0f172a; }
  #mddL-root .mddL-ws-rationale { font-size:.74rem; color:#475569; line-height:1.45; }
  #mddL-root .mddL-ws-evidence { font-size:.68rem; color:#64748b; margin-top:8px; padding-top:8px; border-top:1px dashed #e2e8f0; }
  #mddL-root .mddL-insight-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
  #mddL-root .mddL-insight-card { background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:14px; }
  #mddL-root .mddL-insight-badge { display:inline-block; padding:3px 10px; border-radius:10px; font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
  #mddL-root .mddL-insight-card h4 { margin:0 0 6px; font-size:.78rem; color:#0f172a; line-height:1.4; }
  #mddL-root .mddL-insight-card p { margin:6px 0 0; font-size:.72rem; color:#475569; line-height:1.5; }
</style>

<div id="u-mddL-tab-root"></div>

<script>
(function(){
  var D = window._TAB_DATA;
  var root = document.getElementById('u-mddL-tab-root');
  if (!D) { root.innerHTML = '<div class="card"><p style="color:#64748b;font-size:.85rem">No data loaded for this tab.</p></div>'; return; }

  // ─── inline helpers (self-contained) ───────────────────────────────────
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function fmtInt(n) { return Math.round(+n || 0).toLocaleString('en-US'); }
  function fmtMoney(n) { return (D.currency || '') + Math.round(+n || 0).toLocaleString('en-US'); }
  function fmtMoneyShort(n) {
    n = Math.round(+n || 0); var cur = D.currency || '';
    if (n >= 1e6) return cur + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return cur + (n / 1e3).toFixed(0) + 'K';
    return cur + n;
  }
  function fmtShort(n) {
    n = Math.round(+n || 0);
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return String(n);
  }
  function pct(v, t) { return (t > 0) ? ((v / t) * 100).toFixed(1) + '%' : '0%'; }
  function mfmt(n) { return (D.currency || '') + Number(n || 0).toFixed(0); }

  var BRAND_PALETTE = D.brandPalette || ['#2563eb','#dc2626','#16a34a','#f59e0b','#8b5cf6','#0891b2','#db2777','#65a30d'];
  function brandColor(name, i) {
    if (typeof name === 'string' && name.indexOf('Other (') === 0) return '#94a3b8';
    return BRAND_PALETTE[i % BRAND_PALETTE.length];
  }

  // ─── Sortable tables ───────────────────────────────────────────────────
  function parseSortValue(td) {
    if (td.dataset && td.dataset.val != null && td.dataset.val !== '') {
      var n = parseFloat(td.dataset.val);
      if (!isNaN(n)) return n;
    }
    var txt = (td.textContent || '').trim();
    var cleaned = txt.replace(/[\s, €$£%]/g, '').replace(/·/g, '');
    if (cleaned !== '' && !isNaN(parseFloat(cleaned))) return parseFloat(cleaned);
    return txt.toLowerCase();
  }
  function sortTableByColumn(table, colIdx, dir) {
    var tbody = table.tBodies[0]; if (!tbody) return;
    var rows = Array.prototype.slice.call(tbody.rows);
    rows.sort(function(a, b) {
      var va = parseSortValue(a.cells[colIdx]);
      var vb = parseSortValue(b.cells[colIdx]);
      if (va < vb) return dir === 'asc' ? -1 : 1;
      if (va > vb) return dir === 'asc' ? 1 : -1;
      return 0;
    });
    rows.forEach(function(r) { tbody.appendChild(r); });
  }
  function makeAllTablesSortable() {
    var tables = root.querySelectorAll('table');
    tables.forEach(function(table) {
      var ths = table.tHead ? table.tHead.rows[0].cells : table.rows[0].cells;
      Array.prototype.forEach.call(ths, function(th, idx) {
        if (th.dataset.sortable === '1') return;
        th.dataset.sortable = '1';
        th.style.cursor = 'pointer';
        th.style.userSelect = 'none';
        th.dataset.sortDir = '';
        var arrow = document.createElement('span');
        arrow.className = 'sort-arrow';
        arrow.style.cssText = 'margin-left:6px;opacity:.6;font-size:1.5em;color:#0f172a;vertical-align:middle;line-height:1';
        arrow.textContent = '▴▾';
        th.appendChild(arrow);
        th.addEventListener('click', function() {
          var dir = th.dataset.sortDir === 'asc' ? 'desc' : 'asc';
          Array.prototype.forEach.call(ths, function(other) {
            other.dataset.sortDir = '';
            var a = other.querySelector('.sort-arrow');
            if (a) { a.textContent = '▴▾'; a.style.opacity = '.6'; }
          });
          th.dataset.sortDir = dir;
          arrow.textContent = dir === 'asc' ? '▴' : '▾';
          arrow.style.opacity = '1';
          sortTableByColumn(table, idx, dir);
        });
      });
    });
  }

  var _charts = [];

  // Pie helper · legend SORTED BY VALUE DESC, "Other (…)" pinned last ────
  // (Unused in MDD's current layout but kept for future enrichments and so
  // every u-* template exposes the same helper surface.)
  function pie(canvasId, labels, data, colors, moneyFmt) {
    var el = document.getElementById(canvasId);
    if (!el) return;
    var idx = labels.map(function(_, i){ return i; });
    idx.sort(function(a, b){
      var la = labels[a], lb = labels[b];
      var oa = typeof la === 'string' && la.indexOf('Other (') === 0;
      var ob = typeof lb === 'string' && lb.indexOf('Other (') === 0;
      if (oa && !ob) return 1;
      if (ob && !oa) return -1;
      return (+data[b] || 0) - (+data[a] || 0);
    });
    var sLabels = idx.map(function(i){ return labels[i]; });
    var sData   = idx.map(function(i){ return data[i]; });
    var sColors = idx.map(function(i){ return colors[i]; });
    var total = sData.reduce(function(a,b){return a+(+b||0);}, 0);
    var ctx = el.getContext('2d');
    var chart = new Chart(ctx, {
      type: 'pie',
      data: { labels: sLabels, datasets: [{ data: sData, backgroundColor: sColors, borderWidth: 2, borderColor: '#fff' }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { boxWidth: 12, padding: 6, font: { size: 11 },
            generateLabels: function() {
              return sLabels.map(function(lbl, i) {
                var v = sData[i]; var p = total > 0 ? (v/total*100).toFixed(1) : '0.0';
                var valStr = moneyFmt ? fmtMoneyShort(v) : fmtInt(v);
                return { text: lbl + ' · ' + valStr + ' (' + p + '%)', fillStyle: sColors[i], strokeStyle: sColors[i], lineWidth: 0, hidden: false, index: i };
              });
            } } },
          tooltip: { callbacks: { label: function(c) { var v = c.parsed; var p = total > 0 ? (v/total*100).toFixed(1) : '0'; return c.label + ': ' + (moneyFmt ? fmtMoneyShort(v) : fmtInt(v)) + ' (' + p + '%)'; } } },
          datalabels: { color: '#fff', font: { size: 11, weight: 'bold' }, formatter: function(v) { var p = total > 0 ? (v/total*100) : 0; return p >= 5 ? p.toFixed(0) + '%' : ''; } }
        }
      },
      plugins: window.ChartDataLabels ? [ChartDataLabels] : []
    });
    _charts.push(chart);
  }

  // ─── Empty-state guard ────────────────────────────────────────────────
  var countryName = D.countryName || '';
  var countryCode = D.countryCode || '';
  var segment     = D.segmentName || '';
  var marketplace = D.marketplace || (countryCode ? 'amazon.' + countryCode.toLowerCase() : '');
  if (!D.competitors || !D.competitors.length) {
    root.innerHTML = '<div class="card"><h3>Marketing Deep-Dive' + (segment ? ' · ' + esc(segment) : '') + (countryName ? ' · ' + esc(countryName) : '') + (countryCode ? ' (' + esc(countryCode) + ')' : '') + '</h3>' +
      '<p style="color:#64748b;font-size:.85rem;line-height:1.6">No competitor data loaded' + (countryName ? ' for <strong>' + esc(countryName) + '</strong>' : '') + '.</p></div>';
    return;
  }

  // ─── Render ────────────────────────────────────────────────────────────
  var h = '<div id="mddL-root">';
  h += '<h2 style="margin-bottom:12px">Marketing Deep-Dive' + (segment ? ' · ' + esc(segment) : '') + (countryName ? ' · ' + esc(countryName) : '') + '</h2>';

  // Intro
  h += '<p class="sec-summary" style="margin-bottom:24px">Marketing intelligence across <b>' + D.totalCompetitors + ' top competitors</b>' + (marketplace ? ' on <b>' + esc(marketplace) + '</b>' : '') + '. Listings pulled from SP-API Catalog. Claims tagged across themes and cross-referenced with VOC findings from the Reviews tab.</p>';

  // 1. Competitor Overview Grid
  h += '<div class="mddL-section">';
  h += '<div class="mddL-sec-header"><div class="mddL-sec-title">1. Competitor Overview · Top ' + D.totalCompetitors + ' by 30d Revenue</div><div class="mddL-sec-sub">Click a card to see full bullets, claims, and image stack</div></div>';
  h += '<div class="mddL-explainer">Each card is one competitor listing pulled from <b>Amazon SP-API Catalog</b>. Brand, title, hero image, price, rating, BSR and 30-day sales/revenue come from the X-Ray export. The <b>theme tags</b> on each card show which marketing claims the listing makes (regex-matched against title + bullets + description in the local language).</div>';
  h += '<div class="mddL-comp-grid">';
  D.competitors.forEach(function(c, idx) {
    h += '<div class="mddL-comp-card" data-idx="' + idx + '">';
    h += '  <div class="mddL-comp-img">' + (c.mainImage ? '<img src="' + esc(c.mainImage) + '" alt="">' : '<span style="color:#cbd5e1;font-size:.7rem">no image</span>') + '</div>';
    h += '  <div class="mddL-comp-brand">' + esc(c.brand) + '</div>';
    h += '  <div class="mddL-comp-title">' + esc(c.title) + '</div>';
    h += '  <div class="mddL-comp-themes">';
    (c.themes || []).forEach(function(t) {
      h += '<span class="mddL-theme-pill">' + esc(String(t).replace(/_/g, ' ')) + '</span>';
    });
    h += '  </div>';
    h += '  <div class="mddL-comp-meta">';
    h += '    <span><b>' + mfmt(c.price) + '</b> price</span>';
    h += '    <span><b>★' + (+(c.rating || 0)).toFixed(1) + '</b> · ' + (+(c.reviews || 0)).toLocaleString() + '</span>';
    h += '    <span><b>' + mfmt(c.rev30d) + '</b> 30d rev</span>';
    h += '  </div>';
    h += '</div>';
  });
  h += '</div></div>';

  // 2. Claims Matrix
  if (D.claimsMatrix && D.claimsMatrix.themes && D.claimsMatrix.rows) {
    var cm = D.claimsMatrix;
    h += '<div class="mddL-section">';
    h += '<div class="mddL-sec-header"><div class="mddL-sec-title">2. Claims Matrix</div><div class="mddL-sec-sub">Rows = competitors, columns = claim themes. Filled = theme present in title/bullets.</div></div>';
    h += '<div class="mddL-explainer"><b>Heatmap:</b> a filled cell means the competitor explicitly claims that theme in their listing copy. Below the matrix, the bars rank themes by <b>adoption rate</b> across all ' + D.totalCompetitors + ' competitors. <b>~100% bars</b> = saturated table-stakes (everybody says it). <b>Short bars</b> = whitespace candidates (few competitors are claiming it — see Section 4).</div>';
    h += '<div class="mddL-matrix-wrap"><table class="mddL-matrix">';
    h += '<thead><tr><th class="mddL-row-h">Brand · ASIN</th>';
    cm.themes.forEach(function(t) { h += '<th>' + esc(t.label) + '</th>'; });
    h += '</tr></thead><tbody>';
    cm.rows.forEach(function(r) {
      h += '<tr><td class="mddL-row-h">' + esc(r.brand) + '<br><span style="font-weight:400;color:#94a3b8;font-size:.62rem">' + esc(r.asin) + '</span></td>';
      r.cells.forEach(function(cell) {
        h += '<td data-val="' + (cell ? 1 : 0) + '">' + (cell ? '<span class="mddL-cell-yes"></span>' : '<span class="mddL-cell-no"></span>') + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>';

    // Claims summary bars
    if (D.claimsSummary) {
      h += '<div style="margin-top:20px"><div class="mddL-sec-sub" style="margin-bottom:8px">Claim frequency across all ' + D.totalCompetitors + ' listings</div>';
      var sortedClaims = D.claimsSummary.slice().sort(function(a,b) { return (+b.count||0) - (+a.count||0); });
      sortedClaims.forEach(function(s) {
        h += '<div class="mddL-bar-row">';
        h += '  <div style="font-weight:600;color:#1e293b">' + esc(s.label) + '</div>';
        h += '  <div class="mddL-bar-track"><div class="mddL-bar-fill" style="width:' + s.pct + '%"></div></div>';
        h += '  <div style="text-align:right;color:#475569"><b>' + s.count + '</b> · ' + s.pct + '%</div>';
        h += '</div>';
        h += '<div class="mddL-brands">Top brands: ' + (s.topBrands || []).map(esc).join(' · ') + '</div>';
      });
      h += '</div>';
    }
    h += '</div>';
  }

  // 3. VOC ↔ Claims Gap Analysis
  if (D.vocGap && D.vocGap.length) {
    h += '<div class="mddL-section">';
    h += '<div class="mddL-sec-header"><div class="mddL-sec-title">3. VOC ↔ Claims Gap Analysis</div><div class="mddL-sec-sub">Customer concerns from the Reviews tab vs how many of the ' + D.totalCompetitors + ' competitors address them</div></div>';
    h += '<div class="mddL-explainer">Cross-references the <b>Reviews VOC tab\'s top complaints</b> with what competitors claim in their listings.<br>· <b>VOC Topic</b> = a complaint theme from your Reviews analysis. · <b>Customer %</b> = share of negative reviews mentioning it. · <b>Addressed by</b> = how many of the ' + D.totalCompetitors + ' competitors make a listing claim that maps to this complaint. · <b>Severity</b>: <span class="mddL-sev mddL-sev-HIGH">HIGH</span> = ≥20% concern AND ≤1 competitor addresses · <span class="mddL-sev mddL-sev-MEDIUM">MED</span> = ≥10% AND ≤2 · <span class="mddL-sev mddL-sev-LOW">LOW</span> = otherwise. · <b>Whitespace</b> = <code>true</code> when zero competitors address it (the strongest signal).<br><b>How to act:</b> hunt for HIGH/MED rows or any row with high % + low addressed-by — those are listing differentiation plays.</div>';
    h += '<table class="mddL-gap"><thead><tr>';
    h += '<th>VOC Topic</th><th>Customer %</th><th>Addressed by</th><th>Severity</th><th>Whitespace</th>';
    h += '</tr></thead><tbody>';
    D.vocGap.forEach(function(g) {
      h += '<tr>';
      h += '<td><b>' + esc(g.vocTopic) + '</b></td>';
      h += '<td data-val="' + parseFloat(g.customerConcernPct) + '"><b>' + esc(g.customerConcernPct) + '</b></td>';
      h += '<td data-val="' + (+g.addressedByCount || 0) + '"><b>' + g.addressedByCount + ' / ' + D.totalCompetitors + '</b><br><span style="font-size:.66rem;color:#64748b">' + (g.addressedByBrands || []).map(esc).join(', ') + '</span></td>';
      h += '<td><span class="mddL-sev mddL-sev-' + g.gapSeverity + '">' + g.gapSeverity + '</span></td>';
      h += '<td>' + esc(g.whitespace) + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }

  // 4. Whitespace + Saturation
  if (D.whitespaceOpportunities && D.whitespaceOpportunities.length) {
    h += '<div class="mddL-section">';
    h += '<div class="mddL-sec-header"><div class="mddL-sec-title">4. Whitespace Opportunities</div><div class="mddL-sec-sub">High customer demand × low competitor coverage</div></div>';
    h += '<div class="mddL-explainer">Themes claimed by <b>≤25% of competitors</b> — empty marketing real estate. Picking one of these and leading with it in your hero bullet or A+ content gives you a claim that buyers don\'t see elsewhere on the search results page. The brands listed under each card are the only ones currently making the claim.</div>';
    h += '<div class="mddL-ws-grid">';
    D.whitespaceOpportunities.forEach(function(w) {
      h += '<div class="mddL-ws-card">';
      h += '  <h4>' + esc(w.opportunity) + '</h4>';
      h += '  <div class="mddL-ws-rationale">' + esc(w.rationale) + '</div>';
      h += '  <div class="mddL-ws-evidence">' + esc(w.evidence) + '</div>';
      h += '</div>';
    });
    h += '</div></div>';
  }
  if (D.saturation && D.saturation.length) {
    h += '<div class="mddL-section">';
    h += '<div class="mddL-sec-header"><div class="mddL-sec-title">Saturated Claims · Diminishing Returns</div><div class="mddL-sec-sub">Most-used claims where adding the same message no longer differentiates</div></div>';
    h += '<div class="mddL-explainer">Themes claimed by <b>≥60% of competitors</b> — table-stakes. You still need to claim them (buyers expect them), but adding them won\'t move the needle. Treat as <b>parity bullets</b>, not hero bullets, and spend your differentiation budget on Whitespace items above.</div>';
    h += '<div class="mddL-ws-grid">';
    D.saturation.forEach(function(s) {
      h += '<div class="mddL-ws-card">';
      h += '  <h4>' + esc(s.label) + ' <span style="float:right;color:#dc2626;font-size:.78rem">' + s.saturationPct + '</span></h4>';
      h += '  <div class="mddL-ws-rationale">' + esc(s.advice) + '</div>';
      h += '</div>';
    });
    h += '</div></div>';
  }

  // 5. Strategic Recommendations
  if (D.strategicRecommendations && D.strategicRecommendations.length) {
    h += '<div class="mddL-section">';
    h += '<div class="mddL-sec-header"><div class="mddL-sec-title">5. Strategic Recommendations</div><div class="mddL-sec-sub">Synthesized findings + actionable implications</div></div>';
    h += '<div class="mddL-explainer">Auto-derived from the highest-severity <b>VOC gaps</b> and biggest <b>whitespace</b> opportunities above. Each card pairs a finding (what the data shows) with an implication (what to do about it in your listing). Use these as a starting point for listing rewrites and A+ content priorities.</div>';
    h += '<div class="mddL-insight-grid">';
    D.strategicRecommendations.forEach(function(r) {
      h += '<div class="mddL-insight-card">';
      h += '  <span class="mddL-insight-badge" style="background:' + esc(r.badgeBg) + ';color:' + esc(r.badgeColor) + '">' + esc(r.type) + '</span>';
      h += '  <h4>' + esc(r.finding) + '</h4>';
      h += '  <p><b>→</b> ' + esc(r.implication) + '</p>';
      h += '</div>';
    });
    h += '</div></div>';
  }

  // Modal
  h += '<div id="u-mddL-modal" class="u-mddL-modal"><div class="u-mddL-modal-body"><span class="u-mddL-modal-close">×</span><div id="u-mddL-modal-content"></div></div></div>';
  h += '</div>'; // end #mddL-root

  // Inline modal styling — keeps the modal self-contained even if the dashboard
  // shell didn't bring its own #mddL-modal CSS (e.g. for hub-iframe contexts).
  h += '<style>' +
       '#u-mddL-modal { display:none; position:fixed; inset:0; background:rgba(15,42,66,.7); z-index:1000; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; }' +
       '#u-mddL-modal.open { display:flex; }' +
       '#u-mddL-modal .u-mddL-modal-body { background:#fff; max-width:1000px; width:100%; border-radius:10px; padding:24px; max-height:calc(100vh - 80px); overflow-y:auto; }' +
       '#u-mddL-modal .u-mddL-modal-close { float:right; cursor:pointer; font-size:1.4rem; color:#64748b; line-height:1; padding:4px 8px; }' +
       '#u-mddL-modal .u-mddL-modal-close:hover { color:#0f172a; }' +
       '#u-mddL-modal .u-mddL-modal-imgs { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin:16px 0; }' +
       '#u-mddL-modal .u-mddL-modal-imgs img { width:100%; aspect-ratio:1; object-fit:contain; background:#f8fafc; border-radius:6px; border:1px solid #e2e8f0; }' +
       '#u-mddL-modal .u-mddL-bullets { list-style:none; padding:0; margin:0; }' +
       '#u-mddL-modal .u-mddL-bullets li { padding:8px 12px; background:#f8fafc; border-left:3px solid #3b82f6; margin-bottom:6px; font-size:.78rem; line-height:1.5; color:#1e293b; border-radius:0 6px 6px 0; }' +
       '</style>';

  root.innerHTML = h;

  // ─── Card click → modal ────────────────────────────────────────────────
  var modal = document.getElementById('u-mddL-modal');
  var modalContent = document.getElementById('u-mddL-modal-content');
  root.querySelectorAll('.mddL-comp-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var c = D.competitors[parseInt(card.dataset.idx, 10)];
      var m = '';
      m += '<div style="font-size:.72rem;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">' + esc(c.brand) + ' · ' + esc(c.asin) + '</div>';

<script>
(function(){
  var D = window._TAB_DATA;
  var root = document.getElementById('u-mddE-tab-root');
  if (!D) { root.innerHTML = '<div class="card"><p style="color:#64748b;font-size:.85rem">No data loaded for this tab.</p></div>'; return; }

  // ─── inline helpers (self-contained) ───────────────────────────────────
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function fmtInt(n) { return Math.round(+n || 0).toLocaleString('en-US'); }
  function fmtMoney(n) { return (D.currency || '') + Math.round(+n || 0).toLocaleString('en-US'); }
  function fmtMoneyShort(n) {
    n = Math.round(+n || 0); var cur = D.currency || '';
    if (n >= 1e6) return cur + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return cur + (n / 1e3).toFixed(0) + 'K';
    return cur + n;
  }
  function fmtShort(n) {
    n = Math.round(+n || 0);
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return String(n);
  }
  function pct(v, t) { return (t > 0) ? ((v / t) * 100).toFixed(1) + '%' : '0%'; }
  function mfmt(n) { return (D.currency || '') + Number(n || 0).toFixed(0); }

  var BRAND_PALETTE = D.brandPalette || ['#2563eb','#dc2626','#16a34a','#f59e0b','#8b5cf6','#0891b2','#db2777','#65a30d'];
  function brandColor(name, i) {
    if (typeof name === 'string' && name.indexOf('Other (') === 0) return '#94a3b8';
    return BRAND_PALETTE[i % BRAND_PALETTE.length];
  }

  // ─── Sortable tables ───────────────────────────────────────────────────
  function parseSortValue(td) {
    if (td.dataset && td.dataset.val != null && td.dataset.val !== '') {
      var n = parseFloat(td.dataset.val);
      if (!isNaN(n)) return n;
    }
    var txt = (td.textContent || '').trim();
    var cleaned = txt.replace(/[\s, €$£%]/g, '').replace(/·/g, '');
    if (cleaned !== '' && !isNaN(parseFloat(cleaned))) return parseFloat(cleaned);
    return txt.toLowerCase();
  }
  function sortTableByColumn(table, colIdx, dir) {
    var tbody = table.tBodies[0]; if (!tbody) return;
    var rows = Array.prototype.slice.call(tbody.rows);
    rows.sort(function(a, b) {
      var va = parseSortValue(a.cells[colIdx]);
      var vb = parseSortValue(b.cells[colIdx]);
      if (va < vb) return dir === 'asc' ? -1 : 1;
      if (va > vb) return dir === 'asc' ? 1 : -1;
      return 0;
    });
    rows.forEach(function(r) { tbody.appendChild(r); });
  }
  function makeAllTablesSortable() {
    var tables = root.querySelectorAll('table');
    tables.forEach(function(table) {
      var ths = table.tHead ? table.tHead.rows[0].cells : table.rows[0].cells;
      Array.prototype.forEach.call(ths, function(th, idx) {
        if (th.dataset.sortable === '1') return;
        th.dataset.sortable = '1';
        th.style.cursor = 'pointer';
        th.style.userSelect = 'none';
        th.dataset.sortDir = '';
        var arrow = document.createElement('span');
        arrow.className = 'sort-arrow';
        arrow.style.cssText = 'margin-left:6px;opacity:.6;font-size:1.5em;color:#0f172a;vertical-align:middle;line-height:1';
        arrow.textContent = '▴▾';
        th.appendChild(arrow);
        th.addEventListener('click', function() {
          var dir = th.dataset.sortDir === 'asc' ? 'desc' : 'asc';
          Array.prototype.forEach.call(ths, function(other) {
            other.dataset.sortDir = '';
            var a = other.querySelector('.sort-arrow');
            if (a) { a.textContent = '▴▾'; a.style.opacity = '.6'; }
          });
          th.dataset.sortDir = dir;
          arrow.textContent = dir === 'asc' ? '▴' : '▾';
          arrow.style.opacity = '1';
          sortTableByColumn(table, idx, dir);
        });
      });
    });
  }

  var _charts = [];

  // Pie helper · legend SORTED BY VALUE DESC, "Other (…)" pinned last ────
  // (Unused in MDD's current layout but kept for future enrichments and so
  // every u-* template exposes the same helper surface.)
  function pie(canvasId, labels, data, colors, moneyFmt) {
    var el = document.getElementById(canvasId);
    if (!el) return;
    var idx = labels.map(function(_, i){ return i; });
    idx.sort(function(a, b){
      var la = labels[a], lb = labels[b];
      var oa = typeof la === 'string' && la.indexOf('Other (') === 0;
      var ob = typeof lb === 'string' && lb.indexOf('Other (') === 0;
      if (oa && !ob) return 1;
      if (ob && !oa) return -1;
      return (+data[b] || 0) - (+data[a] || 0);
    });
    var sLabels = idx.map(function(i){ return labels[i]; });
    var sData   = idx.map(function(i){ return data[i]; });
    var sColors = idx.map(function(i){ return colors[i]; });
    var total = sData.reduce(function(a,b){return a+(+b||0);}, 0);
    var ctx = el.getContext('2d');
    var chart = new Chart(ctx, {
      type: 'pie',
      data: { labels: sLabels, datasets: [{ data: sData, backgroundColor: sColors, borderWidth: 2, borderColor: '#fff' }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { boxWidth: 12, padding: 6, font: { size: 11 },
            generateLabels: function() {
              return sLabels.map(function(lbl, i) {
                var v = sData[i]; var p = total > 0 ? (v/total*100).toFixed(1) : '0.0';
                var valStr = moneyFmt ? fmtMoneyShort(v) : fmtInt(v);
                return { text: lbl + ' · ' + valStr + ' (' + p + '%)', fillStyle: sColors[i], strokeStyle: sColors[i], lineWidth: 0, hidden: false, index: i };
              });
            } } },
          tooltip: { callbacks: { label: function(c) { var v = c.parsed; var p = total > 0 ? (v/total*100).toFixed(1) : '0'; return c.label + ': ' + (moneyFmt ? fmtMoneyShort(v) : fmtInt(v)) + ' (' + p + '%)'; } } },
          datalabels: { color: '#fff', font: { size: 11, weight: 'bold' }, formatter: function(v) { var p = total > 0 ? (v/total*100) : 0; return p >= 5 ? p.toFixed(0) + '%' : ''; } }
        }
      },
      plugins: window.ChartDataLabels ? [ChartDataLabels] : []
    });
    _charts.push(chart);
  }

  // ─── Empty-state guard ────────────────────────────────────────────────
  var countryName = D.countryName || '';
  var countryCode = D.countryCode || '';
  var segment     = D.segmentName || '';
  var marketplace = D.marketplace || (countryCode ? 'amazon.' + countryCode.toLowerCase() : '');
  if (!D.competitors || !D.competitors.length) {
    root.innerHTML = '<div class="card"><h3>Marketing Deep-Dive' + (segment ? ' · ' + esc(segment) : '') + (countryName ? ' · ' + esc(countryName) : '') + (countryCode ? ' (' + esc(countryCode) + ')' : '') + '</h3>' +
      '<p style="color:#64748b;font-size:.85rem;line-height:1.6">No competitor data loaded' + (countryName ? ' for <strong>' + esc(countryName) + '</strong>' : '') + '.</p></div>';
    return;
  }

  // ─── Render ────────────────────────────────────────────────────────────
  var h = '<div id="mddE-root">';
  h += '<h2 style="margin-bottom:12px">Marketing Deep-Dive' + (segment ? ' · ' + esc(segment) : '') + (countryName ? ' · ' + esc(countryName) : '') + '</h2>';

  // Intro
  h += '<p class="sec-summary" style="margin-bottom:24px">Marketing intelligence across <b>' + D.totalCompetitors + ' top competitors</b>' + (marketplace ? ' on <b>' + esc(marketplace) + '</b>' : '') + '. Listings pulled from SP-API Catalog. Claims tagged across themes and cross-referenced with VOC findings from the Reviews tab.</p>';

  // 1. Competitor Overview Grid
  h += '<div class="mddE-section">';
  h += '<div class="mddE-sec-header"><div class="mddE-sec-title">1. Competitor Overview · Top ' + D.totalCompetitors + ' by 30d Revenue</div><div class="mddE-sec-sub">Click a card to see full bullets, claims, and image stack</div></div>';
  h += '<div class="mddE-explainer">Each card is one competitor listing pulled from <b>Amazon SP-API Catalog</b>. Brand, title, hero image, price, rating, BSR and 30-day sales/revenue come from the X-Ray export. The <b>theme tags</b> on each card show which marketing claims the listing makes (regex-matched against title + bullets + description in the local language).</div>';
  h += '<div class="mddE-comp-grid">';
  D.competitors.forEach(function(c, idx) {
    h += '<div class="mddE-comp-card" data-idx="' + idx + '">';
    h += '  <div class="mddE-comp-img">' + (c.mainImage ? '<img src="' + esc(c.mainImage) + '" alt="">' : '<span style="color:#cbd5e1;font-size:.7rem">no image</span>') + '</div>';
    h += '  <div class="mddE-comp-brand">' + esc(c.brand) + '</div>';
    h += '  <div class="mddE-comp-title">' + esc(c.title) + '</div>';
    h += '  <div class="mddE-comp-themes">';
    (c.themes || []).forEach(function(t) {
      h += '<span class="mddE-theme-pill">' + esc(String(t).replace(/_/g, ' ')) + '</span>';
    });
    h += '  </div>';
    h += '  <div class="mddE-comp-meta">';
    h += '    <span><b>' + mfmt(c.price) + '</b> price</span>';
    h += '    <span><b>★' + (+(c.rating || 0)).toFixed(1) + '</b> · ' + (+(c.reviews || 0)).toLocaleString() + '</span>';
    h += '    <span><b>' + mfmt(c.rev30d) + '</b> 30d rev</span>';
    h += '  </div>';
    h += '</div>';
  });
  h += '</div></div>';

  // 2. Claims Matrix
  if (D.claimsMatrix && D.claimsMatrix.themes && D.claimsMatrix.rows) {
    var cm = D.claimsMatrix;

  </div>
  <div class="un-main">
    <aside class="un-needs-panel">
      <div class="un-panel-header">
        <h3>Unmet Needs</h3>
        <span class="un-count" id="un-needs-count">— categories</span>
      </div>
      <div class="un-needs-list" id="un-needs-list"></div>
    </aside>
    <section class="un-reviews-panel">
      <div class="un-reviews-header">
        <div class="un-title-sm">Reviews mentioning</div>
        <div class="un-selected">
          <span id="un-selected-name">—</span>
          <span class="un-pill" id="un-selected-count">—</span>
        </div>
        <div class="un-reason-line" id="un-selected-reason"></div>
        <div class="un-filters">
          <input type="text" placeholder="Search within these reviews..." id="un-search-input">
          <select id="un-rating-filter">
            <option value="">All ratings</option>
            <option value="1">1★ only</option>
            <option value="2">2★ only</option>
            <option value="3">3★ only</option>
            <option value="4">4★ only</option>
            <option value="5">5★ only</option>
          </select>
          <select id="un-brand-filter">
            <option value="">All brands</option>
          </select>
        </div>
      </div>
      <div class="un-reviews-scrollable" id="un-reviews-list"></div>
    </section>
  </div>
</div>

<script>
(function () {
  var D = window._TAB_DATA;
  if (!D || !D.buckets) {
    var r = document.getElementById('un-root');
    if (r) r.innerHTML = '<div class="un-empty-state"><div class="un-icon">⚠️</div>Unmet Needs data not loaded.</div>';
    return;
  }

  var currentSegment = D.defaultSegment || D.segments[0];
  var selectedNeedId = null;

  function severityFor(pct){
    if (pct > 15) return 'high';
    if (pct >= 5) return 'med';
    return 'low';
  }
  function reviewCount(pct, total){ return Math.round(pct * total / 100); }
  function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function highlight(text, keywords){
    var out = text || '';
    (keywords || []).forEach(function(kw){
      try {
        var re = new RegExp('(' + escapeRe(kw) + ')', 'gi');
        out = out.replace(re, '<mark>$1</mark>');
      } catch(_){}
    });
    return out;
  }
  function stars(rating){
    var r = Math.round(rating || 0);
    if (r === 0) return '<span class="un-empty">— no rating —</span>';
    return '★'.repeat(r) + '<span class="un-empty">' + '★'.repeat(5-r) + '</span>';
  }
  function fmt(n){ return (n || 0).toLocaleString(); }

  function renderSegToggle(){
    var SEG_CLASS = { 'Lure': 'lure', 'Electric Traps': 'electric' };
    document.getElementById('un-seg-toggle').innerHTML = D.segments.map(function(name){
      var cls = SEG_CLASS[name] || 'lure';
      var active = name === currentSegment ? ' active' : '';
      return '<button class="un-seg-btn' + active + '" data-segment="' + name + '" role="tab"><span class="un-dot ' + cls + '"></span> ' + name + '</button>';
    }).join('');
    document.querySelectorAll('#un-seg-toggle .un-seg-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ switchSegment(btn.dataset.segment); });
    });
  }

  function renderKpis(){
    var seg = D.buckets[currentSegment];
    if (!seg) return;
    var top = seg.needs.slice().sort(function(a,b){return b.pct - a.pct;})[0];
    var topCount = reviewCount(top.pct, seg.totalReviews);
    document.getElementById('un-kpi-row').innerHTML =
      '<div class="un-kpi un-highlight"><div class="un-label">Segment</div><div class="un-value">' + seg.segmentName + '</div><div class="un-sublabel">avg rating ' + seg.avgRating.toFixed(2) + '★</div></div>' +
      '<div class="un-kpi"><div class="un-label">Reviews Analyzed</div><div class="un-value">' + fmt(seg.totalReviews) + '</div><div class="un-sublabel">Amazon US · AI-classified</div></div>' +
      '<div class="un-kpi"><div class="un-label">Unmet Needs</div><div class="un-value">' + seg.needs.length + '</div><div class="un-sublabel">from AI VOC analysis</div></div>' +
      '<div class="un-kpi"><div class="un-label">Top Unmet Need</div><div class="un-value" style="font-size:.85rem">' + top.name + '</div><div class="un-sublabel">' + fmt(topCount) + ' reviews (' + top.pct + '%)</div></div>';
  }

  function renderNeeds(){
    var seg = D.buckets[currentSegment];
    if (!seg) return;
    document.getElementById('un-needs-count').textContent = seg.needs.length + ' categories';
    var maxPct = Math.max.apply(null, seg.needs.map(function(n){return n.pct;}));
    document.getElementById('un-needs-list').innerHTML = seg.needs.map(function(n){
      var sev = severityFor(n.pct);
      var count = reviewCount(n.pct, seg.totalReviews);
      var active = n.id === selectedNeedId ? ' active' : '';
      return '<div class="un-need-card un-severity-' + sev + active + '" data-id="' + n.id + '">' +
               '<div class="un-top-row">' +
                 '<div class="un-name">' + n.name + '</div>' +
                 '<div class="un-count-pct"><span class="un-num">' + fmt(count) + '</span>' + n.pct + '%</div>' +
               '</div>' +
               '<div class="un-reason">' + n.reason + '</div>' +
               '<div class="un-bar"><div class="un-bar-fill" style="width:' + ((n.pct / maxPct) * 100) + '%"></div></div>' +
             '</div>';
    }).join('');
    document.querySelectorAll('#un-needs-list .un-need-card').forEach(function(el){
      el.addEventListener('click', function(){
        selectedNeedId = el.dataset.id;
        renderNeeds();
        renderReviews();
      });
    });
  }

  function renderReviews(){
    var seg = D.buckets[currentSegment];
    if (!seg) return;
    var need = seg.needs.filter(function(n){return n.id === selectedNeedId;})[0] || seg.needs[0];
    selectedNeedId = need.id;
    var count = reviewCount(need.pct, seg.totalReviews);
    document.getElementById('un-selected-name').textContent = need.name;
    document.getElementById('un-selected-count').textContent = fmt(count) + ' reviews (' + need.pct + '%)';
    document.getElementById('un-selected-reason').textContent = need.reason;

    var reviews = (seg.samples && seg.samples[need.id]) || [];
    var search = (document.getElementById('un-search-input').value || '').toLowerCase();
    var ratingFilter = document.getElementById('un-rating-filter').value;
    var brandFilter = document.getElementById('un-brand-filter').value;

    var filtered = reviews.filter(function(r){
      if (search && ((r.title||'') + ' ' + (r.body||'')).toLowerCase().indexOf(search) === -1) return false;
      if (ratingFilter && String(r.rating) !== ratingFilter) return false;
      if (brandFilter && r.brand !== brandFilter) return false;
      return true;
    });

    var list = document.getElementById('un-reviews-list');
    if (!filtered.length){
      list.innerHTML = '<div class="un-empty-state"><div class="un-icon">📭</div>No reviews match current filters. In production, ' + fmt(count) + ' reviews available for this need.</div>';
      return;
    }
    var note = '<div class="un-sample-note">📊 Showing <strong>' + filtered.length + ' sample reviews</strong> below (extracted via keyword matching). The unmet-need percentage (' + need.pct + '%) is from the AI-classified VOC analysis over all <strong>' + fmt(seg.totalReviews) + '</strong> ' + seg.segmentName + ' reviews.</div>';
    list.innerHTML = note + filtered.map(function(r){
      return '<div class="un-review-card">' +
               '<div class="un-rev-top">' +
                 '<div class="un-stars">' + stars(r.rating) + '</div>' +
                 '<div class="un-meta">' +
                   (r.brand ? '<span class="un-brand">' + r.brand + '</span>' : '') +
                   '<span>' + (r.date || '') + '</span>' +
                 '</div>' +
               '</div>' +
               '<div class="un-rev-title">' + highlight(r.title, need.keywords) + '</div>' +
               '<div class="un-rev-body">' + highlight(r.body, need.keywords) + '</div>' +
               (r.asin ? '<div class="un-asin">ASIN: ' + r.asin + '</div>' : '') +
             '</div>';
    }).join('');
  }

  function populateBrandFilter(){
    var seg = D.buckets[currentSegment];
    var sel = document.getElementById('un-brand-filter');
    sel.innerHTML = '<option value="">All brands</option>';
    if (!seg || !seg.samples) return;
    var brands = {};
    Object.keys(seg.samples).forEach(function(k){
      seg.samples[k].forEach(function(r){ if (r.brand) brands[r.brand] = true; });
    });
    Object.keys(brands).sort().forEach(function(b){
      var opt = document.createElement('option');
      opt.value = b; opt.textContent = b;
      sel.appendChild(opt);
    });
  }

  function switchSegment(name){
    currentSegment = name;
    document.querySelectorAll('#un-seg-toggle .un-seg-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.segment === name);
    });
    var seg = D.buckets[name];
    selectedNeedId = (seg && seg.needs[0]) ? seg.needs[0].id : null;
    renderKpis();
    renderNeeds();
    populateBrandFilter();
    document.getElementById('un-search-input').value = '';
    document.getElementById('un-rating-filter').value = '';
    document.getElementById('un-brand-filter').value = '';
    renderReviews();
  }

  document.getElementById('un-search-input').addEventListener('input', renderReviews);
  document.getElementById('un-rating-filter').addEventListener('change', renderReviews);
  document.getElementById('un-brand-filter').addEventListener('change', renderReviews);

  // Initial render
  renderSegToggle();
  var initSeg = D.buckets[currentSegment];
  selectedNeedId = (initSeg && initSeg.needs[0]) ? initSeg.needs[0].id : null;
  renderKpis();
  renderNeeds();
  populateBrandFilter();
  renderReviews();
})();
</script>
</template>
<script>
(function bootstrap() {
  var B = window.__BUNDLE_DATA__;
  document.getElementById('hdrTitle').textContent = B.title;
  document.getElementById('hdrSub').textContent = B.subtitle;
  var tabs = Object.keys(B.tabs).map(function(id, i) {
    return { id: id, label: (i + 1) + ' · ' + B.tabs[id].label };
  });
  var bar = document.getElementById('tabBar');
  bar.innerHTML = tabs.map(function(t, i) {
    return '<button class="tab' + (i === 0 ? ' active' : '') + '" data-tab="' + t.id + '">' + t.label + '</button>';
  }).join('');
  var loaded = {};
  function loadTab(id) {
    window._TAB_DATA = B.tabs[id].data;
    if (loaded[id]) return;
    var panel = document.getElementById('dt-' + id);
    var tpl = document.getElementById('tpl-' + id);
    panel.innerHTML = tpl.innerHTML;
    panel.querySelectorAll('script').forEach(function(oldScript) {
      var s = document.createElement('script');
      s.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(s, oldScript);
    });
    loaded[id] = true;
  }
  function showTab(id) {
    document.querySelectorAll('.tabs .tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === id); });
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.toggle('active', p.id === 'dt-' + id); });
    loadTab(id);
    if (window.Chart) Object.values(Chart.instances).forEach(function(c) { c.resize(); });
  }
  bar.querySelectorAll('.tab').forEach(function(btn) {
    btn.addEventListener('click', function() { showTab(btn.dataset.tab); });
  });
  showTab(tabs[0].id);
})();
</script>
</body>
</html>
