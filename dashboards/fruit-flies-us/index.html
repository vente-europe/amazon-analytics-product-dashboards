<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fruit Flies (US)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════
   Dashboard Hub — Core Layout
   ═══════════════════════════════════════════════════════ */

* { box-sizing: border-box; margin: 0; padding: 0 }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  font-size: 13px;
  display: flex;
  min-height: 100vh;
}

/* ── Sidebar ── */
.sidebar {
  width: 272px;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  transition: transform .25s ease;
}

.sidebar-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid #f1f5f9;
  display: flex;
  align-items: center;
  gap: 12px;
}

.sidebar-icon {
  width: 24px;
  height: 24px;
  color: #2563eb;
  flex-shrink: 0;
}

.sidebar-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: #0f2942;
  line-height: 1.2;
}

.sidebar-subtitle {
  font-size: .65rem;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 600;
  margin-top: 2px;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
}

.sidebar-group {
  margin-bottom: 20px;
}

.sidebar-group-title {
  font-size: .6rem;
  font-weight: 700;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: .1em;
  padding: 0 10px 8px;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 12px;
  border: none;
  background: none;
  border-radius: 8px;
  font-size: .82rem;
  font-weight: 500;
  color: #475569;
  cursor: pointer;
  text-align: left;
  transition: all .15s ease;
  margin-bottom: 2px;
}

.sidebar-item:hover {
  background: #f8fafc;
  color: #1e293b;
}

.sidebar-item.active {
  background: #eff6ff;
  color: #2563eb;
  font-weight: 600;
}

.sidebar-item-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.sidebar-item .arrow {
  margin-left: auto;
  width: 16px;
  height: 16px;
  color: #cbd5e1;
  opacity: 0;
  transform: translateX(-4px);
  transition: all .15s ease;
}

.sidebar-item.active .arrow,
.sidebar-item:hover .arrow {
  opacity: 1;
  transform: translateX(0);
}

.sidebar-footer {
  padding: 12px;
  border-top: 1px solid #f1f5f9;
  background: #fafbfc;
}

.btn-add {
  width: 100%;
  padding: 10px;
  border: 1px dashed #cbd5e1;
  background: #fff;
  border-radius: 8px;
  font-size: .8rem;
  font-weight: 500;
  color: #64748b;
  cursor: pointer;
  transition: all .15s ease;
}

.btn-add:hover {
  border-color: #2563eb;
  color: #2563eb;
  background: #eff6ff;
}

/* ── Mobile sidebar toggle ── */
.sidebar-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 200;
  width: 40px;
  height: 40px;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}

.sidebar-toggle svg {
  width: 20px;
  height: 20px;
  color: #475569;
}

/* ── Main content ── */
.main-content {
  flex: 1;
  margin-left: 272px;
  min-height: 100vh;
}

/* ── Empty state ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  color: #94a3b8;
  gap: 16px;
}

.empty-icon {
  width: 64px;
  height: 64px;
  opacity: .2;
}

.empty-state p {
  font-size: .9rem;
  font-weight: 500;
}

/* ── Loading state ── */
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  gap: 16px;
  color: #64748b;
}

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid #e2e8f0;
  border-top-color: #2563eb;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading p { font-size: .85rem; font-weight: 500; }

/* ═══════════════════════════════════════════════════════
   Dashboard Content Styles (reused from existing dashboards)
   ═══════════════════════════════════════════════════════ */

.dashboard-header {
  background: #0f2942;
  color: #fff;
  padding: 22px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.dashboard-header h2 {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: .01em;
  color: #fff;
}

.dashboard-header span {
  font-size: .78rem;
  color: #94a3b8;
}

.dashboard-body {
  max-width: 1600px;
  margin: 0 auto;
  padding: 28px 32px;
}

/* ── KPIs ── */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 24px;
}

.kpi {
  background: #fff;
  border-radius: 8px;
  padding: 14px 18px;
  box-shadow: 0 1px 3px rgba(0,0,0,.07);
}

.kpi-v {
  font-size: 1.25rem;
  font-weight: 700;
  color: #0f2942;
  line-height: 1.2;
}

.kpi-l {
  font-size: .68rem;
  color: #64748b;
  margin-top: 5px;
  text-transform: uppercase;
  letter-spacing: .05em;
}

/* ── Section headings ── */
h2 { font-size: 1rem; margin-bottom: 16px; color: #1e293b; font-weight: 700; }

/* ── Grid layouts ── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; margin-bottom: 18px; }

/* ── KPI grid ── */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

/* ── Chart wrapper ── */
.cw { position: relative; height: 240px; }

/* ── Insight & Warning boxes ── */
.insight {
  background: #eff6ff;
  border-left: 3px solid #2563eb;
  padding: 10px 14px;
  border-radius: 0 6px 6px 0;
  margin-bottom: 14px;
  font-size: .8rem;
  color: #1e40af;
  line-height: 1.5;
}

.warn {
  background: #fff7ed;
  border-left: 3px solid #f97316;
  padding: 10px 14px;
  border-radius: 0 6px 6px 0;
  margin-bottom: 14px;
  font-size: .8rem;
  color: #9a3412;
  line-height: 1.5;
}

/* ── Table wrappers ── */
.tbl-wrap { overflow-x: auto; max-height: 460px; overflow-y: auto; }

.num-right th:not(:first-child),
.num-right td:not(:first-child) { text-align: right; }

/* ── Cards & Charts ── */
.charts-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 18px;
  margin-bottom: 24px;
}

.card {
  background: #fff;
  border-radius: 8px;
  padding: 18px 20px;
  box-shadow: 0 1px 3px rgba(0,0,0,.07);
  margin-bottom: 18px;
}

.card h3 {
  font-size: .83rem;
  font-weight: 600;
  color: #475569;
  margin-bottom: 16px;
}

.chart-wrap {
  position: relative;
  height: 300px;
}

/* ── Tables ── */
table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #f8fafc;
  text-align: left;
  padding: 8px 10px;
  font-weight: 600;
  color: #475569;
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .04em;
  border-bottom: 2px solid #e2e8f0;
}

td {
  padding: 7px 10px;
  border-bottom: 1px solid #f1f5f9;
  font-size: .82rem;
}

tr:hover td { background: #f8fafc; }

td.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 7px;
  flex-shrink: 0;
}

.total-row td {
  font-weight: 700;
  color: #0f2942;
  background: #f8fafc;
  border-top: 2px solid #e2e8f0;
}

th.sortable {
  cursor: pointer;
  user-select: none;
  position: relative;
  padding-right: 18px;
}

th.sortable:hover { color: #0f2942; background: #eef2f7; }

th.sortable::after {
  content: '\21C5';
  position: absolute;
  right: 3px;
  top: 50%;
  transform: translateY(-50%);
  font-size: .65rem;
  color: #94a3b8;
}

th.sortable.asc::after { content: '\25B2'; color: #2563eb; }
th.sortable.desc::after { content: '\25BC'; color: #2563eb; }

/* ── Notes ── */
.note {
  font-size: .7rem;
  color: #64748b;
  margin-top: 18px;
  padding: 10px 13px;
  background: #f8fafc;
  border-radius: 6px;
  border-left: 2px solid #cbd5e1;
  line-height: 1.6;
}

/* ── Heatmaps ── */
.heatmap td.hm {
  text-align: center;
  font-size: .78rem;
  font-weight: 600;
  padding: 10px 8px;
  min-width: 70px;
}

.heatmap td.hm-total {
  text-align: center;
  font-size: .78rem;
  font-weight: 700;
  padding: 10px 8px;
  min-width: 70px;
  border-left: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #0f2942;
}

.heatmap .seg-label {
  font-weight: 600;
  color: #1e293b;
  padding: 10px 12px;
  white-space: nowrap;
}

.heatmap .total-row td {
  font-weight: 700;
  border-top: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #0f2942;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 2px;
  background: #f1f5f9;
  padding: 4px;
  border-radius: 10px;
  margin-bottom: 24px;
  width: fit-content;
}

.tab {
  padding: 8px 18px;
  border: none;
  background: none;
  border-radius: 7px;
  font-size: .82rem;
  font-weight: 500;
  color: #64748b;
  cursor: pointer;
  transition: all .15s ease;
}

.tab:hover { color: #1e293b; background: #e2e8f0; }

.tab.active {
  background: #fff;
  color: #2563eb;
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(0,0,0,.07);
}

.panel { display: none; }
.panel.active { display: block; }

/* ═══════════════════════════════════════════════════════
   Tab Template: Reviews VOC (.voc-*, .us-*, .cs-*, etc.)
   ═══════════════════════════════════════════════════════ */

/* VOC sub-tabs */
.voc-sub-tabs { display: flex; background: #fff; border-bottom: 2px solid #e2e8f0; gap: 2px; position: sticky; top: 0; z-index: 30; }
.voc-sub-tab { padding: 10px 18px; cursor: pointer; font-size: .8rem; font-weight: 600; color: #64748b; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.voc-sub-tab:hover { color: #1e3a5f; }
.voc-sub-tab.active { color: #1e3a5f; border-bottom-color: #2563eb; }
.voc-sub-panel { display: none; }
.voc-sub-panel.active { display: block; }

/* VOC anchor navigation */
.voc-anchor-nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 0; position: sticky; top: 41px; z-index: 29; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; box-shadow: 0 2px 4px rgba(0,0,0,.06); margin-bottom: 14px; }
.voc-anchor-nav a { padding: 7px 16px; border-radius: 20px; font-size: .75rem; font-weight: 600; color: #475569; background: #fff; text-decoration: none; border: 1.5px solid #e2e8f0; transition: all .15s; }
.voc-anchor-nav a:hover, .voc-anchor-nav a.active { color: #1e3a5f; background: #dbeafe; border-color: #93c5fd; }

/* Customer Profile 4-chart grid */
.cp-charts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 10px; }
.cp-chart-box { background: #fff; border-radius: 8px; padding: 14px 14px 10px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
.cp-chart-box h4 { font-size: .82rem; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
.cp-chart-wrap { position: relative; height: 230px; }
.cp-legend { font-size: .68rem; color: #94a3b8; text-align: right; padding: 6px 0 0; }

/* Usage scenario / motivation / expectations tables */
.us-table { width: 100%; border-collapse: collapse; font-size: .78rem; }
.us-table th { background: #f8fafc; text-align: left; padding: 10px 14px; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
.us-table td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
.us-table tr:hover td { background: #f8fafc; }
.us-label { font-weight: 600; color: #1e293b; white-space: nowrap; }
.us-reason { color: #64748b; line-height: 1.5; }
.us-pct { text-align: right; white-space: nowrap; color: #1e293b; font-weight: 600; }
.us-pct span { display: inline-block; min-width: 48px; text-align: right; }
.us-bar-wrap { display: inline-block; width: 60px; height: 12px; background: #e2e8f0; border-radius: 3px; overflow: hidden; vertical-align: middle; margin-right: 8px; }
.us-bar { height: 100%; background: #93c5fd; border-radius: 3px; }

/* Negative sentiment zone */
.cs-neg-zone { background: #fef2f2; border-radius: 10px; padding: 18px; margin-bottom: 22px; }
.nf-row { cursor: pointer; transition: background .15s; }
.nf-row:hover td { background: #fff5f5 !important; }
.nf-arrow { display: inline-block; font-size: .65rem; margin-right: 6px; transition: transform .2s; color: #94a3b8; }
.nf-row.open .nf-arrow { transform: rotate(90deg); }
.nf-detail { display: none; }
.nf-detail.open { display: table-row; }
.nf-body { padding: 8px 16px 12px; background: #fff9f9; border-left: 3px solid #fca5a5; }
.nf-body ul { margin: 0 0 8px 16px; font-size: .75rem; color: #334155; line-height: 1.55; }
.nf-body ul li { margin-bottom: 2px; }
.nf-quotes { border-top: 1px solid #fde8e8; padding-top: 6px; }
.nf-quotes p { font-size: .72rem; color: #9a3412; font-style: italic; line-height: 1.45; margin-bottom: 3px; }

/* Positive sentiment zone */
.cs-pos-zone { background: #f0fdf4; border-radius: 10px; padding: 18px; margin-bottom: 22px; }
.pf-row { cursor: pointer; transition: background .15s; }
.pf-row:hover td { background: #f0fdf4 !important; }
.pf-arrow { display: inline-block; font-size: .65rem; margin-right: 6px; transition: transform .2s; color: #94a3b8; }
.pf-row.open .pf-arrow { transform: rotate(90deg); }
.pf-detail { display: none; }
.pf-detail.open { display: table-row; }
.pf-body { padding: 8px 16px 12px; background: #f7fef9; border-left: 3px solid #86efac; }
.pf-body ul { margin: 0 0 8px 16px; font-size: .75rem; color: #334155; line-height: 1.55; }
.pf-body ul li { margin-bottom: 2px; }
.pf-quotes { border-top: 1px solid #dcfce7; padding-top: 6px; }
.pf-quotes p { font-size: .72rem; color: #166534; font-style: italic; line-height: 1.45; margin-bottom: 3px; }

/* Strategy insights table */
.si-table { width: 100%; border-collapse: collapse; font-size: .78rem; }
.si-table th { background: #f8fafc; text-align: left; padding: 10px 14px; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
.si-table td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: top; line-height: 1.55; }
.si-table tr:hover td { background: #f8fafc; }
.si-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: .7rem; font-weight: 600; line-height: 1.3; }

/* Review browser pills */
.pill { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: .68rem; font-weight: 600; margin: 1px 2px; }
.pill-red { background: #fef2f2; color: #dc2626; }
.pill-orange { background: #fff7ed; color: #ea580c; }
.pill-amber { background: #fffbeb; color: #d97706; }
.pill-blue { background: #eff6ff; color: #2563eb; }
.pill-purple { background: #faf5ff; color: #7c3aed; }
.review-text { font-size: .78rem; color: #334155; line-height: 1.55; }

@media (max-width: 900px) { .cp-charts { grid-template-columns: 1fr 1fr; } }
@media (max-width: 550px) { .cp-charts { grid-template-columns: 1fr; } }

/* ── Segment sub-tab buttons ── */
.seg-tab-btns { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.seg-tab-btn {
  padding: 6px 14px;
  border: 1.5px solid #cbd5e1;
  border-radius: 20px;
  cursor: pointer;
  font-size: .75rem;
  font-weight: 600;
  color: #475569;
  background: #fff;
  transition: all .15s;
}
.seg-tab-btn:hover { background: #f8fafc; }
.seg-tab-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

/* ── Section headers ── */
.sec-summary {
  font-size: .78rem;
  color: #64748b;
  line-height: 1.55;
  max-width: 900px;
}

.sec-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-top: 8px;
}

.sec-title {
  font-size: 1rem;
  font-weight: 700;
  color: #1e293b;
}

/* ═══════════════════════════════════════════════════════
   Tab Template: Keyword Analysis (.kwa-*)
   ═══════════════════════════════════════════════════════ */

.kw-table {
  width: 100%;
  border-collapse: collapse;
  font-size: .72rem;
}

.kw-table th {
  position: sticky;
  top: 0;
  background: #0f2942;
  color: #fff;
  padding: 8px 6px;
  text-align: center;
  font-size: .62rem;
  font-weight: 600;
  white-space: nowrap;
  z-index: 2;
}

.kw-table td {
  padding: 5px 6px;
  border-bottom: 1px solid #f1f5f9;
  text-align: center;
  font-size: .72rem;
}

.kw-table tr:hover td { background: #f8fafc; }

.kwa-kw-sort { cursor: pointer; user-select: none; }
.kwa-kw-sort:hover { color: #93c5fd; }

.kw-legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 8px;
  padding: 8px 12px;
  font-size: .68rem;
  color: #64748b;
}

.kw-legend span { display: inline-flex; align-items: center; gap: 4px; }
.kw-legend i { display: inline-block; width: 16px; height: 12px; border-radius: 2px; }

/* KW Analysis — sticky columns */
.kwa-sticky-th {
  position: sticky;
  left: 0;
  background: #0f2942;
  color: #fff;
  padding: 8px 10px;
  text-align: left;
  font-size: .68rem;
  font-weight: 600;
  z-index: 2;
  min-width: 100px;
}

.kwa-sticky-td {
  position: sticky;
  left: 0;
  background: #f8fafc;
  padding: 6px 10px;
  font-weight: 600;
  color: #475569;
  border-bottom: 1px solid #f1f5f9;
  z-index: 1;
}

.kwa-comp-th {
  background: #0f2942;
  color: #fff;
  padding: 8px 6px;
  text-align: center;
  font-size: .62rem;
  font-weight: 600;
  white-space: nowrap;
  min-width: 80px;
}

.kwa-comp-img {
  width: 54px;
  height: 54px;
  object-fit: contain;
  border-radius: 4px;
  background: #fff;
  display: block;
  margin: 0 auto 4px;
}

.kwa-comp-link {
  color: #93c5fd;
  text-decoration: none;
  font-size: .62rem;
}

.kwa-comp-link:hover { text-decoration: underline; }

.kwa-metric-td {
  text-align: center;
  padding: 6px;
  border-bottom: 1px solid #f1f5f9;
}

.kwa-kw-sticky-th {
  position: sticky;
  left: 0;
  z-index: 3;
  background: #0f2942;
  text-align: left;
  padding: 8px 10px;
  min-width: 200px;
}

.kwa-kw-sticky-td {
  position: sticky;
  left: 0;
  background: #fff;
  z-index: 1;
  text-align: left;
  padding: 6px 10px;
  font-weight: 500;
  white-space: nowrap;
  border-bottom: 1px solid #f1f5f9;
}

.kwa-kw-comp-img {

enue": 1012497, "reviews": 433, "price": 49.99}]}}}}, "reviews-voc-lure": {"label": "Reviews VOC · Lure", "data": {"countryName": "United States", "countryCode": "US", "currency": "$", "segmentName": "Lure", "totalReviews": 1756, "avgRating": 1.77, "starDist": [941, 436, 293, 17, 69], "cpSummary": "Based on a population of 1,756 reviews (avg rating 1.77) across 15 ASINs of passive LURE-style fruit fly traps (Terro, Aunt Fannie's, Super Ninja, Raid, HOT SHOT, Qualirey, STEM). <strong>MIXED DATASET:</strong> the corpus is now predominantly negative (1-3★, ~94%) but includes a genuine vein of 4-5★ raves (~5%, 86 reviews) merged from a dedicated positive pull. Two narratives coexist. The dominant complaint: traps attract flies to the rim but fail to drown them, the bait is dismissed as 'just apple cider vinegar in a cup,' the liquid evaporates in days, and it spills and stinks. The enthusiast minority: for buyers who place the traps well and wait 3-7 days, the same products 'clear out fruit flies fast,' beat their own DIY jars, and earn 'best trap I've ever used.' The decisive variables are expectation-setting, placement guidance, and infestation severity — the lure chemistry demonstrably works for some, but under-delivers against marketing for most.", "cpWho": {"labels": ["Pets/Cats", "Children", "Sensitive-nosed Family", "Co-workers", "Houseguests"], "pos": [70, 45, 32, 22, 12], "neg": [180, 140, 110, 35, 25]}, "cpWhen": {"labels": ["Summer/Heat", "First 3 Days", "After 7-10 Days", "After Vacation", "Overnight"], "pos": [60, 150, 95, 35, 42], "neg": [260, 190, 130, 85, 75]}, "cpWhere": {"labels": ["Kitchen Sink", "Fruit Bowl", "Trash/Compost", "House Plants", "Office/Desk", "Bathroom"], "pos": [185, 140, 70, 55, 32, 22], "neg": [480, 320, 190, 160, 75, 60]}, "cpWhat": {"labels": ["Fruit Flies", "Gnats", "House Flies", "Mosquitoes"], "pos": [330, 140, 25, 10], "neg": [950, 380, 140, 45]}, "usageScenarios": [{"label": "Kitchen Fruit Fly Infestations", "reason": "Placing traps near sinks, counters, and fruit bowls to catch kitchen swarms.", "pct": "46.5%"}, {"label": "Gnats Around Houseplants", "reason": "Setting traps near indoor spider plants and soil to capture fungus gnats.", "pct": "21.2%"}, {"label": "Trash & Compost Bins", "reason": "Controlling pests that breed near indoor organic waste receptacles.", "pct": "12.8%"}, {"label": "Post-Vacation Swarms", "reason": "Returning to a home overrun by flies due to forgotten produce.", "pct": "8.5%"}, {"label": "Office & Desk Outbreaks", "reason": "Dealing with fruit flies caused by co-workers leaving snacks out.", "pct": "4.6%"}, {"label": "Bathroom Drains", "reason": "Placing traps near sinks to combat drain flies.", "pct": "3.8%"}, {"label": "General House Fly Control", "reason": "Mistakenly attempting to use the lure for larger house flies.", "pct": "1.9%"}, {"label": "Mosquito Control", "reason": "Hoping the attractant will work on indoor mosquitoes.", "pct": "0.7%"}], "csSummary": "Satisfaction is low overall (avg 1.77): the majority of buyers conclude the traps act as feeding stations rather than kill zones, feel scammed that the 'bait' is diluted apple cider vinegar, and are put off by spills, rapid evaporation, and a pervasive vinegar stench. Yet a real enthusiast minority reports the opposite experience — dramatic, fast clearance of infestations, satisfying visible kills, and a discreet, pet-safe footprint they prefer over messy DIY bowls. The split is driven less by the formula itself than by placement, patience (3-7 days), and whether the buyer's expectations were calibrated by the listing.", "negativeTopics": [{"label": "Flies Attracted But Not Trapped", "reason": "The lure attracts flies to the rim or lid, but fails to force them into the liquid to drown.", "pct": "41.5%", "bullets": ["Consumers report flies congregating on the outside of the trap without entering the holes.", "The lack of a surfactant means the few flies that do land on the liquid do not sink.", "Customers perceive the traps as feeding or breeding grounds rather than extermination tools."], "quotes": ["\"The fruit flies just sat on the Apple and never went inside.\"", "\"It does a really good job of attracting the flies on top of it, but non of them go in and get trapped.\"", "\"They just crawl around the rim and fly out.\""]}, {"label": "Overpriced DIY Substitute", "reason": "Buyers are outraged to discover the liquid is just apple cider vinegar, which they could make at home for pennies.", "pct": "26.3%", "bullets": ["Customers frequently compare the product negatively against homemade water, vinegar, and dish soap traps.", "The strong, recognizable smell of ACV makes buyers feel they overpaid for basic grocery ingredients.", "Many state their homemade saran-wrap traps caught significantly more bugs."], "quotes": ["\"It's just a small cup of diluted Apple Cider Vinegar. Not very effective.\"", "\"I could've bought an entire quart at the store and made my own traps with 20oz bottles for a fraction of the cost.\"", "\"Don't get these literally just buy apple cider vinegar and put them in small cups. Works the same.\""]}, {"label": "Spillage & Instability", "reason": "Top-heavy designs and wide-open lids result in frequent messes on counters.", "pct": "11.8%", "bullets": ["Apple-shaped and small-jar traps tip over easily, spreading pungent vinegar everywhere.", "The lack of a secure, spill-proof lid makes them hazardous around pets and children.", "Spilled liquid actually attracts more flies to the countertop surface."], "quotes": ["\"These apple shaped traps fall over way too easy spilling the bait on counters or tables.\"", "\"I have tried to find places to put them so they dont get knocked over... 3 have been spilled all over my counter!\"", "\"There's no lid. Unlike other traditional traps, this is just wide open, so don't knock it over.\""]}, {"label": "Overpowering Odor", "reason": "The bait gives off a strong, rotten, or sour vinegar scent that fills the room.", "pct": "8.7%", "bullets": ["The smell is described as offensive and strong enough to spread throughout the entire house.", "Customers have to throw the traps away early or run fans simply to tolerate the air in their kitchen.", "The smell deters sensitive-nosed household members and guests."], "quotes": ["\"It makes your whole house smell like vinegar with a hint of sweetness.\"", "\"My family could not tolerate the repulsive smell this product fills the room with.\"", "\"This stuff stinks, do not spill it!\""]}, {"label": "Rapid Evaporation", "reason": "The liquid bait dries out in days rather than lasting the advertised weeks.", "pct": "6.2%", "bullets": ["Claims of 30, 40, or 180 days are viewed as highly deceptive.", "The liquid is reportedly too thin and evaporates rapidly in warm indoor temperatures.", "Traps require constant refilling, negating the 'set it and forget it' value proposition."], "quotes": ["\"Put mine out 7 days ago and it is nearly empty of liquid. Kind of feel scammed by that claim.\"", "\"The liquid you put in them dried up very quickly. Did not last as long as it said it would.\"", "\"These evaporate rapidly, so you will use them up very fast.\""]}, {"label": "Leaking Packaging", "reason": "Bottles and refill packets arrive broken or completely empty.", "pct": "3.1%", "bullets": ["Flimsy packaging leads to spills during shipping.", "Customers are unable to use the product immediately due to dried-out or empty bottles.", "Creates a strong vinegar smell inside the shipping boxes."], "quotes": ["\"Just received these and one of the bottles had spilled in the box and was completely empty.\"", "\"Multiple bottles completely leaked out when I received it.\"", "\"I just opened my package and there's almost little to no liquid solution in the bottles.\""]}, {"label": "Catching the Wrong Bugs", "reason": "Traps are totally ineffective against gnats or house flies despite expectations.", "pct": "1.4%", "bullets": ["Users buy these for gnats and mosquitoes, but the bait formula does not attract them.", "Consumers complain about house flies ignoring the traps entirely.", "Brands are failing to educate buyers on which exact species the lure is calibrated for."], "quotes": ["\"I got this for gnats and mosquitoes. They fly right by it and don't seem to be attracted.\"", "\"These have done nothing to help capture/kill/ reduce the house flies.\"", "\"Did not catch a single gnat I installed zevo plug in insect traps instead.\""]}, {"label": "Deceptive Marketing Claims", "reason": "Brands exaggerate the duration of the supply and safety features.", "pct": "1.0%", "bullets": ["Total duration claims (e.g., '270 days') assume sequential use of single doses, confusing buyers.", "Box claims state 'safe for pets' but inner instructions warn of toxic exposure.", "Leads to direct distrust of the brand and demands for refunds."], "quotes": ["\"Product headline (for 6) says '270 day lure supply'. This is false, there is no refill at all.\"", "\"The box promises that the product is safe around children an pets. Inside the instructions it warns that it is NOT.\"", "\"Kind of feel scammed by that claim for that price.\""]}], "positiveTopics": [{"label": "Clears Infestations Fast (When Placed Right)", "reason": "A genuine cohort reports the traps wiping out a fruit-fly invasion within hours to a few days once positioned near the source.", "pct": "33.5%", "bullets": ["Buyers describe near-total clearance of established swarms within 2-3 days.", "Results land fastest when placed right at the sink, trash, or fruit bowl.", "Several call it the most effective option after exhausting DIY methods."], "quotes": ["\"It is by far the easiest, cleanest, and most effective way to eliminate them without having to mix weird DIY concoctions.\"", "\"I had it out on my counter about 2 hours and most of the fruit flies I had before putting it out were all gone and in the trap.\"", "\"Got rid of my nasty fruit fly infestation quick!\""]}, {"label": "Beats DIY / 'Best I've Tried'", "reason": "Enthusiasts who previously relied on homemade ACV jars rate these as decisively better and become repeat buyers.", "pct": "24.8%", "bullets": ["Direct winners in self-run comparisons against vinegar-and-soap bowls.", "Skeptical buyers report being converted after one use.", "Strong repeat-purchase and recommendation language."], "quotes": ["\"This is 100% the best fruit fly trap on the market that I have used.\"", "\"Was skeptical, but turned out to be the best option out of all.\"", "\"These are the best fruit fly traps I have ever used.\""]}, {"label": "Satisfying Visible Kill", "reason": "Buyers delight in being able to SEE the flies enter and die inside the trap — visible proof builds trust.", "pct": "18.2%", "bullets": ["Seeing dead flies accumulate confirms the product is working.", "The transparent chamber lets users watch flies get drawn in and drown.", "Visible results convert early skeptics into believers."], "quotes": ["\"I saw dead fruit flies in each trap! Yes, they smell strongly of vinegar but it's worth it if you have a bad fruit fly issue!\"", "\"You can actually see them get in the jar.\"", "\"fruit flies hovering over it and dove into the liquid.\""]}, {"label": "Discreet & Cute Design", "reason": "The compact, attractive containers are preferred over unsightly hanging fly tape and blend into the kitchen.", "pct": "13.9%", "bullets": ["Small, attractive profiles sit on the counter without looking like a bug trap.", "A clear visual upgrade from yellow fly ribbons or open mason jars.", "Discreet enough to place throughout the home."], "quotes": ["\"it is small and looks attractive, so that it doesn't look hideous.\"", "\"The apple shape is cuter than fly tape though.\"", "\"Nice container. Discreet.\""]}, {"label": "Natural, Pet-Safe & No-Cleanup", "reason": "Families value a ready-to-use, chemical-free trap that is easy to deploy and disposes cleanly.", "pct": "9.6%", "bullets": ["Reassuring around children, pets, and food prep areas.", "No mixing, measuring, or messy cleanup — open, place, discard.", "Effective on gnats as well as fruit flies for some buyers."], "quotes": ["\"not only safe for our family and children, but this attracts the gnats and then catches them inside the bottle.\"", "\"Simply open jar, flies are attracted and fall into liquid . Simply close jar and discard.  No more flies !\"", "\"easy to use . Just open and put near doors and sinks.\""]}], "negativeInsights": [{"type": "Efficacy Crisis", "badgeBg": "#fee2e2", "badgeColor": "#991b1b", "finding": "Over 40% of complaints center on flies landing on the trap but not drowning in the liquid.", "implication": "<strong>Reformulate the bait</strong> to include a surfactant (like dish soap) that breaks surface tension, ensuring flies actually sink and die."}, {"type": "DIY Substitute", "badgeBg": "#fef3c7", "badgeColor": "#92400e", "finding": "Over 1/4 of unhappy buyers feel scammed, stating homemade apple cider vinegar works better.", "implication": "<strong>Differentiate the formula</strong> visually or functionally from basic ACV, or focus marketing entirely on the superior, spill-proof hardware to justify the premium."}, {"type": "Design Flaw", "badgeBg": "#ffedd5", "badgeColor": "#9a3412", "finding": "Top-heavy apple shapes and open jars spill easily, creating messy, fly-attracting puddles.", "implication": "<strong>Redesign the base</strong> to be wider and heavier, and incorporate a spill-resistant funnel lid to protect pets, kids, and counters."}, {"type": "Smell", "badgeBg": "#e0e7ff", "badgeColor": "#3730a3", "finding": "Customers frequently abandon the product because the intense vinegar odor permeates their living spaces.", "implication": "<strong>Deodorize or mask</strong> the vinegar scent with pleasant botanicals, or refine the trap openings to limit airflow while still allowing flies to enter."}, {"type": "Evaporation", "badgeBg": "#fce7f3", "badgeColor": "#9d174d", "finding": "Liqui prized by houseplant owners; buyers love watching the sticky card fill overnight, value the quiet, slim, chemical-free, nightlight-friendly form factor, and the off-brand units (LFSYS, VEYOFLY) win on 'as good as Zevo for less.' The category's real job-to-be-done is fungus-gnat control, not fruit-fly extermination.", "cpWho": {"labels": ["Homeowners", "Plant Owners", "Pet Owners", "Parents", "RV Owners"], "pos": [200, 160, 95, 70, 25], "neg": [450, 110, 90, 80, 45]}, "cpWhen": {"labels": ["Summer Months", "Gnat Season", "Nighttime / Dark", "First 24 Hours", "After 3 to 6 Months"], "pos": [230, 200, 260, 70, 18], "neg": [520, 200, 90, 310, 480]}, "cpWhere": {"labels": ["Kitchen Counter / Sink", "Near Trash / Compost", "Bathroom", "Living Room", "Near Houseplants"], "pos": [170, 45, 140, 60, 150], "neg": [650, 320, 110, 80, 90]}, "cpWhat": {"labels": ["Fruit Flies", "Gnats", "Mosquitoes", "House Flies", "Plant Flies / Fungus Gnats"], "pos": [60, 320, 20, 15, 130], "neg": [680, 190, 85, 210, 50]}, "usageScenarios": [{"label": "Kitchen Counters & Sinks", "reason": "Users primarily place units near produce or sinks where fruit flies actively congregate.", "pct": "84.5%"}, {"label": "Trash & Compost Bins", "reason": "Attempting to mitigate swarms breeding near food waste disposal areas.", "pct": "52.3%"}, {"label": "Houseplant Stations", "reason": "Targeting fungus gnats that hover around indoor potting soil.", "pct": "38.1%"}, {"label": "Nightlight Dual-Usage", "reason": "Utilizing the blue/UV glow to illuminate dark hallways or kitchens overnight.", "pct": "29.4%"}, {"label": "Bathrooms", "reason": "Placing units in smaller, confined spaces where drain flies or gnats appear.", "pct": "21.6%"}, {"label": "RV and Camper Interiors", "reason": "Trying to control bugs entering through frequently opened doors in small recreational vehicles.", "pct": "14.2%"}, {"label": "Entryways & Exterior Doors", "reason": "Positioned by doors to catch house flies and mosquitoes as they enter the home.", "pct": "11.8%"}, {"label": "Pet Areas", "reason": "Using a chemical-free option near dog bowls or litter boxes to keep flying pests away.", "pct": "8.5%"}], "csSummary": "Satisfaction is low for the marketed use (avg 2.03): most buyers conclude UV light fails to draw fruit flies and that cheap DIY vinegar outperforms a $30+ device, compounded by LEDs and fans failing within 3-6 months. The bright spot is unambiguous and repeatable — as fungus-gnat and small-fly traps the devices genuinely work, often filling the sticky card overnight, and buyers reward the quiet, slim, mess-free, chemical-free design and the nightlight glow. Off-brand alternatives convert price-sensitive buyers with 'same results as the name brand for less.'", "negativeTopics": [{"label": "Light Fails to Attract Fruit Flies", "reason": "Customers continuously observe fruit flies ignoring the UV/blue light entirely, often landing beside the trap rather than on it.", "pct": "91.5%", "bullets": ["Users report zero catches over weeks despite heavy infestations in the room.", "Literature included with some devices contradicts marketing, stating fruit flies aren't attracted to light.", "Customers feel the core premise of the product is scientifically flawed for this specific pest."], "quotes": ["\"The blue light does not attract fruit flies. This product is a waste of money.\"", "\"I watch the bugs chilling in the blue light like it's happy hour, but they refuse to land on the sticky trap.\"", "\"They are literally flying 15-20 inches from this and ignore it.\""]}, {"label": "Homemade ACV Beats Electric Traps", "reason": "Users consistently test the electric traps against cups of apple cider vinegar (ACV) and find the homemade lure wildly more effective.", "pct": "82.4%", "bullets": ["ACV traps catch dozens of flies in hours, while electric traps catch 1-2 flies over weeks.", "Many users actively apply ACV directly onto the electric sticky pads to force them to work.", "The comparison makes customers deeply regret the high price of the electric unit."], "quotes": ["\"Caught more flies in the open bottle of apple cider vinegar than on the sticky pad.\"", "\"After 3 days the trap caught 1 fruit fly, apple cider vinegar in a jar caught over 10.\"", "\"You can catch more fruit flies with vinegar than you can with ZEVO traps.\""]}, {"label": "Hardware Failure & Burnout", "reason": "A massive volume of reports indicate that the UV lights burn out or the fan motors die completely within a few months of use.", "pct": "67.8%", "bullets": ["Many units die around the 3 to 6-month mark, angering users who expected years of use.", "Some users note the lights slowly dim or change color over time, losing effectiveness.", "FVOAI fan traps specifically suffer from motor death or cord issues after being idle."], "quotes": ["\"This is the second one I've bought that has burned out within about 3 months. Doesn't seem like the light is replaceable.\"", "\"I bought the 2-pack and they worked great but one won't even power on anymore after less than two months of use.\"", "\"Almost a year later and the fan has stopped working.\""]}, {"label": "Dressed-up Fly Paper Gimmick", "reason": "Customers realize the device relies entirely on the sticky pad, making it no better than a standard hanging fly ribbon.", "pct": "59.2%", "bullets": ["Users feel they paid a premium for a piece of plastic housing cheap adhesive.", "Bugs that get caught are perceived as landing there 'by accident' rather than being lured.", "Standard ceiling fly ribbons catch significantly more insects in side-by-side tests."], "quotes": ["\"If a bug gets caught in the device, it's totally random. Behind the nice looking cover, it's just a sheet of sticky paper.\"", "\"Just a fancy fly tape with blue light and a plastic part that covers up from view any flies trapped.\"", "\"I am finding the cheaper sticky ribbons more effective.\""]}, {"label": "Placement & Outlet Limitations", "reason": "Plug-in traps require an outlet, which often dictates placement far away from the actual source of the fruit flies.", "pct": "46.5%", "bullets": ["Sinks, fruit bowls, and trash cans rarely have convenient, low-level outlets nearby.", "Plug-in units (like Zevo) are bulky and block the second outlet or clutter small kitchen counters.", "Users complain the trap only works if your infestation happens to be near a wall socket."], "quotes": ["\"This one only works if the main source of your fruit flys is near an outlet.\"", "\"It takes up a lot of space around the plug. I had to rearrange the items on my kitchen counter.\"", "\"Unit is plug in and thus might not be movable closer to where bugs might appear.\""]}, {"label": "Ineffective on House Flies", "reason": "Customers trying to catch larger house flies find the electric traps completely useless.", "pct": "38.1%", "bullets": ["House flies ignore the light entirely and are rarely caught on the sticky pads.", "The marketing visuals suggest a catch-all solution, leading to disappointment.", "Users with door-draft fly issues specifically report a zero percent catch rate."], "quotes": ["\"It didn't catch a single house fly.\"", "\"It catches Nats but not flies. Have the flies from outside that come in my rv door.\"", "\"It did not get any on the black houseflies, just a very small amount of fruit flies.\""]}, {"label": "FVOAI Fan Weakness & Noise", "reason": "Fan-based suction traps are criticized for being noisy, having weak drafts, and failing to kill the bugs they catch.", "pct": "33.6%", "bullets": ["The fan noise is described as louder than a vacuum, vibrating disruptively after a few months.", "Gnats and flies can easily fly through the weak draft or walk right out of the device.", "Bugs remain alive inside, flying away immediately when the user opens the trap to clean it."], "quotes": ["\"This is NOT quiet. It's louder than our Roomba!\"", "\"It sucks the bugs in but they are not dead. When you open it up to replace the sticky thingy, the bugs fly out.\"", "\"Even gnats can fly through this draft. You can BARELY feel any air moving at all.\""]}, {"label": "Refill Lock-in & Quality", "reason": "Customers are irritated by expensive proprietary refills, missing items in boxes, and inferior generic cartridge replacements.", "pct": "27.4%", "bullets": ["Units frequently ship missing the promised 6 or 10 extra sticky pads.", "Replacement cartridges for Zevo are reportedly less effective when they are opaque rather than clear.", "Brands are accused of utilizing a 'razor-and-blades' model, profiting off pricey refills."], "quotes": ["\"The refills that I ordered are NOT clear and NOT very effective at all.\"", "\"My set did not come with the 6 refill cards as advertised.\"", "\"You will note that the refills are quite expensive... They make money on the refills.\""]}], "positiveTopics": [{"label": "Genuine Gnat & Small-Fly Catcher", "reason": "The single most consistent praise: the traps reliably capture fungus gnats and small flying pests, especially for houseplant owners.", "pct": "38.5%", "bullets": ["Plant owners report dramatic drops in fungus gnats within days.", "Works best in the dark on the small, light-seeking pests it's suited to.", "Often catches gnats the buyer didn't realize were present."], "quotes": ["\"Love it! Great for getting all the gnats out of my plants!\"", "\"I've been struggling with fungus gnats from my plants for months and I've tried everything. This is by far the best thing I've used.\"", "\"Catching fungus gnats! Stupid gnats.\""]}, {"label": "Actually Works / Fills Up Fast", "reason": "A real cohort reports the trap working immediately and the sticky card filling within a single night.", "pct": "26.4%", "bullets": ["Visible catches within the first 24 hours for well-placed units.", "Cards reported 'full' overnight in infested rooms.", "Converts outright skeptics ('NOT A GIMMICK')."], "quotes": ["\"They work! 12 flies overnight! NOT A GIMMICK THEY ACTUALLY WORK!\"", "\"Plugged them in last night. They are all full less than 24hours later.\"", "\"in one night the entire sticky was full.  All types of flying bugs gone.\""]}, {"label": "Quiet, Slim & Mess-Free", "reason": "Buyers value the discreet, silent, clean form factor versus noisy zappers and gross fly tape.", "pct": "16.7%", "bullets": ["Slim profile takes little space and hides the caught bugs.", "Silent operation, unlike zappers.", "No chemicals, no smell, no zap noise."], "quotes": ["\"very slim, so it doesn't take up much space or stand out. I like that it's clean and mess-free.\"", "\"It's very quiet and the light is not bright which is perfect!\"", "\"No chemicals, no smell, and no noise.\""]}, {"label": "Nightlight Bonus", "reason": "The soft blue/purple glow doubles as a welcome ambient nightlight in kitchens and hallways.", "pct": "10.8%", "bullets": ["Pleasant ambient glow valued as a secondary feature.", "Some buyers buy partly for the dual nightlight function.", "Considered a modern, attractive addition to the room."], "quotes": ["\"Love this.  Gets all the bugs and great as a nightlight too.\"", "\"I also kinda enjoy the purple light it gives off at night.\"", "\"has a warm blue nightlight built in. Great product.\""]}, {"label": "Cheaper-Than-Zevo Value", "reason": "Off-brand units win price-sensitive buyers by matching name-brand results for less.", "pct": "7.6%", "bullets": ["Positioned explicitly as a budget alternative to Zevo.", "Buyers report comparable catch performance at lower cost.", "Strong value-for-money sentiment drives repeat orders."], "quotes": ["\"just as good as the name brands at a lower cost!\"", "\"a great value for the money.\"", "\"Works well and at a great price.\""]}], "negativeInsights": [{"type": "Efficacy Crisis", "badgeBg": "#fee2e2", "badgeColor": "#991b1b", "finding": "Over 90% of dissatisfied users report that fruit flies are biologically indifferent to the UV/blue light attractant.", "implication": "<strong>Stop marketing UV light primarily as a 'fruit fly' solution</strong>; shift claims toward gnats, or integrate an odor-based lure into the housing."}, {"type": "The ACV Benchmark", "badgeBg": "#ffedd5", "badgeColor": "#9a3412", "finding": "82% of negative reviews mention reverting to homemade ACV traps because they catch exponentially more flies.", "implication": "<strong>Design a hybrid trap</strong> that features a small, refillable bait cup (for liquid lures) directly beneath the UV light and sticky pad."}, {"type": "Hardware Failure", "badgeBg": "#fce7f3", "badgeColor": "#9d174d", "finding": "Nearly 70% of hardware-related complaints cite LEDs burning out or fans dying between 3 to 6 months of use.", "implication": "<strong>Upgrade LED diode lifespans</strong> and source higher-quality, dust-resistant fan motors to survive 24/7 continuous operation."}, {"type": "Placement Limits", "badgeBg": "#fef08a", "badgeColor": "#854d0e", "finding": "46% of complaints note that wall outlets are rarely located directly where the fruit flies congregate.", "implication": "<strong>Develop a battery-operated or USB-rechargeable variant</strong> that can be placed directly next to fruit bowls and compost bins."}, {"type": "Refill Issues", "badgeBg": "#e0e7ff", "badgeColor": "#3730a3", "finding": "A significant subset of buyers receive boxes missing the advertised number of refill cartridges, or find replacements unaffordable.", "implication": "<strong>Audit fulfillment for accuracy</strong> and offer a low-cost subscription model for OEM clear sticky pads."}, {"type": "Fan Trap Flaws", "badgeBg": "#f3e8ff", "badgeColor": "#6b21a8", "finding": "Fan models (FVOAI) consistently get negative feedback for weak suction, noisy vibration over time, and bugs escaping alive during cleaning.", "implication": "<strong>Increase fan RPM</strong> for stronger draft, use noise-dampening bearings, and implement an auto-closing shutter when powered off."}], "positiveInsights": [{"type": "The Gnat Champion", "badgeBg": "#dcfce7", "badgeColor": "#166534", "finding": "The most reliable positive signal is fungus-gnat / small-fly capture for houseplant owners — the category's true job-to-be-done.", "implication": "<strong>Re-target the listing to plant owners</strong> — lead hero imagery and copy with fungus-gnat eradication, not fruit-fly extermination, to align promise with reality."}, {"type": "Visible Fill = Satisfaction", "badgeBg": "#ccfbf1", "badgeColor": "#115e59", "finding": "Buyers are delighted watching the sticky card fill overnight — visible proof is a core driver of 5★ reviews.", "implication": "<strong>Maximize the visible catch surface</strong> and make the fill easy to see; visible performance monitoring is a feature, not a flaw."}, {"type": "Quiet & Discreet Beats Zappers", "badgeBg": "#fef9c3", "badgeColor": "#854d0e", "finding": "Slim, silent, chemical-free, nightlight-friendly design is repeatedly praised over noisy zappers and ugly fly tape.", "implication": "<strong>Double down on the silent, mess-free, dual-nightlight form factor</strong> — it is a genuine differentiator the negatives never undermine."}, {"type": "Value Alternative Wins", "badgeBg": "#e0f2fe", "badgeColor": "#075985", "finding": "Off-brand units (LFSYS, VEYOFLY) convert buyers with 'as good as Zevo for less,' a durable value position.", "implication": "<strong>Compete on price-per-performance and cheap refills</strong> — the 'name-brand results for less' angle resonates strongly with this base."}], "buyersMotivation": [{"label": "Eliminate Fruit Flies in Kitchen", "reason": "Buyers are desperate to remove swarms of fruit flies hovering around their kitchen sinks and fruit bowls.", "pct": "89.4%"}, {"label": "Avoid Toxic Chemicals", "reason": "Seeking a pet-safe and child-safe alternative to aerosol bug sprays and harsh chemical foggers.", "pct": "64.2%"}, {"label": "Aesthetic Upgrade from Flypaper", "reason": "Wanting to replace ugly, gross-looking hanging yellow fly ribbons with a modern, discreet device.", "pct": "55.8%"}, {"label": "Control Indoor Plant Gnats", "reason": "Looking to manage the influx of tiny fungus gnats breeding in the soil of their numerous houseplants.", "pct": "42.1%"}, {"label": "Hands-Free Pest Control", "reason": "Desiring a 'plug it in and forget it' solution that requires less active maintenance than mixing vinegar jars.", "pct": "37.5%"}, {"label": "Nightlight Dual Functionality", "reason": "Appreciating a product that acts as a subtle nightlight while theoretically controlling pests in the dark.", "pct": "26.3%"}, {"label": "Stop House Flies at Entries", "reason": "Buying units to place near exterior doors or in RVs to catch larger flies as they sneak inside.", "pct": "21.0%"}, {"label": "Reduce Indoor Mosquitoes", "reason": "Hoping the UV light will attract and trap mosquitoes during the peak summer biting season.", "pct": "14.6%"}], "customerExpectations": [{"label": "UV Light Actually Attracts Fruit Flies", "reason": "Customers firmly expect the blue/UV light to act as an irresistible beacon for fruit flies, as marketed.", "pct": "96.5%"}, {"label": "Outperforms Homemade Traps", "reason": "Buyers expect a $30+ technological device to catch significantly more insects than a free cup of vinegar.", "pct": "88.2%"}, {"label": "Long-Term Hardware Durability", "reason": "Users expect a simple LED and plug mechanism to last for years, not burn out in three months.", "pct": "74.1%"}, {"label": "Trapped Bugs Are Dead", "reason": "Specifically for fan traps, users expect bugs to die inside, not fly out into their face upon opening.", "pct": "66.8%"}, {"label": "Refills Included and Affordable", "reason": "Customers expect the box to contain the advertised refills and for future cartridges to be cheap.", "pct": "59.3%"}, {"label": "Flexible Placement", "reason": "Users assume the trap can intercept bugs right at the source, underestimating the restriction of wall outlets.", "pct": "44.5%"}, {"label": "Silent Operation", "reason": "Customers expect the fan models to run in the background without vibrating or sounding like a vacuum.", "pct": "39.2%"}, {"label": "Catches Large House Flies", "reason": "Despite 'fruit fly' branding, customers expect the trap to also handle large, buzzing house flies.", "pct": "31.7%"}], "themeFilters": [{"value": "", "label": "All Themes"}, {"value": "no_effect", "label": "No Effect"}, {"value": "light_no_attract", "label": "Light Fails to Attract"}, {"value": "diy_better", "label": "DIY ACV Better"}, {"value": "hardware_fail", "label": "Hardware Failure"}, {"value": "refill_issue", "label": "Refill Issues"}, {"value": "placement_outlet", "label": "Outlet / Placement"}, {"value": "flypaper_gimmick", "label": "Dressed-up Fly Paper"}, {"value": "gnats_only", "label": "Works on Gnats Only"}, {"value": "noise", "label": "Noisy Fan"}, {"value": "weak_fan", "label": "Weak Fan / Bugs Escape"}, {"value": "nightlight", "label": "Nightlight Use"}, {"value": "chemical_free", "label": "Chemical-Free"}, {"value": "compared_other", "label": "Comparison"}, {"value": "catches_some", "label": "Catches Some"}], "tagStyles": {"no_effect": "pill-red", "attract_no_trap": "pill-red", "diy_better": "pill-orange", "smell": "pill-orange", "spill_issue": "pill-orange", "evaporates": "pill-orange", "light_no_attract": "pill-red", "hardware_fail": "pill-red", "refill_issue": "pill-orange", "placement_outlet": "pill-orange", "flypaper_gimmick": "pill-orange", "noise": "pill-orange", "weak_fan": "pill-orange", "packaging_issue": "pill-orange", "overpriced": "pill-orange", "cute_design": "pill-green", "easy_use": "pill-green", "fast_results": "pill-green", "catches_some": "pill-green", "gnats_only": "pill-green", "nightlight": "pill-green", "chemical_free": "pill-green", "pet_kid_safety": "pill-blue", "compared_other": "pill-blue"}, "reviews": [{"r": 5, "t": "Works — Works good", "tags": ["catches_some"], "date": "2026-05-30", "brand": "FVOAI", "asin": "B0CSK83JSK", "title": "Works", "body": "Works good"}, {"r": 5, "t": "Zevo product — Wow!  Great job!  The flies were driving me crazy and this has really helped!  Very easy to use, great fit, solid structure, fits any place you can plug it in!  Doubles as a night light.", "tags": ["nightlight"], "date": "2026-05-29", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Zevo product", "body": "Wow!  Great job!  The flies were driving me crazy and this has really helped!  Very easy to use, great fit, solid structure, fits any place you can plug it in!  Doubles as a night light."}, {"r": 5, "t": "Works great. — Always get full of nats fairly fast and is easy to put in another trap.  I see a lot less nats in the house.", "tags": [], "date": "2026-05-28", "brand": "Zevo", "asin": "B0CTQDTF1V", "title": "Works great.", "body": "Always get full of nats fairly fast and is easy to put in another trap.  I see a lot less nats in the house."}, {"r": 5, "t": "Bug MD sticky pad refills — Good product. Works effectively!", "tags": [], "date": "2026-05-27", "brand": "BugMD", "asin": "B0D38CSTX3", "title": "Bug MD sticky pad refills", "body": "Good product. Works effectively!"}, {"r": 5, "t": "GREAT PRODUCT that does exactly what it promises! — Great product that does exactly what it promises! I bought this fly trap gizmo, because of recurring gnats that would fly out of the kitchen garbage bin everytime I would pull the bag out for the trash! Disgusting and annoying things that would then flit around the rest of the house, being a general pain.Within an hour of plugging this in, though, I checked and had already caught THREE gnats! And by the end of the week, I looked and there had to have been over 25 of the little buggers trapped by the Zevo execution device! I love it!It's silent, but deadly, has zero odor and — dare I say — actually looks good, with the cool blue lighting that draws the flying bugs in like moths to a flame. And it's VERY easy to use... Just slip the cartridge in, peel off the protective backing, plug the small device into an outlet where the bugs will be attracted to it and walk away!Definitely worth the money, to avoid the headaches of bugs constantly being in your face!", "tags": ["refill_issue", "placement_outlet", "weak_fan", "compared_other"], "date": "2026-05-25", "brand": "Zevo", "asin": "B07T869RNY", "title": "GREAT PRODUCT that does exactly what it promises!", "body": "Great product that does exactly what it promises! I bought this fly trap gizmo, because of recurring gnats that would fly out of the kitchen garbage bin everytime I would pull the bag out for the trash! Disgusting and annoying things that would then flit around the rest of the house, being a general pain.Within an hour of plugging this in, though, I checked and had already caught THREE gnats! And by the end of the week, I looked and there had to have been over 25 of the little buggers trapped by the Zevo execution device! I love it!It's silent, but deadly, has zero odor and — dare I say — actually looks good, with the cool blue lighting that draws the flying bugs in like moths to a flame. And it's VERY easy to use... Just slip the cartridge in, peel off the protective backing, plug the small device into an outlet where the bugs will be attracted to it and walk away!Definitely worth the money, to avoid the headaches of bugs constantly being in your face!"}, {"r": 5, "t": "Modern, Much more effective version of flypaper, without the Downside. — I purchased the Zevo flying insect trap for my garage this winter. I was very impressed with the number of small flying insects it trapped on the glue paper trap. It was very effective.  Now that spring is moving into summer I needed to purchase some refill cartridges. The call it a cartridge, but it is just an improved version of the old fashioned flypaper. The UV LED in the trap attracts the insects where they then end up on the flypaper.  Since the cartridge included with the original trap worked so well I expect the refills to perform the same way.  The downside of flypaper was that you had to see all of the dead insects sticking from the paper.  Here the dead insects are hidden inside of the trap and you only see them while you are changing out the cartridge.", "tags": ["refill_issue", "flypaper_gimmick", "compared_other"], "date": "2026-05-25", "brand": "Zevo", "asin": "B0CTQDTF1V", "title": "Modern, Much more effective version of flypaper, without the Downside.", "body": "I purchased the Zevo flying insect trap for my garage this winter. I was very impressed with the number of small flying insects it trapped on the glue paper trap. It was very effective.  Now that spring is moving into summer I needed to purchase some refill cartridges. The call it a cartridge, but it is just an improved version of the old fashioned flypaper. The UV LED in the trap attracts the insects where they then end up on the flypaper.  Since the cartridge included with the original trap worked so well I expect the refills to perform the same way.  The downside of flypaper was that you had to see all of the dead insects sticking from the paper.  Here the dead insects are hidden inside of the trap and you only see them while you are changing out the cartridge."}, {"r": 5, "t": "You won’t be sorry- great product — Love this.  Gets all the bugs and great as a nightlight too.  Flys, gnats and bugs that crawl to it.  Great light and the sticky traps are super sticky", "tags": ["nightlight"], "date": "2026-05-25", "brand": "LFSYS", "asin": "B0D795SPZD", "title": "You won’t be sorry- great product", "body": "Love this.  Gets all the bugs and great as a nightlight too.  Flys, gnats and bugs that crawl to it.  Great light and the sticky traps are super sticky"}, {"r": 5, "t": "Catch them all!! — Works well and at a great price. Catching fungus gnats! Stupid gnats.", "tags": [], "date": "2026-05-25", "brand": "LFSYS", "asin": "B0D795SPZD", "title": "Catch them all!!", "body": "Works well and at a great price. Catching fungus gnats! Stupid gnats."}, {" ": 4, "t": "Works well for catching flies/nats — I think this product is good and works well for what you are paying for. It catches the flies and nats okay but over the coarse of two days has not caught as many as I think it could. It is easy to put together and very light weight. No scent to this product, in case your wondering if it smells. You can re-use this product for about a week before changing the filter. I am not a fan of how you can see the bugs being caught out in the open, especially since this is primarily used in the kitchen area (at least for me since that is where they hangout the most). Overall it does the job for what you pay for.", "tags": [], "date": "2026-05-23", "brand": "LFSYS", "asin": "B0D795SPZD", "title": "Works well for catching flies/nats", "body": "I think this product is good and works well for what you are paying for. It catches the flies and nats okay but over the coarse of two days has not caught as many as I think it could. It is easy to put together and very light weight. No scent to this product, in case your wondering if it smells. You can re-use this product for about a week before changing the filter. I am not a fan of how you can see the bugs being caught out in the open, especially since this is primarily used in the kitchen area (at least for me since that is where they hangout the most). Overall it does the job for what you pay for."}, {"r": 4, "t": "Works well for catching flies/nats — I think this product is good and works well for what you are paying for. It catches the flies and nats okay but over the coarse of two days has not caught as many as I think it could. It is easy to put together and very light weight. No scent to this product, in case your wondering if it smells. You can re-use this product for about a week before changing the filter. I am not a fan of how you can see the bugs being caught out in the open, especially since this is primarily used in the kitchen area (at least for me since that is where they hangout the most). Overall it does the job for what you pay for.", "tags": [], "date": "2026-05-23", "brand": "LFSYS", "asin": "B0DJ2H3BRB", "title": "Works well for catching flies/nats", "body": "I think this product is good and works well for what you are paying for. It catches the flies and nats okay but over the coarse of two days has not caught as many as I think it could. It is easy to put together and very light weight. No scent to this product, in case your wondering if it smells. You can re-use this product for about a week before changing the filter. I am not a fan of how you can see the bugs being caught out in the open, especially since this is primarily used in the kitchen area (at least for me since that is where they hangout the most). Overall it does the job for what you pay for."}, {"r": 5, "t": "Excellent insect trap! — Very impressed with this insect trap! When I purchased it, I didn’t know I had fruit flies. I had not seen any around my fruit dish or plant stand. I was just buying it after I read that fruit flies can come with or live in the soils of indoor plants. I have a kitchen plant stand with several plants so I thought I would try it. I plugged this unit in and 3 days later I had 18 fruit flies on it!!!! After 10 more days I have a total of 40 fruit flies trapped on it ! I am happy it works so well and grossed out at the same time!!! Love that the design of this hides the dead insects. Some of the “victims” are very tiny so I hope that means they were newly hatched. Will definitely buy another unit and some refill cartridges since I keep fruit & plants year round. I don’t normally see fruit flies until I have summer fruit (peaches) on the counters. Excellent fly attraction and easy to use. The cartridges are easy to remove and replace. Nice blue light!", "tags": ["light_no_attract", "refill_issue"], "date": "2026-05-22", "brand": "Zevo", "asin": "B07T869RNY", "title": "Excellent insect trap!", "body": "Very impressed with this insect trap! When I purchased it, I didn’t know I had fruit flies. I had not seen any around my fruit dish or plant stand. I was just buying it after I read that fruit flies can come with or live in the soils of indoor plants. I have a kitchen plant stand with several plants so I thought I would try it. I plugged this unit in and 3 days later I had 18 fruit flies on it!!!! After 10 more days I have a total of 40 fruit flies trapped on it ! I am happy it works so well and grossed out at the same time!!! Love that the design of this hides the dead insects. Some of the “victims” are very tiny so I hope that means they were newly hatched. Will definitely buy another unit and some refill cartridges since I keep fruit & plants year round. I don’t normally see fruit flies until I have summer fruit (peaches) on the counters. Excellent fly attraction and easy to use. The cartridges are easy to remove and replace. Nice blue light!"}, {"r": 5, "t": "They work! 12 flies overnight! NOT A GIMMICK THEY ACTUALLY WORK! — Just before I got these traps I gave the bathroom sink a real good scrub and I almost cancelled the order thinking I may have solved the problem. I'M SO GLAD I DIDN'T DO THAT!I bought the two-pack and put one in the bathroom and one in the kitchen near the sink. The one in the bathroom caught one fly (so maybe all my cleaning helped out?).The one in the kitchen caught 11 flies overnight. Neither one caught any flies during the day. I figured at night the only light source would be those traps and I was right... no distractions (like flying around in front of the TV) - they went right for the traps and got stuck.After I weed out the current batch of flies I'll probably just keep the one in the kitchen going to get the odd fruit-fly, etc.", "tags": [], "date": "2026-05-22", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "They work! 12 flies overnight! NOT A GIMMICK THEY ACTUALLY WORK!", "body": "Just before I got these traps I gave the bathroom sink a real good scrub and I almost cancelled the order thinking I may have solved the problem. I'M SO GLAD I DIDN'T DO THAT!I bought the two-pack and put one in the bathroom and one in the kitchen near the sink. The one in the bathroom caught one fly (so maybe all my cleaning helped out?).The one in the kitchen caught 11 flies overnight. Neither one caught any flies during the day. I figured at night the only light source would be those traps and I was right... no distractions (like flying around in front of the TV) - they went right for the traps and got stuck.After I weed out the current batch of flies I'll probably just keep the one in the kitchen going to get the odd fruit-fly, etc."}, {"r": 5, "t": "Actually works! — To start off, I have purchased this item several times. My place started to have fruit flies especially during the summer. I have tried so many other methods and it seemed like they didn’t really help. Someone at work told me that they use Zevo lights. To start off I had no clues what this was after doing some research I purchased a set to give it a try.Let me tell you within a week the Zevo light was full of fruit flies and other little bugs. This stuff definitely works.Pros: attracts basically any insects and traps them with the sticky insert. Lasts about 3-4 weeks I would say. Has a blue light that attracts the insects. Easy to use and even easier to replace inserts when it’s time. Also they are neutral looking so if guest come over nobody can see the gross insects it caught. Now that I’m thinking about it unless someone knows what it is, it looks like a plugged air freshener.Cons: honestly the only two cons I could think of is at night if you leave the Zevo lights plugged, and your eyes adjusts to the darkness. The light seems very bright, but I started to unplug them before bed so that fixes it. Lastly I wish the inserts lasted longer, they are still sticky about a month in but dust starts to settle on them and I think it’s not as sticky for the bugs.So overall I would recommend this product for your house if you are in need of an insect catcher.", "tags": ["light_no_attract", "compared_other", "catches_some"], "date": "2026-05-21", "brand": "Zevo", "asin": "B07T869RNY", "title": "Actually works!", "body": "To start off, I have purchased this item several times. My place started to have fruit flies especially during the summer. I have tried so many other methods and it seemed like they didn’t really help. Someone at work told me that they use Zevo lights. To start off I had no clues what this was after doing some research I purchased a set to give it a try.Let me tell you within a week the Zevo light was full of fruit flies and other little bugs. This stuff definitely works.Pros: attracts basically any insects and traps them with the sticky insert. Lasts about 3-4 weeks I would say. Has a blue light that attracts the insects. Easy to use and even easier to replace inserts when it’s time. Also they are neutral looking so if guest come over nobody can see the gross insects it caught. Now that I’m thinking about it unless someone knows what it is, it looks like a plugged air freshener.Cons: honestly the only two cons I could think of is at night if you leave the Zevo lights plugged, and your eyes adjusts to the darkness. The light seems very bright, but I started to unplug them before bed so that fixes it. Lastly I wish the inserts lasted longer, they are still sticky about a month in but dust starts to settle on them and I think it’s not as sticky for the bugs.So overall I would recommend this product for your house if you are in need of an insect catcher."}, {"r": 4, "t": "Good but can they do a better price? — I had this before, so I bought it.  I know it works well, and I do recommend for Amazon buyers.However, one thing that lingers in my mind is that, this product makes me think that a package of 5 refills at $15 is way overpriced...... Is it just me who feels this way?  I hope they offer 10, not 5, for the same price.Again, this works, but for a budget buyer, you might look into many other items before you feel justify to buy this product.", "tags": [], "date": "2026-05-21", "brand": "VEYOFLY", "asin": "B0BHN2YLRR", "title": "Good but can they do a better price?", "body": "I had this before, so I bought it.  I know it works well, and I do recommend for Amazon buyers.However, one thing that lingers in my mind is that, this product makes me think that a package of 5 refills at $15 is way overpriced...... Is it just me who feels this way?  I hope they offer 10, not 5, for the same price.Again, this works, but for a budget buyer, you might look into many other items before you feel justify to buy this product."}, {"r": 5, "t": "Love it! Bought two! — Love it! Great for getting all the gnats out of my plants!", "tags": [], "date": "2026-05-21", "brand": "FVOAI", "asin": "B0CSK83JSK", "title": "Love it! Bought two!", "body": "Love it! Great for getting all the gnats out of my plants!"}, {"r": 5, "t": "Very effective with no chemical, smell or noise — I live in Florida and we have lots of little bugs and this product works terrific! No chemicals, no smell, and no noise. All, which are very important to me.  It is totally solved the problem and is a great value for the money.", "tags": ["noise"], "date": "2026-05-19", "brand": "VEYOFLY", "asin": "B0BHN2YLRR", "title": "Very effective with no chemical, smell or noise", "body": "I live in Florida and we have lots of little bugs and this product works terrific! No chemicals, no smell, and no noise. All, which are very important to me.  It is totally solved the problem and is a great value for the money."}, {"r": 5, "t": "It gets the job done. Just a little pricy for how often you’ll need to keep it changed. — I’ve bought this once in April and just bought another. So it’s been about a month, I noticed it works immediately and gives the flying bugs somewhere to go instead of buzzing around. But after about 1week, I started to notice the little flying bugs again. I dislike the price for cart/refill but I appreciate the efficiency. Just know, you will need to keep some on hand so you can rotate as needed to really have it working consistently.", "tags": ["refill_issue", "noise"], "date": "2026-05-17", "brand": "Zevo", "asin": "B07T869RNY", "title": "It gets the job done. Just a little pricy for how often you’ll need to keep it changed.", "body": "I’ve bought this once in April and just bought another. So it’s been about a month, I noticed it works immediately and gives the flying bugs somewhere to go instead of buzzing around. But after about 1week, I started to notice the little flying bugs again. I dislike the price for cart/refill but I appreciate the efficiency. Just know, you will need to keep some on hand so you can rotate as needed to really have it working consistently."}, {"r": 3, "t": "Does work — Does work but not as effective as fly spray.", "tags": [], "date": "2026-05-17", "brand": "VEYOFLY", "asin": "B0BHN2YLRR", "title": "Does work", "body": "Does work but not as effective as fly spray."}, {"r": 5, "t": "Quick and easy replacement cartridges — I love the Zevo insect trap.  I keep two in my kitchen and it is great at trapping fruit flys and other insects.  The refills are easy to use with a quick insertion and peel off of the cover.  I change them about once every 2-4 weeks depending on the time of year.", "tags": ["compared_other"], "date": "2026-05-17", "brand": "Zevo", "asin": "B0CTQDTF1V", "title": "Quick and easy replacement cartridges", "body": "I love the Zevo insect trap.  I keep two in my kitchen and it is great at trapping fruit flys and other insects.  The refills are easy to use with a quick insertion and peel off of the cover.  I change them about once every 2-4 weeks depending on the time of year."}, {"r": 5, "t": "Zevo not only look nice but also has a warm blue nightlight built in. Great product. — I live in Florida an for some reason the Nats were so bad this year. Now I believe, God s  skeptical at first seeing these online, but they work remarkably well and setting them up took less than a minute. We may end up purchasing another pair for maximum efficiency but so far even just the two we have have worked wonders. If you’re skeptical like I was, do yourself a favor and just hit add to cart."}, {"r": 4, "t": "Meh — Stuck it in a corner. Caught some smaller flying things which is nice. A spider even moved in for a bit. Didn't catch anything like a house fly though. Those still have free reign. I guess the issue is that during the day there's too much light and during the night the flies stop being active.So yes, it does catch some things, but no way is it gonna catch anything the size of a fly.Update: So finally it has caught some house flies. Like 5 of 'em. 85% of what it catches are still just the small things like tiny fruit flies and mosquitoes. But after like 2-3 weeks (I'm not keeping track, but a while) I checked and it caught some houseflies. But don't count on it to be your savior--this is not a \"plug it in and never have to worry ever again\" product. There's still tons of flies it DOES NOT catch, but it will occasionally get one or two.", "tags": ["catches_some"], "date": "2026-04-21", "brand": "Zevo", "asin": "B07T869RNY", "title": "Meh", "body": "Stuck it in a corner. Caught some smaller flying things which is nice. A spider even moved in for a bit. Didn't catch anything like a house fly though. Those still have free reign. I guess the issue is that during the day there's too much light and during the night the flies stop being active.So yes, it does catch some things, but no way is it gonna catch anything the size of a fly.Update: So finally it has caught some house flies. Like 5 of 'em. 85% of what it catches are still just the small things like tiny fruit flies and mosquitoes. But after like 2-3 weeks (I'm not keeping track, but a while) I checked and it caught some houseflies. But don't count on it to be your savior--this is not a \"plug it in and never have to worry ever again\" product. There's still tons of flies it DOES NOT catch, but it will occasionally get one or two."}, {"r": 5, "t": "Excellent and doubles as night light — This insect trap works perfectly. Within just 3 months, it caught a ton of flies. I live on the first floor near a lot of plants, so bugs are definitely an issue, and this has made a big difference.The blue light is actually a nice bonus - it doubles as a soft hallway night light, which I didn’t expect but really like.The packaging did arrive a bit damaged, but the product itself worked fine with no issues.Refills are a little expensive, but honestly worth it for a pest-free home. I would definitely buy this again.", "tags": ["light_no_attract", "nightlight"], "date": "2026-04-17", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Excellent and doubles as night light", "body": "This insect trap works perfectly. Within just 3 months, it caught a ton of flies. I live on the first floor near a lot of plants, so bugs are definitely an issue, and this has made a big difference.The blue light is actually a nice bonus - it doubles as a soft hallway night light, which I didn’t expect but really like.The packaging did arrive a bit damaged, but the product itself worked fine with no issues.Refills are a little expensive, but honestly worth it for a pest-free home. I would definitely buy this again."}, {"r": 5, "t": "This thing is AMAZING!!!! — I keep this near my fruit bowl and it gets all the gnats! I haven't seen any flying around since I set this up.  It's very quiet and the light is not bright which is perfect!", "tags": [], "date": "2026-04-11", "brand": "FVOAI", "asin": "B0CSK83JSK", "title": "This thing is AMAZING!!!!", "body": "I keep this near my fruit bowl and it gets all the gnats! I haven't seen any flying around since I set this up.  It's very quiet and the light is not bright which is perfect!"}, {"r": 5, "t": "Fabulous flying insect trapper!! — Living in the country, it’s inevitable that you will get a fly or two in the house with the doors opening and closing all of the time. I leave both my back and front porch lights on, so it makes it even worse when those little flying gnats and moths that are hanging out by the light feel they can come inside with you. I have bought fruit fly traps for the little flies that come in with fresh produce, but that didn’t stop the occasional house fly from dive bombing me when trying to watch tv. (They are attracted to light) so of course I had my doubts about the fly-trapping ability of this product, as well, but got it on sale and it came with refills so I thought I’d give it a whirl. Boy am I glad I did! I simply put the sticky pad in the quality built plug in, really easy to do, and the picture I posted was just from plugging it in last night! As you can see, it has attracted three flies I didn’t even know were in my house! I knew one was, but this thing caught three plus all of the little flies that come in when they are near your outside light. There may even be a few fruit flies on it, as well, altho I haven’t had a problem with them so much recently. The item fits nicely in one of my kitchen sockets, and emits a faint blue light that acts not only as a flying insect attractant, but also acts as a nice little night light if needed. It’s quality made, and the refills you simply peel the outer paper off and slip into the holder and starts working the minute you plug it in! I am very happy with this product, and I know you will be, as well! Perfect for places that get the occasional irritating random fly zooming around the house. Have no fear, zero will get the job done!!!", "tags": ["light_no_attract", "refill_issue", "placement_outlet", "nightlight"], "date": "2026-04-06", "brand": "Zevo", "asin": "B07T869RNY", "title": "Fabulous flying insect trapper!!", "body": "Living in the country, it’s inevitable that you will get a fly or two in the house with the doors opening and closing
