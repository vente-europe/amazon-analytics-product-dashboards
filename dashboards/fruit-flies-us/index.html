<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fruit Flies (US)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════
   Dashboard Hub — Core Layout
   ═══════════════════════════════════════════════════════ */

* { box-sizing: border-box; margin: 0; padding: 0 }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  font-size: 13px;
  display: flex;
  min-height: 100vh;
}

/* ── Sidebar ── */
.sidebar {
  width: 272px;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  transition: transform .25s ease;
}

.sidebar-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid #f1f5f9;
  display: flex;
  align-items: center;
  gap: 12px;
}

.sidebar-icon {
  width: 24px;
  height: 24px;
  color: #2563eb;
  flex-shrink: 0;
}

.sidebar-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: #0f2942;
  line-height: 1.2;
}

.sidebar-subtitle {
  font-size: .65rem;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 600;
  margin-top: 2px;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
}

.sidebar-group {
  margin-bottom: 20px;
}

.sidebar-group-title {
  font-size: .6rem;
  font-weight: 700;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: .1em;
  padding: 0 10px 8px;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 12px;
  border: none;
  background: none;
  border-radius: 8px;
  font-size: .82rem;
  font-weight: 500;
  color: #475569;
  cursor: pointer;
  text-align: left;
  transition: all .15s ease;
  margin-bottom: 2px;
}

.sidebar-item:hover {
  background: #f8fafc;
  color: #1e293b;
}

.sidebar-item.active {
  background: #eff6ff;
  color: #2563eb;
  font-weight: 600;
}

.sidebar-item-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.sidebar-item .arrow {
  margin-left: auto;
  width: 16px;
  height: 16px;
  color: #cbd5e1;
  opacity: 0;
  transform: translateX(-4px);
  transition: all .15s ease;
}

.sidebar-item.active .arrow,
.sidebar-item:hover .arrow {
  opacity: 1;
  transform: translateX(0);
}

.sidebar-footer {
  padding: 12px;
  border-top: 1px solid #f1f5f9;
  background: #fafbfc;
}

.btn-add {
  width: 100%;
  padding: 10px;
  border: 1px dashed #cbd5e1;
  background: #fff;
  border-radius: 8px;
  font-size: .8rem;
  font-weight: 500;
  color: #64748b;
  cursor: pointer;
  transition: all .15s ease;
}

.btn-add:hover {
  border-color: #2563eb;
  color: #2563eb;
  background: #eff6ff;
}

/* ── Mobile sidebar toggle ── */
.sidebar-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 200;
  width: 40px;
  height: 40px;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}

.sidebar-toggle svg {
  width: 20px;
  height: 20px;
  color: #475569;
}

/* ── Main content ── */
.main-content {
  flex: 1;
  margin-left: 272px;
  min-height: 100vh;
}

/* ── Empty state ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  color: #94a3b8;
  gap: 16px;
}

.empty-icon {
  width: 64px;
  height: 64px;
  opacity: .2;
}

.empty-state p {
  font-size: .9rem;
  font-weight: 500;
}

/* ── Loading state ── */
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  gap: 16px;
  color: #64748b;
}

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid #e2e8f0;
  border-top-color: #2563eb;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading p { font-size: .85rem; font-weight: 500; }

/* ═══════════════════════════════════════════════════════
   Dashboard Content Styles (reused from existing dashboards)
   ═══════════════════════════════════════════════════════ */

.dashboard-header {
  background: #0f2942;
  color: #fff;
  padding: 22px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.dashboard-header h2 {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: .01em;
  color: #fff;
}

.dashboard-header span {
  font-size: .78rem;
  color: #94a3b8;
}

.dashboard-body {
  max-width: 1600px;
  margin: 0 auto;
  padding: 28px 32px;
}

/* ── KPIs ── */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 24px;
}

.kpi {
  background: #fff;
  border-radius: 8px;
  padding: 14px 18px;
  box-shadow: 0 1px 3px rgba(0,0,0,.07);
}

.kpi-v {
  font-size: 1.25rem;
  font-weight: 700;
  color: #0f2942;
  line-height: 1.2;
}

.kpi-l {
  font-size: .68rem;
  color: #64748b;
  margin-top: 5px;
  text-transform: uppercase;
  letter-spacing: .05em;
}

/* ── Section headings ── */
h2 { font-size: 1rem; margin-bottom: 16px; color: #1e293b; font-weight: 700; }

/* ── Grid layouts ── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; margin-bottom: 18px; }

/* ── KPI grid ── */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

/* ── Chart wrapper ── */
.cw { position: relative; height: 240px; }

/* ── Insight & Warning boxes ── */
.insight {
  background: #eff6ff;
  border-left: 3px solid #2563eb;
  padding: 10px 14px;
  border-radius: 0 6px 6px 0;
  margin-bottom: 14px;
  font-size: .8rem;
  color: #1e40af;
  line-height: 1.5;
}

.warn {
  background: #fff7ed;
  border-left: 3px solid #f97316;
  padding: 10px 14px;
  border-radius: 0 6px 6px 0;
  margin-bottom: 14px;
  font-size: .8rem;
  color: #9a3412;
  line-height: 1.5;
}

/* ── Table wrappers ── */
.tbl-wrap { overflow-x: auto; max-height: 460px; overflow-y: auto; }

.num-right th:not(:first-child),
.num-right td:not(:first-child) { text-align: right; }

/* ── Cards & Charts ── */
.charts-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 18px;
  margin-bottom: 24px;
}

.card {
  background: #fff;
  border-radius: 8px;
  padding: 18px 20px;
  box-shadow: 0 1px 3px rgba(0,0,0,.07);
  margin-bottom: 18px;
}

.card h3 {
  font-size: .83rem;
  font-weight: 600;
  color: #475569;
  margin-bottom: 16px;
}

.chart-wrap {
  position: relative;
  height: 300px;
}

/* ── Tables ── */
table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #f8fafc;
  text-align: left;
  padding: 8px 10px;
  font-weight: 600;
  color: #475569;
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .04em;
  border-bottom: 2px solid #e2e8f0;
}

td {
  padding: 7px 10px;
  border-bottom: 1px solid #f1f5f9;
  font-size: .82rem;
}

tr:hover td { background: #f8fafc; }

td.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 7px;
  flex-shrink: 0;
}

.total-row td {
  font-weight: 700;
  color: #0f2942;
  background: #f8fafc;
  border-top: 2px solid #e2e8f0;
}

th.sortable {
  cursor: pointer;
  user-select: none;
  position: relative;
  padding-right: 18px;
}

th.sortable:hover { color: #0f2942; background: #eef2f7; }

th.sortable::after {
  content: '\21C5';
  position: absolute;
  right: 3px;
  top: 50%;
  transform: translateY(-50%);
  font-size: .65rem;
  color: #94a3b8;
}

th.sortable.asc::after { content: '\25B2'; color: #2563eb; }
th.sortable.desc::after { content: '\25BC'; color: #2563eb; }

/* ── Notes ── */
.note {
  font-size: .7rem;
  color: #64748b;
  margin-top: 18px;
  padding: 10px 13px;
  background: #f8fafc;
  border-radius: 6px;
  border-left: 2px solid #cbd5e1;
  line-height: 1.6;
}

/* ── Heatmaps ── */
.heatmap td.hm {
  text-align: center;
  font-size: .78rem;
  font-weight: 600;
  padding: 10px 8px;
  min-width: 70px;
}

.heatmap td.hm-total {
  text-align: center;
  font-size: .78rem;
  font-weight: 700;
  padding: 10px 8px;
  min-width: 70px;
  border-left: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #0f2942;
}

.heatmap .seg-label {
  font-weight: 600;
  color: #1e293b;
  padding: 10px 12px;
  white-space: nowrap;
}

.heatmap .total-row td {
  font-weight: 700;
  border-top: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #0f2942;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 2px;
  background: #f1f5f9;
  padding: 4px;
  border-radius: 10px;
  margin-bottom: 24px;
  width: fit-content;
}

.tab {
  padding: 8px 18px;
  border: none;
  background: none;
  border-radius: 7px;
  font-size: .82rem;
  font-weight: 500;
  color: #64748b;
  cursor: pointer;
  transition: all .15s ease;
}

.tab:hover { color: #1e293b; background: #e2e8f0; }

.tab.active {
  background: #fff;
  color: #2563eb;
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(0,0,0,.07);
}

.panel { display: none; }
.panel.active { display: block; }

/* ═══════════════════════════════════════════════════════
   Tab Template: Reviews VOC (.voc-*, .us-*, .cs-*, etc.)
   ═══════════════════════════════════════════════════════ */

/* VOC sub-tabs */
.voc-sub-tabs { display: flex; background: #fff; border-bottom: 2px solid #e2e8f0; gap: 2px; position: sticky; top: 0; z-index: 30; }
.voc-sub-tab { padding: 10px 18px; cursor: pointer; font-size: .8rem; font-weight: 600; color: #64748b; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.voc-sub-tab:hover { color: #1e3a5f; }
.voc-sub-tab.active { color: #1e3a5f; border-bottom-color: #2563eb; }
.voc-sub-panel { display: none; }
.voc-sub-panel.active { display: block; }

/* VOC anchor navigation */
.voc-anchor-nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 0; position: sticky; top: 41px; z-index: 29; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; box-shadow: 0 2px 4px rgba(0,0,0,.06); margin-bottom: 14px; }
.voc-anchor-nav a { padding: 7px 16px; border-radius: 20px; font-size: .75rem; font-weight: 600; color: #475569; background: #fff; text-decoration: none; border: 1.5px solid #e2e8f0; transition: all .15s; }
.voc-anchor-nav a:hover, .voc-anchor-nav a.active { color: #1e3a5f; background: #dbeafe; border-color: #93c5fd; }

/* Customer Profile 4-chart grid */
.cp-charts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 10px; }
.cp-chart-box { background: #fff; border-radius: 8px; padding: 14px 14px 10px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
.cp-chart-box h4 { font-size: .82rem; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
.cp-chart-wrap { position: relative; height: 230px; }
.cp-legend { font-size: .68rem; color: #94a3b8; text-align: right; padding: 6px 0 0; }

/* Usage scenario / motivation / expectations tables */
.us-table { width: 100%; border-collapse: collapse; font-size: .78rem; }
.us-table th { background: #f8fafc; text-align: left; padding: 10px 14px; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
.us-table td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
.us-table tr:hover td { background: #f8fafc; }
.us-label { font-weight: 600; color: #1e293b; white-space: nowrap; }
.us-reason { color: #64748b; line-height: 1.5; }
.us-pct { text-align: right; white-space: nowrap; color: #1e293b; font-weight: 600; }
.us-pct span { display: inline-block; min-width: 48px; text-align: right; }
.us-bar-wrap { display: inline-block; width: 60px; height: 12px; background: #e2e8f0; border-radius: 3px; overflow: hidden; vertical-align: middle; margin-right: 8px; }
.us-bar { height: 100%; background: #93c5fd; border-radius: 3px; }

/* Negative sentiment zone */
.cs-neg-zone { background: #fef2f2; border-radius: 10px; padding: 18px; margin-bottom: 22px; }
.nf-row { cursor: pointer; transition: background .15s; }
.nf-row:hover td { background: #fff5f5 !important; }
.nf-arrow { display: inline-block; font-size: .65rem; margin-right: 6px; transition: transform .2s; color: #94a3b8; }
.nf-row.open .nf-arrow { transform: rotate(90deg); }
.nf-detail { display: none; }
.nf-detail.open { display: table-row; }
.nf-body { padding: 8px 16px 12px; background: #fff9f9; border-left: 3px solid #fca5a5; }
.nf-body ul { margin: 0 0 8px 16px; font-size: .75rem; color: #334155; line-height: 1.55; }
.nf-body ul li { margin-bottom: 2px; }
.nf-quotes { border-top: 1px solid #fde8e8; padding-top: 6px; }
.nf-quotes p { font-size: .72rem; color: #9a3412; font-style: italic; line-height: 1.45; margin-bottom: 3px; }

/* Positive sentiment zone */
.cs-pos-zone { background: #f0fdf4; border-radius: 10px; padding: 18px; margin-bottom: 22px; }
.pf-row { cursor: pointer; transition: background .15s; }
.pf-row:hover td { background: #f0fdf4 !important; }
.pf-arrow { display: inline-block; font-size: .65rem; margin-right: 6px; transition: transform .2s; color: #94a3b8; }
.pf-row.open .pf-arrow { transform: rotate(90deg); }
.pf-detail { display: none; }
.pf-detail.open { display: table-row; }
.pf-body { padding: 8px 16px 12px; background: #f7fef9; border-left: 3px solid #86efac; }
.pf-body ul { margin: 0 0 8px 16px; font-size: .75rem; color: #334155; line-height: 1.55; }
.pf-body ul li { margin-bottom: 2px; }
.pf-quotes { border-top: 1px solid #dcfce7; padding-top: 6px; }
.pf-quotes p { font-size: .72rem; color: #166534; font-style: italic; line-height: 1.45; margin-bottom: 3px; }

/* Strategy insights table */
.si-table { width: 100%; border-collapse: collapse; font-size: .78rem; }
.si-table th { background: #f8fafc; text-align: left; padding: 10px 14px; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
.si-table td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: top; line-height: 1.55; }
.si-table tr:hover td { background: #f8fafc; }
.si-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: .7rem; font-weight: 600; line-height: 1.3; }

/* Review browser pills */
.pill { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: .68rem; font-weight: 600; margin: 1px 2px; }
.pill-red { background: #fef2f2; color: #dc2626; }
.pill-orange { background: #fff7ed; color: #ea580c; }
.pill-amber { background: #fffbeb; color: #d97706; }
.pill-blue { background: #eff6ff; color: #2563eb; }
.pill-purple { background: #faf5ff; color: #7c3aed; }
.review-text { font-size: .78rem; color: #334155; line-height: 1.55; }

@media (max-width: 900px) { .cp-charts { grid-template-columns: 1fr 1fr; } }
@media (max-width: 550px) { .cp-charts { grid-template-columns: 1fr; } }

/* ── Segment sub-tab buttons ── */
.seg-tab-btns { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.seg-tab-btn {
  padding: 6px 14px;
  border: 1.5px solid #cbd5e1;
  border-radius: 20px;
  cursor: pointer;
  font-size: .75rem;
  font-weight: 600;
  color: #475569;
  background: #fff;
  transition: all .15s;
}
.seg-tab-btn:hover { background: #f8fafc; }
.seg-tab-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

/* ── Section headers ── */
.sec-summary {
  font-size: .78rem;
  color: #64748b;
  line-height: 1.55;
  max-width: 900px;
}

.sec-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-top: 8px;
}

.sec-title {
  font-size: 1rem;
  font-weight: 700;
  color: #1e293b;
}

/* ═══════════════════════════════════════════════════════
   Tab Template: Keyword Analysis (.kwa-*)
   ═══════════════════════════════════════════════════════ */

.kw-table {
  width: 100%;
  border-collapse: collapse;
  font-size: .72rem;
}

.kw-table th {
  position: sticky;
  top: 0;
  background: #0f2942;
  color: #fff;
  padding: 8px 6px;
  text-align: center;
  font-size: .62rem;
  font-weight: 600;
  white-space: nowrap;
  z-index: 2;
}

.kw-table td {
  padding: 5px 6px;
  border-bottom: 1px solid #f1f5f9;
  text-align: center;
  font-size: .72rem;
}

.kw-table tr:hover td { background: #f8fafc; }

.kwa-kw-sort { cursor: pointer; user-select: none; }
.kwa-kw-sort:hover { color: #93c5fd; }

.kw-legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 8px;
  padding: 8px 12px;
  font-size: .68rem;
  color: #64748b;
}

.kw-legend span { display: inline-flex; align-items: center; gap: 4px; }
.kw-legend i { display: inline-block; width: 16px; height: 12px; border-radius: 2px; }

/* KW Analysis — sticky columns */
.kwa-sticky-th {
  position: sticky;
  left: 0;
  background: #0f2942;
  color: #fff;
  padding: 8px 10px;
  text-align: left;
  font-size: .68rem;
  font-weight: 600;
  z-index: 2;
  min-width: 100px;
}

.kwa-sticky-td {
  position: sticky;
  left: 0;
  background: #f8fafc;
  padding: 6px 10px;
  font-weight: 600;
  color: #475569;
  border-bottom: 1px solid #f1f5f9;
  z-index: 1;
}

.kwa-comp-th {
  background: #0f2942;
  color: #fff;
  padding: 8px 6px;
  text-align: center;
  font-size: .62rem;
  font-weight: 600;
  white-space: nowrap;
  min-width: 80px;
}

.kwa-comp-img {
  width: 54px;
  height: 54px;
  object-fit: contain;
  border-radius: 4px;
  background: #fff;
  display: block;
  margin: 0 auto 4px;
}

.kwa-comp-link {
  color: #93c5fd;
  text-decoration: none;
  font-size: .62rem;
}

.kwa-comp-link:hover { text-decoration: underline; }

.kwa-metric-td {
  text-align: center;
  padding: 6px;
  border-bottom: 1px solid #f1f5f9;
}

.kwa-kw-sticky-th {
  position: sticky;
  left: 0;
  z-index: 3;
  background: #0f2942;
  text-align: left;
  padding: 8px 10px;
  min-width: 200px;
}

.kwa-kw-sticky-td {
  position: sticky;
  left: 0;
  background: #fff;
  z-index: 1;
  text-align: left;
  padding: 6px 10px;
  font-weight: 500;
  white-space: nowrap;
  border-bottom: 1px solid #f1f5f9;
}

.kwa-kw-comp-img {

enue": 1012497, "reviews": 433, "price": 49.99}]}}}}, "reviews-voc-lure": {"label": "Reviews VOC · Lure", "data": {"countryName": "United States", "countryCode": "US", "currency": "$", "segmentName": "Lure", "totalReviews": 1644, "avgRating": 1.61, "starDist": [928, 433, 283, 0, 0], "cpSummary": "Based on a population of 1,644 reviews (avg rating 1.61) across 15 ASINs, this analysis focuses exclusively on passive LURE-style fruit fly traps (e.g., Terro, Super Ninja, Aunt Fannie's, Raid). <strong>CRITICAL CONTEXT:</strong> The dataset is heavily skewed, containing only 1★, 2★, and 3★ reviews, and no 4★ or 5★ ratings. Consequently, 'positive' sentiments are inferred entirely from 3★ reviews, representing partial successes or specific features customers liked (such as 'cute design' or 'easy setup') despite their overarching dissatisfaction. The dominant narrative is severe product failure, largely driven by traps failing to sink flies, rapid liquid evaporation, pungent vinegar odors, and consumers feeling ripped off by a product they view as 'just overpriced apple cider vinegar in a cup'.", "cpWho": {"labels": ["Pets/Cats", "Children", "Sensitive-nosed Family", "Co-workers", "Houseguests"], "pos": [40, 25, 20, 15, 5], "neg": [180, 140, 110, 35, 25]}, "cpWhen": {"labels": ["Summer/Heat", "First 3 Days", "After 7-10 Days", "After Vacation", "Overnight"], "pos": [35, 85, 55, 20, 25], "neg": [260, 190, 130, 85, 75]}, "cpWhere": {"labels": ["Kitchen Sink", "Fruit Bowl", "Trash/Compost", "House Plants", "Office/Desk", "Bathroom"], "pos": [120, 90, 45, 35, 20, 15], "neg": [480, 320, 190, 160, 75, 60]}, "cpWhat": {"labels": ["Fruit Flies", "Gnats", "House Flies", "Mosquitoes"], "pos": [210, 85, 15, 5], "neg": [950, 380, 140, 45]}, "usageScenarios": [{"label": "Kitchen Fruit Fly Infestations", "reason": "Placing traps near sinks, counters, and fruit bowls to catch kitchen swarms.", "pct": "46.5%"}, {"label": "Gnats Around Houseplants", "reason": "Setting traps near indoor spider plants and soil to capture fungus gnats.", "pct": "21.2%"}, {"label": "Trash & Compost Bins", "reason": "Controlling pests that breed near indoor organic waste receptacles.", "pct": "12.8%"}, {"label": "Post-Vacation Swarms", "reason": "Returning to a home overrun by flies due to forgotten produce.", "pct": "8.5%"}, {"label": "Office & Desk Outbreaks", "reason": "Dealing with fruit flies caused by co-workers leaving snacks out.", "pct": "4.6%"}, {"label": "Bathroom Drains", "reason": "Placing traps near sinks to combat drain flies.", "pct": "3.8%"}, {"label": "General House Fly Control", "reason": "Mistakenly attempting to use the lure for larger house flies.", "pct": "1.9%"}, {"label": "Mosquito Control", "reason": "Hoping the attractant will work on indoor mosquitoes.", "pct": "0.7%"}], "csSummary": "Customer satisfaction is abysmal, reflected by an average rating of 1.61. The primary pain point is that the traps act as feeding stations rather than kill zones; flies are attracted to the scent but do not drown. Compounding this frustration is the realization that the proprietary 'bait' is merely diluted apple cider vinegar, leading customers to feel scammed compared to a cheap DIY solution with dish soap. Furthermore, poor container design leads to frequent spills, rapid evaporation of the fluid, and an overpowering, unpleasant vinegar stench throughout the home.", "negativeTopics": [{"label": "Flies Attracted But Not Trapped", "reason": "The lure attracts flies to the rim or lid, but fails to force them into the liquid to drown.", "pct": "41.5%", "bullets": ["Consumers report flies congregating on the outside of the trap without entering the holes.", "The lack of a surfactant means the few flies that do land on the liquid do not sink.", "Customers perceive the traps as feeding or breeding grounds rather than extermination tools."], "quotes": ["\"The fruit flies just sat on the Apple and never went inside.\"", "\"It does a really good job of attracting the flies on top of it, but non of them go in and get trapped.\"", "\"They just crawl around the rim and fly out.\""]}, {"label": "Overpriced DIY Substitute", "reason": "Buyers are outraged to discover the liquid is just apple cider vinegar, which they could make at home for pennies.", "pct": "26.3%", "bullets": ["Customers frequently compare the product negatively against homemade water, vinegar, and dish soap traps.", "The strong, recognizable smell of ACV makes buyers feel they overpaid for basic grocery ingredients.", "Many state their homemade saran-wrap traps caught significantly more bugs."], "quotes": ["\"It's just a small cup of diluted Apple Cider Vinegar. Not very effective.\"", "\"I could've bought an entire quart at the store and made my own traps with 20oz bottles for a fraction of the cost.\"", "\"Don't get these literally just buy apple cider vinegar and put them in small cups. Works the same.\""]}, {"label": "Spillage & Instability", "reason": "Top-heavy designs and wide-open lids result in frequent messes on counters.", "pct": "11.8%", "bullets": ["Apple-shaped and small-jar traps tip over easily, spreading pungent vinegar everywhere.", "The lack of a secure, spill-proof lid makes them hazardous around pets and children.", "Spilled liquid actually attracts more flies to the countertop surface."], "quotes": ["\"These apple shaped traps fall over way too easy spilling the bait on counters or tables.\"", "\"I have tried to find places to put them so they dont get knocked over... 3 have been spilled all over my counter!\"", "\"There's no lid. Unlike other traditional traps, this is just wide open, so don't knock it over.\""]}, {"label": "Overpowering Odor", "reason": "The bait gives off a strong, rotten, or sour vinegar scent that fills the room.", "pct": "8.7%", "bullets": ["The smell is described as offensive and strong enough to spread throughout the entire house.", "Customers have to throw the traps away early or run fans simply to tolerate the air in their kitchen.", "The smell deters sensitive-nosed household members and guests."], "quotes": ["\"It makes your whole house smell like vinegar with a hint of sweetness.\"", "\"My family could not tolerate the repulsive smell this product fills the room with.\"", "\"This stuff stinks, do not spill it!\""]}, {"label": "Rapid Evaporation", "reason": "The liquid bait dries out in days rather than lasting the advertised weeks.", "pct": "6.2%", "bullets": ["Claims of 30, 40, or 180 days are viewed as highly deceptive.", "The liquid is reportedly too thin and evaporates rapidly in warm indoor temperatures.", "Traps require constant refilling, negating the 'set it and forget it' value proposition."], "quotes": ["\"Put mine out 7 days ago and it is nearly empty of liquid. Kind of feel scammed by that claim.\"", "\"The liquid you put in them dried up very quickly. Did not last as long as it said it would.\"", "\"These evaporate rapidly, so you will use them up very fast.\""]}, {"label": "Leaking Packaging", "reason": "Bottles and refill packets arrive broken or completely empty.", "pct": "3.1%", "bullets": ["Flimsy packaging leads to spills during shipping.", "Customers are unable to use the product immediately due to dried-out or empty bottles.", "Creates a strong vinegar smell inside the shipping boxes."], "quotes": ["\"Just received these and one of the bottles had spilled in the box and was completely empty.\"", "\"Multiple bottles completely leaked out when I received it.\"", "\"I just opened my package and there's almost little to no liquid solution in the bottles.\""]}, {"label": "Catching the Wrong Bugs", "reason": "Traps are totally ineffective against gnats or house flies despite expectations.", "pct": "1.4%", "bullets": ["Users buy these for gnats and mosquitoes, but the bait formula does not attract them.", "Consumers complain about house flies ignoring the traps entirely.", "Brands are failing to educate buyers on which exact species the lure is calibrated for."], "quotes": ["\"I got this for gnats and mosquitoes. They fly right by it and don't seem to be attracted.\"", "\"These have done nothing to help capture/kill/ reduce the house flies.\"", "\"Did not catch a single gnat I installed zevo plug in insect traps instead.\""]}, {"label": "Deceptive Marketing Claims", "reason": "Brands exaggerate the duration of the supply and safety features.", "pct": "1.0%", "bullets": ["Total duration claims (e.g., '270 days') assume sequential use of single doses, confusing buyers.", "Box claims state 'safe for pets' but inner instructions warn of toxic exposure.", "Leads to direct distrust of the brand and demands for refunds."], "quotes": ["\"Product headline (for 6) says '270 day lure supply'. This is false, there is no refill at all.\"", "\"The box promises that the product is safe around children an pets. Inside the instructions it warns that it is NOT.\"", "\"Kind of feel scammed by that claim for that price.\""]}], "positiveTopics": [{"label": "Discreet & Cute Design", "reason": "Buyers prefer the aesthetic of the apple-shaped containers over unsightly sticky tape.", "pct": "41.2%", "bullets": ["The compact, colorful apple designs blend nicely with kitchen fruit bowls.", "Customers appreciate the visual upgrade from hanging fly ribbons or open mason jars.", "Small profiles allow them to be tucked away discreetly near plants or sinks."], "quotes": ["\"The apple shape is cuter than fly tape though.\"", "\"The traps are easy to set up and look nicer than other brands, which is a plus for keeping them on the counter.\"", "\"As they are very stylish, I placed them all around the house.\""]}, {"label": "Ease of Setup", "reason": "The ready-to-use liquid and pre-made containers offer a no-touch convenience.", "pct": "27.5%", "bullets": ["Consumers like avoiding the measuring and mixing required for homemade ACV traps.", "Simply tearing open a packet or unscrewing a lid appeals to buyers wanting quick deployment.", "The concept of 'no harsh chemicals' makes buyers feel comfortable setting it up near food."], "quotes": ["\"Easy to set up solution packet included just poor into apple.\"", "\"Very easy set up.\"", "\"I love the nice clean concept of natural ingredients without harsh chemicals.\""]}, {"label": "Initial Attraction / First Few Days", "reason": "The product does show signs of working in the short-term before the scent fades.", "pct": "18.8%", "bullets": ["Users acknowledge the bait effectively draws flies to the area within hours.", "Some traps manage to catch a handful of bugs in the first 48 hours.", "Validates that the attractant formula itself fundamentally works to draw pests."], "quotes": ["\"Update: after just an 1hr of having it ..it has a bunch of dead gnats!!\"", "\"They definitely catch some fruit flies, especially during the first few days.\"", "\"Does a great job of attracting them.\""]}, {"label": "Effective Over Time", "reason": "A minority of users report that if left alone, the traps eventually reduce the swarm.", "pct": "8.1%", "bullets": ["Patience yields results for some, with notable drops in fly populations after a week.", "Works better when placed optimally, like right next to a garbage can.", "Catches enough bugs to feel marginally useful."], "quotes": ["\"I went ahead and left it in position near my trash can and after a few days it finally started to catch them.\"", "\"Eventually some bugs do wind up dead at the bottom of in the solution.\"", "\"I did notice a significant decrease in the number of small flying insects in 7-10 days.\""]}, {"label": "Customer Service Recovery", "reason": "Brands issuing refunds for ineffective products turn 1-star sentiments into 3-star reviews.", "pct": "4.4%", "bullets": ["Proactive outreach by sellers mitigates extreme anger.", "Offering alternative products or money back restores a base level of brand trust.", "Demonstrates that service can bandage product flaws."], "quotes": ["\"Was contacted by customer service and refunded and they are sending a different product.\"", "\"Great customer service.\"", "\"At least the company stands behind their product.\""]}], "negativeInsights": [{"type": "Efficacy Crisis", "badgeBg": "#fee2e2", "badgeColor": "#991b1b", "finding": "Over 40% of complaints center on flies landing on the trap but not drowning in the liquid.", "implication": "<strong>Reformulate the bait</strong> to include a surfactant (like dish soap) that breaks surface tension, ensuring flies actually sink and die."}, {"type": "DIY Substitute", "badgeBg": "#fef3c7", "badgeColor": "#92400e", "finding": "Over 1/4 of unhappy buyers feel scammed, stating homemade apple cider vinegar works better.", "implication": "<strong>Differentiate the formula</strong> visually or functionally from basic ACV, or focus marketing entirely on the superior, spill-proof hardware to justify the premium."}, {"type": "Design Flaw", "badgeBg": "#ffedd5", "badgeColor": "#9a3412", "finding": "Top-heavy apple shapes and open jars spill easily, creating messy, fly-attracting puddles.", "implication": "<strong>Redesign the base</strong> to be wider and heavier, and incorporate a spill-resistant funnel lid to protect pets, kids, and counters."}, {"type": "Smell", "badgeBg": "#e0e7ff", "badgeColor": "#3730a3", "finding": "Customers frequently abandon the product because the intense vinegar odor permeates their living spaces.", "implication": "<strong>Deodorize or mask</strong> the vinegar scent with pleasant botanicals, or refine the trap openings to limit airflow while still allowing flies to enter."}, {"type": "Evaporation", "badgeBg": "#fce7f3", "badgeColor": "#9d174d", "finding": "Liquid evaporates in just days, completely invalidating brand claims of 30-270 day longevities.", "implication": "<strong>Thicken the liquid</strong> with a sucrose or gel base to slow evaporation rates, and align box claims with realistic household conditions to prevent buyer backlash."}, {"type": "Packaging", "badgeBg": "#f1f5f9", "badgeColor": ", "Near Houseplants"], "pos": [110, 30, 95, 40, 75], "neg": [650, 320, 110, 80, 90]}, "cpWhat": {"labels": ["Fruit Flies", "Gnats", "Mosquitoes", "House Flies", "Plant Flies / Fungus Gnats"], "pos": [40, 180, 15, 10, 70], "neg": [680, 190, 85, 210, 50]}, "usageScenarios": [{"label": "Kitchen Counters & Sinks", "reason": "Users primarily place units near produce or sinks where fruit flies actively congregate.", "pct": "84.5%"}, {"label": "Trash & Compost Bins", "reason": "Attempting to mitigate swarms breeding near food waste disposal areas.", "pct": "52.3%"}, {"label": "Houseplant Stations", "reason": "Targeting fungus gnats that hover around indoor potting soil.", "pct": "38.1%"}, {"label": "Nightlight Dual-Usage", "reason": "Utilizing the blue/UV glow to illuminate dark hallways or kitchens overnight.", "pct": "29.4%"}, {"label": "Bathrooms", "reason": "Placing units in smaller, confined spaces where drain flies or gnats appear.", "pct": "21.6%"}, {"label": "RV and Camper Interiors", "reason": "Trying to control bugs entering through frequently opened doors in small recreational vehicles.", "pct": "14.2%"}, {"label": "Entryways & Exterior Doors", "reason": "Positioned by doors to catch house flies and mosquitoes as they enter the home.", "pct": "11.8%"}, {"label": "Pet Areas", "reason": "Using a chemical-free option near dog bowls or litter boxes to keep flying pests away.", "pct": "8.5%"}], "csSummary": "Customer satisfaction is exceptionally low, driven by the stark realization that UV light fundamentally fails to attract the target pest (fruit flies). Users feel cheated by marketing claims, reporting that cheap DIY vinegar traps work instantly while $30+ electric devices catch nothing. Satisfaction drops further as hardware (LEDs and fans) routinely fails within 3 to 6 months, turning the product into a dead wall ornament.", "negativeTopics": [{"label": "Light Fails to Attract Fruit Flies", "reason": "Customers continuously observe fruit flies ignoring the UV/blue light entirely, often landing beside the trap rather than on it.", "pct": "91.5%", "bullets": ["Users report zero catches over weeks despite heavy infestations in the room.", "Literature included with some devices contradicts marketing, stating fruit flies aren't attracted to light.", "Customers feel the core premise of the product is scientifically flawed for this specific pest."], "quotes": ["\"The blue light does not attract fruit flies. This product is a waste of money.\"", "\"I watch the bugs chilling in the blue light like it's happy hour, but they refuse to land on the sticky trap.\"", "\"They are literally flying 15-20 inches from this and ignore it.\""]}, {"label": "Homemade ACV Beats Electric Traps", "reason": "Users consistently test the electric traps against cups of apple cider vinegar (ACV) and find the homemade lure wildly more effective.", "pct": "82.4%", "bullets": ["ACV traps catch dozens of flies in hours, while electric traps catch 1-2 flies over weeks.", "Many users actively apply ACV directly onto the electric sticky pads to force them to work.", "The comparison makes customers deeply regret the high price of the electric unit."], "quotes": ["\"Caught more flies in the open bottle of apple cider vinegar than on the sticky pad.\"", "\"After 3 days the trap caught 1 fruit fly, apple cider vinegar in a jar caught over 10.\"", "\"You can catch more fruit flies with vinegar than you can with ZEVO traps.\""]}, {"label": "Hardware Failure & Burnout", "reason": "A massive volume of reports indicate that the UV lights burn out or the fan motors die completely within a few months of use.", "pct": "67.8%", "bullets": ["Many units die around the 3 to 6-month mark, angering users who expected years of use.", "Some users note the lights slowly dim or change color over time, losing effectiveness.", "FVOAI fan traps specifically suffer from motor death or cord issues after being idle."], "quotes": ["\"This is the second one I've bought that has burned out within about 3 months. Doesn't seem like the light is replaceable.\"", "\"I bought the 2-pack and they worked great but one won't even power on anymore after less than two months of use.\"", "\"Almost a year later and the fan has stopped working.\""]}, {"label": "Dressed-up Fly Paper Gimmick", "reason": "Customers realize the device relies entirely on the sticky pad, making it no better than a standard hanging fly ribbon.", "pct": "59.2%", "bullets": ["Users feel they paid a premium for a piece of plastic housing cheap adhesive.", "Bugs that get caught are perceived as landing there 'by accident' rather than being lured.", "Standard ceiling fly ribbons catch significantly more insects in side-by-side tests."], "quotes": ["\"If a bug gets caught in the device, it's totally random. Behind the nice looking cover, it's just a sheet of sticky paper.\"", "\"Just a fancy fly tape with blue light and a plastic part that covers up from view any flies trapped.\"", "\"I am finding the cheaper sticky ribbons more effective.\""]}, {"label": "Placement & Outlet Limitations", "reason": "Plug-in traps require an outlet, which often dictates placement far away from the actual source of the fruit flies.", "pct": "46.5%", "bullets": ["Sinks, fruit bowls, and trash cans rarely have convenient, low-level outlets nearby.", "Plug-in units (like Zevo) are bulky and block the second outlet or clutter small kitchen counters.", "Users complain the trap only works if your infestation happens to be near a wall socket."], "quotes": ["\"This one only works if the main source of your fruit flys is near an outlet.\"", "\"It takes up a lot of space around the plug. I had to rearrange the items on my kitchen counter.\"", "\"Unit is plug in and thus might not be movable closer to where bugs might appear.\""]}, {"label": "Ineffective on House Flies", "reason": "Customers trying to catch larger house flies find the electric traps completely useless.", "pct": "38.1%", "bullets": ["House flies ignore the light entirely and are rarely caught on the sticky pads.", "The marketing visuals suggest a catch-all solution, leading to disappointment.", "Users with door-draft fly issues specifically report a zero percent catch rate."], "quotes": ["\"It didn't catch a single house fly.\"", "\"It catches Nats but not flies. Have the flies from outside that come in my rv door.\"", "\"It did not get any on the black houseflies, just a very small amount of fruit flies.\""]}, {"label": "FVOAI Fan Weakness & Noise", "reason": "Fan-based suction traps are criticized for being noisy, having weak drafts, and failing to kill the bugs they catch.", "pct": "33.6%", "bullets": ["The fan noise is described as louder than a vacuum, vibrating disruptively after a few months.", "Gnats and flies can easily fly through the weak draft or walk right out of the device.", "Bugs remain alive inside, flying away immediately when the user opens the trap to clean it."], "quotes": ["\"This is NOT quiet. It's louder than our Roomba!\"", "\"It sucks the bugs in but they are not dead. When you open it up to replace the sticky thingy, the bugs fly out.\"", "\"Even gnats can fly through this draft. You can BARELY feel any air moving at all.\""]}, {"label": "Refill Lock-in & Quality", "reason": "Customers are irritated by expensive proprietary refills, missing items in boxes, and inferior generic cartridge replacements.", "pct": "27.4%", "bullets": ["Units frequently ship missing the promised 6 or 10 extra sticky pads.", "Replacement cartridges for Zevo are reportedly less effective when they are opaque rather than clear.", "Brands are accused of utilizing a 'razor-and-blades' model, profiting off pricey refills."], "quotes": ["\"The refills that I ordered are NOT clear and NOT very effective at all.\"", "\"My set did not come with the 6 refill cards as advertised.\"", "\"You will note that the refills are quite expensive... They make money on the refills.\""]}], "positiveTopics": [{"label": "Effective on Gnats & Small Bugs", "reason": "While failing on fruit flies, the devices successfully attract and trap fungus gnats and smaller miscellaneous flying pests.", "pct": "41.2%", "bullets": ["Plant owners report decent success catching fungus gnats around their indoor pots.", "The traps function better in dark spaces like bathrooms where gnats congregate.", "Users appreciate that it handles the 'invisible' gnats they didn't realize were present."], "quotes": ["\"It seems to be catching gnats no problem but flies aren't phased by it.\"", "\"Well, it did get some very tiny gnats I was not aware were in the house.\"", "\"It is an effective gnat catcher though.\""]}, {"label": "Strong Sticky Pad Adhesive", "reason": "The quality of the glue on the cartridges is highly rated, ensuring that anything that does land stays trapped.", "pct": "35.8%", "bullets": ["Customers note the adhesive is extremely sticky and durable.", "When bugs accidentally bump into the pad, they cannot escape.", "The adhesive quality is the only redeeming feature preventing total 1-star washouts."], "quotes": ["\"The only reason I gave 2 stars is because it's at least 'sticky.'\"", "\"It's a good adhesive insect pest pad.\"", "\"The adhesive is very sticky.\""]}, {"label": "Pleasant Nightlight Feature", "reason": "The soft blue/UV glow serves well as an ambient nightlight in kitchens and hallways.", "pct": "29.7%", "bullets": ["Users like the aesthetic glow it provides in dark rooms.", "It is considered a 'cool' and modern addition to the home decor.", "Often cited as the only functional aspect of the device."], "quotes": ["\"Night light feature works and gives off a good dark glow and it is easy to use.\"", "\"It's a fine nightlight, but when it comes to dealing with bugs, it's far from the best solution.\"", "\"Cool and modern looking, does not a thing to reduce fruit flies.\""]}, {"label": "Safe and Chemical-Free", "reason": "Parents and pet owners appreciate the lack of toxic sprays, chemical odors, or ": "B0CTQDTF1V", "title": "Package was short one", "body": "Package said it was four I only received three in the box was damaged. I want another one sent to me."}, {"r": 3, "t": "Good but misleading — The description says 2 traps and 2 REFILL cartridges however it only comes with 2 trap plug ins and 2 cartridges to put in, no refills. Little misleading. Package came torn and damaged but item itself was in tact. Size is pretty big, prefer smaller size for restrooms. Had to plug in large area spaces bc of size.", "tags": ["refill_issue", "placement_outlet"], "date": "2026-02-11", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Good but misleading", "body": "The description says 2 traps and 2 REFILL cartridges however it only comes with 2 trap plug ins and 2 cartridges to put in, no refills. Little misleading. Package came torn and damaged but item itself was in tact. Size is pretty big, prefer smaller size for restrooms. Had to plug in large area spaces bc of size."}, {"r": 3, "t": "Give it time — At first it didn’t seem to work but by the end of summer we realized it worked fairly well.", "tags": [], "date": "2026-02-11", "brand": "Zevo", "asin": "B0CTQDTF1V", "title": "Give it time", "body": "At first it didn’t seem to work but by the end of summer we realized it worked fairly well."}, {"r": 3, "t": "Missing refill parts to my Zevo unit. — The two Zevo traps arrived on time, however the two Refill Cartridges are missing from the package. Is it possible to send the two refills or must I return the Traps? B. Keller", "tags": ["refill_issue", "compared_other"], "date": "2026-02-10", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Missing refill parts to my Zevo unit.", "body": "The two Zevo traps arrived on time, however the two Refill Cartridges are missing from the package. Is it possible to send the two refills or must I return the Traps? B. Keller"}, {"r": 1, "t": "DO NOT WASTE YOUR MONEY!!!! — I bought a pair of these thinking that they would be good and attrac ‑star rating reflects an average between the first and second versions of the Zevo trap, because the two products performed very differently. First Version – No Longer Available, and Misleading The original version is no longer listed, so I can’t leave a review specifically for it. If I could, it wouldn’t get more than one star. The main reason I bought it was the claim that it also worked for mosquitoes. After using it for a year and a half, I can confirm that this was completely false. It catches plenty of other flying insects, but never mosquitoes, which made the original purchase pointless for my needs. Second Version – Accurate Description, Works Properly The updated version no longer claims to trap mosquitoes—likely removed after customer complaints. And this time, the product performs exactly as described. For the insects it lists, it works reliably, and I would normally rate this version five stars on its own. Final Rating Logic Because I can’t leave a separate review for the discontinued first version, and because the original misleading claims were the reason I bought the product in the first place, I’m forced to average the experience. I can’t give 2.5 stars, so I’m leaving 2 stars to reflect the accurate performance of the new version and the misleading marketing of the old one.", "tags": ["compared_other"], "date": "2026-01-24", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Zevo Flying Insect Traps & 2 Refill Cartridges (first and second version)", "body": "My two‑star rating reflects an average between the first and second versions of the Zevo trap, because the two products performed very differently. First Version – No Longer Available, and Misleading The original version is no longer listed, so I can’t leave a review specifically for it. If I could, it wouldn’t get more than one star. The main reason I bought it was the claim that it also worked for mosquitoes. After using it for a year and a half, I can confirm that this was completely false. It ust expected a little more courtesy and respect for things your customers spend their money on!!", "tags": ["compared_other"], "date": "2026-01-11", "brand": "Zevo", "asin": "B0CTQDTF1V", "title": "Could have been done better", "body": "The insect traps are great and work exactly as expected. The 2 stars is because Amazon put the little Zevo box in a flimsy plastic bag and then USPS smashed the whole thing flat. The box was destroyed and all the insect traps were all over the bag. Luckily none were damaged and still usable, I just expected a little more courtesy and respect for things your customers spend their money on!!"}, {"r": 2, "t": "Better Packing — The product itself is excellent. The packing of the product is awful. Probably should not put this thin box of Zevo in a plastic bag to be delivered. The box was smashed into the product. I worried that the product was not usable.", "tags": ["compared_other"], "date": "2026-01-11", "brand": "Zevo", "asin": "B0CTQDTF1V", "title": "Better Packing", "body": "The product itself is excellent. The packing of the product is awful. Probably should not put this thin box of Zevo in a plastic bag to be delivered. The box was smashed into the product. I worried that the product was not usable."}, {"r": 3, "t": "Electrical issues — Purchased approximately April 25 today each had electrical fault", "tags": [], "date": "2026-01-11", "brand": "Zevo", "asin": "B07T869RNY", "title": "Electrical issues", "body": "Purchased approximately April 25 today each had electrical fault"}, {"r": 3, "t": "worked ok — worked ok", "tags": [], "date": "2026-01-11", "brand": "Zevo", "asin": "B07T869RNY", "title": "worked ok", "body": "worked ok"}, {"r": 2, "t": "Not Impressed So Far — After about two weeks, there are about 2 fruit flies in the trap. The rest are flying around and resting on the cabinet or wall nearby.", "tags": [], "date": "2026-01-11", "brand": "Zevo", "asin": "B07T869RNY", "title": "Not Impressed So Far", "body": "After about two weeks, there are about 2 fruit flies in the trap. The rest are flying around and resting on the cabinet or wall nearby."}, {"r": 1, "t": "Sucks — Doesn't work", "tags": ["no_effect"], "date": "2026-01-11", "brand": "LFSYS", "asin": "B0D795SPZD", "title": "Sucks", "body": "Doesn't work"}, {"r": 1, "t": "Sucks — Doesn't work", "tags": ["no_effect"], "date": "2026-01-11", "brand": "LFSYS", "asin": "B0DJ2H3BRB", "title": "Sucks", "body": "Doesn't work"}, {"r": 1, "t": "NO TO ZEVO! — This product is useless. I returned it and had to take it to staples. They processed the return and I went on my way...my account was charged back because the return wasn't received??? What did staples do with it??? Now I am out 40 dollars and I'm out the worthless product. UPS is the only way to return. Don't buy zevo", "tags": ["no_effect", "compared_other"], "date": "2026-01-09", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "NO TO ZEVO!", "body": "This product is useless. I returned it and had to take it to staples. They processed the return and I went on my way...my account was charged back because the return wasn't received??? What did staples do with it??? Now I am out 40 dollars and I'm out the worthless product. UPS is the only way to return. Don't buy zevo"}, {"r": 3, "t": "Interesting device. Really like the violet light — The attraction and catch rate could be better, but I am grateful for how they fit in my needed locations in each space. Just started using them so the lifespan, durability quality and effectiveness is still in observation.", "tags": [], "date": "2026-01-08", "brand": "Zevo", "asin": "B07T869RNY", "title": "Interesting device. Really like the violet light", "body": "The attraction and catch rate could be better, but I am grateful for how they fit in my needed locations in each space. Just started using them so the lifespan, durability quality and effectiveness is still in observation."}, {"r": 3, "t": "zevo insect trap — not impressed did not work well", "tags": ["no_effect"], "date": "2026-01-07", "brand": "Zevo", "asin": "B07T869RNY", "title": "zevo insect trap", "body": "not impressed did not work well"}, {"r": 3, "t": "Works as intended not as good with a lot of fruit flies — The trap works as intended. However, we had a lot of fruit flies so the trap wasn’t quite as effective. I ended up needing to buy another trap that had apple cider and vinegar in it.", "tags": ["diy_better"], "date": "2026-01-06", "brand": "Zevo", "asin": "B07T869RNY", "title": "Works as intended not as good with a lot of fruit flies", "body": "The trap works as intended. However, we had a lot of fruit flies so the trap wasn’t quite as effective. I ended up needing to buy another trap that had apple cider and vinegar in it."}, {"r": 2, "t": "Expensive, not worth the money. — Not very effective.", "tags": [], "date": "2026-01-06", "brand": "Zevo", "asin": "B0CTQDTF1V", "title": "Expensive, not worth the money.", "body": "Not very effective."}, {"r": 3, "t": "Not sure of effectiveness — Haven’t caught any flies. The bug sticks did better", "tags": [], "date": "2026-01-05", "brand": "Zevo", "asin": "B07T869RNY", "title": "Not sure of effectiveness", "body": "Haven’t caught any flies. The bug sticks did better"}, {"r": 1, "t": "Zero effectiveness for me — I have had this in a heavy fly spot (there was some flooding) for like 2 weeks. I have filled a few fly tapes and there is still zero flies on this trap. I would have given a zero but not allowed.", "tags": [], "date": "2026-01-05", "brand": "VEYOFLY", "asin": "B0BHN2YLRR", "title": "Zero effectiveness for me", "body": "I have had this in a heavy fly spot (there was some flooding) for like 2 weeks. I have filled a few fly tapes and there is still zero flies on this trap. I would have given a zero but not allowed."}, {"r": 3, "t": "Works, Careless Packaging, A Bit Overpriced — I’ve ordered this item twice because it does the job and is much more pleasant than fly tape. 3 stars out of 5 because you’re paying for the light bulb and overall aesthetic. My 2nd delivery arrived in a large plain paper envelope; the product box was somewhat crushed and the device was cracked. The plug was rendered loose but since the bulb was not broken and the overall device still worked I didn’t want to hassle with exchanging it. So it’s an OK solution but is spendy to continually replace, plus depending on packaging, it may or may not arrive damaged.", "tags": ["flypaper_gimmick"], "date": "2026-01-04", "brand": "Zevo", "asin": "B07T869RNY", "title": "Works, Careless Packaging, A Bit Overpriced", "body": "I’ve ordered this item twice because it does the job and is much more pleasant than fly tape. 3 stars out of 5 because you’re paying for the light bulb and overall aesthetic. My 2nd delivery arrived in a large plain paper envelope; the product box was somewhat crushed and the device was cracked. The plug was rendered loose but since the bulb was not broken and the overall device still worked I didn’t want to hassle with exchanging it. So it’s an OK solution but is spendy to continually replace, plus depending on packaging, it may or may not arrive damaged."}, {"r": 2, "t": "Maybe I'm using it wrong, but... — I plugged this into my bathroom to take care of a small gnat problem. The next day, I got a letter of complaint from the gnats, saying that the blue light kept them up all night, and could they please get some fresh water? Lovely. And these weren't weird gnats, either. Just garden variety flying insects, the kind it says it will trap.", "tags": ["light_no_attract"], "date": "2026-01-04", "brand": "Zevo", "asin": "B07T869RNY", "title": "Maybe I'm using it wrong, but...", "body": "I plugged this into my bathroom to take care of a small gnat problem. The next day, I got a letter of complaint from the gnats, saying that the blue light kept them up all night, and could they please get some fresh water? Lovely. And these weren't weird gnats, either. Just garden variety flying insects, the kind it says it will trap."}, {"r": 2, "t": "DIY worked better — For fruit flies, it’s just ok. It was easily outperformed by a DIY set up of rotting fruit with a Saran Wrap cover and small poke holes. It caught some, just not enough to justify the money.", "tags": ["catches_some"], "date": "2026-01-02", "brand": "Zevo", "asin": "B07T869RNY", "title": "DIY worked better", "body": "For fruit flies, it’s just ok. It was easily outperformed by a DIY set up of rotting fruit with a Saran Wrap cover and small poke holes. It caught some, just not enough to justify the money."}, {"r": 1, "t": "Bummer — Didn't work, had to return.", "tags": ["no_effect"], "date": "2026-01-02", "brand": "FVOAI", "asin": "B0CSK83JSK", "title": "Bummer", "body": "Didn't work, had to return."}, {"r": 2, "t": "It’s ok I guess. — Has a nice blue light that probably attracts some bugs and the quality seems good, I got it for a fruit/drain fly issue. It is very sticky but wasn’t effective for the fly issues I had. It may be effective for other pests.", "tags": ["light_no_attract"], "date": "2025-12-31", "brand": "Zevo", "asin": "B07T869RNY", "title": "It’s ok I guess.", "body": "Has a nice blue light that probably attracts some bugs and the quality seems good, I got it for a fruit/drain fly issue. It is very sticky but wasn’t effective for the fly issues I had. It may be effective for other pests."}, {"r": 3, "t": "Bug be gone — Appears to be working as it should", "tags": [], "date": "2025-12-30", "brand": "Zevo", "asin": "B07T869RNY", "title": "Bug be gone", "body": "Appears to be working as it should"}, {"r": 2, "t": "Not many bugs attracted — Decent but doesn't attract many bugs", "tags": [], "date": "2025-12-27", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Not many bugs attracted", "body": "Decent but doesn't attract many bugs"}, {"r": 3, "t": "Small bugs but NOT flies — works really well for small gnats and moths, but does not seem to attract larger flies well", "tags": [], "date" y are still swarming. Will it take care of them finally once and for all and, if so, how long does that take? If, when, it does, it would be a five star review."}, {"r": 1, "t": "Don’t waste your money! — I’d give it 0 Stars if possible. I’ve had one plugged in one foot from a bowl I keep onions, avocados and other various vegetables from time to time and not one single fruit fly or any other flying insect has found its way too. My roommate and I have each killed a handful during this time. We have another in my bathroom where I am constantly finding a tiny flying insect and it has also not attacked a single one in 10 days!! It is a complete waste of money!!!", "tags": ["no_effect"], "date": "2025-12-23", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Don’t waste your money!", "body": "I’d give it 0 Stars if possible. I’ve had one plugged in one foot from a bowl I keep onions, avocados and other various vegetables from time to time and not one single fruit fly or any other flying insect has found its way too. My roommate and I have each killed a handful during this time. We have another in my bathroom where I am constantly finding a tiny flying insect and it has also not attacked a single one in 10 days!! It is a complete waste of money!!!"}, {"r": 3, "t": "Not much sticks on it — Bugs really don't stick much", "tags": [], "date": "2025-12-23", "brand": "Zevo", "asin": "B07T869RNY", "title": "Not much sticks on it", "body": "Bugs really don't stick much"}, {"r": 2, "t": "It works sometimes — It does work but not always. Pricey. It depends where you place it..", "tags": [], "date": "2025-12-23", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "It works sometimes", "body": "It does work but not always. Pricey. It depends where you place it.."}, {"r": 1, "t": "Do not work — Not working not recommended buying", "tags": ["no_effect"], "date": "2025-12-23", "brand": "LFSYS", "asin": "B0D795SPZD", "title": "Do not work", "body": "Not working not recommended buying"}, {"r t so I’m trying to figure out where they are coming from because I do my dishes right away The extra star is because it does look very sleek and I like the little light that it has and it looks so much nicer than anything else on the market, but I have shifted it around to four different outlets and I have caught two fruit flies in the past couple weeks… and then I took a piece of tape and looped it around on a popsicle stick and place it in a little glass filled with maple syrup and I caught like 10 more over the past 24 hours so I’m bummed that it didn’t work", "tags": [], "date": "2025-12-19", "brand": "LFSYS", "asin": "B0DJ2H3BRB", "title": "Doesn’t seem to be very effective", "body": "I’m having an issue with fruit flies and I think it’s because I’ve been doing a lot of food prep lately and I have two dogs and leave my patio door open for them to go in and out so I’m trying to figure out where they are coming from because I do my dishes right away The extra star is because it does look very sleek and I like the little light that it has and it looks so much nicer than anything else on the market, but I have shifted it around to four different outlets and I have caught two fruit flies in the past couple weeks… and then I took a piece of tape and looped it around on a popsicle stick and place it in a little glass filled with maple syrup and I caught like 10 more over the past 24 hours so I’m bummed that it didn’t work"}, {"r": 3, "t": "Didn't even last a year. — Light didn't even last a year. I really liked this trap. It worked great through the spring, summer and fall season with all the fruit flies, flies, mosquitoes and even a couple of spiders but then the light died and now it doesn't attract the insects. It's awful pricey for barely 9 months worth of use.", "tags": ["hardware_fail"], "date": "2025-12-18", "brand": "Zevo", "asin": "B07T869RNY", "title": "Didn't even last a year.", "body": "Light didn't even last a year. I really liked this trap. It worked gre 2025-12-17", "brand": "LFSYS", "asin": "B0DJ2H3BRB", "title": "Does not work at all", "body": "I’m so mad that I wasted money on this. Does not attract and catch any flies whatsoever, even if it’s directly within inches of them."}, {"r": 3, "t": "Light flickering after couple months — After a few months both units started flickering for no reason. Not sure if it will negatively affect the ability to catch bugs now with the flicker. Previously it had worked ok with gnats but we still had mosquitoes around. The light is too bright to use in the bedroom at night which is when we would be bitten by mosquitos.", "tags": ["hardware_fail"], "date": "2025-12-16", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Light flickering after couple months", "body": "After a few months both units started flickering for no reason. Not sure if it will negatively affect the ability to catch bugs now with the flicker. Previously it had worked ok with gnats but we still had mosquitoes around. The light is too bright to use in the bedroom at night which is when we would be bitten by mosquitos."}, {"r": 3, "t": "Not impressed — Unit work good for about a day or two and then once it started to fill up it didn't work well at all, replacements are very expensive.", "tags": ["no_effect"], "date": "2025-12-16", "brand": "Zevo", "asin": "B07T869RNY", "title": "Not impressed", "body": "Unit work good for about a day or two and then once it started to fill up it didn't work well at all, replacements are very expensive."}, {"r": 3, "t": "Not worth the price paid — Although, it does attract bugs, they are few and far between. Definitely does not attract gnats as we plugged it in right by our sink where the gnat problem is and in the bathroom and made sure to turn all lights off, and still barely caught any. I am very disappointed. These traps were definitely not cheap.", "tags": ["compared_other"], "date": "2025-12-15", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Not worth the price paid", "body": "Although, it does attract bugs, they are few and far between. Definitely does not attract gnats as we plugged it in right by our sink where the gnat problem is and in the bathroom and made sure to turn all lights off, and still barely caught any. I am very disappointed. These traps were definitely not cheap."}, {"r": 3, "t": "Trying — So far so good. Ask me again in two weeks.", "tags": [], "date": "2025-12-15", "brand": "Zevo", "asin": "B07T869RNY", "title": "Trying", "body": "So far so good. Ask me again in two weeks."}, {"r": 2, "t": "Expensive glue trap — They work ok but I ended up buying a comparatively priced bug zapper that will still be working years from now.", "tags": ["catches_some"], "date": "2025-12-14", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Expensive glue trap", "body": "They work ok but I ended up buying a comparatively priced bug zapper that will still be working years from now."}, {"r": 2, "t": "Didn’t work for us — I bought this to get rid of a fly infestation in my kitchen. We could not identify the type of fly. It was tiny. It did not work AT ALL, not one attached to the Zevo. We had to vacuum the flies!", "tags": ["no_effect", "compared_other"], "date": "2025-12-14", "brand": "Zevo", "asin": "B07T869RNY", "title": "Didn’t work for us", "body": "I bought this to get rid of a fly infestation in my kitchen. We could not identify the type of fly. It was tiny. It did not work AT ALL, not one attached to the Zevo. We had to vacuum the flies!"}, {"r": 1, "t": "Don’t waste your money — These were a waste of money. They don’t work at all.", "tags": ["no_effect"], "date": "2025-12-14", "brand": "LFSYS", "asin": "B0D795SPZD", "title": "Don’t waste your money", "body": "These were a waste of money. They don’t work at all."}, {"r": 1, "t": "Don’t waste your money — These were a waste of money. They don’t work at all.", "tags": ["no_effect"], "date": "2025-12-14", "brand": "LFSYS", "asin": "B0DJ2H3BRB", "title": "Don’t waste your money", "bod  am looking for a better option."}, {"r": 1, "t": "thinking a fly swatter would have been the better purchase — bugs are dancing on top , none inside but the lights are pretty in the kitchen at 3 am . only day two . maybe word hasnt gotten out that its there .", "tags": [], "date": "2025-12-13", "brand": "FVOAI", "asin": "B0CSK83JSK", "title": "thinking a fly swatter would have been the better purchase", "body": "bugs are dancing on top , none inside but the lights are pretty in the kitchen at 3 am . only day two . maybe word hasnt gotten out that its there ."}, {"r": 1, "t": "Anser the question, Do they work. — Received on December 3 and installed, today is December 12th and they have yet to trap or catch a single fruit fly. After day 3 I got out my bowl and filled it 1/2 way with apple cider vinegar, made a cover of aluminum foil punched some small holes in the foil. Since then it has captured 17 fruit flies and the traps still have caught none. If you purchase I hope you have better luck with them than I had.", "tags": ["diy_better", "catches_some"], "date": "2025-12-12", "brand": "LFSYS", "asin": "B0D795SPZD", "title": "Anser the question, Do they work.", "body": "Received on December 3 and installed, today is December 12th and they have yet to trap or catch a single fruit fly. After day 3 I got out my bowl and filled it 1/2 way with apple cider vinegar, made a cover of aluminum foil punched some small holes in the foil. Since then it has captured 17 fruit flies and the traps still have caught none. If you purchase I hope you have better luck with them than I had."}, {"r": 1, "t": "Anser the question, Do they work. — Received on December 3 and installed, today is December 12th and they have yet to trap or catch a single fruit fly. After day 3 I got out my bowl and filled it 1/2 way with apple cider vinegar, made a cover of aluminum foil punched some small holes in the foil. Since then it has captured 17 fruit flies and the traps still have caught none. If you purchase I hope you have better luck with them than I had.", "tags": ["diy_better", "catches_some"], "date": "2025-12-12", "brand": "LFSYS", "asin": "B0DJ2H3BRB", "title": "Anser the question, Do they work.", "body": "Received on December 3 and installed, today is December 12th and they have yet to trap or catch a single fruit fly. After day 3 I got out my bowl and filled it 1/2 way with apple cider vinegar, made a cover of aluminum foil punched some small holes in the foil. Since then it has captured 17 fruit flies and the traps still have caught none. If you purchase I hope you have better luck with them than I had."}, {"r": 2, "t": "Does not work on house flies. — This device worked to catch a few gnats, and I suspect might work for fruit flies but it does not work house flies like the description says it does. I had my doubts but decided to try it out as I was dealing with a lot of flies this season and they were consistently working their way into the house. I put up two of these and left them on 24x7 and checked the sticky pads daily and never caught a single fly with them despite being in a heavy fly traffic area in the house. I don't recommend if your looking to remove flies. I think the light is a blue LED not true UV but whatever the reason it fails to do what is claims in my experience.", "tags": ["no_effect"], "date": "2025-12-12", "brand": "VEYOFLY", "asin": "B0BHN2YLRR", "title": "Does not work on house flies.", "body": "This device worked to catch a few gnats, and I suspect might work for fruit flies but it does not work house flies like the description says it does. I had my doubts but decided to try it out as I was dealing with a lot of flies this season and they were consistently working their way into the house. I put up two of these and left them on 24x7 and checked the sticky pads daily and never caught a single fly with them despite being in a heavy fly traffic area in the house. I don't recommend if your looking to remove flies. I think the light is a blue LED not true UV but whatever the reason it fails to do what is claims in my experience."}, {"r": 3, "t": "Delivery concern — Item was fine. Delivery one day late. Driver entered wrong addresses couldn’t deliver. It was just late in evening so didn’t deliver. Delivered next day with same address no problem", "tags": [], "date": "2025-12-11", "brand": "Zevo", "asin": "B0CTQDTF1V", "title": "Delivery concern", "body": "Item was fine. Delivery one day late. Driver entered wrong addresses couldn’t deliver. It was just late in evening so didn’t deliver. Delivered next day with same address no problem"}, {"r": 3, "t": "Just there, does not make a difference — Meh, does not really make a difference. IT is probably just there to keep a peace of mind for you. Also, it is so expensive to get replacement traps.", "tags": [], "date": "2025-12-11", "brand": "Zevo", "asin": "B07T869RNY", "title": "Just there, does not make a difference", "body": "Meh, does not really make a difference. IT is probably just there to keep a peace of mind for you. Also, it is so expensive to get replacement traps."}, {"r": 3, "t": "Great item… damage from cheap poorly packaging — Excellent item… poor packaging caused insert to be unusable.", "tags": [], "date": "2025-12-11", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Great item… damage from cheap poorly packaging", "body": "Excellent item… poor packaging caused insert to be unusable."}, {"r": 1, "t": "Quality — Highly disappointed really want my money back", "tags": [], "date": "2025-12-11", "brand": "LFSYS", "asin": "B0D795SPZD", "title": "Quality", "body": "Highly disappointed really want my money back"}, {"r": 1, "t": "Quality — Highly disappointed really want my money back", "tags": [], "date": "2025-12-11", "brand": "LFSYS", "asin": "B0DJ2H3BRB", "title": "Quality", "body": "Highly disappointed really want my money back"}, {"r": 1, "t": "Do not recommend — Has not worked at all. It’s not attracting or catching anything. Do not r y bedroom. Nothing more annoying than when youre watching TV and some little dope flies right in front of your face :( . I think theres better options out there for sure."}, {"r": 3, "t": "Does not work for catching nats — Seems to catch flies and other bugs but not nats .", "tags": [], "date": "2025-12-09", "brand": "Zevo", "asin": "B07T869RNY", "title": "Does not work for catching nats", "body": "Seems to catch flies and other bugs but not nats ."}, {"r": 3, "t": "healthy Tomatoes — it does work but takes longer than I thought", "tags": [], "date": "2025-12-09", "brand": "BugMD", "asin": "B0D38CSTX3", "title": "healthy Tomatoes", "body": "it does work but takes longer than I thought"}, {"r": 2, "t": "box was opened previously and missing a refill — great product but my box only had 3 refills inside instead of 4. The last thing I need to do during the holidays is return an item, because the box had already been opened by someone else.", "tags": [], "date": "2025-12-08", "brand": "Zevo", "asin": "B0CTQDTF1V", "title": "box was opened previously and missing a refill", "body": "great product but my box only had 3 refills inside instead of 4. The last thing I need to do during the holidays is return an item, because the box had already been opened by someone else."}, {"r": 3, "t": "less expensive but not as effective as Zevo — Veyofly catches about half as many flys as Zevo when placed adjacent to each other.", "tags": ["compared_other"], "date": "2025-12-07", "brand": "VEYOFLY", "asin": "B0BHN2YLRR", "title": "less expensive but not as effective as Zevo", "body": "Veyofly catches about half as many flys as Zevo when placed adjacent to each other."}, {"r": 2, "t": "Don’t last long — These seem nice but don’t last long. After 4 months mine burnt out and burned my outlets. And two others are just blinking randomly. Do not recommend at all!!", "tags": ["hardware_fail"], "date": "2025-12-07", "brand": "BugMD", "asin": "B0D38CSTX3", "title": "Don’t last long", "body": "Thes
