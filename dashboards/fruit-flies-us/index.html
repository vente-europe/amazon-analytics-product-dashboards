04-03", "brand": "BugMD", "asin": "B0D38CSTX3", "title": "Not as good as VeyoFly brand (see pics)", "body": "Spring house plants brought gnats.These help a little.This brand did not do as well as the competition (VeyoFly).  See the photos showing way more bugs on the other brand.These two were side by side on the same 3 foot long power strip under a desk.I bought both brands because I want sure which works work better."}, {"r": 5, "t": "Catches gnats at night! — This product does work well on gnats . . . However, it only works at night. I suppose it would work with blackout curtains as well. The gnats are attracted to the light, but the light isn’t strong enough to be seen with sunlight pouring in from windows. I had a gnat problem for about a week, and these did take care of it (along with spraying peroxide in my potted plants) after a few days. If you have lots of gnats the sticky traps will fill up fast so be sure to get plenty of refills.", "tags": [], "date": "2026-03-29", "brand": "VEYOFLY", "asin": "B0BHN2YLRR", "title": "Catches gnats at night!", "body": "This product does work well on gnats . . . However, it only works at night. I suppose it would work with blackout curtains as well. The gnats are attracted to the light, but the light isn’t strong enough to be seen with sunlight pouring in from windows. I had a gnat problem for about a week, and these did take care of it (along with spraying peroxide in my potted plants) after a few days. If you have lots of gnats the sticky traps will fill up fast so be sure to get plenty of refills."}, {"r": 5, "t": "5 stars — This flat trap indoor suction system works really well. It was easy to set up and is very slim, so it doesn’t take up much space or stand out. I like that it’s clean and mess-free compared to other options I’ve tried.It does exactly what it’s supposed to do and has been very effective so far. Definitely a great purchase if you’re looking for something simple and reliable for indoor use.", "tags": ["compared_other"], "date": "2026-03-17", "brand": "FVOAI", "asin": "B0CSK83JSK", "title": "5 stars", "body": "This flat trap indoor suction system works really well. It was easy to set up and is very slim, so it doesn’t take up much space or stand out. I like that it’s clean and mess-free compared to other options I’ve tried.It does exactly what it’s supposed to do and has been very effective so far. Definitely a great purchase if you’re looking for something simple and reliable for indoor use."}, {"r": 1, "t": "Broke after 30 days — After 30 days trap made a loud noise and stopped working. Of course it was past the return date.", "tags": ["hardware_fail", "noise"], "date": "2026-02-17", "brand": "FVOAI", "asin": "B0CSK83JSK", "title": "Broke after 30 days", "body": "After 30 days trap made a loud noise and stopped working. Of course it was past the return date."}, {"r": 1, "t": "Useless — Completely useless. I set it up on the most infested area of the kitchen. Left it there for two weeks. Checked the trap, only one fly on the sticky stuff. One!!! Back to my own homemade waaay cheaper traps of apple cider vinegar and a drop of dish soap. The flies love it! Don't waste your money on this.", "tags": ["no_effect", "diy_better", "compared_other"], "date": "2026-02-16", "brand": "Zevo", "asin": "B07T869RNY", "title": "Useless", "body": "Completely useless. I set it up on the most infested area of the kitchen. Left it there for two weeks. Checked the trap, only one fly on the sticky stuff. One!!! Back to my own homemade waaay cheaper traps of apple cider vinegar and a drop of dish soap. The flies love it! Don't waste your money on this."}, {"r": 1, "t": "does not work. and refused refund — these no longer work. something has changed. they worked great for a couple years now. Now they no longer do what they once did", "tags": [], "date": "2026-02-16", "brand": "Zevo", "asin": "B0CTQDTF1V", "title": "does not work. and refused refund", "body": "these no longer work. something has changed. they worked great for a couple years now. Now they no longer do what they once did"}, {"r": 1, "t": "Disappointing. — I have not found veyofly trap to be effective at all.i am finding the cheaper sticky ribbons more effective.", "tags": ["compared_other"], "date": "2026-02-16", "brand": "VEYOFLY", "asin": "B0BHN2YLRR", "title": "Disappointing.", "body": "I have not found veyofly trap to be effective at all.i am finding the cheaper sticky ribbons more effective."}, {"r": 3, "t": "Not 100% effective- probably 50-60% for fruitflies. — Though I have a whole bunch of fruitflies near my kitchen sink where the device is. It caught only some of them.", "tags": [], "date": "2026-02-15", "brand": "Zevo", "asin": "B07T869RNY", "title": "Not 100% effective- probably 50-60% for fruitflies.", "body": "Though I have a whole bunch of fruitflies near my kitchen sink where the device is. It caught only some of them."}, {"r": 5, "t": "Works Amazingly Well! Bye‑Bye Fruit Flies — I’m genuinely impressed with this indoor fly trap. I bought it because fruit flies were driving me crazy, and within the first day I could already see results. The suction is stronger than I expected, and the built‑in light really helps attract the bugs. I also love the time setting feature it’s convenient to let it run automatically without thinking about it.The 10 sticky glue boards are a great bonus and super easy to replace. The blue color looks nice and blends in well with my home. Overall, this trap is quiet, effective, and hassle‑free. If you’re dealing with fruit flies or tiny indoor pests, this is absolutely worth it. Highly recommended!", "tags": [], "date": "2026-02-14", "brand": "FVOAI", "asin": "B0CSK83JSK", "title": "Works Amazingly Well! Bye‑Bye Fruit Flies", "body": "I’m genuinely impressed with this indoor fly trap. I bought it because fruit flies were driving me crazy, and within the first day I could already see results. The suction is stronger than I expected, and the built‑in light really helps attract the bugs. I also love the time setting feature it’s convenient to let it run automatically without thinking about it.The 10 sticky glue boards are a great bonus and super easy to replace. The blue color looks nice and blends in well with my home. Overall, this trap is quiet, effective, and hassle‑free. If you’re dealing with fruit flies or tiny indoor pests, this is absolutely worth it. Highly recommended!"}, {"r": 3, "t": "Good Product/Damaged Box — Packaging was damaged.", "tags": [], "date": "2026-02-13", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Good Product/Damaged Box", "body": "Packaging was damaged."}, {"r": 1, "t": "Package was short one — Package said it was four I only received three in the box was damaged. I want another one sent to me.", "tags": [], "date": "2026-02-12", "brand": "Zevo", "asin": "B0CTQDTF1V", "title": "Package was short one", "body": "Package said it was four I only received three in the box was damaged. I want another one sent to me."}, {"r": 3, "t": "Good but misleading — The description says 2 traps and 2 REFILL cartridges however it only comes with 2 trap plug ins and 2 cartridges to put in, no refills. Little misleading. Package came torn and damaged but item itself was in tact. Size is pretty big, prefer smaller size for restrooms. Had to plug in large area spaces bc of size.", "tags": ["refill_issue", "placement_outlet"], "date": "2026-02-11", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Good but misleading", "body": "The description says 2 traps and 2 REFILL cartridges however it only comes with 2 trap plug ins and 2 cartridges to put in, no refills. Little misleading. Package came torn and damaged but item itself was in tact. Size is pretty big, prefer smaller size for restrooms. Had to plug in large area spaces bc of size."}, {"r": 3, "t": "Give it time — At first it didn’t seem to work but by the end of summer we realized it worked fairly well.", "tags": [], "date": "2026-02-11", "brand": "Zevo", "asin": "B0CTQDTF1V", "title": "Give it time", "body": "At first it didn’t seem to work but by the end of summer we realized it worked fairly well."}, {"r": 3, "t": "Missing refill parts to my Zevo unit. — The two Zevo traps arrived on time, however the two Refill Cartridges are missing from the package. Is it possible to send the two refills or must I return the Traps? B. Keller", "tags": ["refill_issue", "compared_other"], "date": "2026-02-10", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Missing refill parts to my Zevo unit.", "body": "The two Zevo traps arrived on time, however the two Refill Cartridges are missing from the package. Is it possible to send the two refills or must I return the Traps? B. Keller"}, {"r": 1, "t": "DO NOT WASTE YOUR MONEY!!!! — I bought a pair of these thinking that they would be good and attract gnats instead didn’t attract anything total waste of money", "tags": ["no_effect"], "date": "2026-02-10", "brand": "LFSYS", "asin": "B0D795SPZD", "title": "DO NOT WASTE YOUR MONEY!!!!", "body": "I bought a pair of these thinking that they would be good and attract gnats instead didn’t attract anything total waste of money"}, {"r": 1, "t": "What are you really paying for/ getting? — It’s not exactly what it represents is in the box, at least the one I got. Now my box had been torn open, so I may be wrong. Yes there was 2 traps, but no pads were in them, so the 2 “refill pads” actually should be a part of the traps, so no refill pads are part of the package!", "tags": ["refill_issue"], "date": "2026-02-10", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "What are you really paying for/ getting?", "body": "It’s not exactly what it represents is in the box, at least the one I got. Now my box had been torn open, so I may be wrong. Yes there was 2 traps, but no pads were in them, so the 2 “refill pads” actually should be a part of the traps, so no refill pads are part of the package!"}, {"r": 2, "t": "Did not help with my fly problem — I bought this hoping to solve a problem with houseflies. Our place is full of them and I don't know where they are coming from. I have searched and could not find a place where they might be breeding. I didn't rely on just Amazon reviews to buy this. It has reviews all over the net saying that it worked well for the kind of problem I have. When I received this I read the instructions and put it up in an area that is full of flies. It has been up for a couple of weeks and has only caught maybe half a dozen flies. There are still tons of flies zooming around in here doing what flies do. They buzz my face, attack my eyes and mouth, land on my ears and sit there buzzing. I'm still trying to find the source where they are coming from but this product isn't helping. It said it would help me combat houseflies but the flies aren't interested in it. The blue light was supposed to attract them. I don't think it does. I don't know if it works for other flying insects but it does not help with houseflies. I saw reviews that made it seem like a near miracle worker. It is not. Do your research and look beyond review sites before you buy this product.", "tags": ["light_no_attract", "noise"], "date": "2026-02-10", "brand": "Zevo", "asin": "B07T869RNY", "title": "Did not help with my fly problem", "body": "I bought this hoping to solve a problem with houseflies. Our place is full of them and I don't know where they are coming from. I have searched and could not find a place where they might be breeding. I didn't rely on just Amazon reviews to buy this. It has reviews all over the net saying that it worked well for the kind of problem I have. When I received this I read the instructions and put it up in an area that is full of flies. It has been up for a couple of weeks and has only caught maybe half a dozen flies. There are still tons of flies zooming around in here doing what flies do. They buzz my face, attack my eyes and mouth, land on my ears and sit there buzzing. I'm still trying to find the source where they are coming from but this product isn't helping. It said it would help me combat houseflies but the flies aren't interested in it. The blue light was supposed to attract them. I don't think it does. I don't know if it works for other flying insects but it does not help with houseflies. I saw reviews that made it seem like a near miracle worker. It is not. Do your research and look beyond review sites before you buy this product."}, {"r": 1, "t": "DO NOT WASTE YOUR MONEY!!!! — I bought a pair of these thinking that they would be good and attract gnats instead didn’t attract anything total waste of money", "tags": ["no_effect"], "date": "2026-02-10", "brand": "LFSYS", "asin": "B0DJ2H3BRB", "title": "DO NOT WASTE YOUR MONEY!!!!", "body": "I bought a pair of these thinking that they would be good and attract gnats instead didn’t attract anything total waste of money"}, {"r": 1, "t": "….. at least the light is pretty?? — They make great night lights for children, but that wasn’t what I bought them for 🫠 Not a single fly was caught, these did not work for me at all.", "tags": ["no_effect"], "date": "2026-02-09", "brand": "LFSYS", "asin": "B0D795SPZD", "title": "….. at least the light is pretty??", "body": "They make great night lights for children, but that wasn’t what I bought them for 🫠 Not a single fly was caught, these did not work for me at all."}, {"r": 1, "t": "….. at least the light is pretty?? — They make great night lights for children, but that wasn’t what I bought them for 🫠 Not a single fly was caught, these did not work for me at all.", "tags": ["no_effect"], "date": "2026-02-09", "brand": "LFSYS", "asin": "B0DJ2H3BRB", "title": "….. at least the light is pretty??", "body": "They make great night lights for children, but that wasn’t what I bought them for 🫠 Not a single fly was caught, these did not work for me at all."}, {"r": 2, "t": "Bugs just laugh as they fly by — Bought this to control fruit flies in my kitchen. Use e the experience. I can’t give 2.5 stars, so I’m leaving 2 stars to reflect the accurate performance of the new version and the misleading marketing of the old one.", "tags": ["compared_other"], "date": "2026-01-24", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "Zevo Flying Insect Traps & 2 Refill Cartridges (first and second version)", "body": "My two‑star rating reflects an average between the first and second versions of the Zevo trap, because the two products performed very differently. First Version – No Longer Available, and Misleading The original version is no longer listed, so I can’t leave a review specifically for it. If I could, it wouldn’t get more than one star. The main reason I bought it was the claim that it also worked for mosquitoes. After using it for a year and a half, I can confirm that this was completely false. It catches plenty of other flying insects, but never mosquitoes, which made the original purchase pointless for my needs. Second Version – Accurate Description, Works Properly The updated version no longer claims to trap mosquitoes—likely removed after customer complaints. And this time, the product performs exactly as described. For the insects it lists, it works reliably, and I would normally rate this version five stars on its own. Final Rating Logic Because I can’t leave a separate review for the discontinued first version, and because the original misleading claims were the reason I bought the product in the first place, I’m forced to average the experience. I can’t give 2.5 stars, so I’m leaving 2 stars to reflect the accurate performance of the new version and the misleading marketing of the old one."}, {"r": 3, "t": "It’s alright… — It does its job but it might take a while to accumulate flies. I bought this in the summer when I had lots of fruit flies at home. After installation over the 3-4 days it only accumulated few flies so I had to buy apple traps and those are way more effective, killed a bunch in first 24hr. This th stic bag to be delivered. The box was smashed into the product. I worried that the product was not usable."}, {"r": 3, "t": "Electrical issues — Purchased approximately April 25 today each had electrical fault", "tags": [], "date": "2026-01-11", "brand": "Zevo", "asin": "B07T869RNY", "title": "Electrical issues", "body": "Purchased approximately April 25 today each had electrical fault"}, {"r": 3, "t": "worked ok — worked ok", "tags": [], "date": "2026-01-11", "brand": "Zevo", "asin": "B07T869RNY", "title": "worked ok", "body": "worked ok"}, {"r": 2, "t": "Not Impressed So Far — After about two weeks, there are about 2 fruit flies in the trap. The rest are flying around and resting on the cabinet or wall nearby.", "tags": [], "date": "2026-01-11", "brand": "Zevo", "asin": "B07T869RNY", "title": "Not Impressed So Far", "body": "After about two weeks, there are about 2 fruit flies in the trap. The rest are flying around and resting on the cabinet or wall nearby."}, {"r": 1, "t": "Sucks — Doesn't work", "tags": ["no_effect"], "date": "2026-01-11", "brand": "LFSYS", "asin": "B0D795SPZD", "title": "Sucks", "body": "Doesn't work"}, {"r": 1, "t": "Sucks — Doesn't work", "tags": ["no_effect"], "date": "2026-01-11", "brand": "LFSYS", "asin": "B0DJ2H3BRB", "title": "Sucks", "body": "Doesn't work"}, {"r": 1, "t": "NO TO ZEVO! — This product is useless. I returned it and had to take it to staples. They processed the return and I went on my way...my account was charged back because the return wasn't received??? What did staples do with it??? Now I am out 40 dollars and I'm out the worthless product. UPS is the only way to return. Don't buy zevo", "tags": ["no_effect", "compared_other"], "date": "2026-01-09", "brand": "Zevo", "asin": "B0C3PDTYYX", "title": "NO TO ZEVO!", "body": "This product is useless. I returned it and had to take it to staples. They processed the return and I went on my way...my account was charged back because the return wasn't received??? What did staples do with it??? Now I am out 40 dollars and I'm out the worthless product. UPS is the only way to return. Don't buy zevo"}, {"r": 3, "t": "Interesting device. Really like the violet light — The attraction and catch rate could be better, but I am grateful for how they fit in my needed locations in each space. Just started using them so the lifespan, durability quality and effectiveness is still in observation.", "tags": [], "date": "2026-01-08", "brand": "Zevo", "asin": "B07T869RNY", "title": "Interesting device. Really like the violet light", "body": "The attraction and catch rate could be better, but I am grateful for how they fit in my needed locations in each space. Just started using them so the lifespan, durability quality and effectiveness is still in observation."}, {"r": 3, "t": "zevo insect trap — not impressed did not work well", "tags": ["no_effect"], "date": "2026-01-07", "brand": "Zevo", "asin": "B07T869RNY", "title": "zevo insect trap", "body": "not impressed did not work well"}, {"r": 3, "t": "Works as intended not as good with a lot of fruit flies — The trap works as intended. However, we had a lot of fruit flies so the trap wasn’t quite as effective. I ended up needing to buy another trap that had apple cider and vinegar in it.", "tags": ["diy_better"], "date": "2026-01-06", "brand": "Zevo", "asin": "B07T869RNY", "title": "Works as intended not as good with a lot of fruit flies", "body": "The trap works as intended. However, we had a lot of fruit flies so the trap wasn’t quite as effective. I ended up needing to buy another trap that had apple cider and vinegar in it."}, {"r": 2, "t": "Expensive, not worth the money. — Not very effective.", "tags": [], "date": "2026-01-06", "brand": "Zevo", "asin": "B0CTQDTF1V", "title": "Expensive, not worth the money.", "body": "Not very effective."}, {"r": 3, "t": "Not sure of effectiveness — Haven’t caught any flies. The bug sticks did better", "tags": [], "date": "2026-01-05", "brand": "Zevo", "asin": "B07T869RNY", "title": "Not sure of effectiveness", "body": "Haven’t caught any flies. The bug sticks did better"}, {"r": 1, "t": "Zero effectiveness for me — I have had this in a heavy fly spot (there was some flooding) for like 2 weeks. I have filled a few fly tapes and there is still zero flies on this trap. I would have given a zero but not allowed.", "tags": [], "date": "2026-01-05", "brand": "VEYOFLY", "asin": "B0BHN2YLRR", "title": "Zero effectiveness for me", "body": "I have had this in a heavy fly spot (there was some flooding) for like 2 weeks. I have filled a few fly tapes and there is still zero flies on this trap. I would have given a zero but not allowed."}, {"r": 3, "t": "Works, Careless Packaging, A Bit Overpriced — I’ve ordered this item twice because it does the job and is much more pleasant than fly tape. 3 stars out of 5 because you’re paying for the light bulb and overall aesthetic. My 2nd delivery arrived in a large plain paper envelope; the product box was somewhat crushed and the device was cracked. The plug was rendered loose but since the bulb was not broken and the overall device still worked I didn’t want to hassle with exchanging it. So it’s an OK solution but is spendy to continually replace, plus depending on packaging, it may or may not arrive damaged.", "tags": ["flypaper_gimmick"], "date": "2026-01-04", "brand": "Zevo", "asin": "B07T869RNY", "title": "Works, Careless Packaging, A Bit Overpriced", "body": "I’ve ordered this item twice because it does the job and is much more pleasant than fly tape. 3 stars out of 5 because you’re paying for the light bulb and overall aesthetic. My 2nd delivery arrived in a large plain paper envelope; the product box was somewhat crushed and the device was cracked. The plug was rendered loose but since the bulb was not broken and the overall device still worked I didn’t want to hassle with exchanging it. So it’s an OK solution but is spendy to continually replace, plus depending on packaging, it may or may not arrive damaged."}, {"r": 2, "t": "Maybe I'm using it wrong, but... — I plugged this into my bathroom to take care of a small gnat problem. The next day, I got a letter of complaint from the gnats, saying that the blue light kept them up all night, and could they please get some fresh water? Lovely. And these weren't weird gnats, either. Just garden variety flying insects, the kind it says it will trap.", "tags": ["light_no_attract"], "date": "2026-01-04", "brand": "Zevo", "asin": "B07T869RNY", "title": "Maybe I'm using it wrong, but...", "body": "I plugged this into my bathroom to take care of a small gnat problem. The next day, I got a letter of complaint from the gnats, saying that the blue light kept them up all night, and could they please get some fresh water? Lovely. And these weren't weird gnats, either. Just garden variety flying insects, the kind it says it will trap."}, {"r": 2, "t": "DIY worked better — For fruit flies, it’s just ok. It was easily outperformed by a DIY set up of rotting fruit with a Saran Wrap cover and small poke holes. It caught some, just not enough to justify the money.", "tags": ["catches_some"], "date": "2026-01-02", "brand": "Zevo", "asin": "B07T869RNY", "title": "DIY worked better", "body": "For fruit flies, it’s just ok. It was easily outperformed by a DIY set up of rotting fruit with a Saran Wrap cover and small poke holes. It caught some, just not enough to justify the money."}, {"r": 1, "t": "Bummer — Didn't work, had to return.", "tags": ["no_effect"], "date": "2026-01-02", "brand": "FVOAI", "asin": "B0CSK83JSK", "title": "Bummer", "body": "Didn't work, had to return."}, {"r": 2, "t": "It’s ok I guess. — Has a nice blue light that probably attracts some bugs and the quality seems good, I got it for a fruit/drain fly issue. It is very sticky but wasn’t effective for the fly issues I had. It may be effective for other pests.", "tags": ["light_no_attract"], "date": "2025-12-31", "brand": "Zevo", "asin": "B07T869RNY", "title": "It’ "Super Ninja", "asin": "B0D5DJ7V4P"}, {"title": "Effective, safe way to curb fruit fly pests", "body": "These fruit fly traps are easy to set up and start catching gnats almost immediately, thanks to the sweet scent of the bait. I like that they use essential oils and are safe to use around my kitchen, and the small design blends in near the fruit bowl. They don't trap every last fly, but they noticeably reduce the population over the span of a couple of days. The traps dry out and need replacing every few weeks, yet they offer a convenient, non toxic way to keep pesky flies at bay.", "rating": 4, "date": "2026-04-08", "brand": "Raid", "asin": "B09GDHSW99"}, {"title": "Did a wonderful job", "body": "Every year we get flies, fruit flies etc., then I spend all spring, summer & fall doing battle with them. We live in the country every time the door opens another sneaks in. Stem is amazing, last year I bought a few got the problem under control & then just kept one on a high cabinet in the kitchen by the backdoor & one near the front door. It's all I needed for any \"strays\". This year I'm ready it's starting to warm up here & I'll set one in kitchen & have an extra ready. I don't  worry about my pets getting sick or poisoned, it's up high. Easy to use & worth the price.", "rating": 5, "date": "2026-04-01", "brand": "STEM", "asin": "B09GD8T863"}, {"title": "Could be a better design", "body": "Didn’t see a difference and I wouldn’t use if you have cats or a curious dog or pet they will just knock it over", "rating": 3, "date": "2026-01-25", "brand": "HOT SHOT", "asin": "B0DGWQV8GK"}], "multi_species": [{"title": "Costs more than apple cider vinegar but doesn’t smell", "body": "A must have for summer. I used to use apple cider vinegar and dawn which is cheap and effective but the smell! I use this every summer because inevitably if I buy fruit the gnats gather. This does an amazing job. Between this and the Zevo flying insect trap, my place has been bug free.", "rating": 5, "date": "2026-05-25", "brand": "Terro", "asin": "B01MRHXM0I"}, {"title": "If you hate gnats grab this", "body": "I’m so glad I found this product. Living in the south we have a lot of issues with gnats. This product is not only safe for our family and children, but this attracts the gnats and then catches them inside the bottle. You just shake it up and peel off the protective adhesive leave the lid open and let it work. We’ve tried the other brands, but this is the best value for the money. It’s simple easy to use.We’ve been using these for over a year and won’t use any other brand. And if you wanna dress it up, just take some of your favorite self adhesive wallpaper lol if you want something that’s effective and works this is your best bang for the buck. Well, it’s nothing to look at it really is effective.", "rating": 5, "date": "2026-05-20", "brand": "Aunt Fannie's", "asin": "B07VYPGHFW"}, {"title": "Effective, safe way to curb fruit fly pests", "body": "These fruit fly traps are easy to set up and start catching gnats almost immediately, thanks to the sweet scent of the bait. I like that they use essential oils and are safe to use around my kitchen, and the small design blends in near the fruit bowl. They don't trap every last fly, but they noticeably reduce the population over the span of a couple of days. The traps dry out and need replacing every few weeks, yet they offer a convenient, non toxic way to keep pesky flies at bay.", "rating": 4, "date": "2026-04-08", "brand": "Raid", "asin": "B09GDHSW99"}, {"title": "Works Great", "body": "If you have the little red apples but just don't have anymore fruit fly juice left,this is the perfect product. Since using this I have been able to trap and kill lots of gnats. 1 bottle fills 2 apples which is a great deal so you're actually getting 24 uses out of this product which is a excellent deal.", "rating": 5, "date": "2026-04-06", "brand": "Qualirey", "asin": "B0CXXC99TZ"}, {"title": "Doesn't work for \"fungus flies\" - tiny black fliers...", "body": "Two weeks of use, ZERO dead gnats. If you have fungus flies / gnats, this product won't help. Fruit flies seem to be attracted to the Apple cider vinegar and soap concoction, but overall not impressed for use against \"fungus flies\" (*aka tiny black flying bugs that buzz randomly around your face...). Would not recommend for this type of invasion. Next step will be throwing away all the house plants and starting over.", "rating": 1, "date": "2026-02-07", "brand": "Terro", "asin": "B01MRHXM0I"}, {"title": "Didn’t work for me", "body": "I haven’t caught not one gnat or fly I placed it on my kitchen sink counter around my plants! I have a zevo and sticky traps that work. Every thing catching them except for the punch I even sat it in the pot of one of my plants and still didn’t catch not one gnats", "rating": 1, "date": "2026-02-07", "brand": "Aunt Fannie's", "asin": "B07VYPGHFW"}, {"title": "Does not work _ do not waste your money!", "body": "Would Rate a zero if I could. Do not waste money on this product. Does not work. Did not catch a single gnat I installed zevo plug in insect traps instead and very quickly have captured thousands ofgnats around around my home. Apparently this Terro product is not returnable or refundable.", "rating": 1, "date": "2026-02-06", "brand": "Terro", "asin": "B01MRHXM0I"}, {"title": "Not very effective!!!", "body": "So it definitely attracts the gnats but it kills barely any of them. I made a home made gnat trap and that worked way better than these. They will fly on top but they won’t go in it. These killed maybe 2 or 3 of the gnats while my homemade one killed almost all of the ones that started coming into my kitchen. The liquid is basically apple cider vinegar and something else? To be honest just make your own! Apple cider vinegar, dish soap, water, and sugar. Works way way way better than this ever will!", "rating": 2, "date": "2026-01-30", "brand": "Terro", "asin": "B01MRHXM0I"}, {"title": "Doesn’t work for me", "body": "This did not work at my house. I have had it out for 4 days. The gnats or fruit flies are still on the ceiling. Maybe it works for small areas? I have an open concept with 12 foot ceilings. I wish it worked as great as the Terro ant traps.", "rating": 2, "date": "2026-01-25", "brand": "Terro", "asin": "B01MRHXM0I"}, {"title": "it works!!", "body": "Update: after just an 1hr of having it ..it has a bunch of dead gnats!! Smell still strong though. Previous review: It does attract the gnats to the rim but geez does it have a very strong apple cider vinegar smell immediately once opened. I hope it works, because I've noticed some gnats in bathroom and kitchen and they're annoying", "rating": 3, "date": "2026-01-21", "brand": "STEM", "asin": "B09GD8T863"}, {"title": "Did NOT WORK", "body": "These did not work. Caught 2 gnats over 3 months of trying. Wish Icould return!", "rating": 1, "date": "2026-01-17", "brand": "Terro", "asin": "B01MRHXM0I"}]}}, "Electric Traps": {"segmentName": "Electric Traps", "totalReviews": 1264, "avgRating": 2.03, "needs": [{"id": "uv_attracts", "name": "UV Light Actually Attracts Fruit Flies", "pct": 96.5, "reason": "Customers firmly expect the blue/UV light to act as an irresistible beacon for fruit flies, as marketed.", "keywords": ["blue light", "uv", "light doesn", "doesn't attract", "no flies", "light dont"]}, {"id": "outperforms_homemade", "name": "Outperforms Homemade Traps", "pct": 88.2, "reason": "Buyers expect a $30+ technological device to catch significantly more insects than a free cup of vinegar.", "keywords": ["homemade", "apple cider", "vinegar", "cup", "dish soap", "jar"]}, {"id": "hardware_durability", "name": "Long-Term Hardware Durability", "pct": 74.1, "reason": "Users expect a simple LED and plug mechanism to last for years, not burn out in three months.", "keywords": ["burn out", "died", "broke", "stopped working", "months", "year", "durab"]}, {"id": "bugs_dead", "name": "Trapped Bugs Are Dead", "pct": 66.8, "reason": "Specifically for fan traps, users expect bugs to die inside, not fly out into their face upon opening.", "keywords": ["fly out", "alive", "escaped", "still buzzing", "come back out"]}, {"id": "refills_affordable", "name": "Refills Included and Affordable", "pct": 59.3, "reason": "Customers expect the box to contain the advertised refills and for future cartridges to be cheap.", "keywords": ["refill", "cartridge", "expensive", "subscription"]}, {"id": "flexible_placement", "name": "Flexible Placement", "pct": 44.5, "reason": "Users assume the trap can intercept bugs right at the source, underestimating the restriction of wall outlets.", "keywords": ["outlet", "cord", "cable", "placement", "where to put", "wall", "plug"]}, {"id": "silent_operation", "name": "Silent Operation", "pct": 39.2, "reason": "Customers expect the fan models to run in the background without vibrating or sounding like a vacuum.", "keywords": ["noise", "noisy", "loud", "vibrat", "sound", "fan", "hum"]}, {"id": "catches_houseflies", "name": "Catches Large House Flies", "pct": 31.7, "reason": "Despite 'fruit fly' branding, customers expect the trap to also handle large, buzzing house flies.", "keywords": ["house flies", "houseflies", "big flies", "large flies"]}], "samples": {"uv_attracts": [{"title": "GREAT PRODUCT that does exactly what it promises!", "body": "Great product that does exactly what it promises! I bought this fly trap gizmo, because of recurring gnats that would fly out of the kitchen garbage bin everytime I would pull the bag out for the trash! Disgusting and annoying things that would then flit around the rest of the house, being a general pain.Within an hour of plugging this in, though, I checked and had already caught THREE gnats! And by the end of the week, I looked and there had to have been over 25 of the little buggers trapped by the Zevo execution device! I love it!It's silent, but deadly, has zero odor and — dare I say — actually looks good, with the cool blue lighting that draws the flying bugs in like moths to a flame. And it's VERY easy to use... Just slip the cartridge in, peel off the protective backing, plug the small device into an outlet where the bugs will be attracted to it and walk away!Definitely worth the money, to avoid the headaches of bugs constantly being in your face!", "rating": 5, "date": "2026-05-25", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "Modern, Much more effective version of flypaper, without the Downside.", "body": "I purchased the Zevo flying insect trap for my garage this winter. I was very impressed with the number of small flying insects it trapped on the glue paper trap. It was very effective.  Now that spring is moving into summer I needed to purchase some refill cartridges. The call it a cartridge, but it is just an improved version of the old fashioned flypaper. The UV LED in the trap attracts the insects where they then end up on the flypaper.  Since the cartridge included with the original trap worked so well I expect the refills to perform the same way.  The downside of flypaper was that you had to see all of the dead insects sticking from the paper.  Here the dead insects are hidden inside of the trap and you only see them while you are changing out the cartridge.", "rating": 5, "date": "2026-05-25", "brand": "Zevo", "asin": "B0CTQDTF1V"}, {"title": "Excellent insect trap!", "body": "Very impressed with this insect trap! When I purchased it, I didn’t know I had fruit flies. I had not seen any around my fruit dish or plant stand. I was just buying it after I read that fruit flies can come with or live in the soils of indoor plants. I have a kitchen plant stand with several plants so I thought I would try it. I plugged this unit in and 3 days later I had 18 fruit flies on it!!!! After 10 more days I have a total of 40 fruit flies trapped on it ! I am happy it works so well and grossed out at the same time!!! Love that the design of this hides the dead insects. Some of the “victims” are very tiny so I hope that means they were newly hatched. Will definitely buy another unit and some refill cartridges since I keep fruit & plants year round. I don’t normally see fruit flies until I have summer fruit (peaches) on the counters. Excellent fly attraction and easy to use. The cartridges are easy to remove and replace. Nice blue light!", "rating": 5, "date": "2026-05-22", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "Actually works!", "body": "To start off, I have purchased this item several times. My place started to have fruit flies especially during the summer. I have tried so many other methods and it seemed like they didn’t really help. Someone at work told me that they use Zevo lights. To start off I had no clues what this was after doing some research I purchased a set to give it a try.Let me tell you within a week the Zevo light was full of fruit flies and other little bugs. This stuff definitely works.Pros: attracts basically any insects and traps them with the sticky insert. Lasts about 3-4 weeks I would say. Has a blue light that attracts the insects. Easy to use and even easier to replace inserts when it’s time. Also they are neutral looking so if guest come over nobody can see the gross insects it caught. Now that I’m thinking about it unless someone knows what it is, it looks like a plugged air freshener.Cons: honestly the only two cons I could think of is at night if you leave the Zevo lights plugged, and your eyes adjusts to the darkness. The light seems very bright, but I started to unplug them before bed so that fixes it. Lastly I wish the inserts lasted longer, they are still sticky about a month in but dust starts to settle on them and I think it’s not as sticky for the bugs.So overall I would recommend this product for your house if you are in need of an insect catcher.", "rating": 5, "date": "2026-05-21", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "WOW!!!", "body": "My husband and I just moved into a very old apartment building over this winter, and as it’s warmed up into spring we’ve realized we have a bad gnat problem here as not everything is sealed as well as it could be. While this doesn’t treat the root problem of course, these trap plug-ins have been game changing as far as managing the flies. Just a few days ago we had them flying in our faces every time we ate, a single dirty dish laying in the sink would attract a hoard and they would swarm around the trash cans. Three days after plugging in the two units we got to start with, we have hardly noticed any at all. This picture shows one of the traps which was placed in the worst problem area after just three days. I was shocked at how well just a little blue light works. I was skeptical at first seeing these online, but they work remarkably well and setting them up took less than a minute. We may end up purchasing another pair for maximum efficiency but so far even just the two we have have worked wonders. If you’re skeptical like I was, do yourself a favor and just hit add to cart.", "rating": 5, "date": "2026-04-22", "brand": "Zevo", "asin": "B0C3PDTYYX"}, {"title": "Excellent and doubles as night light", "body": "This insect trap works perfectly. Within just 3 months, it caught a ton of flies. I live on the first floor near a lot of plants, so bugs are definitely an issue, and this has made a big difference.The blue light is actually a nice bonus - it doubles as a soft hallway night light, which I didn’t expect but really like.The packaging did arrive a bit damaged, but the product itself worked fine with no issues.Refills are a little expensive, but honestly worth it for a pest-free home. I would definitely buy this again.", "rating": 5, "date": "2026-04-17", "brand": "Zevo", "asin": "B0C3PDTYYX"}, {"title": "Fabulous flying insect trapper!!", "body": "Living in the country, it’s inevitable that you will get a fly or two in the house with the doors opening and closing all of the time. I leave both my back and front porch lights on, so it makes it even worse when those little flying gnats and moths that are hanging out by the light feel they can come inside with you. I have bought fruit fly traps for the little flies that come in with fresh produce, but that didn’t stop the occasional house fly from dive bombing me when trying to watch tv. (They are attracted to light) so of course I had my doubts about the fly-trapping ability of this product, as well, but got it on sale and it came with refills so I thought I’d give it a whirl. Boy am I glad I did! I simply put the sticky pad in the quality built plug in, really easy to do, and the picture I posted was just from plugging it in last night! As you can see, it has attracted three flies I didn’t even know were in my house! I knew one was, but this thing caught three plus all of the little flies that come in when they are near your outside light. There may even be a few fruit flies on it, as well, altho I haven’t had a problem with them so much recently. The item fits nicely in one of my kitchen sockets, and emits a faint blue light that acts not only as a flying insect attractant, but also acts as a nice little night light if needed. It’s quality made, and the refills you simply peel the outer paper off and slip into the holder and starts working the minute you plug it in! I am very happy with this product, and I know you will be, as well! Perfect for places that get the occasional irritating random fly zooming around the house. Have no fear, zero will get the job done!!!", "rating": 5, "date": "2026-04-06", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "Did not help with my fly problem", "body": "I bought this hoping to solve a problem with houseflies. Our place is full of them and I don't know where they are coming from. I have searched and could not find a place where they might be breeding. I didn't rely on just Amazon reviews to buy this. It has reviews all over the net saying that it worked well for the kind of problem I have. When I received this I read the instructions and put it up in an area that is full of flies. It has been up for a couple of weeks and has only caught maybe half a dozen flies. There are still tons of flies zooming around in here doing what flies do. They buzz my face, attack my eyes and mouth, land on my ears and sit there buzzing. I'm still trying to find the source where they are coming from but this product isn't helping. It said it would help me combat houseflies but the flies aren't interested in it. The blue light was supposed to attract them. I don't think it does. I don't know if it works for other flying insects but it does not help with houseflies. I saw reviews that made it seem like a near miracle worker. It is not. Do your research and look beyond review sites before you buy this product.", "rating": 2, "date": "2026-02-10", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "Light doesn’t last on plug in", "body": "Light burn out after less than a year.", "rating": 3, "date": "2026-02-04", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "Maybe I'm using it wrong, but...", "body": "I plugged this into my bathroom to take care of a small gnat problem. The next day, I got a letter of complaint from the gnats, saying that the blue light kept them up all night, and could they please get some fresh water? Lovely. And these weren't weird gnats, either. Just garden variety flying insects, the kind it says it will trap.", "rating": 2, "date": "2026-01-04", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "It’s ok I guess.", "body": "Has a nice blue light that probably attracts some bugs and the quality seems good, I got it for a fruit/drain fly issue. It is very sticky but wasn’t effective for the fly issues I had. It may be effective for other pests.", "rating": 2, "date": "2025-12-31", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "Not many bugs attracted", "body": "Decent but doesn't attract many bugs", "rating": 2, "date": "2025-12-27", "brand": "Zevo", "asin": "B0C3PDTYYX"}], "outperforms_homemade": [{"title": "You will NOT regret this purchase. Buy as many plug ins as you can afford!", "body": "light #1 out of 3. Plugged them in last night. They are all full less than 24hours later. I tried homemade traps. I tried everything. This trap is a life saver. No more drain flies coming for my laptop in the middle of the night. There are 2 different ways to use the traps. The second being covering a cup or water or wine. The cup of wine worked as well but the plug in lights are by far superior. I guess it really depends if the flys have a different source of water available. YOU WILL NOT REGRET THIS PURCHASE. I had to move the lights around to adjust. I found that a flat wall works best for the lights rather than a textured or tiled shiny wall. The light will shine better on regular drywall. 2 out of 3 of my plugs are plugged into a socket by the floor and they still work wonders. The other next to the sink where I believe they initially hatched their eggs in the drain. You should definitely keep one by the front door so any new flies coming in go right for the light before hatching eggs.", "rating": 5, "date": "2026-05-15", "brand": "LFSYS", "asin": "B0D795SPZD"}, {"title": "Useless", "body": "Completely useless. I set it up on the most infested area of the kitchen. Left it there for two weeks. Checked the trap, only one fly on the sticky stuff. One!!! Back to my own homemade waaay cheaper traps of apple cider vinegar and a drop of dish soap. The flies love it! Don't waste your money on this.", "rating": 1, "date": "2026-02-16", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "Solved the problem well enough, may be better DIY solutions", "body": "Maybe a tad overproduced and wasteful but it works well enough in the summer in a home kitchen. Doubles a night light. You may find more effective solutions building your own traps using mason jars (look up a guide)", "rating": 3, "date": "2026-01-16", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "Works as intended not as good with a lot of fruit flies", "body": "The trap works as intended. However, we had a lot of fruit flies so the trap wasn’t quite as effective. I ended up needing to buy another trap that had apple cider and vinegar in it.", "rating": 3, "date": "2026-01-06", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "Did very little for problem", "body": "Disappointed….only 2 gnats in several weeks…used along with 2 Terro fruit fly traps and which caught 1 gnat in each apple trap. Also tried apple cider vinegar with dish soap in a bowl and that caught 1…seems a waste of $25 total…believe insects came in on houseplant brought in for the winter and have lessened a lot but not in traps. Tried traps because spray was not safe for my cat.", "rating": 2, "date": "2025-12-13", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "Anser the question, Do they work.", "body": "Received on December 3 and installed, today is December 12th and they have yet to trap or catch a single fruit fly. After day 3 I got out my bowl and filled it 1/2 way with apple cider vinegar, made a cover of aluminum foil punched some small holes in the foil. Since then it has captured 17 fruit flies and the traps still have caught none. If you purchase I hope you have better luck with them than I had.", "rating": 1, "date": "2025-12-12", "brand": "LFSYS", "asin": "B0D795SPZD"}], "hardware_durability": [{"title": "Excellent insect trap!", "body": "Very impressed with this insect trap! When I purchased it, I didn’t know I had fruit flies. I had not seen any around my fruit dish or plant stand. I was just buying it after I read that fruit flies can come with or live in the soils of indoor plants. I have a kitchen plant stand with several plants so I thought I would try it. I plugged this unit in and 3 days later I had 18 fruit flies on it!!!! After 10 more days I have a total of 40 fruit flies trapped on it ! I am happy it works so well and grossed out at the same time!!! Love that the design of this hides the dead insects. Some of the “victims” are very tiny so I hope that means they were newly hatched. Will definitely buy another unit and some refill cartridges since I keep fruit & plants year round. I don’t normally see fruit flies until I have summer fruit (peaches) on the counters. Excellent fly attraction and easy to use. The cartridges are easy to remove and replace. Nice blue light!", "rating": 5, "date": "2026-05-22", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "Quick and easy replacement cartridges", "body": "I love the Zevo insect trap.  I keep two in my kitchen and it is great at trapping fruit flys and other insects.  The refills are easy to use with a quick insertion and peel off of the cover.  I change them about once every 2-4 weeks depending on the time of year.", "rating": 5, "date": "2026-05-17", "brand": "Zevo", "asin": "B0CTQDTF1V"}, {"title": "Zevo not only look nice but also has a warm blue nightlight built in. Great product.", "body": "I live in Florida an for some reason the Nats were so bad this year. Now I believe, God said  bugs of all kind belong outside. Well,these Nats wanted to take up residence inside. I  couldn't eat or even sleep without these intruders either sharing my food or floating around my head at night. Someone suggested I try Zevo. I ordered the traps a few months ago one for each room. Within two days my little friends were attracted to Zevo not me. I ordered the refills about three months later. No bugs.Plug-ins or self standing  makes this product perfect for ridding any flying pests from your home. I will always have Zevo products  in my home and no more pests.", "rating": 5, "date": "2026-05-17", "brand": "Zevo", "asin": "B0CTQDTF1V"}, {"title": "Working great!", "body": "These have been working great for us, just as good as the name brands at a lower cost! In the summer we get all types of flying bugs getting inside and having these this year has helped significantly! I also kinda enjoy the purple light it gives off at night.", "rating": 5, "date": "2026-05-15", "brand": "LFSYS", "asin": "B0D795SPZD"}, {"title": "No more fruit flys!", "body": "This absolutely works! Quality of material is durable. Just insert the sticky part facing towards the wall, plug it in to outlet and your set. They swivel to accommodate sideways too. Vertical plugs, put in Bug MD at the top and you have room for another appliance plug on the bottom  Order lots of refills though, for first month, you have to catch the ones hatched from the eggs. Easy to put together, light is nice shade of blue and acts as dim night light for small areas. I had to use brighter night light in addition,  for living area, to be safe. It definitely is effective in attracting the little buggers. If they made the insert double sided with plain sticky on one side for sticking inside garbage cans, I would buy those too. I have one kit in kitchen, one in bathroom and one in living area.", "rating": 5, "date": "2026-05-05", "brand": "BugMD", "asin": "B0D38CSTX3"}, {"title": "Really Works Attracting Bugs", "body": "This product really works. If you have flying insects in your house, order this and be done with insects. It really attracts the insects. I like the looks & easy of replacement. Plus it’s chemical-free and durable. You only have to slide up the used pick to replace, so easy to install a clean sticky trap. I recommend this wonderful product. Plus I love that’s it bright at night too.", "rating": 5, "date": "2026-04-28", "brand": "Zevo", "asin": "B0CTQDTF1V"}, {"title": "Best solution I've tried", "body": "I've been struggling with fungus gnats from my plants for months and I've tried everything. This is by far the best thing I've used. Every day, I see more gnats stuck to the card and I don't have to do anything except change the card when it gets full. It's not noisy like a zapper and the light isn't bothersome. It seems solidly built and the cost is extremely reasonable as well. I just bought more for my other rooms. Oh, and you can get refill cards as well.", "rating": 5, "date": "2026-04-27", "brand": "LFSYS", "asin": "B0D795SPZD"}, {"title": "Most effective gnat trap", "body": "I bought the VEYOFLY to deal with a gnat problem in my house, and I’m really glad I did. Within a short time of setting it up, I started noticing a big difference—there were way fewer gnats flying around, especially in the areas where they were the worst. It was even catching little or medium sized house flies which was coolWhat I like most is how easy it is to use. I just plugged it in and let it do its thing no complicated setup or constant maintenance. It’s also pretty discreet, so it doesn’t stick out or look out of place in my home.After using it consistently, my space feels a lot more comfortable and clean without those annoying gnats everywhere. For something that requires so little effort, it works surprisingly well.Overall, I’m very happy with this purchase and would definitely recommend it to anyone dealing with gnats or small flying insects.There is one con tho you are going to have to buy more than just the two pack if you have a bigger house .I had ordered some last year and they still work perfecly fine so the Durability is great and sticky as well . I came back for another two pack this year as the gnats come back when its warm", "rating": 5, "date": "2026-04-22", "brand": "VEYOFLY", "asin": "B0BHN2YLRR"}, {"title": "Excellent and doubles as night light", "body": "This insect trap works perfectly. Within just 3 months, it caught a ton of flies. I live on the first floor near a lot of plants, so bugs are definitely an issue, and this has made a big difference.The blue light is actually a nice bonus - it doubles as a soft hallway night light, which I didn’t expect but really like.The packaging did arrive a bit damaged, but the product itself worked fine with no issues.Refills are a little expensive, but honestly worth it for a pest-free home. I would definitely buy this again.", "rating": 5, "date": "2026-04-17", "brand": "Zevo", "asin": "B0C3PDTYYX"}, {"title": "Broke after 30 days", "body": "After 30 days trap made a loud noise and stopped working. Of course it was past the return date.", "rating": 1, "date": "2026-02-17", "brand": "FVOAI", "asin": "B0CSK83JSK"}, {"title": "does not work. and refused refund", "body": "these no longer work. something has changed. they worked great for a couple years now. Now they no longer do what they once did", "rating": 1, "date": "2026-02-16", "brand": "Zevo", "asin": "B0CTQDTF1V"}, {"title": "do not purchase", "body": "this product fails exactly after 1 year which is past the warranty. Funny , I purchased several of them and all of them quit after one year of use like they were all on a timer. Bad product", "rating": 1, "date": "2026-02-06", "brand": "FVOAI", "asin": "B0CSK83JSK"}], "bugs_dead": [{"title": "GREAT PRODUCT that does exactly what it promises!", "body": "Great product that does exactly what it promises! I bought this fly trap gizmo, because of recurring gnats that would fly out of the kitchen garbage bin everytime I would pull the bag out for the trash! Disgusting and annoying things that would then flit around the rest of the house, being a general pain.Within an hour of plugging this in, though, I checked and had already caught THREE gnats! And by the end of the week, I looked and there had to have been over 25 of the little buggers trapped by the Zevo execution device! I love it!It's silent, but deadly, has zero odor and — dare I say — actually looks good, with the cool blue lighting that draws the flying bugs in like moths to a flame. And it's VERY easy to use... Just slip the cartridge in, peel off the protective backing, plug the small device into an outlet where the bugs will be attracted to it and walk away!Definitely worth the money, to avoid the headaches of bugs constantly being in your face!", "rating": 5 hat it is, it looks like a plugged air freshener.Cons: honestly the only two cons I could think of is at night if you leave the Zevo lights plugged, and your eyes adjusts to the darkness. The light seems very bright, but I started to unplug them before bed so that fixes it. Lastly I wish the inserts lasted longer, they are still sticky about a month in but dust starts to settle on them and I think it’s not as sticky for the bugs.So overall I would recommend this product for your house if you are in need of an insect catcher.", "rating": 5, "date": "2026-05-21", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "Quick and easy replacement cartridges", "body": "I love the Zevo insect trap.  I keep two in my kitchen and it is great at trapping fruit flys and other insects.  The refills are easy to use with a quick insertion and peel off of the cover.  I change them about once every 2-4 weeks depending on the time of year.", "rating": 5, "date": "2026-05-17", "brand": "Zevo", "asin": "B0CTQDTF1V"}, {"title": "Zevo not only look nice but also has a warm blue nightlight built in. Great product.", "body": "I live in Florida an for some reason the Nats were so bad this year. Now I believe, God said  bugs of all kind belong outside. Well,these Nats wanted to take up residence inside. I  couldn't eat or even sleep without these intruders either sharing my food or floating around my head at night. Someone suggested I try Zevo. I ordered the traps a few months ago one for each room. Within two days my little friends were attracted to Zevo not me. I ordered the refills about three months later. No bugs.Plug-ins or self standing  makes this product perfect for ridding any flying pests from your home. I will always have Zevo products  in my home and no more pests.", "rating": 5, "date": "2026-05-17", "brand": "Zevo", "asin": "B0CTQDTF1V"}, {"title": "You will NOT regret this purchase. Buy as many plug ins as you can afford!", "body": "light #1 out of 3. Plugged them in last night. They are all full less than 24hours later. I tried homemade traps. I tried everything. This trap is a life saver. No more drain flies coming for my laptop in the middle of the night. There are 2 different ways to use the traps. The second being covering a cup or water or wine. The cup of wine worked as well but the plug in lights are by far superior. I guess it really depends if the flys have a different source of water available. YOU WILL NOT REGRET THIS PURCHASE. I had to move the lights around to adjust. I found that a flat wall works best for the lights rather than a textured or tiled shiny wall. The light will shine better on regular drywall. 2 out of 3 of my plugs are plugged into a socket by the floor and they still work wonders. The other next to the sink where I believe they initially hatched their eggs in the drain. You should definitely keep one by the front door so any new flies coming in go right for the light before hatching eggs.", "rating": 5, "date": "2026-05-15", "brand": "LFSYS", "asin": "B0D795SPZD"}, {"title": "Works great at attracting and capturing those annoying tiny flying gnats and fruit flies but...", "body": "These traps work great at attracting and capturing those annoying tiny flying gnats and fruit flies. While not as good at catching the bigger flies, we were surprised at how many gnats were hanging around the house. Getting rid of them has been awesome! But here's a heads-up: The replacement cartridges are a bit expensive (especially considering its just sticky cellophane)! I was able to find non-zevo replacements at nearly half-price that seem to work nearly as well!", "rating": 4, "date": "2026-05-06", "brand": "Zevo", "asin": "B0C3PDTYYX"}, {"title": "No more fruit flys!", "body": "This absolutely works! Quality of material is durable. Just insert the sticky part facing towards the wall, plug it in to outlet and your set. They swivel to accommodate sideways too. Vertical plugs, put in Bug MD at the top and you have room for anoth hose still have free reign. I guess the issue is that during the day there's too much light and during the night the flies stop being active.So yes, it does catch some things, but no way is it gonna catch anything the size of a fly.Update: So finally it has caught some house flies. Like 5 of 'em. 85% of what it catches are still just the small things like tiny fruit flies and mosquitoes. But after like 2-3 weeks (I'm not keeping track, but a while) I checked and it caught some houseflies. But don't count on it to be your savior--this is not a \"plug it in and never have to worry ever again\" product. There's still tons of flies it DOES NOT catch, but it will occasionally get one or two.", "rating": 4, "date": "2026-04-21", "brand": "Zevo", "asin": "B07T869RNY"}, {"title": "Did not help with my fly problem", "body": "I bought this hoping to solve a problem with houseflies. Our place is full of them and I don't know where they are coming from. I have searched and could not find a place where they might be breeding. I didn't rely on just Amazon reviews to buy this. It has reviews all over the net saying that it worked well for the kind of problem I have. When I received this I read the instructions and put it up in an area that is full of flies. It has been up for a couple of weeks and has only caught maybe half a dozen flies. There are still tons of flies zooming around in here doing what flies do. They buzz my face, attack my eyes and mouth, land on my ears and sit there buzzing. I'm still trying to find the source where they are coming from but this product isn't helping. It said it would help me combat houseflies but the flies aren't interested in it. The blue light was supposed to attract them. I don't think it does. I don't know if it works for other flying insects but it does not help with houseflies. I saw reviews that made it seem like a near miracle worker. It is not. Do your research and look beyond review sites before you buy this product.", "rating": 2, "d <template id="tpl-total-market"><!-- u-main-segments tab template
==============================================================================
Tom's standalone-composition tab — ported from eu-wasp-analysis renderMainSegments().
Inline this template into a per-dashboard standalone index.html via your
_build_standalone.py. The caller sets window._TAB_DATA to a single object
(already scoped to one country/market) BEFORE this template's <script> runs.

DATA CONTRACT — window._TAB_DATA shape:
{
  // ── Identity (used in headings/notes) ─────────────────────────────────
  countryName: "Germany",          // string — displayed in titles
  countryCode: "DE",               // string — used to build amazon.{tld} links
                                   //          UK → "co.uk", else lowercased
  currency: "€",                   // string — e.g. "€", "$", "£"

  // ── Catalog of segments (drives column order & color lookup) ──────────
  segments: ["Lure", "Electric"],  // string[] — canonical segment names in
                                   //            display order
  segmentColors: {                 // name → hex; used by KPI cards + pies
    "Lure":     "#16a34a",
    "Electric": "#dc2626"
  },
  brandPalette: [                  // string[] — position-based brand colors
    "#2563eb","#dc2626","#16a34a","#f59e0b",
    "#8b5cf6","#0891b2","#db2777","#65a30d"
  ],

  // ── Total Market roll-up ──────────────────────────────────────────────
  totalUnits: 1234567,             // number — 12M units across all segments
  totalRevenue: 12345678,          // number — 12M revenue across all segments

    {

      units: 800000,               // number — 12M units in this segment
      revenue: 6000000              // number — 12M revenue in this segment
      // NOTE: brandsByUnits / brandsByRevenue (top-8 + "Other") are no longer
      // consumed by this template — the per-segment Brand-Share pies moved to

  ],

  // ── LEGACY — NOT consumed by this template ────────────────────────────

  // brand-share line charts) was moved to the dedicated tab template
  // `u-segments-market-structure/template.html`.
  //
  // Build scripts that populate both tabs from a single _TAB_DATA blob may

  // ── Seasonality (optional — drives bar chart + methodology panel) ─────
  seasonality: {
    asinCount: 8,                  // ASINs with sales history
    startDate: "2025-04-01",       // window covered by curve
    endDate:   "2026-03-31",
    monthLabels: ["Apr","May","Jun","Jul",…,"Mar"],

    history: 8, seasonality: 79, flat: 0

}
